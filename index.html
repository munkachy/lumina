    scrollTo({ top: 0, behavior: "smooth" });
  }

  /* ---------- highlights ---------- */
  function hlKey(tx, book, c, i){ return [tx, book, c, i].join("|"); }
  function hlsFor(tx, book, c, i){
    const k = hlKey(tx, book, c, i);
    return state.hls.filter(h => hlKey(h.tx, h.book, h.c, h.i) === k);
  }
  function renderTextWithHls(text, tx, book, c, i){
    const ranges = hlsFor(tx, book, c, i);
    if (!ranges.length) return esc(text);
    const segs = C.segmentText(text, ranges);
    return segs.map(s => s.hl
      ? '<mark class="hl ' + s.hl.color + (s.hl.note ? " noted" : "") + '" data-hl="' + s.hl.id + '">' + esc(s.t) + '</mark>'
      : esc(s.t)).join("");
  }
  function activeHlTx(){ return state.corpus === "ccc" ? "ccc" : state.corpus === "docs" ? "doc" : state.tx; }
  /* selection capture */
  let selCtx = null;   /* set by views: {tx, book, c, list:[{el, i}]} */
  function offsetsWithin(container, range){
    /* character offsets of the selection within container's text, handling
       verses that are fully inside the selection (multi-verse selections). */
    let start = -1, end = -1, pos = 0;
    const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
    let node;
    while ((node = walker.nextNode())){
      const len = node.textContent.length;
      let cs = 1, ce = -1;
      try { cs = range.comparePoint(node, 0); ce = range.comparePoint(node, len); } catch(e){}
      if (node === range.startContainer) start = pos + range.startOffset;
      else if (start === -1 && cs === 0) start = pos;          /* node begins inside range */
      if (node === range.endContainer) end = pos + range.endOffset;
      else if (ce === 0 || (cs === 0 && ce === 0)) end = pos + len;  /* node ends inside range */
      else if (start !== -1 && end === -1 && cs === 0) end = pos + len;
      pos += len;
    }
    return start >= 0 && end > start ? { s: start, e: end } : null;
  }
  /* a selection becomes a gold highlight by itself once the finger or mouse lets go and
     the selection has stopped moving — no box to compete with the browser's own menu.
     Tap a highlight afterwards to change its colour, add a note or remove it. */
  let selTouching = false;
  addEventListener("touchstart", () => { selTouching = true; }, { passive: true });
  addEventListener("touchend", () => { selTouching = false; armAutoHl(); }, { passive: true });
  addEventListener("mouseup", () => armAutoHl());
  function armAutoHl(){ clearTimeout(window._selT); window._selT = setTimeout(autoHighlight, 900); }
  document.addEventListener("selectionchange", armAutoHl);
  function autoHighlight(){
    if (selTouching) return;
    const sel = getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return;
    const range = sel.getRangeAt(0), touched = [];
    if (!selCtx || !selCtx.list.some(item => document.contains(item.el) && range.intersectsNode(item.el))) return anyHighlight(sel, range);
    selCtx.list.forEach(item => {
      if (!range.intersectsNode(item.el)) return;
      const off = offsetsWithin(item.el, range);
      if (off && off.e > off.s) touched.push({ i: item.i, el: item.el,
        book: item.book !== undefined ? item.book : selCtx.book,
        c: item.c !== undefined ? item.c : selCtx.c, ...off });
    });
    const fresh = touched.filter(t => !C.rangesOverlap(hlsFor(selCtx.tx, t.book, t.c, t.i), t.s, t.e));
    if (!fresh.length) return;
    const g = uid();
    fresh.forEach(t => state.hls.push({ id: uid(), g, tx: selCtx.tx, book: t.book, c: t.c, i: t.i,
      s: t.s, e: t.e, color: "gold", note: "", added: Date.now(), t: t.el.textContent.slice(t.s, t.e) }));
    save(); sel.removeAllRanges();
    rerenderInPlace();
    showToast("Highlighted — tap it to change or remove");
  }
  /* ---------- highlights anywhere else: prayers, the daily page, Armarium, the Library, the mind map, the Chapter…
     A paragraph is keyed by a hash of its words (tx "any"), so its highlight comes back wherever those words are
     shown again; each remembers where it was made (where), to go back to it from Favorites › Highlights. ---------- */
  const ANY_BLOCKS = "p, li, h1, h2, h3, h4, h5, blockquote, pre, td, th, dd, dt, summary, figcaption, .lib-s, .lib-t, .scr-u, .pr-p, .ch-plan";
  const anyBlocks = () => [...view.querySelectorAll(ANY_BLOCKS)].filter(el => !el.querySelector(ANY_BLOCKS) &&
    !el.closest("button, textarea, input, select, [contenteditable], .crumb, .tabrow") && el.textContent.trim());
  function anyWhere(el){
    let label;
    if (document.body.classList.contains("scr-on") && window.Scriptorium){
      const sp = window.Scriptorium.spot();
      label = ({ armarium:"Armarium", library:"Library", chapter:"Chapter", mind:"Mind map", mail:"Mail", faith:"Journal" })[sp.tab] || "Scriptorium";
      var desc = { kind:"scr", tab: sp.tab, lib: sp.lib || null };
    } else {
      const k = cur && cur.kind;
      label = k === "prayers" ? "Prayers · " + ({ smsm:"Society", aux:"Auxilium", pope:"Pope's intentions" })[cur.set] || "Prayers"
            : k === "readings" ? "Daily · " + cur.date : /^(favs|favList|chapFavs|chapFavList|hls)$/.test(k || "") ? "Favorites"
            : k === "search" ? "Search" : "Lumina";
      var desc = cur ? JSON.parse(JSON.stringify(cur)) : null;
    }
    const heads = [...view.querySelectorAll("h1, h2, h3, h4, summary, .pr-h")].filter(h => h !== el && !h.contains(el) &&
      (h.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_FOLLOWING));
    const head = heads.length ? heads[heads.length - 1].textContent.replace(/\s+/g, " ").trim().slice(0, 70) : "";
    return { label: label + (head && !label.includes(head) ? " · " + head : ""), desc };
  }
  function anyHighlight(sel, range){
    const touched = [];
    anyBlocks().forEach(el => {
      if (!range.intersectsNode(el)) return;
      const off = offsetsWithin(el, range);
      if (off && off.e > off.s) touched.push({ el, i: psHash(el.textContent), ...off });
    });
    const fresh = touched.filter(t => t.el.textContent.slice(t.s, t.e).trim() && !C.rangesOverlap(hlsFor("any", "any", 0, t.i), t.s, t.e));
    if (!fresh.length) return;
    const g = uid(), where = anyWhere(fresh[0].el);
    fresh.forEach(t => state.hls.push({ id: uid(), g, tx: "any", book: "any", c: 0, i: t.i, s: t.s, e: t.e,
      color: "gold", note: "", added: Date.now(), t: t.el.textContent.slice(t.s, t.e), where }));
    save(); sel.removeAllRanges(); anyMarks();
    showToast("Highlighted — tap it to change or add a note");
  }
  let anyBusy = false, anyT = null;
  function anyMarks(){
    anyBusy = true;
    try {
      view.querySelectorAll("mark.anyhl").forEach(m => { const p = m.parentNode; while (m.firstChild) p.insertBefore(m.firstChild, m); p.removeChild(m); p.normalize(); });
      const mine = state.hls.filter(h => h.tx === "any");
      if (!mine.length) return;
      const byKey = new Map();
      mine.forEach(h => { if (!byKey.has(h.i)) byKey.set(h.i, []); byKey.get(h.i).push(h); });
      anyBlocks().forEach(el => {
        const hs = byKey.get(psHash(el.textContent)); if (!hs) return;
        hs.slice().sort((a, b) => b.s - a.s).forEach(h => psWrap(document, el, h, "hl anyhl"));
      });
    } finally { setTimeout(() => { anyBusy = false; }, 0); }
  }
  new MutationObserver(() => { if (anyBusy) return; clearTimeout(anyT); anyT = setTimeout(anyMarks, 250); })
    .observe(view, { childList: true, subtree: true, characterData: true });
  function anyGo(h){   /* back to where it was made, and to the words */
    const d = h.where && h.where.desc;
    const find = (n) => { const m = view.querySelector('mark[data-hl="' + h.id + '"]');
      if (m) m.scrollIntoView({ block: "center", behavior: "smooth" }); else if (n < 12) setTimeout(() => find(n + 1), 400); };
    if (!d) return showToast("Where this was made isn't known");
    if (d.kind === "scr") openScr(d.tab).then(() => { if (d.lib && window.Scriptorium) window.Scriptorium.libraryRead(d.lib); setTimeout(() => find(0), 600); });
    else { dispatch(d); setTimeout(() => find(0), 500); }
  }
  function maybeShowHlPop(){
    if (!selCtx) return;
    const sel = getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount){ return; }
    const range = sel.getRangeAt(0);
    const touched = [];
    selCtx.list.forEach(item => {
      const el = item.el;
      if (range.intersectsNode(el)){
        const off = offsetsWithin(el, range);
        if (off) touched.push({ i: item.i, el,
          book: item.book !== undefined ? item.book : selCtx.book,
          c: item.c !== undefined ? item.c : selCtx.c, ...off });
      }
    });
    if (!touched.length) return;
    const overlap = touched.some(t => C.rangesOverlap(hlsFor(selCtx.tx, t.book, t.c, t.i), t.s, t.e));
    showHlPop(range.getBoundingClientRect(), touched, overlap);
  }
  function showHlPop(rect, touched, overlap){
    let color = "gold";
    hlpop.innerHTML = '<div class="hl-colors">' +
      HLCOLORS.map(c => '<span class="hl-dot ' + c + (c === "gold" ? " sel" : "") + '" data-c="' + c + '"></span>').join("") + '</div>' +
      (overlap ? '<p style="margin:.2rem 0;font-size:.85rem;color:var(--rubric);font-style:italic;text-align:center">Overlaps an existing highlight</p>' : '') +
      '<textarea id="hlNote" placeholder="Add a note (optional)"></textarea>' +
      '<div class="rowbtns"><button class="btn small" id="hlFav" title="Save selection as a favorite">♥</button>' +
      '<button class="btn small" id="hlCancel">Cancel</button>' +
      '<button class="btn small primary" id="hlSave"' + (overlap ? " disabled" : "") + '>Highlight</button></div>';
    hlpop.style.display = "block";
    const w = hlpop.offsetWidth, vw = innerWidth;
    let left = Math.min(Math.max(8, rect.left + rect.width / 2 - w / 2), vw - w - 8);
    let top = rect.bottom + 8;
    if (top + hlpop.offsetHeight > innerHeight - 90) top = Math.max(8, rect.top - hlpop.offsetHeight - 8);
    hlpop.style.left = left + "px"; hlpop.style.top = top + "px";
    hlpop.querySelectorAll(".hl-dot").forEach(d => d.onclick = () => {
      color = d.dataset.c;
      hlpop.querySelectorAll(".hl-dot").forEach(x => x.classList.toggle("sel", x === d));
    });
    hlpop.querySelector("#hlCancel").onclick = hideHlPop;
    hlpop.querySelector("#hlFav").onclick = () => {
      const t0 = touched[0];
      hideHlPop(); getSelection().removeAllRanges();
      if (selCtx.tx === "ccc") return openFavModal({ corpus:"ccc", n: t0.i });
      if (selCtx.tx === "doc") return openFavModal({ corpus:"doc", id: t0.book, n: t0.i });
      const same = touched.filter(t => t.book === t0.book && t.c === t0.c);
      const i1 = Math.min(...same.map(t => t.i)), i2 = Math.max(...same.map(t => t.i));
      openFavModal(i1 === i2
        ? { corpus:"bible", book: t0.book, c: t0.c, i: i1 }
        : { corpus:"passage", book: t0.book, c: t0.c, i1, i2 });
    };
    hlpop.querySelector("#hlSave").onclick = () => {
      const note = hlpop.querySelector("#hlNote").value.trim();
      const g = uid();
      touched.forEach(t => state.hls.push({ id: uid(), g, tx: selCtx.tx, book: t.book,
        c: t.c, i: t.i, s: t.s, e: t.e, color, note, added: Date.now(),
        t: (t.el ? t.el.textContent.slice(t.s, t.e) : "") }));
      save(); hideHlPop(); getSelection().removeAllRanges();
      showToast("Highlighted"); rerenderInPlace();
    };
  }
  function hideHlPop(){ hlpop.style.display = "none"; hlpop.innerHTML = ""; }
  document.addEventListener("mousedown", e => { if (!hlpop.contains(e.target)) hideHlPop(); });
  function openHlView(id){
    /* read-first: show the note comfortably; edit only on request */
    const h = state.hls.find(x => x.id === id);
    if (!h) return;
    if (!h.note && !h.journal) return openHlEdit(id);
    const back = modal('<h3>Note</h3>' +
      '<p style="text-align:center;margin:.1rem 0"><span class="hl-dot ' + h.color + '" style="display:inline-block;vertical-align:middle;width:1rem;height:1rem"></span>' +
      ' <span style="font-style:italic;color:var(--ink-soft);font-size:.95rem">' + esc(hlCiteOf(h)) + '</span></p>' +
      (h.t ? '<p style="text-align:center;font-style:italic;color:var(--ink-faint);font-size:.92rem;margin:.4rem 0">“' + esc(h.t.length > 140 ? h.t.slice(0,139) + "…" : h.t) + '”</p>' : '') +
      (h.note ? '<div class="note-view">' + esc(h.note) + '</div>' : '') +
      (h.journal ? '<div class="jr-head">✎ In your Journal</div><div class="jr-entry" id="nvJournal">' + esc(h.journal) + '</div>' : '') +
      '<div class="rowbtns"><button class="btn" id="nvClose">Close</button>' +
      '<button class="btn primary" id="nvEdit">Edit</button></div>');
    back.querySelector("#nvClose").onclick = () => back.remove();
    back.querySelector("#nvEdit").onclick = () => { back.remove(); openHlEdit(id); };
    const jr = back.querySelector("#nvJournal");   /* the Journal's write-up, formatted as Scriptorium shows it */
    if (jr) loadScriptorium().then(scr => { if (scr.md) jr.innerHTML = scr.md(h.journal); }).catch(() => {});
  }
  function hlCiteOf(h){
    if (h.tx === "psalter") return (h.where && h.where.label) || "Psalter";
    if (h.tx === "any") return (h.where && h.where.label) || "Lumina";
    if (h.tx === "ccc" || h.book === "ccc") return "CCC ¶ " + h.i;
    if (h.tx === "doc") return docCite(h.book, h.i);
    const b = C.bookIdxById(h.book);
    if (b < 0) return h.book;
    return C.chapterLabel(b, h.c) + ":" + C.vnum(D.books[b].ch[h.c], h.i);
  }
  function openHlEdit(id){
    const h = state.hls.find(x => x.id === id);
    if (!h) return;
    const group = h.g ? state.hls.filter(x => x.g === h.g) : [h];
    let color = h.color;
    const back = modal('<h3>Highlight</h3>' +
      '<div class="hl-colors">' + HLCOLORS.map(c => '<span class="hl-dot ' + c + (c === color ? " sel" : "") + '" data-c="' + c + '"></span>').join("") + '</div>' +
      '<textarea id="ehNote" placeholder="Note">' + esc(h.note || "") + '</textarea>' +
      '<div class="rowbtns hl-jrow"><button class="btn" id="ehMic" title="Speak your thought: it goes into your Journal">🎙 Speak</button>' +
      '<button class="btn" id="ehJournal" title="Make this note an entry in your Journal">✎ To Journal</button></div>' +
      (h.journaled ? '<p class="hl-jdone">In your Journal ✓ <a href="#" id="ehOpenJ">Open the Journal</a></p>' : "") +
      '<div class="rowbtns"><button class="btn danger" id="ehDel">Delete</button><button class="btn" id="ehCopy">Copy</button>' +
      '<button class="btn" id="ehCancel">Cancel</button><button class="btn primary" id="ehSave">Save</button></div>' +
      voicePanelHtml());
    wireVoicePanel(back, group.map(x => x.t || "").join(" "));
    back.querySelectorAll(".hl-dot").forEach(d => d.onclick = () => {
      color = d.dataset.c;
      back.querySelectorAll(".hl-dot").forEach(x => x.classList.toggle("sel", x === d));
    });
    back.querySelector("#ehCancel").onclick = () => back.remove();
    /* the highlighted words, with where they come from */
    const quoted = () => {
      const words = group.map(x => (x.t || "").trim()).filter(Boolean).join(" ");
      const h0 = group[0], hz = group[group.length - 1];
      let cite = hlCiteOf(h0);
      if (hz !== h0 && h0.tx !== "psalter" && h0.tx !== "any"){            /* a highlight across verses: John 1:14–15 */
        const bi = C.bookIdxById(hz.book);
        const end = bi >= 0 && D.books[bi].ch[hz.c] ? C.vnum(D.books[bi].ch[hz.c], hz.i) : hz.i;
        cite += hz.c === h0.c || h0.tx === "doc" || h0.tx === "ccc" ? "–" + end : "–" + (hz.c + 1) + ":" + end;
      }
      return { words, cite };
    };
    back.querySelector("#ehCopy").onclick = () => { const q = quoted(); copy("“" + q.words + "” — " + q.cite); };
    /* the note becomes a Journal entry: the highlighted words and where they are from, then his thought, written up by
       the AI on his Mac like any other note (today's Journal page) */
    const note = back.querySelector("#ehNote"), mic = back.querySelector("#ehMic");
    const toJournal = () => {
      const thought = note.value.trim();
      if (!thought) return showToast("Write or speak your thought first");
      group.forEach(x => { x.color = color; x.note = thought; });
      save(); back.remove(); rerenderInPlace(); psalterMarks(); anyMarks();
      const q = quoted();
      showToast("Sending to your Journal…");
      const text = "On “" + q.words + "” (" + q.cite + "):\n\n" + thought;
      /* Sonnet (the Armarium, ✎ Entry) writes it up; the local AI only if Claude can't (limits, offline) */
      loadScriptorium().then(scr => scr.ask({ kind: "armarium", entry: true, text })
          .then(st => (!st || st.error || !st.content) ? (showToast("Claude unavailable — the local AI is writing it…"), scr.ask({ kind: "faith", text })) : st))
        .then(st => {
          if (st && st.error) return showToast("Journal: " + st.error);
          group.forEach(x => { x.journaled = Date.now(); x.journal = (st && st.content) || ""; }); save();   /* the entry, to read from the highlight */
          showToast("Written in your Journal");
        })
        .catch(e => showToast(/locked/.test(e.message) ? "Open Scriptorium once to unlock it, then try again" : "Couldn't reach Scriptorium: " + e.message));
    };
    back.querySelector("#ehJournal").onclick = toJournal;
    let rec = null;
    mic.onclick = async () => {
      if (rec){ rec.stop(); rec = null; mic.textContent = "…"; mic.disabled = true; return; }
      try {
        const scr = await loadScriptorium();
        note.placeholder = "Listening… your words appear here a few seconds behind you";
        rec = await scr.dictate(note, (text, complete) => {   /* spoken: straight into the Journal */
          rec = null; mic.disabled = false; mic.textContent = "🎙 Speak"; note.placeholder = "Note";
          if (complete && text && document.body.contains(back)) toJournal();
        });
        mic.textContent = "■ Stop";
      } catch(e){
        showToast(/locked/.test(e.message) ? "Open Scriptorium once to unlock it, then try again" : "Couldn't use the microphone: " + e.message);
      }
    };
    const openJ = back.querySelector("#ehOpenJ");
    if (openJ) openJ.onclick = e => { e.preventDefault(); back.remove(); $("btnArmarium").click(); };
    back.querySelector("#ehDel").onclick = () => {
      const ids = new Set(group.map(x => x.id));
      state.hls = state.hls.filter(x => !ids.has(x.id));
      save(); back.remove(); showToast("Highlight removed"); rerenderInPlace(); psalterMarks(); anyMarks();
    };
    back.querySelector("#ehSave").onclick = () => {
      const note = back.querySelector("#ehNote").value.trim();
      group.forEach(x => { x.color = color; x.note = note; });
      save(); back.remove(); rerenderInPlace(); psalterMarks(); anyMarks();
    };
  }
  view.addEventListener("click", e => {
    const m = e.target.closest("mark.hl");
    if (m && m.dataset.hl) openHlView(m.dataset.hl);
  });

  /* ---------- summaries ---------- */
  function summaryFor(b, c){
    const S = window.LUMINA_SUMMARIES;
    if (!S) return null;
    const arr = S[D.books[b].id];
    return arr && arr[c] || null;
  }
  function summaryButtonHtml(){ return '<button class="btn" id="vSummary">Summary</button>'; }
  /* the floating bar, on the chapter and the verse screens: ‹ previous chapter · Book · Chapter ·
     Verse · ♡ · Summary · next chapter ›. It stays at the top of the screen as you scroll.
     fav: { id, on, title } for the heart (the chapter's on the chapter screen, the verse's on the verse screen) */
  function floatBarHtml(b, c, ch, fav){
    const bk = D.books[b], pc = C.prevChapter(b, c), nc = C.nextChapter(b, c);
    return '<div class="fbar" id="fbar">' +
      '<button class="fb-arrow" id="cPrev" ' + (pc ? 'title="' + esc(C.chapterLabel(pc.b, pc.c)) + '"' : "disabled") + '>‹</button>' +
      '<select id="fbBook" title="Book">' + D.books.map((x, k) => '<option value="' + k + '"' + (k === b ? " selected" : "") + '>' + esc(x.name) + '</option>').join("") + '</select>' +
      '<select id="fbCh" title="Chapter">' + bk.ch.map((_, k) => '<option value="' + k + '"' + (k === c ? " selected" : "") + '>' + (k + 1) + '</option>').join("") + '</select>' +
      '<select class="verse-pick" id="versePick" title="Jump to a verse"><option value="">v.</option>' +
        ch.v.map((_, j) => '<option value="' + j + '">' + C.vnum(ch, j) + '</option>').join("") + '</select>' +
      '<button class="fb-btn' + (fav.on ? " fav-on" : "") + '" id="' + fav.id + '" title="' + fav.title + '">' + (fav.on ? "♥" : "♡") + '</button>' +
      '<button class="fb-btn" id="vSummary" title="Chapter summary">Summary</button>' +
      '<button class="fb-arrow" id="cNext" ' + (nc ? 'title="' + esc(C.chapterLabel(nc.b, nc.c)) + '"' : "disabled") + '>›</button>' +
    '</div>';
  }
  function wireFloatBar(b, c){
    const pc = C.prevChapter(b, c), nc = C.nextChapter(b, c);
    if (pc) $("cPrev").onclick = () => renderChapter(pc.b, pc.c);
    if (nc) $("cNext").onclick = () => renderChapter(nc.b, nc.c);
    $("fbBook").onchange = e => renderChapter(+e.target.value, 0);
    $("fbCh").onchange = e => renderChapter(b, +e.target.value);
    bindSummary(b, c, "#fbar");
  }
  function bindSummary(b, c, containerSel){
    const btn = $("vSummary");
    if (!btn) return;
    btn.onclick = () => loadSums().then(() => {
      const s = summaryFor(b, c);
      const host = view.querySelector(containerSel);
      if (!host) return;
      let p = view.querySelector("#sumPanel");
      if (p){ p.classList.toggle("open"); return; }
      p = document.createElement("div");
      p.id = "sumPanel"; p.className = "sum-panel open";
      p.innerHTML = '<span class="lbl">Chapter summary — ' + esc(C.chapterLabel(b, c)) + '</span><br>' +
        (s ? esc(s) : "No summary available for this chapter.") +
        '<div style="font-size:.78rem;color:var(--ink-faint);font-style:italic;margin-top:.4rem">AI-generated summary</div>';
      host.appendChild(p);
      p.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }).catch(() => showToast("Could not load summaries"));
  }

  /* ---------- verse view (bible) ---------- */
  let cur = null, renderSeq = 0;
  /* Opening the Psalms (coming from another book) switches to the Grail, if this device has it. */
  let lastBookB = null;
  function grailForPsalms(b){
    const was = lastBookB; lastBookB = b;
    if (D.books[b].id !== "psalms" || was === b || state.corpus !== "bible" || state.tx === "grail") return;
    const use = () => { state.tx = "grail"; txSel.value = "grail"; save(); applyMode(); };
    if (window.LUMINA_TX && window.LUMINA_TX.grail) return use();
    loadTx("grail").then(() => {
      if (cur && (cur.kind === "chapter" || cur.kind === "verse") && cur.b === b && state.tx !== "grail"){ use(); rerenderInPlace(); }
    }).catch(() => {});
  }
  function renderVerse(b, c, i, opts){
    grailForPsalms(b);
    const drbch = D.books[b].ch[c];
    i = Math.max(0, Math.min(i, drbch.v.length - 1));
    cur = { kind:"verse", b, c, i };
    state.last = { kind:"verse", book: D.books[b].id, c, i }; save();
    record(cur);
    const seq = ++renderSeq;
    const meta = txMeta(state.tx);
    if (meta.kind === "api" && !quickCached(b, c)) loadingView();
    activeChapterAsync(b, c).then(({ ch, fell, err }) => {
      if (seq !== renderSeq) return;
      const isDrb = state.tx === "drb" || fell;
      const j = isDrb ? i : C.mapToTx(ch, i);
      const note = isDrb && ch.notes && ch.notes[String(j)];
      const ref = { corpus:"bible", book: D.books[b].id, c, i };
      const isFav = favsFor(ref).length > 0;
      const hlTx = fell ? "drb" : activeHlTx();
      view.innerHTML =
        '<div class="view">' + floatBarHtml(b, c, ch, { id: "vFav", on: isFav, title: "Save this verse to favorites" }) +
        '<div class="card" id="verseCard">' +
        '<div class="ornament">❦</div>' +
        '<div class="citation">' + esc(C.citation(b, c, C.vnum(ch, j))) +
          '<span class="tx-tag">' + (fell ? "DR" : meta.abbr) + '</span></div>' +
        '<p class="verse-text dropcap" id="vtext">' + (!isDrb && state.tx === "grail" ? flowGrail(renderTextWithHls(ch.v[j], hlTx, D.books[b].id, c, j)) : renderTextWithHls(ch.v[j], hlTx, D.books[b].id, c, j)) + '</p>' +
        (fell ? '<p class="ch-notice">' + fallNote(meta, err) + '</p>' : '') +
        (note ? '<details class="note"><summary>Challoner’s note</summary><p>' + esc(note) + '</p></details>' : '') +
        '<div class="compare" id="cmp"></div>' +
        '<div class="verse-actions">' +
          '<button class="btn nav-arrow" id="vPrev" title="Previous verse">←</button>' +
          '<button class="btn" id="vChapter">Chapter</button>' +
          '<button class="btn" id="vCompare">⇄</button>' +
          '<button class="btn" id="vCopy">Copy</button>' +
          '<button class="btn nav-arrow" id="vNext" title="Next verse">→</button>' +
        '</div></div></div>';
      const g = C.toGlobal(b, c, i);
      const pv = C.fromGlobal(g - 1), nv = C.fromGlobal(g + 1);
      $("vPrev").disabled = !pv; $("vNext").disabled = !nv;
      $("vPrev").onclick = () => pv && renderVerse(pv.b, pv.c, pv.i);
      $("vNext").onclick = () => nv && renderVerse(nv.b, nv.c, nv.i);
      $("vChapter").onclick = () => renderChapter(b, c, i);
      $("vCopy").onclick = () => copy("“" + ch.v[j] + "” — " + C.citation(b, c, C.vnum(ch, j)) + " (" + (fell ? "DR" : meta.abbr) + ")");
      $("vCompare").onclick = () => toggleCompare(b, c, i);
      $("vFav").onclick = () => openFavModal(ref);
      wireFloatBar(b, c);
      $("versePick").onchange = e => {               /* on the verse screen: open that verse */
        if (e.target.value === "") return;
        const jj = +e.target.value;
        renderVerse(b, c, isDrb ? jj : C.mapFromTx(D.books[b].ch[c], ch, jj));
      };
      selCtx = { tx: hlTx, book: D.books[b].id, c, list: [{ el: $("vtext"), i: j }] };
      applyMode();
      if (!opts || !opts.keepScroll) scrollTo({ top: 0, behavior: "smooth" });
    });
  }
  function fallNote(meta, err){
    if (meta.only) return "The " + esc(meta.name) + " contain only the Psalms — this passage is shown in the Douay-Rheims.";
    return err ? "Could not reach " + esc(meta.name) + " — shown in the Douay-Rheims."
               : "Shown in the Douay-Rheims — this passage is not contained in " + esc(meta.name) + ".";
  }
  function toggleCompare(b, c, i){
    const box = $("cmp");
    if (!box) return;
    if (box.classList.contains("open")){ box.classList.remove("open"); return; }
    box.innerHTML = '<p class="cmp-text absent">Gathering the witnesses…</p>';
    box.classList.add("open");
    const locals = TRANSLATIONS.filter(t => t.kind === "local" && (!t.only || t.only === D.books[b].id));
    const apis = TRANSLATIONS.filter(t => t.kind === "api");
    Promise.allSettled(locals.map(t => loadTx(t.id))).then(() =>
      Promise.allSettled(apis.map(t => apiSlotChapter(t, b, c)))
    ).then(apiResults => {
      let html = "";
      locals.forEach(t => { if (t.imported && !txData(t.id)) return; html += cmpItem(t, C.txChapter(txData(t.id), b, c), b, c, i, false); });
      apis.forEach((t, k) => {
        const r = apiResults[k];
        const ch = r.status === "fulfilled" ? r.value : undefined;
        html += cmpItem(t, ch || null, b, c, i, ch === undefined);
      });
      box.innerHTML = html;
    });
  }
  function cmpItem(t, ch, b, c, i, err){
    let body;
    if (err) body = '<p class="cmp-text absent">Could not reach this translation.</p>';
    else if (!ch) body = '<p class="cmp-text absent">Not contained in this translation.</p>';
    else {
      const j = t.id === "drb" ? i : C.mapToTx(ch, i);
      body = '<p class="cmp-text">' + (t.id === "grail" ? flowGrail(esc(ch.v[j])) : esc(ch.v[j])) +
             ' <span class="tx-tag" style="font-size:.75em;color:var(--ink-faint)">v' + C.vnum(ch, j) + '</span></p>';
    }
    return '<div class="cmp-item"><div class="cmp-tx">' + esc(t.name) + '</div>' + body + '</div>';
  }
  function copy(text){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(() => showToast("Copied ✓"), () => fallbackCopy(text));
    } else fallbackCopy(text);
  }
  function fallbackCopy(text){
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); showToast("Copied ✓"); } catch(e){ showToast("Copy failed"); }
    ta.remove();
  }

  /* ---------- chapter view (bible) ---------- */
  function renderChapter(b, c, highlightI){
    grailForPsalms(b);
    const bk = C.bookByIdx(b);
    cur = { kind:"chapter", b, c, i: highlightI == null ? null : highlightI };
    state.last = { kind:"chapter", book: bk.id, c, i: cur.i }; save();
    record(cur);
    const seq = ++renderSeq;
    const meta = txMeta(state.tx);
    if (meta.kind === "api" && !quickCached(b, c)) loadingView();
    activeChapterAsync(b, c).then(({ ch, fell, err }) => {
      if (seq !== renderSeq) return;
      const isDrb = state.tx === "drb" || fell;
      const hlJ = highlightI == null ? -1 : (isDrb ? highlightI : C.mapToTx(ch, highlightI));
      const pc = C.prevChapter(b, c), nc = C.nextChapter(b, c);
      const txb = !isDrb && meta.kind === "local" && txData(state.tx).books[b];
      const hlTx = fell ? "drb" : activeHlTx();
      let vs = "";
      const stz = new Set(!isDrb && ch.sb || []);
      const grailFlow = !isDrb && state.tx === "grail";
      ch.v.forEach((t, j) => {
        const note = isDrb && ch.notes && ch.notes[String(j)];
        if (!isDrb && ch.h && ch.h[j]) vs += '<p class="subhead">' + esc(ch.h[j]) + '</p>';
        vs += '<p class="v' + (j === hlJ ? " hl" : "") + (stz.has(j) ? " stz" : "") + '" id="v' + j + '">' +
              '<sup class="vn">' + C.vnum(ch, j) + '</sup><span class="vt" data-i="' + j + '">' +
              (grailFlow ? flowGrail(renderTextWithHls(t, hlTx, bk.id, c, j)) : renderTextWithHls(t, hlTx, bk.id, c, j)) + '</span>' +
              (note ? '<button class="notemark" data-n="' + j + '" title="Challoner’s note">✝</button>' +
                      '<span class="note-inline" id="n' + j + '">' + esc(note) + '</span>' : '') +
              '</p>';
      });
      const attribution = !isDrb && meta.kind === "api" && apiCopyright[meta.id]
        ? '<p class="attribution">' + esc(apiCopyright[meta.id]) + '</p>' : '';
      view.innerHTML =
        '<div class="view">' +
        '<div class="ch-head" id="chHead">' +
          '<p class="ch-book">' + esc(bk.name) +
            (txb && txb.name !== bk.name ? ' · ' + esc(txb.name) : '') +
            (bk.t === "OT" ? " · Old Testament" : " · New Testament") + '</p>' +
          '<h2 class="ch-title">' + esc(C.chapterLabel(b, c)) + '</h2>' +
          (isDrb && ch.s ? '<p class="ch-summary">' + esc(ch.s) + '</p>' : '') +
          (!isDrb && ch.title ? '<p class="ch-summary">' + esc(ch.title) + '</p>' : '') +
          (fell ? '<p class="ch-notice">' + fallNote(meta, err) + '</p>' : '') +
        '</div>' +
        floatBarHtml(b, c, ch, { id: "chFav", on: chapFavsFor(b, c).length > 0, title: "Save this chapter to favorites" }) +
        '<div class="card"><div class="verses" id="versesHost">' + vs + '</div></div>' + attribution +
        '</div>';
      wireFloatBar(b, c);
      view.querySelectorAll(".notemark").forEach(btn => {
        btn.onclick = () => $("n" + btn.dataset.n).classList.toggle("open");
      });
      view.querySelectorAll(".v").forEach(p => {
        p.addEventListener("dblclick", () => {
          const j = parseInt(p.id.slice(1), 10);
          copy("“" + ch.v[j] + "” — " + C.citation(b, c, C.vnum(ch, j)) + " (" + (fell ? "DR" : meta.abbr) + ")");
        });
      });
      $("chFav").onclick = () => openChapFavModal(b, c);
      $("versePick").onchange = e => {
        const j = e.target.value;
        if (j === "") return;
        /* jump within the chapter: the verse is lit and brought just below the floating bar */
        view.querySelectorAll(".v.hl").forEach(x => x.classList.remove("hl"));
        const el = $("v" + j); if (!el) return;
        el.classList.add("hl");
        const barH = $("fbar").offsetHeight;
        scrollTo({ top: el.getBoundingClientRect().top + scrollY - barH - 12, behavior: "smooth" });
        const drbI = isDrb ? +j : C.mapFromTx(D.books[b].ch[c], ch, +j);
        cur.i = drbI; state.last = { kind:"chapter", book: bk.id, c, i: drbI }; save();
        e.target.value = "";
      };
      selCtx = { tx: hlTx, book: bk.id, c,
        list: [...view.querySelectorAll(".vt")].map(el => ({ el, i: parseInt(el.dataset.i, 10) })) };
      applyMode();
      if (hlJ >= 0){
        const el = $("v" + hlJ);
        if (el) setTimeout(() => el.scrollIntoView({ block: "center", behavior: "smooth" }), 60);
      } else scrollTo({ top: 0, behavior: "smooth" });
    });
  }

  /* ---------- books / grid (bible) ---------- */
  function renderBooks(){
    cur = { kind:"books" };
    record(cur);
    selCtx = null;
    let html = '<div class="view">';
    ["OT", "NT"].forEach(t => {
      html += '<h3 class="t-head">' + (t === "OT" ? "The Old Testament" : "The New Testament") + '</h3><div class="book-grid">';
      D.books.forEach((bk, b) => { if (bk.t === t) html += '<button class="book-btn" data-b="' + b + '">' + esc(bk.name) + '</button>'; });
      html += '</div>';
    });
    html += '</div>';
    view.innerHTML = html;
    view.querySelectorAll(".book-btn").forEach(btn => btn.onclick = () => renderChapterGrid(parseInt(btn.dataset.b, 10)));
    scrollTo({ top: 0, behavior: "smooth" });
  }
  function renderChapterGrid(b){
    const bk = C.bookByIdx(b);
    if (bk.ch.length === 1){ renderChapter(b, 0); return; }
    cur = { kind:"grid", b };
    record(cur);
    selCtx = null;
    let html = '<div class="view"><div class="crumb"><button class="btn" id="backBooks">← All Books</button></div>' +
      '<div class="ch-head"><h2 class="ch-title">' + esc(bk.name) + '</h2>' +
      '<p class="ch-book">' + bk.ch.length + (bk.id === "psalms" ? " psalms" : " chapters") + '</p></div>' +
      '<div class="chapter-grid">';
    bk.ch.forEach((_, c) => html += '<button class="book-btn" data-c="' + c + '">' + (c + 1) + '</button>');
    html += '</div></div>';
    view.innerHTML = html;
    $("backBooks").onclick = renderBooks;
    view.querySelectorAll("[data-c]").forEach(btn => btn.onclick = () => renderChapter(b, parseInt(btn.dataset.c, 10)));
    scrollTo({ top: 0, behavior: "smooth" });
  }

  /* ---------- Catechism views ---------- */
  function ccc(){ return window.LUMINA_CCC; }
  function renderCccPara(n, opts){
    const K = ccc(); if (!K) return;
    n = Math.max(1, Math.min(n, K.paras.length));
    cur = { kind:"cccPara", n };
    state.cccLast = { kind:"cccPara", n }; save();
    record(cur);
    const p = K.paras[n - 1];
    const ti = C.cccTocOf(K, n);
    const t = K.toc[ti];
    const ref = { corpus:"ccc", n };
    const isFav = favsFor(ref).length > 0;
    view.innerHTML =
      '<div class="view"><div class="card" id="verseCard">' +
      '<div class="ornament">✠</div>' +
      '<div class="citation">CCC ¶ ' + n + '</div>' +
      '<p style="text-align:center;font-style:italic;color:var(--ink-faint);font-size:.9rem;margin:-.4rem 0 .8rem">' +
        esc(C.cccTocTitle(t)) + '</p>' +
      '<p class="verse-text dropcap" id="vtext">' + renderTextWithHls(p.t, "ccc", "ccc", 0, n) + '</p>' +
      (p.f && p.f.length ? '<ol class="ccc-notes">' + p.f.map(([num, t]) => '<li value="' + num + '">' + esc(t) + '</li>').join("") + '</ol>' : '') +
      '<div class="verse-actions">' +
        '<button class="btn nav-arrow" id="vPrev">←</button>' +
        '<button class="btn" id="vChapter">Chapter</button>' +
        '<button class="btn' + (isFav ? " fav-on" : "") + '" id="vFav">' + (isFav ? "♥" : "♡") + '</button>' +
        '<button class="btn" id="vCopy">Copy</button>' +
        '<button class="btn nav-arrow" id="vNext">→</button>' +
      '</div></div></div>';
    $("vPrev").disabled = n <= 1; $("vNext").disabled = n >= K.paras.length;
    $("vPrev").onclick = () => renderCccPara(n - 1);
    $("vNext").onclick = () => renderCccPara(n + 1);
    $("vChapter").onclick = () => renderCccChapter(ti, n);
    $("vCopy").onclick = () => copy("“" + p.t + "” — Catechism of the Catholic Church, ¶ " + n);
    $("vFav").onclick = () => openFavModal(ref);
    selCtx = { tx:"ccc", book:"ccc", c:0, list: [{ el: $("vtext"), i: n }] };
    if (!opts || !opts.keepScroll) scrollTo({ top: 0, behavior: "smooth" });
  }
  function renderCccChapter(ti, highlightN){
    const K = ccc(); if (!K) return;
    ti = Math.max(0, Math.min(ti, K.toc.length - 1));
    cur = { kind:"cccChapter", ti, n: highlightN || null };
    state.cccLast = { kind:"cccChapter", ti, n: highlightN || null }; save();
    record(cur);
    const t = K.toc[ti];
    let html = '<div class="view"><div class="ch-head">' +
      '<p class="ch-book">' + esc(t.part) + (t.sec && t.sec !== t.part ? " · " + esc(t.sec) : "") + '</p>' +
      '<h2 class="ch-title">' + esc(C.cccTocTitle(t)) + '</h2>' +
      '<p class="ch-notice">¶ ' + t.first + "–" + t.last + '</p></div>' +
      '<div class="ch-nav">' +
      '<button class="btn nav-arrow" id="cPrev" ' + (ti > 0 ? "" : "disabled") + '>←</button>' +
      '<span class="mid"><button class="btn small" id="cccToc" title="' + (t.last - t.first + 1) + ' paragraphs">☰ Contents</button></span>' +
      '<button class="btn nav-arrow" id="cNext" ' + (ti < K.toc.length - 1 ? "" : "disabled") + '>→</button></div>' +
      '<div class="card"><div class="verses">';
    for (let n = t.first; n <= t.last; n++){
      const p = K.paras[n - 1];
      if (p.g) html += '<div class="subhead">' + esc(p.g) + '</div>';
      if (p.a) html += '<div class="subhead art">' + esc(p.a) + '</div>';
      if (p.h) html += '<div class="subhead">' + esc(p.h) + '</div>';
      html += '<p class="v' + (n === highlightN ? " hl" : "") + '" id="p' + n + '">' +
        (p.b ? '<span class="inbrief">In Brief</span>' : '') +
        '<sup class="vn">' + n + '</sup><span class="vt" data-i="' + n + '">' +
        renderTextWithHls(p.t, "ccc", "ccc", 0, n) + '</span></p>';
    }
    html += '</div></div></div>';
    view.innerHTML = html;
    $("cccToc").onclick = renderCccContents;
    if (ti > 0) $("cPrev").onclick = () => renderCccChapter(ti - 1);
    if (ti < K.toc.length - 1) $("cNext").onclick = () => renderCccChapter(ti + 1);
    view.querySelectorAll(".v").forEach(p => p.addEventListener("dblclick", () => {
      const n = parseInt(p.id.slice(1), 10);
      copy("“" + K.paras[n - 1].t + "” — CCC ¶ " + n);
    }));
    selCtx = { tx:"ccc", book:"ccc", c:0,
      list: [...view.querySelectorAll(".vt")].map(el => ({ el, i: parseInt(el.dataset.i, 10) })) };
    if (highlightN){
      const el = $("p" + highlightN);
      if (el) setTimeout(() => el.scrollIntoView({ block:"center", behavior:"smooth" }), 60);
    } else scrollTo({ top: 0, behavior: "smooth" });
  }
  function renderCccContents(){
    const K = ccc(); if (!K) return;
    cur = { kind:"cccToc" };
    record(cur);
    selCtx = null;
    let html = '<div class="view">', lastPart = null;
    K.toc.forEach((t, ti) => {
      if (t.part !== lastPart){ html += '<h3 class="t-head">' + esc(t.part) + '</h3>'; lastPart = t.part; }
      html += '<div class="list-item" data-ti="' + ti + '"><div class="li-main">' +
        '<div class="li-cite">' + esc(C.cccTocTitle(t)) + '</div>' +

  /* ---------- Church documents ---------- */
  /* A "book" key is the document id, plus "~old" for its older public-domain translation. */
  function docById(id){ const L = window.LUMINA_DOCS; return L ? L.docs.find(d => d.id === id.replace(/~old$/, "")) : null; }
  function docIsOld(key){ return /~old$/.test(key); }
  function docParas(key){ const d = docById(key); return !d ? [] : docIsOld(key) && d.alt ? d.alt.p : d.p; }
  function docPara(key, n){ return docParas(key).find(p => p[0] === n); }
  function docParaText(key, n){ const p = docPara(key, n); return p ? p[1] : ""; }
  function docLabel(d, n){ const p = d && d.p.find(x => x[0] === n); return p && p[2] ? p[2] : String(n); }
  function docCite(key, n){
    const d = docById(key); if (!d) return key;
    let c;
    if (!n) c = d.title + " (opening)";
    else if (!d.unit) c = d.title + " " + n;
    else {
      const l = docLabel(d, n);
      c = d.title + ", " + (/^\d+$/.test(l) ? d.unit + " " + l
        : /^Can\. /.test(l) ? "can. " + l.slice(5)
        : /^Pr\. /.test(l) ? "prologue " + l.slice(4)
        : { Proem:"proem", Canons:"before the canons", End:"conclusion" }[l] || l);
    }
    return docIsOld(key) && d.alt ? c + " (" + d.alt.name + ")" : c;
  }
  function docLevel(d){ return window.LUMINA_DOCS.levels.find(l => l.id === d.level); }
  function docKeyFor(d){ return d.alt && state.docOld && state.docOld[d.id] ? d.id + "~old" : d.id; }
  function docShow(key, n){

  function toDocs(then){

  function searchDocs(q, limit){
    const terms = q.toLowerCase().split(/\s+/).filter(Boolean), out = [];

        const low = p[1].toLowerCase();
        if (terms.every(t => low.includes(t))){ out.push([key, p[0]]); if (out.length >= limit) return out; }
      }
    }
    return out;
  }

    else scrollTo({ top: 0, behavior: "smooth" });
  }
  function renderDocPara(id, n, opts){
    const d = docById(id); if (!d) return renderDocLibrary();

        esc(d.sub) + (head ? " · " + esc(shorten(head, 90)) : "") + '</p>' +
      '<p class="verse-text dropcap vt" id="vtext">' + renderTextWithHls(p[1], "doc", key, 0, n) + '</p>' +

        '<button class="btn" id="vCopy">Copy</button>' +
        '<button class="btn nav-arrow" id="vNext">→</button>' +
      '</div></div></div>';

  function stepDocPara(delta){
    const d = docById(cur.id); if (!d) return;

  function randomDocPara(){
    const all = [];

  /* a random section: a heading's first paragraph, or any paragraph of a document without headings */

  const loadBiy = () => loadScript("data-biy.js", () => !!window.LUMINA_BIY);

  /* ---------- search ---------- */
  function rememberSearch(q){
    state.searches = [q].concat(state.searches.filter(x => x !== q)).slice(0, 15);
    save();
  }
  function renderSearch(prefill){
    cur = { kind:"search", q: prefill || null };
    record(cur);
    selCtx = null;
    const isCcc = state.corpus === "ccc", isDocs = state.corpus === "docs" && !!window.LUMINA_DOCS;

      if (!isCcc && meta.kind === "api"){

          encodeURIComponent(q) + "&limit=100&sort=canonical";
        fetch(url, { headers: { "api-key": API_KEY } })
          .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
          .then(j => {
            fums(j.meta && j.meta.fumsToken);
            const verses = (j.data && j.data.verses) || [];
            let html = '<p class="ch-notice">' + ((j.data && j.data.total) || verses.length) + ' result(s) \u00b7 ' + esc(meta.abbr) + '</p>';

              const c = Math.min(cNum, D.books[b].ch.length) - 1;

  /* ---------- daily readings ---------- */

      }));
      body.innerHTML = '<p class="ch-notice">Fetching the text\u2026</p>';
      const ready = txMeta(rtx).kind === "local" && rtx !== "drb" ? loadTx(rtx).catch(() => {}) : Promise.resolve();
      ready.then(() => Promise.all(keys.map(k => activeChapterAsync(k.b, k.c, rtx).then(res => [k.b + ":" + k.c, res]))))
        .then(pairs => {
          if (seq !== renderSeq) return;
          const chmap = Object.fromEntries(pairs);
          const meta = txMeta(rtx);
          const hlTx = rtx;
          let html = '<p class="season-line">' + esc((d.day && d.day.season) || "") +
            (d.day && d.day.title && d.day.title !== "Daily Readings" ? " \u00b7 " + esc(d.day.title) : "") + '</p>';
          groups.forEach(g => {
            html += '<div class="reading-block">' +
              '<p class="reading-title">' + esc(g.title) + '</p>' +
              '<p class="reading-ref">' + esc(g.ref) + '</p>';
            g.parts.forEach(p => {
              const res = chmap[p.b + ":" + p.c];
              if (!res) return;
              const ch = res.ch, fell = res.fell;
              const bkid = D.books[p.b].id;
              let idxs = C.pickVerses(ch, p.nums);
              let mismatch = false;
              if (!idxs.length){ idxs = ch.v.map((_, j) => j); mismatch = true; }
              const isPsalm = D.books[p.b].id === "psalms";
              html += '<p class="ch-book" style="margin:.5rem 0 .2rem;text-align:center">' +
                esc(C.chapterLabel(p.b, p.c)) + (fell ? " \u00b7 DR" : "") + '</p>' +
                (mismatch ? '<p class="ch-notice">Verse numbering differs here \u2014 showing the whole chapter.</p>' : '') +
                (isPsalm && !mismatch ? '<p class="ch-notice">The lectionary numbers psalms in the Hebrew tradition; ' +
                  'Vulgate verses can differ by one \u2014 open the full psalm if a line seems to begin oddly.</p>' : '') +
                '<div class="card" style="margin-bottom:.9rem"><div class="verses">';
              idxs.forEach(j => {
                html += '<p class="v"><sup class="vn">' + C.vnum(ch, j) + '</sup>' +
                  '<span class="vt" data-b="' + p.b + '" data-c="' + p.c + '" data-i="' + j + '">' +
                  renderTextWithHls(ch.v[j], hlTx, bkid, p.c, j) + '</span></p>';
              });
              html += '</div></div>' +
                '<div style="text-align:center;margin:-.3rem 0 .8rem">' +
                '<button class="btn small opench" data-b="' + p.b + '" data-c="' + p.c + '">Open ' +
                esc(C.chapterLabel(p.b, p.c)) + ' \u2192</button></div>';
            });
            html += '</div>';
          });
          html += '<p class="attribution">Readings for ' + esc(date) + ' from the USCCB lectionary via Cathople' +
            ((d.source && d.source.usccbLink) ? ' \u00b7 <a href="' + esc(d.source.usccbLink) +
              '" target="_blank" rel="noopener" style="color:var(--gold)">USCCB</a>' : '') +
            '<br>Scripture shown in <b>' + esc(meta.name) + '</b> \u2014 change it with \u201cRead in\u201d above.' +
            (apiCopyright[meta.id] ? '<br>' + esc(apiCopyright[meta.id]) : '') + '</p>';
          body.innerHTML = html;
          body.querySelectorAll(".opench").forEach(btn => btn.onclick = () =>
            renderChapter(parseInt(btn.dataset.b, 10), parseInt(btn.dataset.c, 10)));
          body.querySelectorAll(".v").forEach(pv => pv.addEventListener("dblclick", () => {
            const sp = pv.querySelector(".vt");
            if (!sp) return;
            const b = +sp.dataset.b, c = +sp.dataset.c, j = +sp.dataset.i;
            const res = chmap[b + ":" + c];
            if (res) copy("\u201c" + res.ch.v[j] + "\u201d \u2014 " + C.citation(b, c, C.vnum(res.ch, j)));
          }));
          selCtx = { tx: hlTx, book: null, c: null,
            list: [...body.querySelectorAll(".vt")].map(el => ({ el, i: parseInt(el.dataset.i, 10),
              book: D.books[parseInt(el.dataset.b, 10)].id, c: parseInt(el.dataset.c, 10) })) };
        })
        .catch(() => { body.innerHTML = '<p class="ch-notice">Could not load the scripture text.</p>'; });
    };

    if (readingsCache[date]) return draw(readingsCache[date]);
    fetch(CATH_BASE + "/readings/daily?date=" + date + "&lang=en", {
      headers: { "Authorization": "Bearer " + CATH_KEY, "Accept": "application/json" }
    }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(j => { if (!j.success) throw new Error("api"); readingsCache[date] = j;
        if (cur.kind === "readings" && cur.date === date) draw(j); })
      .catch(() => { body.innerHTML = '<p class="ch-notice">Could not fetch the readings \u2014 check your connection, or the date may be beyond the calendar.</p>'; });
  }

  /* ---------- reading plan ---------- */
  function planReady(id){ return id !== "biy" ? Promise.resolve() : loadBiy(); }
  function renderPlan(dayOverride){
    cur = { kind:"plan", day: dayOverride == null ? null : dayOverride };
    record(cur);
    selCtx = null;
    const active = state.activePlan;
    view.innerHTML = '<div class="view"><div class="crumb"><button class="btn" id="backMore">\u2190 Back</button></div>' +
      '<div class="ch-head"><h2 class="ch-title">Reading Plan</h2></div>' +
      '<div class="controls"><select id="planSel"><option value="">\u2014 choose a plan \u2014</option>' +
      C.PLANS.map(p => '<option value="' + p.id + '"' + (p.id === active ? " selected" : "") + '>' + esc(p.name) + '</option>').join("") +
      '</select></div><div id="planBody"></div></div>';
    $("backMore").onclick = () => navBack();
    $("planSel").onchange = () => {
      const id = $("planSel").value;
      if (!id){ state.activePlan = null; save(); $("planBody").innerHTML = ""; return; }
      if (!state.plans[id]) state.plans[id] = { start: isoToday(), done: {} };
      state.activePlan = id; save();
      planReady(id).then(() => drawPlan(id)).catch(() => showToast("Could not load the plan data"));
    };
    if (active){
      if (!state.plans[active]) state.plans[active] = { start: isoToday(), done: {} };
      planReady(active).then(() => drawPlan(active, dayOverride == null ? undefined : dayOverride))
        .catch(() => showToast("Could not load the plan data"));
    }
    function drawPlan(id, viewDay){
      const def = C.PLANS.find(p => p.id === id);
      const ps = state.plans[id];
      const day = viewDay == null ? C.resumeDay(ps.done, def.days) : Math.max(0, Math.min(def.days - 1, viewDay));
      cur = { kind:"plan", day };
      if (nav.idx >= 0 && nav.stack[nav.idx] && nav.stack[nav.idx].kind === "plan")
        nav.stack[nav.idx] = JSON.parse(JSON.stringify(cur));
      const dref = C.planDayRefs(id, day);
      const doneCount = Object.keys(ps.done).length;
      let html = '<div class="progress"><i style="width:' + Math.round(100 * doneCount / def.days) + '%"></i></div>' +
        '<p class="ch-notice">' + doneCount + ' of ' + def.days + ' days completed \u00b7 began ' + esc(ps.start) + '</p>' +
        '<div class="plan-day">' +
        '<button class="btn nav-arrow" id="pdPrev" ' + (day > 0 ? "" : "disabled") + '>\u2190</button>' +
        '<span class="pd">Day ' + (day + 1) + '</span>' +
        '<button class="btn nav-arrow" id="pdNext" ' + (day < def.days - 1 ? "" : "disabled") + '>\u2192</button></div>' +
        (dref.period ? '<p class="pd-period">' + esc(dref.period) + '</p>' : '');
      if (!dref.refs.length) html += '<p class="ch-notice" style="margin:1rem 0">A day of rest and review \u2014 no new chapters.</p>';
      else {
        html += '<div class="chapter-grid" style="margin:.8rem 0">';
        dref.refs.forEach(r => html += '<button class="book-btn pref" data-b="' + r.parts[0].b + '" data-c="' + r.parts[0].c + '" style="min-width:auto;padding:.5rem .8rem">' + esc(r.label) + '</button>');
        html += '</div><div style="text-align:center;margin:.4rem 0"><button class="btn primary" id="pdOpen">Read Day ' + (day + 1) + ' \u2192</button></div>';
      }
      html += '<div class="rowbtns" style="display:flex;justify-content:center;gap:.6rem;margin-top:.6rem">' +
        '<button class="btn ' + (ps.done[day] ? "" : "primary") + '" id="pdDone">' + (ps.done[day] ? "\u2713 Completed \u2014 undo" : "Mark day complete") + '</button>' +
        '<button class="btn danger small" id="pdRestart">Restart plan</button></div>';
      $("planBody").innerHTML = html;
      $("pdPrev").onclick = () => day > 0 && drawPlan(id, day - 1);
      $("pdNext").onclick = () => day < def.days - 1 && drawPlan(id, day + 1);
      const open = $("pdOpen"); if (open) open.onclick = () => renderPlanDay(id, day);
      $("pdDone").onclick = () => { if (ps.done[day]) delete ps.done[day]; else ps.done[day] = true; save(); drawPlan(id, day); };
      $("pdRestart").onclick = () => {
        const back = modal('<h3>Restart this plan?</h3><p style="text-align:center">Progress will be cleared and the start date set to today.</p>' +
          '<div class="rowbtns"><button class="btn" id="rCancel">Cancel</button><button class="btn danger" id="rGo">Restart</button></div>');
        back.querySelector("#rCancel").onclick = () => back.remove();
        back.querySelector("#rGo").onclick = () => { state.plans[id] = { start: isoToday(), done: {} }; save(); back.remove(); drawPlan(id, 0); };
      };
      $("planBody").querySelectorAll(".pref").forEach(btn => btn.onclick = () => {
        if (state.corpus !== "bible"){ state.corpus = "bible"; txSel.value = state.tx; applyMode(); save(); }
        renderChapter(parseInt(btn.dataset.b, 10), parseInt(btn.dataset.c, 10));
      });
    }
  }

  /* the whole day's readings on one page */
  function renderPlanDay(planId, day){
    cur = { kind:"planDay", planId, day };
    record(cur);
    if (state.corpus !== "bible"){ state.corpus = "bible"; txSel.value = state.tx; applyMode(); save(); }
    const def = C.PLANS.find(p => p.id === planId);
    const seq = ++renderSeq;
    loadingView("Gathering Day " + (day + 1) + " readings\u2026");
    planReady(planId).then(() => {
      const dref = C.planDayRefs(planId, day);
      const chapKeys = []; const seen = new Set();
      dref.refs.forEach(r => r.parts.forEach(p => {
        const k = p.b + ":" + p.c;
        if (!seen.has(k)){ seen.add(k); chapKeys.push({ b: p.b, c: p.c }); }
      }));
      return Promise.all(chapKeys.map(k => activeChapterAsync(k.b, k.c).then(res => [k.b + ":" + k.c, res])))
        .then(pairs => {
          if (seq !== renderSeq) return;
          const chmap = Object.fromEntries(pairs);
          const ps = state.plans[planId] || { done: {} };
          const hlTx = activeHlTx();
          let html = '<div class="view"><div class="crumb"><button class="btn" id="backPlan">\u2190 Plan</button></div>' +
            '<div class="ch-head"><h2 class="ch-title">Day ' + (day + 1) + '</h2>' +
            (dref.period ? '<p class="pd-period">' + esc(dref.period) + '</p>' : '') +
            '<p class="ch-notice">' + esc(def.name) + '</p></div>';
          dref.refs.forEach(r => {
            html += '<div class="pd-reading-head">' + esc(r.label) + '</div>';
            r.parts.forEach(p => {
              const res = chmap[p.b + ":" + p.c];
              if (!res) return;
              const ch = res.ch, fell = res.fell;
              const bkid = D.books[p.b].id;
              html += '<p class="ch-book" style="margin:.3rem 0 .2rem;text-align:center">' + esc(C.chapterLabel(p.b, p.c)) + (fell ? " \u00b7 DR" : "") + '</p>' +
                '<div class="card" style="margin-bottom:1rem"><div class="verses">';
              ch.v.forEach((t, j) => {
                const num = C.vnum(ch, j);
                if (p.v1 && num < p.v1) return;
                if (p.v2 && num > p.v2) return;
                html += '<p class="v"><sup class="vn">' + num + '</sup><span class="vt" data-b="' + p.b + '" data-c="' + p.c + '" data-i="' + j + '">' +
                        (!fell && state.tx === "grail" ? flowGrail(renderTextWithHls(t, hlTx, bkid, p.c, j)) : renderTextWithHls(t, hlTx, bkid, p.c, j)) + '</span></p>';
              });
              html += '</div></div>';
            });
          });
          html += '<div class="rowbtns" style="display:flex;justify-content:center;gap:.6rem;margin:1rem 0;flex-wrap:wrap">' +
            '<button class="btn nav-arrow" id="pdayPrev" ' + (day > 0 ? "" : "disabled") + '>\u2190 Day ' + day + '</button>' +
            '<button class="btn ' + (ps.done && ps.done[day] ? "" : "primary") + '" id="pdayDone">' + (ps.done && ps.done[day] ? "\u2713 Completed \u2014 undo" : "Mark day complete") + '</button>' +
            '<button class="btn nav-arrow" id="pdayNext" ' + (day < def.days - 1 ? "" : "disabled") + '>Day ' + (day + 2) + ' \u2192</button></div></div>';
          view.innerHTML = html;
          $("backPlan").onclick = () => renderPlan(day);
          if (day > 0) $("pdayPrev").onclick = () => renderPlanDay(planId, day - 1);
          if (day < def.days - 1) $("pdayNext").onclick = () => renderPlanDay(planId, day + 1);
          $("pdayDone").onclick = () => {
            const st = state.plans[planId] || (state.plans[planId] = { start: isoToday(), done: {} });
            if (st.done[day]) delete st.done[day]; else st.done[day] = true;
            save(); renderPlanDay(planId, day);
          };
          selCtx = { tx: hlTx, book: null, c: null,
            list: [...view.querySelectorAll(".vt")].map(el => ({ el, i: parseInt(el.dataset.i, 10),
              book: D.books[parseInt(el.dataset.b, 10)].id, c: parseInt(el.dataset.c, 10) })) };
          scrollTo({ top: 0, behavior: "smooth" });
        });
    }).catch(() => showToast("Could not load the plan data"));
  }

  /* ---------- the Trees: the Psalms, and the Gospels & Acts ---------- */
  /* Branches and twigs open by choice, never by chance. Psalm leaves are Grail verses,
     numbered after the Vulgate (the Douay's same verses when no Grail file is imported);
     Gospel leaves are scenes (every telling of an event) or single verses, shown in the
     current translation where it is built in. */
  const loadTree = () => loadGrailOrMap().then(() => loadScript("data-tree.js", () => !!window.LUMINA_TREE));
  const loadGTree = () => loadScript("data-gtree.js", () => !!window.LUMINA_GTREE);
  const NT_BOOK = { mt:"matthew", mk:"mark", lk:"luke", jn:"john", ac:"acts" };
  let treeOpen = new Set(), treeScroll = 0;
  const TREE_ART =
    '<svg class="tree-art" viewBox="0 0 120 110" fill="none" stroke="currentColor" stroke-width="2.2" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M60 90V52M60 72L43 57M60 63L78 48M60 53L49 37M60 53L69 33M43 57L32 51M78 48L90 44M60 90C56 94 50 95 45 96M60 90C64 94 70 95 75 96"/>' +
    '<g fill="currentColor" stroke="none" opacity=".85">' +
    [[32,49],[28,39],[36,30],[45,23],[56,19],[67,19],[77,23],[86,30],[92,39],[89,49],[80,41],[71,30],[50,30],[42,40],[61,27],[74,37],[53,43],[66,42]]
      .map(p => '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3.6"/>').join("") + '</g>' +
    '<g class="water"><path d="M16 101q7-4 14 0t14 0t14 0t14 0t14 0t14 0t14 0"/><path d="M30 107q7-4 14 0t14 0t14 0t14 0t14 0"/></g></svg>';
  /* the Grail's chanting lines flow as one paragraph, a faint dot where each line ends */
  function flowGrail(html){ return html.replace(/\n/g, '<span class="gl">\n</span>'); }
  /* a New Testament verse [bk, c, v] (Douay numbering) in the current translation when built in */
  function ntVerse(bk, c, v){
    const b = C.bookIdxById(NT_BOOK[bk]), drb = D.books[b].ch[c - 1], i = v - 1;
    const tx = state.tx, meta = txMeta(tx);
    if (tx !== "drb" && meta.kind === "local" && !meta.only && txData(tx)){
      const ch = C.txChapter(txData(tx), b, c - 1);
      if (ch){ const j = C.mapToTx(ch, i); if (j >= 0 && ch.v[j]) return ch.v[j]; }
    }
    return drb.v[i] || "";
  }
  function ntCite(bk, c, v1, c2, v2){
    const name = NT_BOOK[bk] === "acts" ? "Acts" : C.bookByIdx(C.bookIdxById(NT_BOOK[bk])).name;
    if (c2 == null) return name + " " + c + ":" + v1;
    return name + " " + c + ":" + v1 + (c2 !== c ? "–" + c2 + ":" + v2 : v2 !== v1 ? "–" + v2 : "");
  }
  const NT_ABBR = { mt:"Mt", mk:"Mk", lk:"Lk", jn:"Jn", ac:"Acts" };
  function sceneCite(sc){
    if (sc.tl.length > 1) return "Told in " + sc.tl.map(t => NT_ABBR[t[0]]).join(" · ");
    const [bk, parts] = sc.tl[0], p = parts[0], q = parts[parts.length - 1];
    return ntCite(bk, p[0], p[1], q[2], q[3]);
  }
  function renderTree(opts){
    const restore = opts && opts.restore;
    if (!restore) treeOpen = new Set();
    const kind = state.treeKind === "gospels" ? "gospels" : "psalms";
    cur = { kind:"tree", t: kind };
    record(cur);
    selCtx = null;
    const seq = ++renderSeq;
    (kind === "gospels" ? loadGTree() : loadTree()).then(() => {
      if (seq !== renderSeq) return;
      const psB = C.bookIdxById("psalms");
      let T, head, leaves, count;
      if (kind === "psalms"){
        T = window.LUMINA_TREE;
        const g = txData("grail"), dps = D.books[psB].ch;
        /* without the Grail, each leaf is the Douay verse it answers to (once, if two Grail verses share it) */
        const refsOf = tw => {
          if (g) return tw.refs;
          const seen = new Set();
          return tw.refs.filter(([ps, n]) => { const m = grailPsalm(ps), k = ps + ":" + m.d[m.n ? m.n.indexOf(n) : n - 1]; return !seen.has(k) && seen.add(k); });
        };
        const g13 = g && g.books[psB].ch[0].v[2];
        head = { title:"The Psalm Tree",
          motto: g13 ? g13.split("\n").slice(0, 2).join(" ").replace(/[,;:]$/, ".") : "And he shall be like a tree which is planted near the running waters.",
          cite:"Psalm 1:3", hint:"Open whatever the Spirit draws you to. Every psalm hangs somewhere on this tree." };
        count = tw => refsOf(tw).length;
        leaves = tw => refsOf(tw).map(([ps, n]) => {
          const ch = grailPsalm(ps), j = ch.n ? ch.n.indexOf(n) : n - 1;
          const num = g ? n : C.vnum(dps[ps - 1], ch.d[j]);
          const text = g ? flowGrail(esc(ch.v[j])) : esc(dps[ps - 1].v[ch.d[j]]);
          return '<div class="leaf" role="button" tabindex="0" data-ps="' + ps + '" data-j="' + j + '">' +
            '<span class="l-cite">Psalm ' + ps + ':' + num + '</span>' +
            '<span class="l-text">' + text + '</span></div>';
        }).join("");
      } else {
        T = window.LUMINA_GTREE;
        head = { title:"The Gospels & Acts", motto:"I am the vine: you the branches.",
          cite:"John 15:5", hint:"Open whatever the Spirit draws you to. Every chapter of the Gospels and Acts hangs here; a scene opens every telling of it." };
        count = tw => tw.items.length;
        leaves = tw => tw.items.map(it => {
          if (typeof it === "string"){
            const sc = T.scenes[it.slice(2)];
            return '<div class="leaf scene" role="button" tabindex="0" data-s="' + it.slice(2) + '">' +
              '<span class="l-cite">' + esc(sceneCite(sc)) + '</span>' +
              '<span class="l-title">' + esc(sc.t) + '</span>' +
              '<span class="l-text">' + esc(ntVerse(...sc.k)) + '</span></div>';
          }
          const [bk, c, v, ps] = it;
          return '<div class="leaf" role="button" tabindex="0" data-bk="' + bk + '" data-c="' + c + '" data-v="' + v + '">' +
            '<span class="l-cite">' + esc(ntCite(bk, c, v)) + '</span>' +
            '<span class="l-text">' + esc(ntVerse(bk, c, v)) + '</span>' +
            (ps ? '<button class="btn small pslink" data-ps="' + ps + '">↔ Psalm ' + ps + '</button>' : '') + '</div>';
        }).join("");
      }
      let html = '<div class="view"><div class="tree-switch" role="tablist">' +
          '<button class="btn small' + (kind === "psalms" ? " on" : "") + '" data-k="psalms">The Psalms</button>' +
          '<button class="btn small' + (kind === "gospels" ? " on" : "") + '" data-k="gospels">Gospels &amp; Acts</button></div>' +
        '<div class="tree-head">' + TREE_ART +
        '<h2 class="ch-title">' + head.title + '</h2>' +
        '<p class="tree-motto">“' + head.motto + '” <span class="cite">' + head.cite + '</span></p>' +
        '<p class="tree-hint">' + head.hint + '</p></div><div class="tree">';
      T.branches.forEach(br => {
        const bid = kind[0] + ":" + br.id;
        html += '<details class="tb" data-id="' + bid + '"' + (treeOpen.has(bid) ? " open" : "") + '><summary>' +
          '<span class="t-ic">' + br.icon + '</span>' +
          '<span class="t-main"><span class="t-name">' + esc(br.name) + '</span>' +
          '<span class="t-desc">' + esc(br.desc) + '</span></span>' +
          '<span class="t-caret">▸</span></summary><div class="twigs">';
        br.twigs.forEach(tw => {
          const id = bid + "/" + tw.id, open = treeOpen.has(id);
          if (tw.group) html += '<p class="t-group">' + esc(tw.group) + '</p>';
          html += '<details class="tt" data-id="' + id + '"' + (open ? " open" : "") + '><summary>' +
            '<span class="t-name">' + esc(tw.name) + '</span>' +
            '<span class="t-count">' + count(tw) + '</span><span class="t-caret">▸</span></summary>' +
            '<div class="leaves">' + (open ? leaves(tw) : "") + '</div></details>';
        });
        html += '</div></details>';
      });
      view.innerHTML = html + '</div></div>';
      const twigOf = id => { const [bid, tid] = id.split("/"); return T.branches.find(x => x.id === bid.slice(2)).twigs.find(x => x.id === tid); };
      view.querySelectorAll(".tree details").forEach(d => d.addEventListener("toggle", () => {
        const id = d.dataset.id;
        if (d.open) treeOpen.add(id); else treeOpen.delete(id);
        const box = d.classList.contains("tt") && d.querySelector(".leaves");
        if (box && d.open && !box.childElementCount) box.innerHTML = leaves(twigOf(id));
      }));
      view.querySelectorAll(".tree-switch button").forEach(b => b.onclick = () => {
        if (b.dataset.k === kind) return;
        state.treeKind = b.dataset.k; save(); renderTree();
      });
      const toBible = () => { if (state.corpus !== "bible"){ state.corpus = "bible"; txSel.value = state.tx; save(); applyMode(); } };
      const act = e => {
        const pl = e.target.closest(".pslink");
        const leaf = e.target.closest(".leaf");
        if (!pl && !leaf) return;
        treeScroll = scrollY;
        toBible();

  /* "21:2" — a Psalm (Vulgate) and Grail verse — opened with the verse lit */
  function openPsalmVerse(ref){

  /* ---------- 🔔 Reminders: one-off and every-day, color-coded, pinned ones stay on top ----------
     Kept in state.reminders (synced item by item, like favorites). A reminder:
     { id, title, notes, color, pinned, pinnedAt, repeat: null|"daily", date: "YYYY-MM-DD"|null, time: "HH:MM"|null,
       done (one-off), doneAt, doneOn (every-day: the last day it was checked), log: [days checked], list, created } */
  const REM_COLORS = [["red","#d0453a"],["orange","#e08a2a"],["yellow","#d4b42a"],["green","#4f9a5a"],["blue","#3f7fc4"],["purple","#8e5bb5"]];
  const remHex = c => (REM_COLORS.find(x => x[0] === c) || [])[1] || "";
  const remDay = (d = new Date()) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  if (!Array.isArray(state.reminders)) state.reminders = [];
  let remFilter = null, remShowDone = false;
  /* every month: date is the next time it is due; checking it moves date on a month (doneOn shows it checked for the rest of today) */
  const remIsDone = r => r.repeat === "daily" || r.repeat === "monthly" ? r.doneOn === remDay() : !!r.done;
  function remMonthOn(day, n, mday){
    const [y, m] = day.split("-").map(Number), t = new Date(y, m - 1 + n, 1);
    const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
    t.setDate(Math.min(mday || +day.slice(8), last)); return remDay(t);
  }
  const remOrd = n => n + (n % 10 === 1 && n !== 11 ? "st" : n % 10 === 2 && n !== 12 ? "nd" : n % 10 === 3 && n !== 13 ? "rd" : "th");
  /* when it is due, as a time on the clock (null: no date) */
  function remDueAt(r){
    const day = r.repeat === "daily" ? remDay() : r.date;
    if (!day) return null;
    const [y, m, d] = day.split("-").map(Number), [hh, mm] = (r.time || "23:59").split(":").map(Number);
    return new Date(y, m - 1, d, hh, mm).getTime();
  }
  function remStreak(r){
    const log = new Set(r.log || []); let n = 0; const d = new Date();
    if (!log.has(remDay(d))) d.setDate(d.getDate() - 1);     /* today not yet done: the streak so far still counts */
    while (log.has(remDay(d))){ n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function remWhen(r){
    const t = r.time ? new Date(2000, 0, 1, ...r.time.split(":").map(Number)).toLocaleTimeString([], { hour:"numeric", minute:"2-digit" }) : "";
    if (r.repeat === "daily"){ const s = remStreak(r); return "Every day" + (t ? " · " + t : "") + (s > 1 ? " · " + s + " days running" : ""); }
    if (!r.date) return r.repeat === "monthly" ? "Every month" : "";
    if (r.repeat === "monthly" && r.doneOn === remDay()) return "Done today · next " + new Date(...r.date.split("-").map((v, i) => i === 1 ? v - 1 : +v)).toLocaleDateString([], { month:"short", day:"numeric" });
    const today = remDay(), tm = new Date(); tm.setDate(tm.getDate() + 1);
    const [y, m, d] = r.date.split("-").map(Number), dt = new Date(y, m - 1, d);
    const day = r.date === today ? "Today" : r.date === remDay(tm) ? "Tomorrow"
      : dt.toLocaleDateString([], { weekday:"short", month:"short", day:"numeric", year: y === tm.getFullYear() ? undefined : "numeric" });
    return day + (t ? " · " + t : "") + (r.repeat === "monthly" ? " · every month on the " + remOrd(r.mday || +r.date.slice(8)) : "");
  }
  /* the bar's badge: the every-day reminders still to do today */
  function remCount(){
    const end = new Date().setHours(23, 59, 59, 999);
    return state.reminders.filter(r => !remIsDone(r) && (r.repeat === "daily" || r.repeat === "monthly" && remDueAt(r) !== null && remDueAt(r) <= end)).length;
  }
  function remBadge(){
    const b = $("remBadge"); if (!b) return;
    const n = remCount(); b.textContent = n > 99 ? "99+" : n; b.classList.toggle("on", n > 0);
  }
  function remToggle(id){
    const r = state.reminders.find(x => x.id === id); if (!r) return;
    if (r.repeat === "daily"){
      const t = remDay(), log = new Set(r.log || []);
      if (r.doneOn === t){ r.doneOn = null; log.delete(t); } else { r.doneOn = t; log.add(t); }
      r.log = [...log].sort().slice(-90);
    } else if (r.repeat === "monthly"){
      const t = remDay(), d = r.date || t;
      if (r.doneOn === t){ r.doneOn = null; r.date = remMonthOn(d, -1, r.mday); }
      else { r.doneOn = t; r.date = remMonthOn(d, 1, r.mday); }
      remAlerted(r.id, null);
    } else { r.done = !r.done; r.doneAt = r.done ? Date.now() : null; }
    save(); remBadge();
  }
  function remRow(r){
    const hex = remHex(r.color), done = remIsDone(r), due = remDueAt(r), late = !done && due !== null && due < Date.now();
    const sub = [remWhen(r), r.list && r.list !== "My Tasks" ? r.list : "", r.notes ? r.notes.split("\n")[0] : ""].filter(Boolean).join(" · ");
    return '<div class="rem-row' + (done ? " done" : "") + (r.pinned ? " pinned" : "") + '" data-rem="' + r.id + '"' + (hex ? ' style="--rc:' + hex + '"' : "") + '>' +
      '<button class="rem-check" data-chk="' + r.id + '" title="' + (done ? "Mark not done" : "Done") + '"><span class="rem-dot">' + (done ? "✓" : "") + '</span></button>' +
      '<div class="rem-main"><div class="rem-title">' + esc(r.title) + '</div>' +
      (sub ? '<div class="rem-sub' + (late ? " late" : "") + '">' + esc(sub) + '</div>' : "") + '</div>' +
      '<button class="rem-pin' + (r.pinned ? " on" : "") + '" data-pin="' + r.id + '" title="' + (r.pinned ? "Unpin" : "Pin to the top") + '">' + (r.pinned ? "★" : "☆") + '</button></div>';
  }
  function renderReminders(){
    try { remMoveIntents(); } catch(e){}            /* also when a sync brings them back from a device on an older build */
    cur = { kind:"rem" }; record(cur);
    const all = state.reminders.filter(r => !remFilter || (remFilter === "today" ? remDueAt(r) !== null && remDueAt(r) <= new Date().setHours(23, 59, 59, 999) : r.color === remFilter));
    const byDue = (a, b) => (remDueAt(a) ?? Infinity) - (remDueAt(b) ?? Infinity) || (a.created || 0) - (b.created || 0);
    const nDone = all.filter(remIsDone).length;
    const vis = r => remShowDone || !remIsDone(r);
    const pinned = all.filter(r => vis(r) && r.pinned && (!remIsDone(r) || r.repeat === "monthly")).sort((a, b) => (a.pinnedAt || 0) - (b.pinnedAt || 0));
    const daily = all.filter(r => vis(r) && !r.pinned && r.repeat === "daily").sort((a, b) => remIsDone(a) - remIsDone(b) || byDue(a, b));
    const once = all.filter(r => vis(r) && !r.pinned && r.repeat !== "daily" && !r.done).sort((a, b) => remIsDone(a) - remIsDone(b) || byDue(a, b));
    const done = all.filter(r => r.repeat !== "daily" && r.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
    const pinnedDaily = all.filter(r => vis(r) && r.pinned && r.repeat === "daily" && remIsDone(r));   /* checked for today: back in its place until tomorrow */
    const chip = (k, lb, hex) => '<button class="btn small rem-chip' + (remFilter === k ? " on" : "") + '" data-f="' + (k || "") + '">' +
      (hex ? '<i style="background:' + hex + '"></i>' : "") + lb + '</button>';
    let html = '<div class="view rem">';
    const tools = '<form class="rem-add" id="remAdd"><input type="text" id="remNew" placeholder="New reminder" autocomplete="off" enterkeyhint="done">' +
      '<button class="btn primary" type="submit">Add</button><button class="btn" type="button" id="remMore" title="Add with a date, color, every day…">…</button></form>' +
      '<div class="rem-chips">' + chip(null, "All") + chip("today", "Today") + REM_COLORS.map(([k, h]) => chip(k, "", h)).join("") + '</div>' +
      '<div class="crumb rem-foot"><button class="btn" id="remBack">← Back</button> <button class="btn small" id="remImport">⇩ Import</button>' +
      (nDone ? ' <button class="btn small" id="remDoneTog">' + (remShowDone ? "Hide completed" : "Show completed (" + nDone + ")") + '</button>' : "") + '</div>' +
      '<div class="rem-sync">' + remSyncLine() + '</div>';
    const dailyAll = daily.concat(pinnedDaily);   /* A− A+ beside "Every day", or the first heading when there is none */
    const adjAt = dailyAll.length ? "daily" : pinned.length ? "pinned" : "once";
    const sec = (title, list, k) => list.length ? '<div class="rem-sec">' + title + (k === adjAt ? lsAdj : "") + '</div>' + list.map(remRow).join("") : "";
    html += sec("★ Pinned", pinned, "pinned") + sec("Every day", dailyAll, "daily") + sec(daily.length || pinned.length ? "Reminders" : "", once, "once");
    if (!pinned.length && !daily.length && !once.length && !pinnedDaily.length)
      html += '<p class="rem-empty">' + (nDone && !remShowDone ? "All done. ✓" : remFilter ? "Nothing here." : "No reminders yet. Type one above, or ⇩ Import your Google Tasks.") + '</p>';
    if (done.length && remShowDone)
      html += '<div class="rem-sec">Completed</div>' + done.map(remRow).join("") + '<div class="rem-clear"><button class="btn small danger" id="remClear">Clear completed</button></div>';
    view.innerHTML = html + tools + '</div>';
    if ($("remSyncNow")) $("remSyncNow").onclick = () => { syncNow(true).then(() => { const e = view.querySelector(".rem-sync"); if (e) e.innerHTML = remSyncLine(); }); };
    $("remBack").onclick = () => navBack();
    $("remImport").onclick = remImportSheet;
    $("remMore").onclick = () => remEdit(null, $("remNew").value.trim());
    $("remAdd").onsubmit = e => {
      e.preventDefault();
      const t = $("remNew").value.trim(); if (!t) return;
      state.reminders.push({ id: uid(), title: t, color: ["today", null].includes(remFilter) ? null : remFilter, created: Date.now(),
        date: remFilter === "today" ? remDay() : null });
      save(); remBadge(); renderReminders(); $("remNew").focus();
    };
    lsWire();
    view.querySelectorAll(".rem-chip").forEach(b => b.onclick = () => { remFilter = b.dataset.f || null; renderReminders(); });
    view.querySelectorAll("[data-chk]").forEach(b => b.onclick = e => { e.stopPropagation(); primeSound(); remToggle(b.dataset.chk); renderReminders(); });
    view.querySelectorAll("[data-pin]").forEach(b => b.onclick = e => {
      e.stopPropagation();
      const r = state.reminders.find(x => x.id === b.dataset.pin); r.pinned = !r.pinned; r.pinnedAt = r.pinned ? Date.now() : null;
      save(); renderReminders();
    });
    view.querySelectorAll("[data-rem]").forEach(el => el.onclick = () => remEdit(el.dataset.rem));
    if ($("remDoneTog")) $("remDoneTog").onclick = () => { remShowDone = !remShowDone; renderReminders(); };
    if ($("remClear")) $("remClear").onclick = () => {
      state.reminders = state.reminders.filter(r => !(r.repeat !== "daily" && r.done)); save(); renderReminders();
    };
    remBadge();
  }
  /* where the reminders are kept: says plainly when they are only on this device */
  function remSyncLine(){
    if (!localStorage.getItem("lumina.scriptorium.vault"))
      return "Saved on this device only. To have them everywhere, open Lumina from your Home Screen and set up Scriptorium (☰ More), which syncs them.";

  }
  /* the Reminders page shows only the list and its own buttons: Lumina's title, Book/Focus row and footer step aside */

  /* the sheet for one reminder (new when id is null) */

  /* ⇩ Import: Google Tasks (Google Takeout's Tasks.json), or a pasted list, one reminder a line */
  function remImportSheet(){

    const q = s => back.querySelector(s);

    const add = items => {

    q("#riCancel").onclick = () => back.remove();

    loadTx(state.tx).then(begin).catch(e => {
      state.tx = "drb"; txSel.value = "drb"; applyMode(); begin();
      if (e && e.noGrail) setTimeout(() => showToast("Your Grail file is not on this device"), 400);
    });
  } else begin();
})();

// The build (the ?v= on scriptorium.js, which is bumped with every update) and the update check: under the bottom buttons on phones, top right on wide screens.
(function(){
  const mine = +((document.documentElement.innerHTML.match(/scriptorium\.js\?v=(\d+)/) || [])[1] || 0);
  const btn = document.createElement("button");
  btn.id = "scrBuildTop"; btn.title = "Check for updates"; btn.textContent = "b" + mine;
  document.body.appendChild(btn);
  let latest = 0;
  async function check(){
    try {
      const html = await (await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" })).text();
      latest = +((html.match(/scriptorium\.js\?v=(\d+)/) || [])[1] || 0);
    } catch (e) { return null; }
    const newer = latest > mine;
    btn.classList.toggle("new", newer);
    btn.textContent = newer ? "b" + mine + " → b" + latest + " ↑" : "b" + mine;
    return newer;
  }
  btn.onclick = async () => {
    const newer = await check();
    if (newer === null) return alert("Couldn't check for updates. Are you online?");
    if (!newer) return alert("You have the latest build, b" + mine + ".");
    if (confirm("Build b" + latest + " is ready (you have b" + mine + "). Update now? Nothing you've saved is lost."))
      location.replace(location.pathname + "?b=" + latest + "&t=" + Date.now() + location.hash);
  };
  setTimeout(check, 3000);
})();
</script>
