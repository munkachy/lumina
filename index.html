              html += '<p class="ch-book" style="margin:.5rem 0 .2rem;text-align:center">' +
                esc(C.chapterLabel(p.b, p.c)) + (fell ? " \u00b7 DR" : "") + '</p>' +
                (mismatch ? '<p class="ch-notice">Verse numbering differs here \u2014 showing the whole chapter.</p>' : '') +
                (isPsalm && !mismatch ? '<p class="ch-notice">The lectionary numbers psalms in the Hebrew tradition; ' +
                  'Vulgate verses can differ by one \u2014 open the full psalm if a line seems to begin oddly.</p>' : '') +
                '<div class="card" style="margin-bottom:.9rem"><div class="verses">';
              idxs.forEach(j => {
                html += '<p class="v"><sup class="vn">' + C.vnum(ch, j) + '</sup>' +
                  '<span class="vt" data-b="' + p.b + '" data-c="' + p.c + '" data-i="' + j + '">' +
                  renderTextWithHls(ch.v[j], hlTx, bkid, p.c, j) + '</span></p>';
              });
              html += '</div></div>' +
                '<div style="text-align:center;margin:-.3rem 0 .8rem">' +
                '<button class="btn small opench" data-b="' + p.b + '" data-c="' + p.c + '">Open ' +
                esc(C.chapterLabel(p.b, p.c)) + ' \u2192</button></div>';
            });
            html += '</div>';
          });
          html += '<p class="attribution">Readings for ' + esc(date) + ' from the USCCB lectionary via Cathople' +
            ((d.source && d.source.usccbLink) ? ' \u00b7 <a href="' + esc(d.source.usccbLink) +
              '" target="_blank" rel="noopener" style="color:var(--gold)">USCCB</a>' : '') +
            '<br>Scripture shown in <b>' + esc(meta.name) + '</b> \u2014 change it with \u201cRead in\u201d above.' +
            (apiCopyright[meta.id] ? '<br>' + esc(apiCopyright[meta.id]) : '') + '</p>';
          body.innerHTML = html;
          body.querySelectorAll(".opench").forEach(btn => btn.onclick = () =>
            renderChapter(parseInt(btn.dataset.b, 10), parseInt(btn.dataset.c, 10)));
          body.querySelectorAll(".v").forEach(pv => pv.addEventListener("dblclick", () => {
            const sp = pv.querySelector(".vt");
            if (!sp) return;
            const b = +sp.dataset.b, c = +sp.dataset.c, j = +sp.dataset.i;
            const res = chmap[b + ":" + c];
            if (res) copy("\u201c" + res.ch.v[j] + "\u201d \u2014 " + C.citation(b, c, C.vnum(res.ch, j)));
          }));
          selCtx = { tx: hlTx, book: null, c: null,
            list: [...body.querySelectorAll(".vt")].map(el => ({ el, i: parseInt(el.dataset.i, 10),
              book: D.books[parseInt(el.dataset.b, 10)].id, c: parseInt(el.dataset.c, 10) })) };
        })
        .catch(() => { body.innerHTML = '<p class="ch-notice">Could not load the scripture text.</p>'; });
    };

    if (readingsCache[date]) return draw(readingsCache[date]);
    fetch(CATH_BASE + "/readings/daily?date=" + date + "&lang=en", {
      headers: { "Authorization": "Bearer " + CATH_KEY, "Accept": "application/json" }
    }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(j => { if (!j.success) throw new Error("api"); readingsCache[date] = j;
        if (cur.kind === "readings" && cur.date === date) draw(j); })
      .catch(() => { body.innerHTML = '<p class="ch-notice">Could not fetch the readings \u2014 check your connection, or the date may be beyond the calendar.</p>'; });
  }

  /* ---------- reading plan ---------- */
  function planReady(id){ return id !== "biy" ? Promise.resolve() : loadBiy(); }
  function renderPlan(dayOverride){
    cur = { kind:"plan", day: dayOverride == null ? null : dayOverride };
    record(cur);
    selCtx = null;
    const active = state.activePlan;
    view.innerHTML = '<div class="view"><div class="crumb"><button class="btn" id="backMore">\u2190 Back</button></div>' +
      '<div class="ch-head"><h2 class="ch-title">Reading Plan</h2></div>' +
      '<div class="controls"><select id="planSel"><option value="">\u2014 choose a plan \u2014</option>' +
      C.PLANS.map(p => '<option value="' + p.id + '"' + (p.id === active ? " selected" : "") + '>' + esc(p.name) + '</option>').join("") +
      '</select></div><div id="planBody"></div></div>';
    $("backMore").onclick = () => navBack();
    $("planSel").onchange = () => {
      const id = $("planSel").value;
      if (!id){ state.activePlan = null; save(); $("planBody").innerHTML = ""; return; }
      if (!state.plans[id]) state.plans[id] = { start: isoToday(), done: {} };
      state.activePlan = id; save();
      planReady(id).then(() => drawPlan(id)).catch(() => showToast("Could not load the plan data"));
    };
    if (active){
      if (!state.plans[active]) state.plans[active] = { start: isoToday(), done: {} };
      planReady(active).then(() => drawPlan(active, dayOverride == null ? undefined : dayOverride))
        .catch(() => showToast("Could not load the plan data"));
    }
    function drawPlan(id, viewDay){
      const def = C.PLANS.find(p => p.id === id);
      const ps = state.plans[id];
      const day = viewDay == null ? C.resumeDay(ps.done, def.days) : Math.max(0, Math.min(def.days - 1, viewDay));
      cur = { kind:"plan", day };
      if (nav.idx >= 0 && nav.stack[nav.idx] && nav.stack[nav.idx].kind === "plan")
        nav.stack[nav.idx] = JSON.parse(JSON.stringify(cur));
      const dref = C.planDayRefs(id, day);
      const doneCount = Object.keys(ps.done).length;
      let html = '<div class="progress"><i style="width:' + Math.round(100 * doneCount / def.days) + '%"></i></div>' +
        '<p class="ch-notice">' + doneCount + ' of ' + def.days + ' days completed \u00b7 began ' + esc(ps.start) + '</p>' +
        '<div class="plan-day">' +
        '<button class="btn nav-arrow" id="pdPrev" ' + (day > 0 ? "" : "disabled") + '>\u2190</button>' +
        '<span class="pd">Day ' + (day + 1) + '</span>' +
        '<button class="btn nav-arrow" id="pdNext" ' + (day < def.days - 1 ? "" : "disabled") + '>\u2192</button></div>' +
        (dref.period ? '<p class="pd-period">' + esc(dref.period) + '</p>' : '');
      if (!dref.refs.length) html += '<p class="ch-notice" style="margin:1rem 0">A day of rest and review \u2014 no new chapters.</p>';
      else {
        html += '<div class="chapter-grid" style="margin:.8rem 0">';
        dref.refs.forEach(r => html += '<button class="book-btn pref" data-b="' + r.parts[0].b + '" data-c="' + r.parts[0].c + '" style="min-width:auto;padding:.5rem .8rem">' + esc(r.label) + '</button>');
        html += '</div><div style="text-align:center;margin:.4rem 0"><button class="btn primary" id="pdOpen">Read Day ' + (day + 1) + ' \u2192</button></div>';
      }
      html += '<div class="rowbtns" style="display:flex;justify-content:center;gap:.6rem;margin-top:.6rem">' +
        '<button class="btn ' + (ps.done[day] ? "" : "primary") + '" id="pdDone">' + (ps.done[day] ? "\u2713 Completed \u2014 undo" : "Mark day complete") + '</button>' +
        '<button class="btn danger small" id="pdRestart">Restart plan</button></div>';
      $("planBody").innerHTML = html;
      $("pdPrev").onclick = () => day > 0 && drawPlan(id, day - 1);
      $("pdNext").onclick = () => day < def.days - 1 && drawPlan(id, day + 1);
      const open = $("pdOpen"); if (open) open.onclick = () => renderPlanDay(id, day);
      $("pdDone").onclick = () => { if (ps.done[day]) delete ps.done[day]; else ps.done[day] = true; save(); drawPlan(id, day); };
      $("pdRestart").onclick = () => {
        const back = modal('<h3>Restart this plan?</h3><p style="text-align:center">Progress will be cleared and the start date set to today.</p>' +
          '<div class="rowbtns"><button class="btn" id="rCancel">Cancel</button><button class="btn danger" id="rGo">Restart</button></div>');
        back.querySelector("#rCancel").onclick = () => back.remove();
        back.querySelector("#rGo").onclick = () => { state.plans[id] = { start: isoToday(), done: {} }; save(); back.remove(); drawPlan(id, 0); };
      };
      $("planBody").querySelectorAll(".pref").forEach(btn => btn.onclick = () => {
        if (state.corpus !== "bible"){ state.corpus = "bible"; txSel.value = state.tx; applyMode(); save(); }
        renderChapter(parseInt(btn.dataset.b, 10), parseInt(btn.dataset.c, 10));
      });
    }
  }

  /* the whole day's readings on one page */
  function renderPlanDay(planId, day){
    cur = { kind:"planDay", planId, day };
    record(cur);
    if (state.corpus !== "bible"){ state.corpus = "bible"; txSel.value = state.tx; applyMode(); save(); }
    const def = C.PLANS.find(p => p.id === planId);
    const seq = ++renderSeq;
    loadingView("Gathering Day " + (day + 1) + " readings\u2026");
    planReady(planId).then(() => {
      const dref = C.planDayRefs(planId, day);
      const chapKeys = []; const seen = new Set();
      dref.refs.forEach(r => r.parts.forEach(p => {
        const k = p.b + ":" + p.c;
        if (!seen.has(k)){ seen.add(k); chapKeys.push({ b: p.b, c: p.c }); }
      }));
      return Promise.all(chapKeys.map(k => activeChapterAsync(k.b, k.c).then(res => [k.b + ":" + k.c, res])))
        .then(pairs => {
          if (seq !== renderSeq) return;
          const chmap = Object.fromEntries(pairs);
          const ps = state.plans[planId] || { done: {} };
          const hlTx = activeHlTx();
          let html = '<div class="view"><div class="crumb"><button class="btn" id="backPlan">\u2190 Plan</button></div>' +
            '<div class="ch-head"><h2 class="ch-title">Day ' + (day + 1) + '</h2>' +
            (dref.period ? '<p class="pd-period">' + esc(dref.period) + '</p>' : '') +
            '<p class="ch-notice">' + esc(def.name) + '</p></div>';
          dref.refs.forEach(r => {
            html += '<div class="pd-reading-head">' + esc(r.label) + '</div>';
            r.parts.forEach(p => {
              const res = chmap[p.b + ":" + p.c];
              if (!res) return;
              const ch = res.ch, fell = res.fell;
              const bkid = D.books[p.b].id;
              html += '<p class="ch-book" style="margin:.3rem 0 .2rem;text-align:center">' + esc(C.chapterLabel(p.b, p.c)) + (fell ? " \u00b7 DR" : "") + '</p>' +
                '<div class="card" style="margin-bottom:1rem"><div class="verses">';
              ch.v.forEach((t, j) => {
                const num = C.vnum(ch, j);
                if (p.v1 && num < p.v1) return;
                if (p.v2 && num > p.v2) return;
                html += '<p class="v"><sup class="vn">' + num + '</sup><span class="vt" data-b="' + p.b + '" data-c="' + p.c + '" data-i="' + j + '">' +
                        (!fell && state.tx === "grail" ? flowGrail(renderTextWithHls(t, hlTx, bkid, p.c, j)) : renderTextWithHls(t, hlTx, bkid, p.c, j)) + '</span></p>';
              });
              html += '</div></div>';
            });
          });
          html += '<div class="rowbtns" style="display:flex;justify-content:center;gap:.6rem;margin:1rem 0;flex-wrap:wrap">' +
            '<button class="btn nav-arrow" id="pdayPrev" ' + (day > 0 ? "" : "disabled") + '>\u2190 Day ' + day + '</button>' +
            '<button class="btn ' + (ps.done && ps.done[day] ? "" : "primary") + '" id="pdayDone">' + (ps.done && ps.done[day] ? "\u2713 Completed \u2014 undo" : "Mark day complete") + '</button>' +
            '<button class="btn nav-arrow" id="pdayNext" ' + (day < def.days - 1 ? "" : "disabled") + '>Day ' + (day + 2) + ' \u2192</button></div></div>';
          view.innerHTML = html;
          $("backPlan").onclick = () => renderPlan(day);
          if (day > 0) $("pdayPrev").onclick = () => renderPlanDay(planId, day - 1);
          if (day < def.days - 1) $("pdayNext").onclick = () => renderPlanDay(planId, day + 1);
          $("pdayDone").onclick = () => {
            const st = state.plans[planId] || (state.plans[planId] = { start: isoToday(), done: {} });
            if (st.done[day]) delete st.done[day]; else st.done[day] = true;
            save(); renderPlanDay(planId, day);
          };
          selCtx = { tx: hlTx, book: null, c: null,
            list: [...view.querySelectorAll(".vt")].map(el => ({ el, i: parseInt(el.dataset.i, 10),
              book: D.books[parseInt(el.dataset.b, 10)].id, c: parseInt(el.dataset.c, 10) })) };
          scrollTo({ top: 0, behavior: "smooth" });
        });
    }).catch(() => showToast("Could not load the plan data"));
  }

  /* ---------- the Trees: the Psalms, and the Gospels & Acts ---------- */
  /* Branches and twigs open by choice, never by chance. Psalm leaves are Grail verses,
     numbered after the Vulgate (the Douay's same verses when no Grail file is imported);
     Gospel leaves are scenes (every telling of an event) or single verses, shown in the
     current translation where it is built in. */
  const loadTree = () => loadGrailOrMap().then(() => loadScript("data-tree.js", () => !!window.LUMINA_TREE));
  const loadGTree = () => loadScript("data-gtree.js", () => !!window.LUMINA_GTREE);
  const NT_BOOK = { mt:"matthew", mk:"mark", lk:"luke", jn:"john", ac:"acts" };
  let treeOpen = new Set(), treeScroll = 0;
  const TREE_ART =
    '<svg class="tree-art" viewBox="0 0 120 110" fill="none" stroke="currentColor" stroke-width="2.2" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M60 90V52M60 72L43 57M60 63L78 48M60 53L49 37M60 53L69 33M43 57L32 51M78 48L90 44M60 90C56 94 50 95 45 96M60 90C64 94 70 95 75 96"/>' +
    '<g fill="currentColor" stroke="none" opacity=".85">' +
    [[32,49],[28,39],[36,30],[45,23],[56,19],[67,19],[77,23],[86,30],[92,39],[89,49],[80,41],[71,30],[50,30],[42,40],[61,27],[74,37],[53,43],[66,42]]
      .map(p => '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3.6"/>').join("") + '</g>' +
    '<g class="water"><path d="M16 101q7-4 14 0t14 0t14 0t14 0t14 0t14 0t14 0"/><path d="M30 107q7-4 14 0t14 0t14 0t14 0t14 0"/></g></svg>';
  /* the Grail's chanting lines flow as one paragraph, a faint dot where each line ends */
  function flowGrail(html){ return html.replace(/\n/g, '<span class="gl">\n</span>'); }
  /* a New Testament verse [bk, c, v] (Douay numbering) in the current translation when built in */
  function ntVerse(bk, c, v){
    const b = C.bookIdxById(NT_BOOK[bk]), drb = D.books[b].ch[c - 1], i = v - 1;
    const tx = state.tx, meta = txMeta(tx);
    if (tx !== "drb" && meta.kind === "local" && !meta.only && txData(tx)){
      const ch = C.txChapter(txData(tx), b, c - 1);
      if (ch){ const j = C.mapToTx(ch, i); if (j >= 0 && ch.v[j]) return ch.v[j]; }
    }
    return drb.v[i] || "";
  }
  function ntCite(bk, c, v1, c2, v2){
    const name = NT_BOOK[bk] === "acts" ? "Acts" : C.bookByIdx(C.bookIdxById(NT_BOOK[bk])).name;
    if (c2 == null) return name + " " + c + ":" + v1;
    return name + " " + c + ":" + v1 + (c2 !== c ? "–" + c2 + ":" + v2 : v2 !== v1 ? "–" + v2 : "");
  }
  const NT_ABBR = { mt:"Mt", mk:"Mk", lk:"Lk", jn:"Jn", ac:"Acts" };
  function sceneCite(sc){
    if (sc.tl.length > 1) return "Told in " + sc.tl.map(t => NT_ABBR[t[0]]).join(" · ");
    const [bk, parts] = sc.tl[0], p = parts[0], q = parts[parts.length - 1];
    return ntCite(bk, p[0], p[1], q[2], q[3]);
  }
  function renderTree(opts){
    const restore = opts && opts.restore;
    if (!restore) treeOpen = new Set();
    const kind = state.treeKind === "gospels" ? "gospels" : "psalms";
    cur = { kind:"tree", t: kind };
    record(cur);
    selCtx = null;
    const seq = ++renderSeq;
    (kind === "gospels" ? loadGTree() : loadTree()).then(() => {
      if (seq !== renderSeq) return;
      const psB = C.bookIdxById("psalms");
      let T, head, leaves, count;
      if (kind === "psalms"){
        T = window.LUMINA_TREE;
        const g = txData("grail"), dps = D.books[psB].ch;
        /* without the Grail, each leaf is the Douay verse it answers to (once, if two Grail verses share it) */
        const refsOf = tw => {
          if (g) return tw.refs;
          const seen = new Set();
          return tw.refs.filter(([ps, n]) => { const m = grailPsalm(ps), k = ps + ":" + m.d[m.n ? m.n.indexOf(n) : n - 1]; return !seen.has(k) && seen.add(k); });
        };
        const g13 = g && g.books[psB].ch[0].v[2];
        head = { title:"The Psalm Tree",
          motto: g13 ? g13.split("\n").slice(0, 2).join(" ").replace(/[,;:]$/, ".") : "And he shall be like a tree which is planted near the running waters.",
          cite:"Psalm 1:3", hint:"Open whatever the Spirit draws you to. Every psalm hangs somewhere on this tree." };
        count = tw => refsOf(tw).length;
        leaves = tw => refsOf(tw).map(([ps, n]) => {
          const ch = grailPsalm(ps), j = ch.n ? ch.n.indexOf(n) : n - 1;
          const num = g ? n : C.vnum(dps[ps - 1], ch.d[j]);
          const text = g ? flowGrail(esc(ch.v[j])) : esc(dps[ps - 1].v[ch.d[j]]);
          return '<div class="leaf" role="button" tabindex="0" data-ps="' + ps + '" data-j="' + j + '">' +
            '<span class="l-cite">Psalm ' + ps + ':' + num + '</span>' +
            '<span class="l-text">' + text + '</span></div>';
        }).join("");
      } else {
        T = window.LUMINA_GTREE;
        head = { title:"The Gospels & Acts", motto:"I am the vine: you the branches.",
          cite:"John 15:5", hint:"Open whatever the Spirit draws you to. Every chapter of the Gospels and Acts hangs here; a scene opens every telling of it." };
        count = tw => tw.items.length;
        leaves = tw => tw.items.map(it => {
          if (typeof it === "string"){
            const sc = T.scenes[it.slice(2)];
            return '<div class="leaf scene" role="button" tabindex="0" data-s="' + it.slice(2) + '">' +
              '<span class="l-cite">' + esc(sceneCite(sc)) + '</span>' +
              '<span class="l-title">' + esc(sc.t) + '</span>' +
              '<span class="l-text">' + esc(ntVerse(...sc.k)) + '</span></div>';
          }
          const [bk, c, v, ps] = it;
          return '<div class="leaf" role="button" tabindex="0" data-bk="' + bk + '" data-c="' + c + '" data-v="' + v + '">' +
            '<span class="l-cite">' + esc(ntCite(bk, c, v)) + '</span>' +
            '<span class="l-text">' + esc(ntVerse(bk, c, v)) + '</span>' +
            (ps ? '<button class="btn small pslink" data-ps="' + ps + '">↔ Psalm ' + ps + '</button>' : '') + '</div>';
        }).join("");
      }
      let html = '<div class="view"><div class="tree-switch" role="tablist">' +
          '<button class="btn small' + (kind === "psalms" ? " on" : "") + '" data-k="psalms">The Psalms</button>' +
          '<button class="btn small' + (kind === "gospels" ? " on" : "") + '" data-k="gospels">Gospels &amp; Acts</button></div>' +
        '<div class="tree-head">' + TREE_ART +
        '<h2 class="ch-title">' + head.title + '</h2>' +
        '<p class="tree-motto">“' + head.motto + '” <span class="cite">' + head.cite + '</span></p>' +
        '<p class="tree-hint">' + head.hint + '</p></div><div class="tree">';
      T.branches.forEach(br => {
        const bid = kind[0] + ":" + br.id;
        html += '<details class="tb" data-id="' + bid + '"' + (treeOpen.has(bid) ? " open" : "") + '><summary>' +
          '<span class="t-ic">' + br.icon + '</span>' +
          '<span class="t-main"><span class="t-name">' + esc(br.name) + '</span>' +
          '<span class="t-desc">' + esc(br.desc) + '</span></span>' +
          '<span class="t-caret">▸</span></summary><div class="twigs">';
        br.twigs.forEach(tw => {
          const id = bid + "/" + tw.id, open = treeOpen.has(id);
          if (tw.group) html += '<p class="t-group">' + esc(tw.group) + '</p>';
          html += '<details class="tt" data-id="' + id + '"' + (open ? " open" : "") + '><summary>' +
            '<span class="t-name">' + esc(tw.name) + '</span>' +
            '<span class="t-count">' + count(tw) + '</span><span class="t-caret">▸</span></summary>' +
            '<div class="leaves">' + (open ? leaves(tw) : "") + '</div></details>';
        });
        html += '</div></details>';
      });
      view.innerHTML = html + '</div></div>';
      const twigOf = id => { const [bid, tid] = id.split("/"); return T.branches.find(x => x.id === bid.slice(2)).twigs.find(x => x.id === tid); };
      view.querySelectorAll(".tree details").forEach(d => d.addEventListener("toggle", () => {
        const id = d.dataset.id;
        if (d.open) treeOpen.add(id); else treeOpen.delete(id);
        const box = d.classList.contains("tt") && d.querySelector(".leaves");
        if (box && d.open && !box.childElementCount) box.innerHTML = leaves(twigOf(id));
      }));
      view.querySelectorAll(".tree-switch button").forEach(b => b.onclick = () => {
        if (b.dataset.k === kind) return;
        state.treeKind = b.dataset.k; save(); renderTree();
      });
      const toBible = () => { if (state.corpus !== "bible"){ state.corpus = "bible"; txSel.value = state.tx; save(); applyMode(); } };
      const act = e => {
        const pl = e.target.closest(".pslink");
        const leaf = e.target.closest(".leaf");
        if (!pl && !leaf) return;
        treeScroll = scrollY;
        toBible();
        if (pl){ e.stopPropagation(); return openPsalmVerse(pl.dataset.ps); }
        if (leaf.dataset.s) return renderScene(leaf.dataset.s);
        if (leaf.dataset.bk){
          const b = C.bookIdxById(NT_BOOK[leaf.dataset.bk]);
          return renderChapter(b, +leaf.dataset.c - 1, +leaf.dataset.v - 1);
        }
        const c = +leaf.dataset.ps - 1;
        renderChapter(psB, c, C.mapFromTx(D.books[psB].ch[c], grailPsalm(c + 1), +leaf.dataset.j));
      };
      const tree = view.querySelector(".tree");
      tree.addEventListener("click", act);
      tree.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("leaf")){ e.preventDefault(); act(e); } });
      if (restore) setTimeout(() => scrollTo({ top: treeScroll }), 30);
      else scrollTo({ top: 0, behavior: "smooth" });
    }).catch(() => showToast("Could not load the tree"));
  }
  /* "21:2" — a Psalm (Vulgate) and Grail verse — opened with the verse lit */
  function openPsalmVerse(ref){
    const [ps, n] = ref.split(":").map(Number), psB = C.bookIdxById("psalms");
    loadGrailOrMap().then(() => {
      const g = grailPsalm(ps), j = g.n ? g.n.indexOf(n) : n - 1;
      renderChapter(psB, ps - 1, C.mapFromTx(D.books[psB].ch[ps - 1], g, Math.max(0, j)));
    });
  }
  /* a scene: every telling of it, one tab each, the key verse lit */
  function renderScene(id, k){
    const seq = ++renderSeq;
    loadGTree().then(() => {
      const sc = window.LUMINA_GTREE.scenes[id];
      if (!sc) return;
      /* open on the telling that holds the key verse unless one was chosen */
      if (k == null) k = Math.max(0, sc.tl.findIndex(t => t[0] === sc.k[0]));
      k = Math.min(k, sc.tl.length - 1);
      cur = { kind:"scene", id, k };
      record(cur);
      const [bk, parts] = sc.tl[k], b = C.bookIdxById(NT_BOOK[bk]), bkid = D.books[b].id;
      const chaps = [];
      parts.forEach(p => { for (let c = p[0]; c <= p[2]; c++) if (!chaps.includes(c)) chaps.push(c); });
      if (txMeta(state.tx).kind === "api") loadingView();
      return Promise.all(chaps.map(c => activeChapterAsync(b, c - 1).then(r => [c, r]))).then(pairs => {
        if (seq !== renderSeq) return;
        const res = Object.fromEntries(pairs), hlTx0 = activeHlTx();
        let fellAny = false, body = "";
        parts.forEach(p => {
          body += '<p class="ch-book" style="margin:.3rem 0 .2rem;text-align:center">' + esc(ntCite(bk, p[0], p[1], p[2], p[3])) + '</p>' +
            '<div class="card" style="margin-bottom:1rem"><div class="verses">';
          for (let c = p[0]; c <= p[2]; c++){
            const r = res[c], ch = r.ch, hlTx = r.fell ? "drb" : hlTx0;
            if (r.fell) fellAny = true;
            ch.v.forEach((t, j) => {
              const num = C.vnum(ch, j);
              if ((c === p[0] && num < p[1]) || (c === p[2] && num > p[3])) return;
              const key = bk === sc.k[0] && c === sc.k[1] && num === sc.k[2];
              body += '<p class="v' + (key ? " hl" : "") + '"' + (key ? ' id="sceneKey"' : '') + '><sup class="vn">' + num + '</sup>' +
                '<span class="vt" data-b="' + b + '" data-c="' + (c - 1) + '" data-i="' + j + '" data-tx="' + hlTx + '">' +
                renderTextWithHls(t, hlTx, bkid, c - 1, j) + '</span></p>';
            });
          }
          body += '</div></div>';
        });
        const meta = txMeta(state.tx);
        view.innerHTML = '<div class="view"><div class="ch-head">' +
          '<p class="ch-book">The Gospels &amp; Acts</p><h2 class="ch-title">' + esc(sc.t) + '</h2>' +
          (sc.tl.length > 1 ? '<div class="tellings" role="tablist">' + sc.tl.map((t, i) =>
            '<button class="btn small' + (i === k ? " on" : "") + '" data-k="' + i + '">' +
            esc(t[0] === "ac" ? "Acts" : C.bookByIdx(C.bookIdxById(NT_BOOK[t[0]])).name) + '</button>').join("") + '</div>' : '') +
          (fellAny && state.tx !== "drb" ? '<p class="ch-notice">' + fallNote(meta) + '</p>' : '') +
          '</div>' + body +
          '<div class="verse-actions"><button class="btn" id="scTree">🌳 Back to the tree</button>' +
          '<button class="btn" id="scChapter">Open the whole chapter</button></div></div>';
        view.querySelectorAll(".tellings button").forEach(x => x.onclick = () => renderScene(id, +x.dataset.k));
        $("scTree").onclick = () => { state.treeKind = "gospels"; renderTree({ restore:true }); };
        $("scChapter").onclick = () => renderChapter(b, parts[0][0] - 1, parts[0][1] - 1);
        selCtx = { tx: hlTx0, book: null, c: null,
          list: [...view.querySelectorAll(".vt")].map(el => ({ el, i: +el.dataset.i, book: bkid, c: +el.dataset.c })) };
        applyMode();
        const key = $("sceneKey");
        if (key) setTimeout(() => key.scrollIntoView({ block:"center", behavior:"smooth" }), 60);
        else scrollTo({ top: 0, behavior: "smooth" });
      });
    }).catch(() => showToast("Could not load the scene"));
  }

  /* ---------- universal history + dispatch ---------- */
  const nav = { stack: [], idx: -1, suppress: false };
  function record(desc){
    if (nav.suppress || !desc) return;
    const snap = JSON.parse(JSON.stringify(desc));
    if (nav.idx >= 0 && JSON.stringify(nav.stack[nav.idx]) === JSON.stringify(snap)){ updateNavButtons(); return; }
    nav.stack = nav.stack.slice(0, nav.idx + 1);
    nav.stack.push(snap);
    if (nav.stack.length > 120) nav.stack.shift();
    nav.idx = nav.stack.length - 1;
    updateNavButtons();
  }
  function updateNavButtons(){
    $("navBack").disabled = nav.idx <= 0;
    $("navFwd").disabled = nav.idx >= nav.stack.length - 1;
  }
  function dispatch(desc){
    if (!desc) return begin();
    switch (desc.kind){
      case "verse": return renderVerse(desc.b, desc.c, desc.i, { keepScroll:true });
      case "chapter": return renderChapter(desc.b, desc.c, desc.i);
      case "grid": return renderChapterGrid(desc.b);
      case "books": return renderBooks();
      case "cccPara": return renderCccPara(desc.n, { keepScroll:true });
      case "cccChapter": return renderCccChapter(desc.ti, desc.n);
      case "cccToc": return renderCccContents();
      case "docLib": return renderDocLibrary();
      case "doc": return renderDoc(desc.id, desc.n, { restore:true });
      case "docPara": return renderDocPara(desc.id, desc.n, { keepScroll:true });
      case "favs": return renderFavorites();
      case "prayers": return renderPrayers(desc.set, desc.day);
      case "favList": return renderFavList(desc.listId);
      case "chapFavs": return renderChapFavorites();
      case "chapFavList": return renderChapFavList(desc.listId);
      case "hls": return renderHighlights(desc.color);
      case "search": return renderSearch(desc.q);
      case "readings": return renderReadings(desc.date);
      case "plan": return renderPlan(desc.day);
      case "planDay": return renderPlanDay(desc.planId, desc.day);
      case "tree": if (desc.t) state.treeKind = desc.t; return renderTree({ restore:true });
      case "scene": return renderScene(desc.id, desc.k);
      default: return begin();
    }
  }
  function navGo(delta){
    const k = nav.idx + delta;
    if (k < 0 || k >= nav.stack.length) return;
    nav.idx = k;
    nav.suppress = true;
    try { dispatch(nav.stack[k]); } finally { nav.suppress = false; }
    updateNavButtons();
  }
  $("navBack").onclick = () => navGo(-1);
  $("navFwd").onclick = () => navGo(1);
  function navBack(){ nav.idx > 0 ? navGo(-1) : begin(); }
  /* Redraw without moving the reader (used after highlighting). Views scroll to their target when
     drawn, some smoothly and after a delay, and some draw in two steps (a loading card, then the text),
     which shrinks the page for a moment. So while the view redraws, scrolling is switched off, the page
     keeps its height, and the reader is put back in place whenever the content changes, until the
     redraw settles or the reader touches or scrolls the page themselves. */
  const realScrollTo = window.scrollTo, realScrollIntoView = Element.prototype.scrollIntoView;
  let holdFinish = null;
  function rerenderInPlace(){
    if (holdFinish) holdFinish();
    const y = scrollY, st = realScrollTo, si = realScrollIntoView;
    const put = () => st.call(window, { top: y, behavior: "instant" });
    window.scrollTo = () => {}; Element.prototype.scrollIntoView = () => {};
    view.style.minHeight = view.offsetHeight + "px";
    const mo = new MutationObserver(put);
    mo.observe(view, { childList: true, subtree: true });
    let done = false;
    const finish = holdFinish = () => {
      if (done) return; done = true; holdFinish = null;
      mo.disconnect();
      window.scrollTo = st; Element.prototype.scrollIntoView = si;
      view.style.minHeight = "";
      ["touchstart", "wheel", "keydown"].forEach(ev => removeEventListener(ev, finish, true));
    };
    try { rerender(); } finally {
      put();
      setTimeout(() => { put(); finish(); }, 1200);
      /* after the redraw starts, so the tap that made the selection does not count */
      setTimeout(() => { if (!done) ["touchstart", "wheel", "keydown"].forEach(ev => addEventListener(ev, finish, true)); }, 0);
    }
  }
  function rerender(){
    if (!cur) return begin();
    nav.suppress = true;
    try { dispatch(cur); } finally { nav.suppress = false; }
  }
  function doRandomVerse(){
    if (state.corpus === "docs") return window.LUMINA_DOCS && randomDocPara();
    if (state.corpus === "ccc"){
      const K = ccc(); if (!K) return;
      let n = C.cccRandomPara(K), guard = 0;
      while (cur && cur.kind === "cccPara" && n === cur.n && guard++ < 4) n = C.cccRandomPara(K);
      return renderCccPara(n);
    }
    let r = C.randomVerse(state.focus), guard = 0;
    while (cur && cur.kind === "verse" && r.b === cur.b && r.c === cur.c && r.i === cur.i && guard++ < 4)
      r = C.randomVerse(state.focus);
    renderVerse(r.b, r.c, r.i);
  }
  function doRandomChapter(){
    if (state.corpus === "docs") return window.LUMINA_DOCS && randomDocSection();
    if (state.corpus === "ccc"){
      const K = ccc(); if (!K) return;
      let ti = C.cccRandomToc(K), guard = 0;
      while (cur && cur.kind === "cccChapter" && ti === cur.ti && guard++ < 4) ti = C.cccRandomToc(K);
      return renderCccChapter(ti);
    }
    let r = C.randomChapter(state.focus), guard = 0;
    while (cur && cur.kind === "chapter" && r.b === cur.b && r.c === cur.c && guard++ < 4)
      r = C.randomChapter(state.focus);
    renderChapter(r.b, r.c);
  }
  $("btnRandomVerse").onclick = doRandomVerse;
  /* the Monastic Psalter, published from munkachy/sing-with-us (psalter/), opens beside Lumina */
  /* ---------- the Monastic Psalter, inside Lumina ----------
     The psalter page (munkachy/sing-with-us, psalter/) is on the same site as Lumina, so Lumina shows it
     in a frame of its own and can reach into it: its theme follows Lumina's, and its storage is shared
     (and synced, above). The page itself is not changed: the monks' own copy looks and works as before.
     The frame is kept once opened, so going back and forth keeps your place in both. */
  const PSALTER_URL = new URL("../sing-with-us/psalter/", location.href).href;
  const PSALTER_THEME = { light: "cloister", dark: "habit", lcars: "glass" };
  let psalterFrame = null;
  function psalterDoc(){ try { return psalterFrame && psalterFrame.contentDocument; } catch(e){ return null; } }
  function psalterDress(){
    const d = psalterDoc(); if (!d || !d.documentElement) return;
    d.documentElement.setAttribute("data-theme", PSALTER_THEME[currentTheme()] || "cloister");
    if (!d.getElementById("luminaStyle")){
      const st = d.createElement("style"); st.id = "luminaStyle";
      /* inside Lumina only: Lumina's ☾ chooses the theme, and Lumina's own bar (below) replaces the site
         header and the rows of buttons; the page-number box (opened from that bar's "p.") stays */
      st.textContent = ".themes,.skip-link,.site-header,.pickbar-in{display:none!important}" +
        ".pickbar{border:0!important;box-shadow:none!important;background:transparent!important}";
      (d.head || d.documentElement).appendChild(st);
    }
  }
  /* Lumina's own bar for the psalter: ‹ · Book · Week · Day · Hour · Today · 📅 · ›, in the place of the
     psalter's rows of buttons (hidden inside Lumina only). It drives the psalter through those same
     buttons and menus, so the psalter's own logic decides everything, and redraws itself whenever the
     psalter changes. In Advent, Lent or Saints, Week and Day give way to the book's Section and Hour. */
  const PS_DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const PS_BOOKS = [["psalter", "Psalter"], ["Advent-Christmas", "Advent"], ["Lent", "Lent"], ["Sanctoral", "Saints"]];
  function pq(sel){ const d = psalterDoc(); return d ? d.querySelector(sel) : null; }
  function psalterNow(){
    const d = psalterDoc();
    if (!d || !d.querySelector("[data-hour]")) return null;            /* the calendar page, or still loading */
    const on = a => { const b = d.querySelector("[" + a + '][aria-pressed="true"]'); return b ? b.getAttribute(a) : null; };
    const opts = sel => { const s = d.querySelector(sel); return s ? [...s.options].map(o => [o.value, o.textContent]) : []; };
    return { book: on("data-book") || "psalter", week: +on("data-week"), day: +on("data-day"), hour: +on("data-hour"),
      inBook: !d.querySelector(".book-picks").hidden, secs: opts("#sec"), sec: (pq("#sec") || {}).value, jumps: opts("#jump"), jump: (pq("#jump") || {}).value,
      hours: [...d.querySelectorAll("[data-hour]")].map(b => b.textContent) };
  }
  function psPress(attr, v){ const b = pq("[" + attr + '="' + v + '"]'); if (b) b.click(); }
  function psSelect(id, v){ const s = pq("#" + id); if (!s) return; s.value = v; s.dispatchEvent(new Event("change")); }
  function psStep(dir){
    const s = psalterNow(); if (!s) return;
    if (s.inBook){                                        /* in a book: its next or previous hour, then section */
      const k = s.jumps.findIndex(j => j[0] === s.jump) + dir;
      if (s.jump !== "" && k >= 0 && k < s.jumps.length) return psSelect("jump", s.jumps[k][0]);
      const n = s.secs.findIndex(x => x[0] === s.sec) + dir;
      if (n >= 0 && n < s.secs.length) psSelect("sec", s.secs[n][0]);
      return;
    }
    let { week, day, hour } = s;                           /* the four-week psalter: hour by hour, Compline → Matins */
    hour += dir;
    if (hour > 4){ hour = 0; day++; if (day > 6){ day = 0; week = (week + 1) % 4; } }
    if (hour < 0){ hour = 4; day--; if (day < 0){ day = 6; week = (week + 3) % 4; } }
    if (week !== s.week) psPress("data-week", week);
    if (day !== s.day) psPress("data-day", day);
    psPress("data-hour", hour);
    try { psalterFrame.contentWindow.scrollTo(0, 0); } catch(e){}
  }
  function drawPbar(){
    const bar = $("pbar"); if (!bar) return;
    const s = psalterNow(), sel = (id, list, val, title) => '<select id="' + id + '" title="' + title + '">' +
      list.map(([v, t]) => '<option value="' + esc(String(v)) + '"' + (String(v) === String(val) ? " selected" : "") + '>' + esc(t) + '</option>').join("") + '</select>';
    if (!s){
      bar.innerHTML = '<button class="fb-btn" id="pbBack" title="Back to the psalter">‹ Psalter</button><span class="pb-mid"></span><button class="fb-btn" id="pbToday">Today</button>';
    } else {
      bar.innerHTML = '<button class="fb-arrow" id="pbPrev" title="Previous hour">‹</button>' +
        sel("pbBook", PS_BOOKS, s.book, "Book") +
        (s.inBook
          ? sel("pbSec", s.secs, s.sec, "Section") + sel("pbJump", s.jumps, s.jump, "Hour in this section")
          : sel("pbWeek", [[0, "I"], [1, "II"], [2, "III"], [3, "IV"]], s.week, "Week") +
            sel("pbDay", PS_DAYS.map((d, k) => [k, d.slice(0, 3)]), s.day, "Day") +
            sel("pbHour", s.hours.map((h, k) => [k, h]), s.hour, "Hour")) +
        '<button class="fb-btn" id="pbToday" title="Today, this hour">Today</button>' +
        '<button class="fb-btn" id="pbCal" title="The ordo: calendar for the year">📅</button>' +
        '<button class="fb-btn" id="pbPage" title="Go to a page number in this book">p.</button>' +
        '<button class="fb-arrow" id="pbNext" title="Next hour">›</button>';
    }
    const on = (id, ev, fn) => { const el = bar.querySelector("#" + id); if (el) el[ev] = fn; };
    on("pbPrev", "onclick", () => psStep(-1));
    on("pbNext", "onclick", () => psStep(1));
    on("pbBook", "onchange", e => psPress("data-book", e.target.value));
    on("pbWeek", "onchange", e => psPress("data-week", e.target.value));
    on("pbDay", "onchange", e => psPress("data-day", e.target.value));
    on("pbHour", "onchange", e => psPress("data-hour", e.target.value));
    on("pbSec", "onchange", e => psSelect("sec", e.target.value));
    on("pbJump", "onchange", e => { if (e.target.value !== "") psSelect("jump", e.target.value); });
    on("pbCal", "onclick", () => { const a = pq(".cal-btn"); if (a) a.click(); });
    on("pbPage", "onclick", () => { const b = pq("#page-btn"); if (b) b.click(); });
    const home = () => { psalterFrame.src = PSALTER_URL; };
    on("pbBack", "onclick", home);
    on("pbToday", "onclick", () => { try { psalterFrame.contentWindow.location.replace(PSALTER_URL); } catch(e){ home(); } });
    psalterFit();
  }
  /* redraw whenever the psalter changes what it shows */
  let pbarWatch = null, pbarT = null;
  function watchPsalter(){
    if (pbarWatch) pbarWatch.disconnect();
    const d = psalterDoc(); drawPbar();
    const nav = d && d.querySelector(".pickbar");
    if (!nav) return;
    pbarWatch = new MutationObserver(() => { clearTimeout(pbarT); pbarT = setTimeout(drawPbar, 60); });
    pbarWatch.observe(nav, { subtree: true, attributes: true, attributeFilter: ["aria-pressed", "hidden"], childList: true, characterData: true });
  }
  function psalterReload(){ if (psalterFrame) try { psalterFrame.contentWindow.location.reload(); } catch(e){} }
  function psalterOn(){ return document.body.classList.contains("psalter-on"); }
  function openPsalter(){
    if (!psalterFrame){
      psalterFrame = document.createElement("iframe");
      psalterFrame.id = "psalterFrame"; psalterFrame.title = "Monastic Psalter";
      psalterFrame.addEventListener("load", () => { psalterDress(); watchPsalter(); });
      const bar = document.createElement("div"); bar.id = "pbar"; bar.className = "fbar pbar";
      document.body.appendChild(bar);
      psalterFrame.src = PSALTER_URL;
      document.body.appendChild(psalterFrame);
    }
    psalterDress();
    document.body.classList.add("psalter-on");
    psalterFit();
    $("btnPsalter").querySelector(".ic").textContent = "❦"; $("btnPsalter").querySelector(".lb").textContent = "Bible";
    $("btnPsalter").title = "Back to the Bible";
  }
  function closePsalter(){
    document.body.classList.remove("psalter-on");
    $("btnPsalter").querySelector(".ic").textContent = "♫"; $("btnPsalter").querySelector(".lb").textContent = "Psalter";
    $("btnPsalter").title = "The Monastic Psalter (Saint Bernard Abbey)";
  }
  /* the frame fills the screen above the bottom bar (phones), or below it (wider screens, where the bar sits on top) */
  function psalterFit(){
    const bar = document.querySelector(".actions.main-bar"), r = bar.getBoundingClientRect(), root = document.documentElement.style;
    if (getComputedStyle(bar).position === "fixed"){ root.setProperty("--barH", Math.ceil(r.height) + "px"); root.setProperty("--barTop", "0px"); }
    else { root.setProperty("--barTop", Math.ceil(r.bottom) + "px"); root.setProperty("--barH", "0px"); }
    const pb = $("pbar"); if (pb) root.setProperty("--pbarH", Math.ceil(pb.offsetHeight) + "px");
  }
  addEventListener("resize", () => { if (psalterOn()) psalterFit(); });
  $("btnPsalter").onclick = () => psalterOn() ? closePsalter() : openPsalter();
  /* any other bottom button (except the timer) leaves the psalter first, then does its work */
  document.querySelector(".actions.main-bar").addEventListener("click", e => {
    const b = e.target.closest("button");
    if (b && psalterOn() && b.id !== "btnPsalter" && b.id !== "btnTimer") closePsalter();
  }, true);
  $("btnSearch").onclick = () => renderSearch();
  $("btnFavs").onclick = renderFavorites;
  $("btnPrayers").onclick = () => renderPrayers();
  $("btnReadings").onclick = () => renderReadings();
  $("btnPlan").onclick = () => openScriptorium("mind");   // the reading plan's button now opens the mind map
  $("btnScriptorium").onclick = openScriptorium;
  /* Scriptorium (scriptorium.js) loads on first use, and opens Catechism and Douay citations here. */
  function openScriptorium(mode){
    const go = () => window.Scriptorium.open(view, typeof mode === "string" ? mode : undefined);
    if (window.Scriptorium) return go();
    loadScriptorium().then(go, () => showToast("Couldn't load Scriptorium. Check the connection."));
  }
  window.LuminaNav = {
    ccc(n){ loadCcc().then(() => { state.corpus = "ccc"; txSel.value = "ccc"; save(); applyMode(); renderCccPara(n); }); },
    verse(bookId, c, v){
      const b = C.bookIdxById(bookId);
      if (b < 0) return false;
      if (state.corpus !== "bible"){ state.corpus = "bible"; txSel.value = state.tx; applyMode(); save(); }
      renderVerse(b, c - 1, v - 1);
      return true;
    },
  };

  addEventListener("keydown", e => {
    if (["SELECT","INPUT","TEXTAREA"].includes(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "r" || e.key === "R") doRandomVerse();
    else if (e.key === "c" || e.key === "C") doRandomChapter();
    else if (e.key === "+" || e.key === "=") $("fontPlus").click();
    else if (e.key === "-" || e.key === "_") $("fontMinus").click();
    else if (e.key === "ArrowLeft" && cur){
      if (cur.kind === "verse"){ const p = C.fromGlobal(C.toGlobal(cur.b, cur.c, cur.i) - 1); if (p) renderVerse(p.b, p.c, p.i); }
      else if (cur.kind === "chapter"){ const p = C.prevChapter(cur.b, cur.c); if (p) renderChapter(p.b, p.c); }
      else if (cur.kind === "cccPara" && cur.n > 1) renderCccPara(cur.n - 1);
      else if (cur.kind === "cccChapter" && cur.ti > 0) renderCccChapter(cur.ti - 1);
      else if (cur.kind === "docPara") stepDocPara(-1);
    } else if (e.key === "ArrowRight" && cur){
      if (cur.kind === "verse"){ const n = C.fromGlobal(C.toGlobal(cur.b, cur.c, cur.i) + 1); if (n) renderVerse(n.b, n.c, n.i); }
      else if (cur.kind === "chapter"){ const n = C.nextChapter(cur.b, cur.c); if (n) renderChapter(n.b, n.c); }
      else if (cur.kind === "cccPara") renderCccPara(cur.n + 1);
      else if (cur.kind === "cccChapter") renderCccChapter(cur.ti + 1);
      else if (cur.kind === "docPara") stepDocPara(1);
    }
  });

  /* ---------- start ---------- */
  applyTheme();
  applyFont();
  applyMode();
  function begin(){
    const last = state.last;
    if (last && last.book != null){
      const b = C.bookIdxById(last.book);
      if (b >= 0 && last.c < D.books[b].ch.length){
        if (last.kind === "chapter") return renderChapter(b, last.c, last.i != null ? last.i : null);
        return renderVerse(b, last.c, Math.min(last.i || 0, D.books[b].ch[last.c].v.length - 1));
      }
    }
    doRandomVerse();
  }
  function beginCcc(){
    const l = state.cccLast;
    if (l && l.kind === "cccChapter") return renderCccChapter(l.ti, l.n);
    if (l && l.kind === "cccPara") return renderCccPara(l.n);
    doRandomVerse();
  }
  function beginDocs(){
    const l = state.docLast;
    if (l && l.kind === "doc" && docById(l.id)) return renderDoc(l.id, l.n);
    renderDocLibrary();
  }
  if (state.corpus === "docs"){
    loadDocs().then(() => { applyMode(); beginDocs(); }).catch(() => { state.corpus = "bible"; txSel.value = state.tx; applyMode(); begin(); });
  } else if (state.corpus === "ccc"){
    loadCcc().then(beginCcc).catch(() => { state.corpus = "bible"; txSel.value = state.tx; applyMode(); begin(); });
  } else if (txMeta(state.tx).kind === "local" && state.tx !== "drb"){
    loadTx(state.tx).then(begin).catch(e => {
      state.tx = "drb"; txSel.value = "drb"; applyMode(); begin();
      if (e && e.noGrail) setTimeout(() => showToast("Your Grail file is not on this device"), 400);
    });
  } else begin();
})();
