    "<tr><td class=\"nm\">Bonded +30 / Commended +60</td><td>Open, and friendly</td><td class=\"nm\" style=\"color:var(--rose)\">Shut. A bonded hauler is a Bureau informant and they know it.</td></tr>"+
    "<tr><td class=\"nm\">Clean 0 / Watched &minus;5</td><td>Open</td><td>Open, watchfully</td></tr>"+
    "<tr><td class=\"nm\">Marked &minus;20 / Wanted &minus;50</td><td class=\"nm\" style=\"color:var(--rose)\">Shut</td><td>Open, and the best prices in the game</td></tr>"+
    "</tbody></table></div>";
  h += '<p class="note">The middle band cannot be held for long by design: every load of blood drags you '+
    "down, every tooth you sell pushes you up. <b>The berth office at Halloway never shuts</b> — the man "+
    "on the quay does not ask what you are, he asks for the money.</p>";
  h += '<p class="note"><em>What moves it:</em> selling teeth +1 · killing a raider +1 · a clean inspection +1 · '+
    "buying or selling blood &minus;2 · a delivery to a farm &minus;2 · running from a patrol &minus;4 · "+
    "caught with blood &minus;5 · shooting at a patrol &minus;6 · killing one &minus;10. Coming back up is slow "+
    "on purpose.</p>";

  h += '<h2 class="sec">Restricted cargo</h2>';
  h += '<p class="note">Blood is restricted in nine of the thirteen settlements and ammunition in four. '+
    "<b>Restricted does not mean there is no buyer.</b> It means there is a buyer and a risk, so the "+
    "price carries the risk — about 20% over the odds where it is restricted, about 10% under where it "+
    "is open. That is where the whole blood margin comes from.</p>";
  h += '<p class="note">If a patrol looks in the back and finds restricted cargo, it is confiscated and you '+
    "are fined. Carrying it makes a patrol more likely to stop you in the first place.</p>";

  h += '<h2 class="sec">Teeth</h2>';
  h += '<p class="note">Vampire canines. You take them off a vampire you have killed. Any Bureau post '+
    "(Sennick, Marrow, Halloway) buys them at a published rate: <b>1,200</b> for the first ten days after "+
    "they are drawn, <b>700</b> after that. Selling them is entirely legal and puts your Warrant up. "+
    "It also hardens everybody in the cab.</p>";

  h += '<h2 class="sec">Your crew</h2>';
  h += '<p class="note">People are found by driving to where they are — nobody advertises, and some of them '+
    "will not come out until you have done something that makes them willing to get in a truck with you. "+
    "Everyone hardens: <b>steady</b>, then <b>hard</b>, then <b>gone</b>. Hard men fight better and deal "+
    "worse and start refusing things. Only a priest walks that back, and he takes a seat to do it.</p>";

  h += '<h2 class="sec">The road</h2>';
  h += '<p class="note">A leg takes one to three days. Each day: one fuel, one day of wages, one roll. '+
    "You may meet a <b>patrol</b> (they inspect), a <b>raider</b> (they attack), or another <b>hauler</b> "+
    "(they trade and gossip). Driving at night means more raiders and fewer patrols, and you shoot worse "+
    "unless floodlights are fitted.</p>";
  h += '<p class="note">In a fight you can fire, run, or give them what is in the back. Running is your '+
    "<b>Driving</b> against theirs. Firing is your <b>Fighting</b> and the power of your mounts against "+
    "their plating and frame.</p>";

  h += '<h2 class="sec">The three valleys</h2><div class="scroll"><table><tbody>'+
    row("<b>Colter</b>", "Where you start. Thin margins, human raiders, nobody official. Four towns.") +
    row("<b>Vann</b>", "Opens when the Tolm mill sponsors your licence. Industry, Bureau posts, real money. The crossing at Rell costs 500 each way.") +
    row("<b>The Kell</b>", "Opens after the Ostrow weighing station. The port, the farms, and the vampires. The crossing costs 1,500.") +
    "</tbody></table></div>";
  h += '<p class="note"><b>You can always go back.</b> Nothing is one-way. But below Marked the checkpoints '+
    "turn from an inconvenience into the most dangerous thing on the map, and you may find you cannot go "+
    "home without anyone having built a wall.</p>";

  h += '<h2 class="sec">Getting about</h2>';
  h += '<p class="note">Every screen is reached from the town you are standing in, and the amber '+
    "button at the top always takes you back to it. <b>Buy cargo</b> and <b>Sell cargo</b> are "+
    "separate on purpose; <b>The yard</b> holds fuel, repairs, trucks and fittings; <b>The country</b> "+
    "is the map; <b>Where you stand</b> is your skills, your standing with the Bureau, and everything "+
    "that has happened.</p>";
  h += '<h2 class="sec">The notebook</h2>';
  h += '<p class="note">Every settlement on roads you can drive.</p>';
  h += '<div class="scroll"><table><thead><tr><th>Place</th><th>Makes it (cheap)</th><th>Short of it (in demand)</th><th>Blood</th><th>Ammunition</th></tr></thead><tbody>';
  PLACES.forEach(pp=>{
    if(!valleyOpen(pp.valley)) return;
    h += "<tr><td class=\"nm\">"+pp.name+" <small>· "+VALLEYS[pp.valley]+
      (pp.bureau?" · post":"")+(pp.farm?" · "+pp.farm+" farm":"")+"</small></td>"+
      "<td>"+(pp.makes.map(g=>GOOD[g].name.toLowerCase()).join(", ")||"—")+"</td>"+
      "<td>"+(pp.wants.map(g=>GOOD[g].name.toLowerCase()).join(", ")||"—")+"</td>"+
      "<td>"+(pp.legal.blood?"open":'<span style="color:var(--rose)">restricted</span>')+"</td>"+
      "<td>"+(pp.legal.ammo?"open":'<span style="color:var(--rose)">restricted</span>')+"</td></tr>";
  });
  h += "</tbody></table></div>";
  h += '<p class="note">Prices move every few days with the local events, so this tells you the shape of a '+
    "market, not today's number. The shape is what a route is made of.</p>";
  return h;
}

function btn(a,v,t,dis){
  return '<button class="b'+(a==="go"||a==="hire"?" go":"")+'" data-a="'+a+'" data-v="'+v+'"'+
         (dis?" disabled":"")+">"+t+"</button>";
}

/* ===================== wiring ===================== */
function wire(){
  document.getElementById("pane").querySelectorAll("button.b").forEach(b=>{
    b.onclick = ()=>act(b.dataset.a, b.dataset.v);
  });
}
function act(a,v){
  const t = truck();
  if(a==="tutskip"){ S.tut.done = true; save(); render(); return; }
  if(a==="buy1") buy(v,1);
  else if(a==="buyx") buy(v, cargoCap()-cargoUsed());
  else if(a==="sellx") sell(v, S.cargo[v]);
  else if(a==="sell1") sell(v, 1);
  else if(a==="go2"){ TAB = v; render(); }
  else if(a==="fuel") refuel();
  else if(a==="fix") repair();
  else if(a==="fangs") sellFangs();
  else if(a==="berth") buyBerth();
  else if(a==="tolm"){ const c = tolmContract(); if(c) c.go(); }
  else if(a==="hire") hire(v);
  else if(a==="fire") fire(v);
  else if(a==="truck"){
    const tk = TRUCKS[+v], net = tk.price - t.sell;
    if(S.cash < net || tk.cargo < cargoUsed()) return;
    S.cash -= net; S.truck = tk.id;
    S.mounts = S.mounts.slice(0,tk.mounts); S.plating = S.plating.slice(0,tk.plating);
    S.fittings = S.fittings.slice(0,tk.fittings);
    while(S.crew.length > tk.seats){ const g = S.crew.pop(); say(CREWBY[g].name+" had no seat and stayed at "+PLACE[S.at].name+"."); }
    S.hull = tk.hull; S.fuel = Math.min(S.fuel, tankCap());
    say("Traded up to the "+tk.name.toLowerCase()+".");
    save(); render();
  }
  else if(a==="mount"){ const m = MOUNTS[+v]; if(S.cash<m.price||S.mounts.length>=t.mounts) return;
    S.cash-=m.price; S.mounts.push(m.id); save(); render(); }
  else if(a==="plate"){ const m = PLATINGS[+v]; if(S.cash<m.price||S.plating.length>=t.plating) return;
    S.cash-=m.price; S.plating.push(m.id); save(); render(); }
  else if(a==="fitting"){ const m = FITTINGS[+v]; if(S.cash<m.price||S.fittings.includes(m.id)||S.fittings.length>=t.fittings) return;
    S.cash-=m.price; S.fittings.push(m.id); if(m.id===4) {} save(); render(); }
  else if(a==="go" || a==="gon"){
    const [to,days,cp] = v.split(":");
    beginTrip(to, +days, cp||null, a==="gon");
    if(veil.hidden) render();
  }
}
document.getElementById("readintro").onclick = e=>{ e.preventDefault(); modal(INTRO); };
document.getElementById("newgame").onclick = e=>{
  e.preventDefault();
  modal({eyebrow:"Start again", title:"Throw this run away?", c:"--rose",
    body:["Day "+S.day+", "+money(S.cash)+", "+band(S.warrant)+"."],
    opts:[{t:"Start again from Fenner", go:()=>{ close(); newGame(); render(); }},
          {t:"No", go:()=>close()}]});
};
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !veil.hidden && !FIGHT) close(); });

/* ===================== boot ===================== */
if(!load()) newGame();
if(!S.market || !S.market[S.at]) reprice();
render();
if(!S.flags.seenIntro) modal(INTRO);
</script>
