<title>One Soul</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --lead:#0b0d10; --glass:#14171c; --glass2:#1b1f26;
  --ink:#ede7db; --ink2:#a8a294; --ink3:#6f6a5f;
  --amber:#e0a844; --cobalt:#6f95e4; --ruby:#d8566c; --verd:#4fa583; --violet:#a988d8;
  --rule:#262b33; --fs:19px;
}
:root[data-theme="light"]{
  --lead:#efece4; --glass:#faf8f3; --glass2:#f2efe7;
  --ink:#1a1c20; --ink2:#535861; --ink3:#8a8579;
  --amber:#9a6a12; --cobalt:#20438f; --ruby:#9c2233; --verd:#2b6350; --violet:#6a4f9c;
  --rule:#d8d3c6;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--lead); color:var(--ink);
  font-family:Spectral,Georgia,serif; font-size:var(--fs); line-height:1.72;
  -webkit-font-smoothing:antialiased;
  padding-bottom:5rem;
}
.came{position:fixed;inset:0;pointer-events:none;border:10px solid var(--lead);
  box-shadow:inset 0 0 0 1px var(--rule);z-index:50}
main{max-width:36rem;margin:0 auto;padding:3.2rem 1.4rem 2rem;position:relative;z-index:1}

/* ---------- prose ---------- */
p{margin:0 0 1.15rem;text-wrap:pretty}
p.q{margin-left:1.2rem;border-left:2px solid var(--rule);padding-left:1rem;color:var(--ink2)}
strong{font-weight:600;color:var(--amber)}
em{font-style:italic}
.hr{height:1px;background:var(--rule);margin:2rem auto;max-width:8rem}
figure{margin:1.6rem 0}
figure img{width:100%;display:block;border:1px solid var(--rule)}
figure figcaption{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.12em;
  color:var(--ink3);margin-top:.5rem;text-transform:uppercase}
.imgph{aspect-ratio:3/2;background:var(--glass2);border:1px solid var(--rule);
  display:flex;align-items:center;justify-content:center;padding:1.5rem;text-align:center;
  font-family:"IBM Plex Mono",monospace;font-size:.7rem;color:var(--ink3);line-height:1.7}

/* ---------- choices ---------- */
.choices{margin:2.2rem 0 1rem;display:flex;flex-direction:column;gap:.6rem}
button.opt{
  font-family:Spectral,Georgia,serif;font-size:1rem;line-height:1.5;text-align:left;
  color:var(--ink);background:var(--glass);border:1px solid var(--rule);
  border-left:3px solid var(--rule);
  padding:.85rem 1.1rem;cursor:pointer;position:relative;
  transition:border-color .15s,background .15s,box-shadow .15s;
}
button.opt:hover,button.opt:focus-visible{
  border-color:var(--amber);border-left-color:var(--amber);
  background:var(--glass2);box-shadow:0 0 22px -6px var(--amber);outline:none;
}
button.opt .delta{display:block;font-family:"IBM Plex Mono",monospace;font-size:.66rem;
  letter-spacing:.08em;color:var(--ink3);margin-top:.35rem}
button.cont{
  display:block;margin:2rem auto 0;font-family:"IBM Plex Mono",monospace;
  font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;
  background:none;border:1px solid var(--rule);color:var(--ink2);
  padding:.65rem 1.8rem;cursor:pointer;transition:.15s}
button.cont:hover{border-color:var(--amber);color:var(--amber)}

/* ---------- chrome ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--lead);
  border-top:1px solid var(--rule);display:flex;gap:.2rem;padding:.4rem .6rem;
  justify-content:center;flex-wrap:wrap}
.bar button{font-family:"IBM Plex Mono",monospace;font-size:.64rem;letter-spacing:.14em;
  text-transform:uppercase;background:none;border:1px solid transparent;color:var(--ink3);
  padding:.45rem .7rem;cursor:pointer;transition:.15s}
.bar button:hover{color:var(--amber);border-color:var(--rule)}
.bar button.on{color:var(--amber);border-color:var(--amber)}
.crumb{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--lead);
  border-bottom:1px solid var(--rule);padding:.5rem 1rem;
  font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink3);display:flex;justify-content:space-between;gap:1rem}
.crumb b{color:var(--amber);font-weight:500}
.crumb .edit{color:var(--ruby)}

/* ---------- panels ---------- */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(26rem,100%);z-index:60;
  background:var(--glass);border-left:1px solid var(--rule);overflow-y:auto;
  padding:1.4rem 1.3rem 4rem;transform:translateX(101%);transition:transform .2s;
  font-family:"IBM Plex Sans",sans-serif;font-size:.9rem}
.panel.open{transform:none}
.panel h3{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink3);margin:1.6rem 0 .6rem;font-weight:400}
.panel h3:first-child{margin-top:0}
.panel .x{position:absolute;top:.8rem;right:1rem;background:none;border:none;
  color:var(--ink3);font-size:1.3rem;cursor:pointer;line-height:1}
.stat{margin-bottom:1rem}
.statlab{display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;
  font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.3rem;color:var(--ink2)}
.statbar{height:.42rem;background:var(--glass2);position:relative}
.statbar i{position:absolute;inset:0 auto 0 0;display:block}
.kv{display:flex;justify-content:space-between;padding:.4rem 0;border-bottom:1px solid var(--rule);
  font-family:"IBM Plex Mono",monospace;font-size:.76rem}
.kv span:last-child{color:var(--amber)}
.panel textarea{width:100%;min-height:7rem;background:var(--glass2);color:var(--ink);
  border:1px solid var(--rule);padding:.6rem;font-family:"IBM Plex Sans",sans-serif;
  font-size:.88rem;line-height:1.55;resize:vertical}
.panel .snip{background:var(--glass2);border-left:2px solid var(--amber);padding:.6rem .8rem;
  font-family:Spectral,serif;font-size:.86rem;color:var(--ink2);margin-bottom:.8rem;
  max-height:9rem;overflow-y:auto}
.panel button.act{width:100%;padding:.6rem;margin-top:.6rem;background:var(--glass2);
  border:1px solid var(--rule);color:var(--ink);font-family:"IBM Plex Mono",monospace;
  font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.panel button.act:hover{border-color:var(--amber);color:var(--amber)}
.panel button.act.prim{border-color:var(--amber);color:var(--amber)}
.jumps{display:flex;flex-direction:column;gap:1px}
.jumps button{text-align:left;background:var(--glass2);border:none;color:var(--ink2);
  padding:.5rem .7rem;cursor:pointer;font-family:"IBM Plex Sans",sans-serif;font-size:.82rem;
  display:flex;justify-content:space-between;gap:.6rem}
.jumps button:hover{color:var(--amber)}
.jumps button b{font-family:"IBM Plex Mono",monospace;font-size:.66rem;color:var(--ink3);font-weight:400}
.notelist{display:flex;flex-direction:column;gap:.5rem}
.noteitem{background:var(--glass2);border-left:2px solid var(--ruby);padding:.5rem .7rem;font-size:.82rem}
.noteitem em{display:block;color:var(--ink3);font-size:.74rem;font-family:"IBM Plex Mono",monospace;
  margin-bottom:.25rem;font-style:normal;letter-spacing:.08em}
.toast{position:fixed;bottom:4.2rem;left:50%;transform:translateX(-50%);z-index:70;
  background:var(--glass2);border:1px solid var(--amber);color:var(--amber);
  padding:.5rem 1rem;font-family:"IBM Plex Mono",monospace;font-size:.68rem;
  letter-spacing:.12em;text-transform:uppercase;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* edit affordances */
body.editing p{cursor:text;transition:background .12s}
body.editing p:hover{background:var(--glass);box-shadow:0 0 0 6px var(--glass)}
p.hasnote{border-right:2px solid var(--ruby);padding-right:.6rem}
.backbtn{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.14em;
  text-transform:uppercase;background:none;border:1px solid var(--rule);color:var(--ink3);
  padding:.35rem .7rem;cursor:pointer;margin-bottom:1.4rem}
.backbtn:hover{color:var(--amber);border-color:var(--amber)}
.title{text-align:center;padding:5rem 0 2rem}
.title h1{font-size:clamp(3rem,13vw,5rem);margin:0;font-weight:600;letter-spacing:-.02em;line-height:.95}
.title .sub{font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.24em;
  text-transform:uppercase;color:var(--ink3);margin-top:1.2rem}
.title .tag{font-style:italic;color:var(--ink2);margin-top:1.6rem;font-size:1.05rem}
@media(max-width:32rem){ main{padding-top:3.6rem} }
</style>

<div class="came"></div>
<div class="crumb"><span id="cwhere">—</span><span id="cedit"></span></div>
<main id="stage"></main>
<div class="bar" id="bar"></div>
<div class="panel" id="panel"><button class="x" onclick="closePanel()">&times;</button><div id="panelBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ===================================================================
   Scriptorium engine — One Soul
   =================================================================== */
__SCENES__

/* ---------- state ---------- */
const S = {
  vars:{}, scene:null, pc:0, page:[], choices:null, history:[], notes:{},
  edit:false, started:false
};
const $ = id => document.getElementById(id);

/* ---------- parse ---------- */
function parse(src){
  const out=[];
  src.split(/\r?\n/).forEach((raw,i)=>{
    const t = raw.replace(/\t/g,'  ');
    const ind = t.length - t.replace(/^ +/,'').length;
    const s = t.trim();
    if(!s) { out.push({ind,k:'blank',line:i}); return; }
    if(s.startsWith('*')){
      const m = s.match(/^\*([a-z_]+)\s?(.*)$/);
      out.push({ind,k:'cmd',c:m?m[1]:'',a:m?m[2]:'',line:i});
    } else if(s.startsWith('#')){
      out.push({ind,k:'opt',a:s.slice(1).trim(),line:i});
    } else {
      out.push({ind,k:'text',a:s,line:i});
    }
  });
  return out;
}
const P = {}; for(const k in SCENES) P[k]=parse(SCENES[k]);
const ORDER = (SCENES.__order__||'').split(/\s+/).filter(Boolean);

/* ---------- expressions ---------- */
function val(tok){
  tok=tok.trim();
  if(/^-?\d+$/.test(tok)) return +tok;
  if(/^".*"$/.test(tok)) return tok.slice(1,-1);
  if(tok==='true') return true; if(tok==='false') return false;
  return (tok in S.vars) ? S.vars[tok] : 0;
}
function evalExpr(e){
  e=e.trim().replace(/^\((.*)\)$/s,'$1').trim();
  for(const op of [' and ',' or ']){
    let d=0;
    for(let i=0;i<e.length;i++){
      if(e[i]==='(')d++; else if(e[i]===')')d--;
      else if(d===0 && e.substr(i,op.length)===op)
        return op===' and ' ? (evalExpr(e.slice(0,i))&&evalExpr(e.slice(i+op.length)))
                            : (evalExpr(e.slice(0,i))||evalExpr(e.slice(i+op.length)));
    }
  }
  e=e.replace(/^\((.*)\)$/s,'$1').trim();
  const m = e.match(/^(.+?)\s*(>=|<=|!=|=|>|<)\s*(.+)$/);
  if(!m) return !!val(e);
  const a=val(m[1]), b=val(m[3]);
  switch(m[2]){case '>=':return a>=b;case '<=':return a<=b;case '!=':return a!=b;
    case '=':return a==b;case '>':return a>b;case '<':return a<b;}
  return false;
}
function fair(cur,n){ n=+n;
  const v = n>=0 ? cur + (100-cur)*n/100 : cur + cur*n/100;
  return Math.max(1,Math.min(99,Math.round(v)));
}
function doSet(arg){
  const m = arg.match(/^(\S+)\s+(.*)$/); if(!m) return;
  const k=m[1]; let r=m[2].trim();
  const fm = r.match(/^%\s*([+-])\s*(\d+)$/);
  if(fm){ S.vars[k]=fair(+S.vars[k]||50, (fm[1]==='-'?-1:1)*(+fm[2])); return; }
  const rel = r.match(/^([+-])\s*(\d+)$/);
  if(rel){ S.vars[k]=(+S.vars[k]||0)+(rel[1]==='-'?-1:1)*(+rel[2]); return; }
  S.vars[k]=val(r);
}

/* ---------- text ---------- */
function subst(t){
  return t.replace(/\$\{(\w+)\}/g, (_,k)=> (k in S.vars? S.vars[k] : ''));
}
function esc(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inline(t){
  return esc(subst(t))
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[\s(&quot;"—-])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/_(.+?)_/g,'<em>$1</em>');
}

/* ---------- run ---------- */
function gotoScene(name){
  if(!P[name]){ S.page.push({t:'text',v:'[missing scene: '+name+']'}); return false; }
  S.scene=name; S.pc=0; return true;
}
function findLabel(sc,lab){
  const a=P[sc]; for(let i=0;i<a.length;i++)
    if(a[i].k==='cmd'&&a[i].c==='label'&&a[i].a.trim()===lab.trim()) return i;
  return -1;
}
function skipBlock(a,i,ind){ let j=i+1; while(j<a.length && (a[j].k==='blank'||a[j].ind>ind)) j++; return j; }

function step(){
  S.page=[]; S.choices=null;
  let guard=0;
  while(S.scene && guard++<20000){
    const a=P[S.scene];
    if(S.pc>=a.length){ advanceScene(); continue; }
    const n=a[S.pc];

    if(n.k==='blank'){ S.pc++; continue; }
    if(n.k==='text'){ S.page.push({t:'text',v:n.a,scene:S.scene,line:n.line}); S.pc++; continue; }
    if(n.k==='opt'){ S.pc=skipBlock(a,S.pc,n.ind); continue; }

    const c=n.c, arg=n.a;
    if(c==='comment'||c==='label'||c==='title'||c==='subtitle'||c==='author'||
       c==='scene_list'||c==='achievement'||c==='save_game'){ S.pc++; continue; }
    if(c==='create'){ doSet(arg); S.pc++; continue; }
    if(c==='set'||c==='set_hidden'||c==='temp'){ doSet(arg); S.pc++; continue; }
    if(c==='set_ward'){ doSet(arg); S.pc++; continue; }
    if(c==='achieve'){ S.vars['ach_'+arg.trim()]=true; S.pc++; continue; }
    if(c==='line_break'){ S.page.push({t:'br'}); S.pc++; continue; }
    if(c==='page_break'){ S.pc++; return render(); }
    if(c==='image'){ const m=arg.match(/^(\S+)\s*(.*)$/)||[]; S.page.push({t:'img',src:m[1]||'',alt:m[2]||''}); S.pc++; continue; }
    if(c==='goto'){ const i=findLabel(S.scene,arg); S.pc = i<0? S.pc+1 : i+1; continue; }
    if(c==='goto_scene'){ const p=arg.trim().split(/\s+/); if(gotoScene(p[0])&&p[1]){const i=findLabel(S.scene,p[1]); if(i>=0)S.pc=i+1;} continue; }
    if(c==='finish'||c==='ending'){ if(c==='ending'){ S.page.push({t:'end'}); return render(); } advanceScene(); continue; }
    if(c==='stat_chart'){ S.page.push({t:'chart'}); S.pc=skipBlock(a,S.pc,n.ind); continue; }
    if(c==='input_text'){ S.page.push({t:'input',v:arg.trim()}); S.pc++; return render(); }
    if(c==='if'||c==='elseif'||c==='else'){
      const ok = (c==='else') ? true : evalExpr(arg);
      if(ok){ S.pc++; }
      else {
        let j=skipBlock(a,S.pc,n.ind);
        while(j<a.length && a[j].k==='cmd' && (a[j].c==='elseif'||a[j].c==='else') && a[j].ind===n.ind){
          if(a[j].c==='else'||evalExpr(a[j].a)){ S.pc=j+1; j=-1; break; }
          j=skipBlock(a,j,n.ind);
        }
        if(j>=0) S.pc=j;
      }
      continue;
    }
    if(c==='choice'||c==='fake_choice'){
      const opts=[]; let j=S.pc+1; let oind=null;
      while(j<a.length){
        const m=a[j];
        if(m.k==='blank'){ j++; continue; }
        if(m.ind<=n.ind) break;
        if(m.k==='opt'){ if(oind===null) oind=m.ind;
          if(m.ind===oind) opts.push({label:m.a,body:j+1,line:m.line}); }
        else if(oind===null && m.k==='cmd' && m.c==='if'){ /* conditional option wrapper */ }
        j++;
      }
      S.choices={opts,after:j};
      return render();
    }
    S.pc++;
  }
  render();
}
function advanceScene(){
  const i=ORDER.indexOf(S.scene);
  if(i>=0 && i+1<ORDER.length){ gotoScene(ORDER[i+1]); }
  else { S.page.push({t:'end'}); S.scene=null; }
}

/* ---------- render ---------- */
function deltaText(bodyStart){
  const a=P[S.scene]; const out=[];
  for(let j=bodyStart;j<a.length && j<bodyStart+60;j++){
    const n=a[j]; if(n.k!=='cmd') continue;
    if(n.c==='set'||n.c==='set_hidden'){ out.push(n.a); }
    if(n.c==='goto'||n.c==='goto_scene') break;
  }
  return out.join(' · ');
}
function render(){
  const st=$('stage'); st.innerHTML='';
  if(S.edit && S.history.length){
    const b=document.createElement('button'); b.className='backbtn'; b.textContent='◂ back';
    b.onclick=goBack; st.appendChild(b);
  }
  S.page.forEach((n,idx)=>{
    if(n.t==='text'){
      const p=document.createElement('p');
      const raw=n.v;
      p.innerHTML=inline(raw);
      const key=n.scene+':'+n.line;
      if(S.notes[key]) p.classList.add('hasnote');
      if(S.edit){ p.onclick=()=>openNote(key,raw); }
      st.appendChild(p);
    } else if(n.t==='br'){ const d=document.createElement('div'); d.className='hr'; st.appendChild(d);
    } else if(n.t==='img'){
      const f=document.createElement('figure');
      f.innerHTML='<div class="imgph">'+esc(n.src)+'<br><br>'+esc(n.alt)+'</div>'+
                  '<figcaption>illustration — not yet generated</figcaption>';
      st.appendChild(f);
    } else if(n.t==='chart'){ st.appendChild(chartEl());
    } else if(n.t==='input'){
      const w=document.createElement('div'); w.className='choices';
      w.innerHTML='<input id="tin" style="font-family:Spectral,serif;font-size:1rem;padding:.7rem;background:var(--glass);border:1px solid var(--rule);color:var(--ink)">';
      const b=document.createElement('button'); b.className='opt'; b.textContent='That is my name.';
      b.onclick=()=>{ const v=$('tin').value.trim(); if(v) S.vars[n.v]=v; S.pc++; save(); step(); };
      w.appendChild(b); st.appendChild(w);
    } else if(n.t==='end'){
      const d=document.createElement('p'); d.style.textAlign='center'; d.style.color='var(--ink3)';
      d.style.fontFamily='"IBM Plex Mono",monospace'; d.style.fontSize='.7rem';
      d.style.letterSpacing='.24em'; d.innerHTML='END';
      st.appendChild(d);
    }
  });
  if(S.choices){
    const w=document.createElement('div'); w.className='choices';
    S.choices.opts.forEach(o=>{
      const b=document.createElement('button'); b.className='opt';
      b.innerHTML=inline(o.label)+(S.edit? '<span class="delta">'+esc(deltaText(o.body))+'</span>':'');
      b.onclick=()=>pick(o);
      w.appendChild(b);
    });
    document.getElementById('stage').appendChild(w);
  } else if(S.scene){
    const b=document.createElement('button'); b.className='cont'; b.textContent='continue';
    b.onclick=()=>{ save(); step(); };
    document.getElementById('stage').appendChild(b);
  }
  $('cwhere').innerHTML = S.scene ? '<b>'+esc(S.scene)+'</b>' : 'end';
  $('cedit').innerHTML = S.edit ? '<span class="edit">edit mode</span>' : '';
  window.scrollTo(0,0);
  save();
}
function pick(o){
  S.history.push({vars:JSON.parse(JSON.stringify(S.vars)),scene:S.scene,pc:S.pc,choices:S.choices});
  if(S.history.length>400) S.history.shift();
  S.pc=o.body; save(); step();
}
function goBack(){
  const h=S.history.pop(); if(!h) return;
  S.vars=h.vars; S.scene=h.scene; S.pc=h.pc; S.choices=h.choices;
  step();
}

/* ---------- stat chart ---------- */
function pairRow(l,r,v,col){
  return '<div class="stat"><div class="statlab"><span>'+l+' '+v+'%</span><span>'+(100-v)+'% '+r+
    '</span></div><div class="statbar"><i style="width:'+v+'%;background:'+col+'"></i></div></div>';
}
function chartEl(){
  const d=document.createElement('div');
  const v=S.vars;
  d.innerHTML =
    pairRow('Valor','Patience',+v.valor||50,'var(--cobalt)')+
    pairRow('Severity','Mercy',+v.severity||50,'var(--ruby)')+
    pairRow('Splendor','Hiddenness',+v.splendor||50,'var(--amber)')+
    '<div class="stat"><div class="statlab"><span>Charity</span><span>'+(+v.charity||50)+'%</span></div>'+
    '<div class="statbar"><i style="width:'+(+v.charity||50)+'%;background:var(--verd)"></i></div></div>'+
    '<div class="stat"><div class="statlab"><span>Hope</span><span>'+(+v.hope||40)+'%</span></div>'+
    '<div class="statbar"><i style="width:'+(+v.hope||40)+'%;background:var(--violet)"></i></div></div>'+
    '<div class="kv"><span>the needle</span><span>'+(v.needle||1)+' of 4</span></div>'+
    '<div class="kv"><span>prayers</span><span>'+(v.prayers||0)+'</span></div>'+
    '<div class="kv"><span>culpability</span><span>'+(v.culpability||'unknown')+'</span></div>';
  return d;
}

/* ---------- panels ---------- */
let noteTarget=null;
function openPanel(html){ $('panelBody').innerHTML=html; $('panel').classList.add('open'); }
function closePanel(){ $('panel').classList.remove('open'); }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800); }

function showStats(){
  const d=chartEl();
  openPanel('<h3>The angel you are making</h3>'+d.innerHTML+
    '<h3>Session</h3><div class="kv"><span>scene</span><span>'+esc(S.scene||'—')+'</span></div>'+
    '<div class="kv"><span>decisions made</span><span>'+S.history.length+'</span></div>');
}
function showJump(){
  let h='<h3>Jump to scene</h3><div class="jumps">';
  ORDER.forEach((s,i)=>{ h+='<button onclick="jump(\''+s+'\')">'+esc(s)+'<b>'+i+'</b></button>'; });
  h+='</div><h3>Warning</h3><p style="font-size:.82rem;color:var(--ink3)">Jumping keeps your current stats. It does not replay the scenes in between.</p>';
  openPanel(h);
}
function jump(s){ S.history.push({vars:JSON.parse(JSON.stringify(S.vars)),scene:S.scene,pc:S.pc,choices:S.choices});
  gotoScene(s); closePanel(); step(); }

function openNote(key,snippet){
  noteTarget={key,snippet};
  const ex=S.notes[key]||{};
  openPanel('<h3>Note on this passage</h3>'+
    '<div class="snip">'+inline(snippet)+'</div>'+
    '<textarea id="ntxt" placeholder="What should change here?">'+esc(ex.note||'')+'</textarea>'+
    '<button class="act prim" onclick="saveNote(\'rewrite\')">Ask Claude to rewrite</button>'+
    '<button class="act" onclick="saveNote(\'note\')">Just a note</button>'+
    '<h3>Or replace the text yourself</h3>'+
    '<textarea id="rtxt" placeholder="Type replacement prose. Leave blank to keep.">'+esc(ex.replacement||'')+'</textarea>'+
    '<button class="act" onclick="saveNote(\'edit\')">Save my rewrite</button>'+
    (ex.note||ex.replacement? '<button class="act" onclick="delNote()">Delete this note</button>':''));
}
async function saveNote(kind){
  if(!noteTarget) return;
  const note=($('ntxt')||{}).value||'', repl=($('rtxt')||{}).value||'';
  const rec={kind,scene:noteTarget.key.split(':')[0],line:+noteTarget.key.split(':')[1],
    snippet:noteTarget.snippet,note:note.trim(),replacement:repl.trim(),at:new Date().toISOString()};
  S.notes[noteTarget.key]=rec; save();
  const db=await claude.use('db');
  if(db){ try{ await db.doc('notes/'+noteTarget.key.replace(/[^\w]/g,'_')).set(rec);
      toast('saved for Claude'); }catch(e){ toast('saved locally only'); } }
  else toast('saved locally only');
  closePanel(); step();
}
function delNote(){ if(noteTarget){ delete S.notes[noteTarget.key]; save(); closePanel(); step(); } }
function showNotes(){
  const ks=Object.keys(S.notes);
  let h='<h3>Your notes ('+ks.length+')</h3>';
  if(!ks.length) h+='<p style="color:var(--ink3);font-size:.85rem">Turn on edit mode and click any paragraph.</p>';
  h+='<div class="notelist">';
  ks.forEach(k=>{ const n=S.notes[k];
    h+='<div class="noteitem"><em>'+esc(n.scene)+' · line '+n.line+' · '+n.kind+'</em>'+
       esc((n.note||n.replacement||'').slice(0,240))+'</div>'; });
  h+='</div>';
  openPanel(h);
}

/* ---------- persistence ---------- */
function save(){ try{ localStorage.setItem('onesoul', JSON.stringify(
  {vars:S.vars,scene:S.scene,pc:S.pc,notes:S.notes,edit:S.edit,started:S.started})); }catch(e){} }
function load(){ try{ const r=JSON.parse(localStorage.getItem('onesoul')||'null');
  if(r){ S.vars=r.vars||{}; S.scene=r.scene; S.pc=r.pc||0; S.notes=r.notes||{};
    S.edit=!!r.edit; S.started=!!r.started; return !!r.scene; } }catch(e){} return false; }

/* ---------- boot ---------- */
function titleScreen(){
  $('stage').innerHTML='<div class="title"><h1>One Soul</h1>'+
    '<div class="sub">Angelic Orders · Book One</div>'+
    '<div class="tag">You are an angel, and one life is yours to keep.</div></div>';
  const w=document.createElement('div'); w.className='choices';
  const b=document.createElement('button'); b.className='opt'; b.textContent='Begin.';
  b.onclick=()=>{ S.started=true; S.vars={}; S.history=[];
    (P.__startup__||[]).forEach(n=>{ if(n.k==='cmd'&&n.c==='create') doSet(n.a); });
    gotoScene(ORDER[0]); step(); };
  w.appendChild(b);
  if(localStorage.getItem('onesoul')){
    const c=document.createElement('button'); c.className='opt'; c.textContent='Continue where I left off.';
    c.onclick=()=>{ load(); if(S.scene) step(); else b.click(); };
    w.appendChild(c);
  }
  $('stage').appendChild(w);
  $('cwhere').textContent='title';
}
function buildBar(){
  const defs=[['stats','Stats',showStats],['notes','Notes',showNotes],
    ['jump','Jump',showJump],['edit','Edit',toggleEdit],
    ['theme','Theme',toggleTheme],['size','A±',cycleSize],['restart','Restart',restart]];
  $('bar').innerHTML='';
  defs.forEach(([id,label,fn])=>{
    if((id==='jump') && !S.edit) return;
    const b=document.createElement('button'); b.id='b_'+id; b.textContent=label; b.onclick=fn;
    if(id==='edit'&&S.edit) b.classList.add('on');
    $('bar').appendChild(b);
  });
}
function toggleEdit(){ S.edit=!S.edit; document.body.classList.toggle('editing',S.edit);
  buildBar(); save(); if(S.scene) step(); else titleScreen();
  toast(S.edit?'edit mode on — click any paragraph':'edit mode off'); }
function toggleTheme(){ const r=document.documentElement;
  r.setAttribute('data-theme', r.getAttribute('data-theme')==='light'?'dark':'light'); }
let sizes=[17,19,21,24], si=1;
function cycleSize(){ si=(si+1)%sizes.length; document.documentElement.style.setProperty('--fs',sizes[si]+'px'); }
function restart(){ if(!confirm('Start again from the beginning?')) return;
  const n=S.notes, e=S.edit; localStorage.removeItem('onesoul');
  S.vars={};S.scene=null;S.pc=0;S.history=[];S.notes=n;S.edit=e; save(); titleScreen(); }

(function(){
  P.__startup__ = parse(SCENES.__startup__||'');
  const had = load();
  document.body.classList.toggle('editing',S.edit);
  buildBar();
  if(had && S.started){ step(); } else { titleScreen(); }
  addEventListener('keydown',e=>{
    if(e.key==='Escape') closePanel();
    if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='e'){ e.preventDefault(); toggleEdit(); }
  });
})();
</script>
