n*set_ward prayers 6\n\n*page_break\n\n*comment ---- 3.3 : THE FINGER. 1984, age nine ----\n\nYou are going to want to pay attention to this one.\n\nIt is a Thursday in February and the kitchen on Dobson Street is too warm because the radiator has one setting. Adam is nine. He is reaching across the table for a glass of milk, and his hand opens wrong — the way anybody's hand opens wrong, a hundred times a day — and for about a quarter of a second his middle finger is up on its own.\n\nHe puts the glass down.\n\nThen, deliberately, he points the same finger at the floor and holds it there for a moment.\n\nThen he picks the glass back up.\n\n*page_break\n\n\"What was that?\" you say.\n\nYour angel does not answer, because your angel is watching, and you have learned by now that when it goes quiet it is because it is seeing all of a thing at once and there is nothing to add.\n\nSo you watch too.\n\nHe does it again at four o'clock, reaching for a book. He does it at twenty past five with a fork. He does it at bedtime, twice, once because of a real one and once because he is not sure whether the first one counted.\n\n*page_break\n\nHere is what is happening, and neither of you can see it, because it is behind the door.\n\nHe made the sign. He did not mean to. It does not matter that he did not mean to, because he is nine and nobody has explained to him that meaning to is the whole of it, and what he was told at seven was that there is a list and the business is getting the list right.\n\nSo: he made the sign. That is on the list. If he does not undo it he will have to confess it. If he forgets to confess it, then next time he goes up for communion he will be going up with it still on him.\n\nPointing at the floor undoes it. He worked this out himself. Nobody taught him this and nobody could talk him out of it because nobody knows.\n\n*page_break\n\nHe does it forty times a day.\n\nHe does it for four years.\n\nHis mother never notices, because he is careful, and because she is working, and because he is a quiet boy and quiet boys are the ones you stop looking at.\n\n*page_break\n\n*comment ---- what she sees, and what it means ----\n\nAnd this is what you see, from where you are standing:\n\nA nine-year-old boy who is *extremely serious about sin.*\n\nThat is not a misreading. That is the only reading there is from outside. Every single fact in front of you says the same thing — a child who is scrupulously careful, who is thinking about God at the table, who is more attentive to this than any adult in the house.\n\nYou have prayed for forty-five years for grandchildren who would take it half this seriously.\n\n*page_break\n\n*if (asked_for = 1)\n  You were told what he would suffer. You were not told when. You have been waiting for something that looks like suffering and this does not look like it.\n  *page_break\n\n*comment ---- the number nobody mentions ----\n\nAlso, somewhere in 1984, one of the numbers starts going down.\n\nNot the boy's. Hers. Prayers.\n\nIt has been going up every night for nine years and now, in the spring, it turns and starts to slide, slowly, and there is nothing in the room to explain it. Halina is not ill. She is not praying less. She kneels down every night at seven and gets up again with difficulty.\n\n*set_ward prayers 5\n\nNothing in the text is going to tell you what that is.\n\n*page_break\n\n*comment ---- 3.3 choice : the beat the game turns on ----\n\nSo. A boy who points at the floor forty times a day.\n\n*choice\n  #Encourage it. This is a child who cares about God.\n    You lean on it. You make the seven o'clock stick harder. You put the missal where he will find it. You make him feel, in the small ways available to you, that this carefulness is the right road and that he is on it.\n    *line_break\n    *line_break\n    It works beautifully. He gets more careful. He starts making a list before Saturday so he does not forget anything.\n    *line_break\n    *line_break\n    *set_ward needle 2\n    Something in him moves, quietly, from *this is forbidden* to *this is filthy, and so am I* — and neither of you sees it move, because it happens behind the door.\n    *set severity %+20\n    *goto finger_end\n\n  #Get an adult to notice.\n    You spend three weeks on it and you finally get his mother to see him do it, at the table, in front of her.\n    *line_break\n    *line_break\n    Ewa Kowalczyk is thirty-one years old, works six days, and loves her son. She looks at him pointing at the floor and she says, not unkindly, \"Adam. Stop being weird.\"\n    *line_break\n    *line_break\n    He stops doing it in front of her.\n    *line_break\n    *line_break\n    That is the entire result. He does not stop. He goes underground, which is worse, and now it is a secret as well as a compulsion.\n    *set valor %+15\n    *set hope %-10\n    *goto finger_end\n\n  #They are working on him. Let them.\n    You can see them at it — the shapeless ones, at the edges, all week, and what they are pushing at is not the boy's carefulness. They are pushing at whether any of it matters at all.\n    *line_break\n    *line_break\n    They are trying to make him careless.\n    *line_break\n    *line_break\n    And you look at a nine-year-old grinding himself to powder over a hand gesture, and you make a judgement, and the judgement is that *this* is the deeper injury and that they are making a mistake.\n    *line_break\n    *line_break\n    So you tell your angel to stand aside. Not to help them — never that. To decline to be in the way.\n    *line_break\n    *line_break\n    \"You understand what you are asking,\" it says.\n    *line_break\n    *line_break\n    \"I understand that he is nine and he is pointing at the floor.\"\n    *line_break\n    *line_break\n    \"Yes,\" it says, and it stands aside.\n    *line_break\n    *line_break\n    You will not find out whether that was right for thirty-four years.\n    *set valor %-20\n    *set severity %-15\n    *set hope %-5\n    *set_hidden overreach 1\n    *achieve stood_aside\n    *goto finger_end\n\n  #You do not understand this. Do nothing until you do.\n    \"I don't know what I'm looking at,\" you say.\n    *line_break\n    *line_break\n    \"No.\"\n    *line_break\n    *line_break\n    \"Do you?\"\n    *line_break\n    *line_break\n    \"No.\"\n    *line_break\n    *line_break\n    So you do nothing, which feels like failing, and which you will go on feeling like for years, and which is the best available answer and gets no credit at all.\n    *set valor %-25\n    *set charity %+20\n    *goto finger_end\n\n*label finger_end\n\n*page_break\n\n*comment ---- 3.4 : THE MILL AND THE LOFT. 1985, age ten ----\n\nIn 1985 the mill on the South Side closes.\n\nStan Kowalczyk is forty-eight and has been there since he was nineteen and there is not going to be work like that again, not for him, not on that river, not ever. Half of Dobson Street goes over the next four years. The bakery on Liberty holds on until 1991.\n\nHe does not say anything about it.\n\nThat is the thing you have to understand about this man and you will be understanding it for another thirty-one years. He is not cold. He is not absent. He is a man who was raised by a man who did not speak, and the machinery for saying a thing out loud was never installed, and there is nothing to be done about it now.\n\n*page_break\n\nSo instead, on the second Saturday after, he goes up onto the roof.\n\nThere is a structure up there that has been shut since 1971. It was his father's. It is a pigeon loft — a proper one, cedar, with a landing board and a trap and forty-eight nest boxes — and half of Polish Hill had one and most of them are gone now.\n\nHe cleans it out. It takes him two weekends. He does not explain what he is doing and nobody asks.\n\n*page_break\n\nThen he brings Adam up the ladder and stands there with his hands in his pockets and says:\n\n\"It's yours.\"\n\nAnd that is all he says. That is the entire ceremony. A man who cannot tell his son one true thing about the world has just handed him a roof full of birds instead, and it is the largest thing he will ever say to anybody.\n\n*page_break\n\n*comment ---- the birds : the angel's one competence ----\n\nHere is what you find out over the next three years, and it is the single funniest thing that happens in forty-nine years.\n\nYour angel can move a bird.\n\nNot *nudge*. Not *arrange circumstances*. A pigeon has no free will — there is no door in the middle of it — and so the whole of an angelic will can be applied to a pigeon and the pigeon does what it is told, completely, at four hundred miles.\n\n*set_hidden birds 1\n\n\"So let me get this straight,\" you say, in May of 1985, on a roof, watching a hen come in off the Ohio like she is on a wire. \"You can't stop a child from pointing at the floor.\"\n\n\"No.\"\n\n\"But you can drive a *bird*.\"\n\n\"Yes.\"\n\n\"Across three states.\"\n\n\"If necessary.\"\n\n*page_break\n\n*comment ---- Josie ----\n\nHer ring number is 1985-AU-4471 and Adam calls her Josie because he is ten.\n\nHe puts her in a basket in a truck in Springfield, Ohio, in the last week of August, with fourteen other birds and a man from the club who charges two dollars a head, and she is liberated at 7:15 in the morning three hundred and forty miles from a roof she has never flown from before.\n\nAt eleven o'clock there is weather over eastern Ohio.\n\n*choice\n  #Bring her home.\n    You do not know what you are doing and you do it anyway. You put your angel on a bird in a crosswind over Cambridge, Ohio, and you hold her there, and it takes most of the afternoon and it costs nothing and helps nobody and is not part of anybody's commission.\n    *line_break\n    *line_break\n    She comes in at 4:40 with her flights ragged and drops onto the board like a thrown shoe.\n    *line_break\n    *line_break\n    Adam is on the roof. He has been on the roof since noon. He picks her up with both hands and holds her against his chest and says, out loud, to nobody:\n    *line_break\n    *line_break\n    \"*There* she is.\"\n    *line_break\n    *line_break\n    And down in the yard his father hears it through the window and does not come up.\n    *set valor %+20\n    *set charity %+15\n    *set_hidden birds 2\n    *achieve storm\n    *goto birds_end\n\n  #Leave her. She is a bird.\n    She is a bird. Four hundred birds go down every year in weather and nobody writes to the paper about it.\n    *line_break\n    *line_break\n    Adam waits on the roof until dark and then until nine, and then his mother makes him come in, and he does not eat anything.\n    *line_break\n    *line_break\n    He gets over it. Children do. He is on the roof again in a week.\n    *line_break\n    *line_break\n    You do not entirely get over it.\n    *set severity %+15\n    *set hope %-10\n    *goto birds_end\n\n  #Ask your angel whether this is allowed.\n    \"Is this allowed? Am I allowed to spend you on a *pigeon*?\"\n    *line_break\n    *line_break\n    \"There is nothing else I am required to be doing this afternoon,\" it says. \"He is on a roof. Nothing is happening to him. And if you are asking whether it is beneath the office —\"\n    *line_break\n    *line_break\n    \"That's what I'm asking.\"\n    *line_break\n    *line_break\n    \"The office,\" it says, \"is one boy on one roof. I do not think you have understood how small it is.\"\n    *line_break\n    *line_break\n    Then it brings the bird home without being asked twice.\n    *set charity %+25\n    *set splendor %-15\n    *set_hidden birds 2\n    *achieve storm\n    *goto birds_end\n\n*label birds_end\n\n*page_break\n\n*comment ---- 3.5 : RENEE. 1984–88 ----\n\nThree doors down there is a girl called Renee Sobek who is exactly his age and who is, from about the age of nine, the most alarming person he knows.\n\nShe is louder than he is. She is better at everything than he is, including the things he is good at, and she is cheerfully aware of this and says so. She wants to be a nurse and announces it at nine and it never changes.\n\n*if (asked_for = 2)\n  You were given the names. You have known this one since before he was born, and you have been waiting five years for a girl to walk past a window, and here she is on a bicycle, and you do not know one single thing about how it ends.\n  *page_break\n\nThey are not sweethearts. That is important. For nine years they are simply the two children on that stretch of Dobson Street who are the same age, and they are in and out of each other's kitchens, and she is on the roof with the birds more often than he would strictly like, and there is a photograph from 1986 of the two of them holding a hen and neither of them looking at the camera.\n\n*page_break\n\nAnd her angel is around.\n\nYou see it in a doorway in 1985 and you both nod, and that is all, and that goes on for four years and neither of you says a word.\n\n\"Why don't you talk to it?\"\n\n\"There is nothing to discuss yet.\"\n\n\"You could just say hello.\"\n\n\"That is not what we are for.\"\n\n*page_break\n\n*comment ---- 3.6 : HALINA. 1986, age eleven ----\n\nShe dies in February, in the back room, over about a week, at eighty-eight.\n\nShe is lucid until the Thursday. Adam is eleven and is brought in twice and the second time she says something to him in Polish that his mother does not translate and that he will still be turning over when he is forty.\n\n*page_break\n\nAnd here is the thing you have been not-noticing for two years.\n\nThe number.\n\nYou have not thought about it since 1984 because there has been no reason to. It has been sliding, quietly, in the corner, all that time — from six to five to four — while an old woman knelt down every night and got up again with difficulty and said the same name.\n\nAnd what you find out, if you go and look, is that from about April of 1984 there is something she will not put down.\n\nIt is about Ewa. It is old — it goes back to 1974 and something that was said in a kitchen about a wedding — and it is small, and Halina has been right about it for twelve years, and she is right about it now, and being right about it has been quietly eating something.\n\nShe does not forgive it. Not in 1984, not on the Thursday, not on the Sunday.\n\n*page_break\n\nShe dies having kept every rule in the book.\n\n*set_ward prayers 0\n\nThe number goes to nothing.\n\n*page_break\n\n*choice\n  #\"Where is she?\"\n    \"That is not given.\"\n    *line_break\n    *line_break\n    \"Don't do that. Don't do the — take me. You've taken me everywhere else. Take me and *show me.*\"\n    *line_break\n    *line_break\n    \"That is not given,\" it says again, in exactly the same voice, and you understand that this is not a refusal it is going to soften and not one it is going to explain.\n    *set hope %-15\n    *goto halina_dead\n\n  #\"She kept every rule she was ever given.\"\n    \"Yes.\"\n    *line_break\n    *line_break\n    \"So that's it. That's all of it. She kept every rule and she was right about Ewa and she was right the whole time.\"\n    *line_break\n    *line_break\n    \"She was right the whole time,\" your angel agrees.\n    *line_break\n    *line_break\n    And it does not say anything else, and after a while you realise it is not going to, and that the silence is not evasion. It is the answer.\n    *set severity %-15\n    *set charity %+15\n    *goto halina_dead\n\n  #Say nothing. Look at the number.\n    Six, five, four, three, one, nothing.\n    *line_break\n    *line_break\n    Eleven years of an old woman on a cold floor at seven o'clock, and you did not once look at it while it was working, and now it is a zero and you are looking at it very hard indeed.\n    *set charity %+20\n    *set hope %-5\n    *goto halina_dead\n\n*label halina_dead\n\n*page_break\n\nAt the funeral Mrs. Duda, who has been dying since 1961, tells Ewa that Halina was a saint, and Ewa says thank you, and goes out to the car, and sits in it for a while.\n\n*page_break\n\n*comment ---- 3.7 : THE CLASSROOM DOOR. 1988, age thirteen ----\n\nAnd then it is 1988 and he is thirteen.\n\nIt is a Tuesday in the second week of October. Fourth period. A health class in a public school in the city of Pittsburgh, taught by a man of fifty-six who would rather be anywhere else in the world and who reads most of it off the sheet.\n\nThere is a filmstrip.\n\nSomething is described. It is described clinically, correctly, as a fact about bodies, with no moral frame attached to it whatsoever, because it is 1988 and it is a public school and that is not the job.\n\n*page_break\n\nThe bell goes at ten past.\n\nHe comes out into the corridor with everybody else. He is quiet on the walk home, which is eleven minutes. He is quiet at dinner. He does his homework at the kitchen table with his feet hooked round the chair legs and he goes to bed at ten.\n\n*page_break\n\nThat is everything you can see.\n\nBecause that is everything there is to see.\n\n*page_break\n\n\"Something happened,\" you say.\n\n\"Yes.\"\n\n\"What?\"\n\n\"I do not know.\"\n\nYou look at your angel for a long moment, and then you look at the boy, thirteen years old, going up the stairs with a glass of water.\n\n*page_break\n\n*if (asked_for = 1)\n  You were told what he would suffer. You have been waiting since 1975 to see it start.\n  *line_break\n  *line_break\n  You have just watched it start and you did not recognise it, because it looked like a boy being quiet on a Tuesday.\n  *page_break\n\n*comment ---- and she does know ----\n\nYou know what happened.\n\nOf course you know. You have raised a child and you were thirteen once yourself. You have known since he came through the door with his face like that. There is not one thing about this that is a mystery to you and you could write it down on the back of an envelope.\n\nAnd the thing standing next to you — which was present at the creation of the world, which watched a third of everything fall, which can drive a bird four hundred miles through weather — has no idea at all.\n\n*page_break\n\n\"You really don't know,\" you say.\n\n\"No.\"\n\n\"I do.\"\n\n\"Yes,\" it says. \"From here on, you will often know before I do. It is not going to help as much as you think.\"\n\n*finish\n", "otherwatch": "*comment ============================================================\n*comment SCENE FOUR — THE OTHER WATCH\n*comment 1988, the same autumn. ~1,400 words, 6 choices.\n*comment Job: two goods that do not fit, and no arbitration.\n*comment ============================================================\n\nEleven days after the classroom door, Renee Sobek's guardian speaks to yours for the first time in thirteen years.\n\nIt happens in a doorway on Dobson Street at about four in the afternoon. There is nothing ceremonious about it. It simply hands something over — instantly, entire, no preamble, the way they do — and your angel receives it, and then stands there holding it.\n\n\"What,\" you say. \"What was that.\"\n\n\"A fact about the girl.\"\n\n\"What fact?\"\n\n\"Her father drinks,\" it says. \"Not visibly. Not yet. It has been getting worse since June and there is a particular kind of evening in that house now, about twice a week, and she has begun to be able to tell in the first ten seconds which kind of evening it is going to be.\"\n\n*page_break\n\nYou look at the other angel.\n\nIt is not like yours. That is the first thing. It is not *unlike* yours either — you cannot say it is bigger or smaller or older, because none of those are things it has — but it is a different kind of creature entirely, and the word that keeps coming to you is one you would be embarrassed to say out loud, and the word is *severe.*\n\n\"Ask it what it wants,\" you say.\n\n*page_break\n\nWhat it wants is this.\n\nRenee should pull back from Adam. Not cruelly and not all at once. Over the next year she should find other people, and take up the things she is good at, and stop spending four afternoons a week on a roof three doors down.\n\nBecause it has been watching him too. It can see, from outside, exactly what you can see: a boy who has been closing since October. And a thirteen-year-old girl who attaches herself to a boy who is closing will spend the next ten years of her life waiting for a door to open.\n\nHer good is that she should not spend her adolescence waiting.\n\n*page_break\n\nAnd Adam's good is that Renee Sobek is the only thing currently keeping him in the world.\n\nSince October he has stopped talking to two other boys, stopped going to the club on Saturdays, and started spending an unusual amount of time on a roof by himself. There is exactly one person he still says whole sentences to, and she is thirteen years old, and she does not know she is doing it, and if she goes he will not follow her.\n\n*page_break\n\nNeither of them is wrong.\n\nThat is the thing you are going to have to sit with, and it takes you about a minute and a half, and you do not like it at the end of the minute and a half either.\n\nThere is no arbitration. Nobody is coming to decide between them. The two of them are under the same obedience and they are obeying it, and they are on opposite sides of one afternoon on Dobson Street.\n\n*page_break\n\n*choice\n  #\"Tell it no. Tell it to leave her where she is.\"\n    Your angel says it. There is no argument, because there cannot be an argument — everything either of them knows is already in the open, and they are not disagreeing about a fact, they are simply pointed at different people.\n    *line_break\n    *line_break\n    The other angel says something back, and your angel relays it, and it is: *understood, and I am not going to.*\n    *line_break\n    *line_break\n    \"It can *do* that?\"\n    *line_break\n    *line_break\n    \"It has its own commission,\" your angel says. \"You are not its abbot. You are mine.\"\n    *set severity %+20\n    *set valor %+15\n    *goto watch_two\n\n  #\"Tell it we'll help. Help her pull back.\"\n    Your angel says it, and the other angel accepts, and the two of them are briefly working together on the removal of the one good thing in your boy's life, and it is horrible, and it is also probably correct.\n    *line_break\n    *line_break\n    \"Say something,\" you tell your angel.\n    *line_break\n    *line_break\n    \"You have said it.\"\n    *set charity %+20\n    *set severity %+10\n    *set hope %-10\n    *goto watch_two\n\n  #\"Ask it what happens to her if she stays.\"\n    The other angel hands it over without hesitating.\n    *line_break\n    *line_break\n    You get eleven years in about a second: a girl who is very good at looking after somebody who will not say what is wrong, and who gets so good at it that by twenty-three it is the only shape she knows how to be, and who goes on being that shape for two more men afterwards, one of whom is worse.\n    *line_break\n    *line_break\n    \"Show me the other angel,\" you say. \"Show me what happens if she goes.\"\n    *line_break\n    *line_break\n    \"It cannot,\" your angel says. \"Neither can I. That has not happened and it depends on what she chooses, and nothing made can see a thing like that in advance.\"\n    *set charity %+15\n    *set hope %-5\n    *goto watch_two\n\n  #Say nothing. Let the two of them work it out.\n    They do not work it out. They stand in a doorway on Dobson Street for a while, entirely open to each other, in complete agreement about every fact in the case, and then the other angel goes back to the girl and yours stays with the boy.\n    *line_break\n    *line_break\n    That is what working it out looks like.\n    *set valor %-20\n    *goto watch_two\n\n*label watch_two\n\n*page_break\n\n*comment ---- the question she actually wants to ask ----\n\n\"Can I ask it something?\"\n\n\"You can ask me and I will ask it.\"\n\n\"Ask it how it gets told.\"\n\n*page_break\n\nThe answer comes back and it is short, and your angel gives it to you flat, without softening:\n\n*line_break\n*line_break\n*It knows.*\n*line_break\n*line_break\n\n\"That's it? It just — knows? It doesn't have somebody in a *bed* telling it —\"\n\n\"No.\"\n\n\"How long does it take?\"\n\n\"There is no time in it,\" your angel says. \"It is not told and then it decides. It is told, and that is the whole of it, and then it acts.\"\n\n*page_break\n\nYou sit with that. Or you would sit with it, if there were anything here to sit on.\n\nSomewhere in the last thirteen years you have started to think of this arrangement as an honour. You would not have said so out loud. But you had begun, quietly, to think that being handed an angel to direct was a thing that had been given to you because of something about you.\n\nAnd here is another one, doing the same job, being told directly by God, instantly, with no woman in a bed in Pittsburgh in the way.\n\n*page_break\n\n*choice\n  #\"Why doesn't mine get that?\"\n    \"I did,\" your angel says. \"Until October of 2024. And I will again.\"\n    *line_break\n    *line_break\n    \"So this is — what, a demotion? For you?\"\n    *line_break\n    *line_break\n    \"It is an arrangement,\" it says. \"I do not have opinions about it. I have told you that.\"\n    *line_break\n    *line_break\n    \"You keep saying that and I keep not believing you.\"\n    *set severity %+15\n    *goto watch_end\n\n  #\"I'm slowing you down.\"\n    \"Yes.\"\n    *line_break\n    *line_break\n    You wait.\n    *line_break\n    *line_break\n    \"You wanted me to soften that,\" it says.\n    *line_break\n    *line_break\n    \"A little bit, yes.\"\n    *line_break\n    *line_break\n    \"You are slowing me down,\" it says, \"and it is not a defect in you, it is what a creature in time is. And He knew that before He arranged it, and He arranged it anyway, and I would rather you thought about why than about whether.\"\n    *set charity %+15\n    *set hope %+10\n    *goto watch_end\n\n  #Nothing. Go back to the boy.\n    You go back to the boy. He is on the roof. It is getting dark early now.\n    *set valor %-15\n    *set splendor %-15\n    *goto watch_end\n\n*label watch_end\n\n*page_break\n\nRenee Sobek stays.\n\nShe stays for eight more years, in fact, on a roof and in a kitchen and eventually in a car and an apartment on Semple Street, and her angel never once stops working on getting her out, and never once succeeds, and never once resents it.\n\n*finish\n", "vigil": "*comment SCENE FIVE — VIGIL. The checkpoint. Fifteen words.\n\n*if choice_user_restored\n  *goto_scene whattheytoldhim\n\nYou may save here. He is thirteen. Nothing has happened yet.\n\n*save_game whattheytoldhim\n\n*goto_scene whattheytoldhim\n", "whattheytoldhim": "*comment ============================================================\n*comment SCENE SIX — WHAT THEY TOLD HIM\n*comment 1989–1993, ages fourteen to eighteen. ~3,500 words, 20 choices.\n*comment Job: four years of a boy crushed between a true teaching and\n*comment every bad version of it he is offered. Fair to everyone in it,\n*comment including the priest, including the father, including the boy.\n*comment First dark hour. The sideways jump. The needle to 3.\n*comment ============================================================\n\n*comment ---- 6.1 : A DOOR, AND A LIGHT. 1989, age fourteen ----\n\nMarch, and the house is asleep, and there is a light under a door at an hour there is no reason for a light.\n\n*page_break\n\nAnd then you cannot see him.\n\n*set_ward sight \"dark\"\n\nIt is not that the room goes dark. The room is exactly as lit as it was. It is that where the boy was there is now a place your attention will not go into — you push at it and it is like pushing at the middle of your own blind spot, and the harder you look the more certain you are that you are looking at nothing.\n\nYou are four feet from him. You have been four feet from him for fourteen years.\n\n*page_break\n\n\"What is that,\" you say. \"What is *happening.*\"\n\nYour angel does not answer immediately, and that has never happened before, and that is the part that frightens you.\n\n\"I cannot see him,\" it says.\n\n\"I know you can't see him, I can't *see* him either, what is —\"\n\n\"I have never not been able to see him.\"\n\n*page_break\n\nAnd then, from somewhere off to the side, out of the dark:\n\n*line_break\n*line_break\n\"You've no idea what's going on in there, have you.\"\n*line_break\n*line_break\n\n*page_break\n\nIt is delighted. That is what you cannot get over afterwards. It is not menacing and it is not gloating exactly; it is *pleased*, in the ordinary way a man is pleased when a thing at work goes right, and it has waited fourteen years to say it and it has clearly been looking forward to it.\n\nYou say something to it. You will not remember afterwards what.\n\nIt says: \"Oh, she talks.\"\n\nAnd then it is gone, and the light under the door goes off, and after a while the room comes back and there is a fourteen-year-old boy asleep in it.\n\n*set_ward sight \"clear\"\n\n*page_break\n\n*comment ---- Loretta's first misjudgment ----\n\nYou are shaking, and you do not have a body, so you are not sure how that is working.\n\n\"Right,\" you say. \"Right. That's — how bad is that. On a scale. How bad.\"\n\n\"I do not know.\"\n\n\"Don't start. Don't do the — you *know*, you told me you know everything on the outside, so tell me —\"\n\n\"I know exactly what he did,\" your angel says. \"I am telling you that I do not know what it *was*. Whether he understood it. Whether he agreed to it with the whole of himself or half of himself or almost none of himself. Whether he has been able to think straight about any of this since he was nine and started pointing at the floor.\"\n\n*page_break\n\n\"It's a mortal sin,\" you say. \"I've known that since I was seven.\"\n\n\"You have known that the *matter* is grave. That is one of three things it takes and it is the only one anybody can see from out here.\" It says this without any heat at all. \"The other two are in the room. And the Church herself says, in writing, that habit and immaturity and a mind under that much pressure can cut what a person is answerable for down to almost nothing.\"\n\n\"*Almost* nothing.\"\n\n\"Almost. Or not at all. Or a great deal. That word on the panel is not decoration, ${name}. It is the actual state of the case, and it is going to stay the actual state of the case for thirty-five years, and you are going to hate it.\"\n\n*page_break\n\nYou look at the word.\n\n*line_break\n*line_break\n**unknown**\n*line_break\n*line_break\n\n*choice\n  #\"Then how am I supposed to decide anything?\"\n    \"The same way everybody does,\" it says. \"Without knowing. That is what it is like to be one of you and it has never once been otherwise and you have been doing it since 1953.\"\n    *set severity %+10\n    *set hope %-5\n    *goto after_dark\n\n  #\"So it might be nothing.\"\n    \"It might be very little. It is not nothing — the thing itself is not nothing whatever he is answerable for, and it is going to do to him what it does whether he is guilty of it or not.\" A pause. \"That is the part people find hardest. A wound does not check your paperwork first.\"\n    *set charity %+15\n    *goto after_dark\n\n  #\"I don't want to watch this.\"\n    \"No,\" it says. \"Neither do I. And neither of us is going to have to, which is the difficulty.\"\n    *set hope %-10\n    *goto after_dark\n\n  #Say nothing. Stay where you are until morning.\n    You stay where you are until morning. So does your angel. Neither of you does anything and there is nothing to do and it is the longest six hours of your life including the ones in the hospital.\n    *set valor %-20\n    *set charity %+20\n    *goto after_dark\n\n*label after_dark\n\n*page_break\n\n*comment ---- 6.2 : THE SATURDAY LINE. 1989–1992 ----\n\nHe goes.\n\nOf course he goes. He is the boy who pointed at the floor forty times a day for four years. On the second Saturday he is in the line at St. Casimir with eleven other people, mostly women over sixty, and he says it, and he cannot get the words out properly, and it takes him three tries.\n\nAnd then he walks home.\n\nAnd halfway home, at the corner of Brereton and Herron, he is not certain he said it *properly.*\n\n*page_break\n\nSo he goes back the following week and says it again.\n\nAnd the week after that.\n\n*page_break\n\nThis is the machine. It is worth looking at squarely, because it runs for four years and it is the reason for everything that comes after.\n\nThe scrupulosity was already there — that is 1984, that is the finger, that is an instrument that got bent before anybody could have known. What has happened now is that the bent instrument has been handed something that genuinely *is* serious, and it is doing what a bent instrument does with a real weight: it is grinding.\n\nHe is not lax. He is the opposite of lax. He is fifteen years old and going to confession every week over one thing and never once feeling that it has taken.\n\n*page_break\n\n*choice\n  #Keep him going. Whatever else is wrong, he is going.\n    You keep him going. It is not hard; he wants to go. What you are keeping him in is a line he cannot get to the end of, and there are Saturdays where he comes out worse than he went in.\n    *line_break\n    *line_break\n    But he goes for four years, and he is inside the door for four years, and there are things that only happen to people who are inside the door.\n    *set valor %+15\n    *set severity %+15\n    *goto line_end\n\n  #Get him to a different priest.\n    This is the highest thing on the board and you do not know it yet.\n    *line_break\n    *line_break\n    You spend eleven months on it. There is a Dominican who comes through in Lent of 1991 who is exactly right and who would have taken about four minutes, and you get Adam into that church on the right afternoon, and he is at the back, and the line is long, and he leaves at ten past four because he has a bus.\n    *line_break\n    *line_break\n    \"That was it,\" your angel says. \"That was the whole of it. Four minutes.\"\n    *line_break\n    *line_break\n    \"Bring him back.\"\n    *line_break\n    *line_break\n    \"He has a bus,\" it says.\n    *set charity %+25\n    *set hope %-10\n    *goto line_end\n\n  #Work on the loop, not the sin.\n    You go at the counting. You blunt it where you can — a Saturday he oversleeps and nothing bad happens, a week the list gets left in a coat pocket and the world does not end.\n    *line_break\n    *line_break\n    It helps. It helps about as much as taking one brick out of a wall.\n    *set severity %-20\n    *set charity %+15\n    *goto line_end\n\n  #Let him stop going for a while. He is being taken apart.\n    \"You are asking me to take a fifteen-year-old out of the sacraments,\" your angel says.\n    *line_break\n    *line_break\n    \"I'm asking you to take him out of a *machine*.\"\n    *line_break\n    *line_break\n    \"Yes. Those are both true descriptions and you have to pick one.\"\n    *line_break\n    *line_break\n    You pick. He misses four weeks in the autumn of 1990 and comes back in November, and he is better in November, and something else has got a little further in while the door was open.\n    *set severity %-25\n    *set hope %-5\n    *set_hidden overreach 2\n    *goto line_end\n\n*label line_end\n\n*page_break\n\n*comment ---- 6.3 : FORTY SECONDS. 1990, age fifteen ----\n\nSaturday, the eighth of December, 1990, four twenty in the afternoon.\n\nFather Jan Halakiewicz is sixty-one years old. He has said two funerals this week. He has eleven people still in the line and a wedding rehearsal at five and a boiler that has been out since Wednesday, and he has heard this particular thing nine times today, and four of those nine were this boy in the last five weeks.\n\nHe is not a cruel man. Ask anyone in that parish. He sat with Mrs. Duda for two hours the night her husband went and he never told a soul.\n\n*page_break\n\nHe is *brisk.*\n\nThat is all. He is tired and he is behind and there is a screen between them so the boy cannot see a face, and he says four words, and the four words are true, and they are the compressed, exhausted, end-of-the-afternoon version of a true thing.\n\n*page_break\n\nAnd a fifteen-year-old with a bent conscience, on the other side of a screen, with no face to read, hears:\n\n*line_break\n*line_break\n*You are a disgusting thing, and everybody in this line knows it.*\n*line_break\n*line_break\n\n*set_ward needle 2\n\n*page_break\n\nThat took forty seconds.\n\nThe priest will never know he did it. If you could tell him — if there were any way at all to get it to him — he would be horrified, and he would go and find the boy, and he would probably fix it in an afternoon.\n\nThere is no way at all to get it to him.\n\n*page_break\n\n*choice\n  #\"Go and tell him. Get in there and tell him.\"\n    \"I can move a curtain,\" your angel says. \"I can put a thought in front of a man. I cannot put a sentence into a priest's head about a boy who has just left, and if I could I would not, and you know both of those things.\"\n    *line_break\n    *line_break\n    \"I don't accept that.\"\n    *line_break\n    *line_break\n    \"No,\" it agrees. \"You will not accept it for another twenty years.\"\n    *set valor %+20\n    *set hope %-10\n    *goto halak_end\n\n  #\"That's not his fault.\"\n    \"No.\"\n    *line_break\n    *line_break\n    \"It's genuinely not. He's been at it since seven this morning.\"\n    *line_break\n    *line_break\n    \"No,\" your angel says again, and the way it says it the second time you understand that it is not agreeing with you to be kind. It has looked at the whole of Jan Halakiewicz at once and it is simply reporting.\n    *set severity %-15\n    *set charity %+20\n    *goto halak_end\n\n  #Watch the needle move and say nothing.\n    You watch it move. One to two. It takes no time at all, the way a bone breaking takes no time at all.\n    *set severity %+10\n    *set hope %-10\n    *goto halak_end\n\n*label halak_end\n\n*page_break\n\n*comment ---- 6.4 : THE CHURCH HALL. 1991, age sixteen ----\n\nThere is a man in this parish called Dennis Wisniewski and you are going to want to hit him.\n\nHe is fifty-four. He runs the Holy Name Society and the September festival and he runs both of them extremely well — the festival clears four thousand dollars a year and it clears it because of him. Nobody has ever seen him cut a corner in his life. He is at the six-thirty on weekdays. He has never done what Adam does and he has never been tempted to and he does not know that those are two different sentences.\n\nHe gets Adam by the coffee urn after a meeting in April and talks to him about purity for eleven minutes.\n\n*page_break\n\nEvery fact he says is true.\n\nThat is the thing. He is not leering and he is not prurient and he is not enjoying it — he is *disciplined*, he is correct, he is quoting accurately, and he is completely certain.\n\nAnd in eleven minutes there is not one gram of mercy. Not a sentence of it. Not an inch of room left anywhere for a sixteen-year-old to stand.\n\nBy the end of it Adam Kowalczyk has learned what the people who believe this are like.\n\n*page_break\n\nYou are shouting. There is nothing here to shout with and you are shouting anyway.\n\n\"Who does he think he is? Who *does* he — I have been listening to men like that my whole —\" and then you stop, because a thought has arrived, and it arrives with a great deal of heat behind it.\n\n\"Who did that to *him*?\"\n\n*page_break\n\n*comment ---- THE SIDEWAYS JUMP ----\n\nAnd you are taken.\n\n*page_break\n\nIt is 1953. It is a kitchen in Lawrenceville with a coal stove and a calendar from a funeral home. Dennis Wisniewski is fourteen years old and he is standing in the middle of the floor, and there is a man in the doorway who is his father, and the man is saying something to him, and there is a woman at the sink who does not turn around.\n\nIt takes about thirty seconds. It is not violent. Nobody hits anybody.\n\nYou would rather it had been violent.\n\n*page_break\n\nAnd then you are back by the coffee urn in 1991 and a fifty-four-year-old man is still talking, and he has got to the part about how these things get into a person and do not come out.\n\n*page_break\n\n\"Well,\" you say, after a while. \"That was a rotten trick.\"\n\n\"You asked.\"\n\n\"You could have just told me.\"\n\n\"You would not have believed it,\" your angel says. \"You would have decided I was making excuses for him.\"\n\n*page_break\n\n*choice\n  #\"It doesn't excuse it.\"\n    \"No.\"\n    *line_break\n    *line_break\n    \"He's still doing it. He's still standing there doing it *right now*.\"\n    *line_break\n    *line_break\n    \"Yes,\" your angel says. \"Both of those are true at once and they are going to stay true, and there is no third thing coming that will resolve them.\"\n    *set severity %+15\n    *set charity %+15\n    *goto dennis_end\n\n  #\"Get the boy out of that room.\"\n    You get him out. There is a friend at the door and a reason to leave and Adam takes it gratefully at the eight-minute mark.\n    *line_break\n    *line_break\n    Eight minutes was enough.\n    *set valor %+20\n    *goto dennis_end\n\n  #\"Can we do anything for Dennis?\"\n    Your angel is quiet for a moment.\n    *line_break\n    *line_break\n    \"He is not our commission,\" it says. \"He has his own. It has been standing beside him since 1939 and it is still there and it is not having an easy time either.\"\n    *line_break\n    *line_break\n    You had not thought about that. You think about it for a long while afterwards.\n    *set charity %+25\n    *set hope %+10\n    *goto dennis_end\n\n*label dennis_end\n\n*page_break\n\n*comment ---- 6.5 : NINE WORDS. 1991, age sixteen ----\n\nIn October, Stan Kowalczyk says the only thing he will ever say to his son about any of this.\n\nIt happens in a 1984 Buick Century on the Bloomfield Bridge, going north, with the radio off. Something has come up — a thing on the television the night before, a thing at school — and Stan has been working himself up to this for about four days, in the way of a man who is going to do a difficult thing once and never again.\n\nHe says nine words.\n\nThey are not cruel. They are not even wrong, exactly. They are the words of a man who has no equipment for this whatsoever and who is embarrassed to the roots of his hair, and what they do is close the subject, permanently, for both of them, in about four seconds.\n\nNeither of them ever mentions it again. Not in 1991, not in 2016 in a hospital bed, not once.\n\n*page_break\n\n*choice\n  #Work on Stan. He is the one who can still be reached.\n    Nobody thinks of this. Stan is not the ward and the panel does not have a column for him.\n    *line_break\n    *line_break\n    You spend two years on him and you get about four inches, and in 1993 those four inches turn into a spiral notebook in a drawer that nobody finds until 2016.\n    *line_break\n    *line_break\n    You will not know that until 2016 either.\n    *set charity %+25\n    *set splendor %-20\n    *goto buick_end\n\n  #Get him to say more. Now, in the car, while the door is open.\n    You push. You push harder than you have pushed at anything.\n    *line_break\n    *line_break\n    Stan Kowalczyk turns the radio on.\n    *set valor %+20\n    *set hope %-10\n    *goto buick_end\n\n  #Nothing. He has done what he can do.\n    \"He has done what he can do,\" your angel says, \"and it was more than his own father did, and he will not know that either.\"\n    *set severity %-15\n    *set charity %+15\n    *goto buick_end\n\n*label buick_end\n\n*page_break\n\n*comment ---- 6.6 : THE ARGUMENT. 1993, age eighteen ----\n\nIt arrives on the 54 in February of 1993, between Butler Street and the bridge, fully formed, and it is good.\n\n*page_break\n\n*line_break\n*Why would He put this in me at thirteen, without asking, and then tell me it damns me?*\n*line_break\n*Either He is cruel, or people made the rule up.*\n*line_break\n*And I do not think He is cruel.*\n*line_break\n*line_break\n\n*page_break\n\nThat is it. That is the whole argument. It is not sophisticated and it does not need to be. It has convinced a very large number of people, including people considerably cleverer than an eighteen-year-old on a bus, and it convinces him in about four seconds because he has been looking for it since he was fourteen.\n\n*page_break\n\nAnd you know the answer.\n\nYou have known it since before you had legs. The answer is that *I am able to* was never an argument for *I should* — he is also able to lie, and to eat until he is sick, and to use a person and call it fondness — and that the thing he is being told is not a fence somebody put round his body. It is a description of what a person is. And therefore of what it costs to practise treating one as a thing.\n\nThat is the answer. It takes about ninety seconds to say properly.\n\n*page_break\n\nAnd there is nobody in the city of Pittsburgh who is going to say it to him.\n\nHis grandmother is dead. His father turned the radio on. The priest is brisk and behind and has eleven people in the line. And the one man who has ever tried to talk to him about this at any length is Dennis Wisniewski, by a coffee urn, in April of 1991, for eleven minutes, and Adam has already decided what that man is.\n\n*page_break\n\n*choice\n  #Find somebody who can say it. Spend everything.\n    You spend everything. You spend two years and you get him within nine feet of it three separate times, and the third time is a man at a wedding in 1994 who would have been perfect and who was called away to deal with his own father.\n    *line_break\n    *line_break\n    Nine feet.\n    *set valor %+25\n    *set hope %-15\n    *set_hidden overreach 3\n    *goto argument_end\n\n  #Put a book in front of him.\n    You put a book in front of him. It goes on a shelf in a house on Dobson Street in 1993 and it moves to three apartments and it is still on a shelf in 2017, and in 2017, at two in the morning, a forty-two-year-old man takes it down.\n    *line_break\n    *line_break\n    Twenty-four years. You will feel like a fool for twenty-four years.\n    *set splendor %-20\n    *set valor %-15\n    *set charity %+20\n    *goto argument_end\n\n  #Work on Renee instead. She is about to matter more than anything.\n    A cold decision and a correct one. He is eighteen and the argument is made and there is nothing you can do about the argument, and there is something you can do about who is standing next to him for the next five years.\n    *set severity %+15\n    *set charity %+20\n    *goto argument_end\n\n  #Let it stand. Arguing back is not the office.\n    You let it stand. It is the hardest thing you have done and it takes no effort at all.\n    *set valor %-30\n    *set severity %+10\n    *goto argument_end\n\n*label argument_end\n\n*set_ward needle 3\n\n*page_break\n\n*comment ---- 6.7 : THE RELIEF. 1993 ----\n\nHe stops going in the autumn.\n\nAnd here is the part nobody tells you, and the part this is going to insist on: **it is wonderful.**\n\n*page_break\n\nNo more Dennis Wisniewski by the coffee urn. No more standing in a line on a Saturday afternoon performing an accounting he has never once got right. No more lying in bed on a Friday going back over the week with a pencil.\n\nAnd the nine o'clock at St. Casimir in 1993 is, objectively, bad. This is not a slander and it is not a set-up for a correction later. There is a cantor who cannot sing and knows it and is doing her best. There is a homily read off a photocopy, badly, by a man who is exhausted. There are eighty-one people in a building built for six hundred, in coats, in October, because the boiler is out again.\n\nAnd there are four people in the third pew who were unkind to his mother in 1987 in a way he has not forgotten, and every single Sunday of his life he has watched them go up and come back with their hands folded.\n\n*page_break\n\nHe does not decide anything.\n\nThat is the other part. There is no scene, no argument, no door. He does not go one Sunday because he is tired. He does not go the next because he did not go the last. By November it is simply a thing he does not do, and nobody in the house says one word about it.\n\n*page_break\n\nHe is eighteen years old and he is free, and it feels *exactly* like being free, and some of his reasons are good reasons.\n\n*page_break\n\n*choice\n  #\"Some of that is fair.\"\n    \"Yes,\" your angel says.\n    *line_break\n    *line_break\n    \"The Mass really is bad.\"\n    *line_break\n    *line_break\n    \"It is bad.\"\n    *line_break\n    *line_break\n    \"And Dennis really is —\"\n    *line_break\n    *line_break\n    \"Yes.\"\n    *line_break\n    *line_break\n    You wait for the correction. There is no correction. Your angel is not going to argue him back into a building and neither are you, and both of you know exactly how long it is going to be.\n    *set charity %+20\n    *set hope %-5\n    *goto relief_end\n\n  #\"He'll be back by Christmas.\"\n    \"No.\"\n    *line_break\n    *line_break\n    \"Easter.\"\n    *line_break\n    *line_break\n    \"No.\"\n    *line_break\n    *line_break\n    \"Don't tell me. Don't you dare tell me.\"\n    *line_break\n    *line_break\n    It does not tell you.\n    *set hope %-15\n    *goto relief_end\n\n  #Look at the number.\n    You look at Prayers. It has been at nothing since February 1986.\n    *line_break\n    *line_break\n    And then, in the third week of November 1993, without any warning and without anything in the text to explain it, it moves.\n    *line_break\n    *line_break\n    Not much. One. And it holds there.\n    *set_ward prayers 1\n    *set hope %+10\n    *goto relief_end\n\n*label relief_end\n\n*page_break\n\nUpstairs on Dobson Street, in the second drawer of a bureau, under a box of screws, there is a spiral notebook that was bought at a drugstore on Liberty Avenue for fifty-nine cents.\n\nOn the first page, at the top, in pencil, there is one word.\n\nIt is a name.\n\n*finish\n", "legion": "*comment ============================================================\n*comment SCENE SEVEN — LEGION\n*comment 1994, a corridor in Oakland. ~1,000 words, 8 choices.\n*comment Job: the one clean win, and it is a win by counting. Loretta\n*comment worked thirty years for the county. She knows a runaround.\n*comment ============================================================\n\nHe is nineteen and at Pitt and living in a building on Semple Street with four other people and a shower that runs cold at seven.\n\nAnd you have a problem, and the problem is that you have been trying for four months to get your angel to stand on one particular thing, and every time it gets there, there is already something there, and it is never the same something.\n\n*page_break\n\nIn September one of them introduces itself as Belphegor.\n\nIt is perfectly civil. It says that this is not really its area, that its area is more the long-term, and that what you want is probably the one who handles the immediate. It says it will pass it along.\n\nIn October a different one says it never got any message from Belphegor, and asks whether you are sure you spoke to Belphegor and not to someone who was covering. It says it will look into it.\n\nIn November one of them claims to be Asmodeus, which would be a very serious matter if it were true.\n\nIn December Belphegor is back and does not appear to remember September.\n\n*page_break\n\n\"They're stalling,\" you say.\n\n\"Yes.\"\n\n\"How long have they been doing this?\"\n\n\"Since 1975.\"\n\n*page_break\n\n\"And every hour you spend on it —\"\n\n\"Is an hour I am not standing where I should be. Yes.\" Your angel says this without any bitterness, which somehow makes it worse. \"The paperwork is not in the way of the attack. The paperwork *is* the attack.\"\n\n*page_break\n\n*comment ---- the recognition ----\n\nAnd you start laughing, and you cannot stop, and your angel waits.\n\n\"What.\"\n\n\"I worked twenty-nine years for Allegheny County,\" you say. \"Twenty-nine years. Deeds, then assessments, then eleven years in the office where people came to complain about assessments.\"\n\n\"Yes.\"\n\n\"Do you know what this is? This is a *runaround.* This is the oldest, cheapest, stupidest thing in the world and I have watched it done four hundred times by men making eleven thousand dollars a year, and the entire trick of it is —\"\n\nYou stop.\n\n*page_break\n\n\"The entire trick of it,\" you say slowly, \"is that they want you to think there are more of them than there are.\"\n\n*page_break\n\n*comment ---- the count ----\n\n*choice\n  #Stand on the same thing twice, a week apart, and see who turns up.\n    You do it in January and again in the second week of February.\n    *line_break\n    *line_break\n    The same one turns up both times. It introduces itself differently the second time and it is the same one, and once you have seen it you cannot unsee it, the way you cannot unsee a bad wig.\n    *set severity %+20\n    *set_hidden caught_the_lie true\n    *goto counted\n\n  #Ask one of them, straight out, how many there are.\n    \"How many of you are there?\"\n    *line_break\n    *line_break\n    There is a pause that is a half-second too long, and in that half-second you have it, because a real number would not have needed a pause.\n    *line_break\n    *line_break\n    \"Legion,\" it says. \"For we are many.\"\n    *line_break\n    *line_break\n    \"Oh,\" you say, \"you're quoting. That's what you've got? You're *quoting.*\"\n    *set splendor %+20\n    *set_hidden caught_the_lie true\n    *goto counted\n\n  #Have your angel stop responding to any of them for a month.\n    Your angel goes quiet in March and does not answer a single one of them.\n    *line_break\n    *line_break\n    By the third week they are turning up unprompted. By the fourth they are turning up *twice*, at the same object, an hour apart, with different names on, because they have nobody left to keep track of who has already been.\n    *set valor %-20\n    *set severity %+15\n    *set_hidden caught_the_lie true\n    *goto counted\n\n  #Ask your angel to just tell you.\n    \"You know, don't you.\"\n    *line_break\n    *line_break\n    \"I have never counted.\"\n    *line_break\n    *line_break\n    \"Why *not*?\"\n    *line_break\n    *line_break\n    \"Because it was never given to me as something to do,\" it says, \"and because I have not been in the habit of asking questions on my own account. That has been the arrangement for a long time.\"\n    *line_break\n    *line_break\n    \"Well, count them.\"\n    *line_break\n    *line_break\n    \"Yes,\" it says, and there is something in the way it says it — you would swear there was something in the way it says it.\n    *set charity %+20\n    *goto counted\n\n*label counted\n\n*page_break\n\nThere are three.\n\n*page_break\n\nOne of them does nearly all the work. It has been on this boy since a delivery room in 1975 and it is patient and it is competent and it is not stupid at all. The other two are barely engaged; they turn up, say something in a different voice, and go away again, and their entire function is to make the first one look like an organisation.\n\n*achieve counted\n\n*page_break\n\nNone of them is Asmodeus. None of them is Belphegor either. None of them has been entitled to any name for a very long time, which is why they keep borrowing the big ones.\n\n*page_break\n\n*choice\n  #\"Three. Three of them. Against you.\"\n    \"It is not a numbers problem,\" your angel says. \"It was never a numbers problem. I could have counted them in 1975 if I had thought to.\"\n    *line_break\n    *line_break\n    \"Then what was it?\"\n    *line_break\n    *line_break\n    \"It was that I was impressed,\" it says.\n    *set severity %+15\n    *goto legion_end\n\n  #\"Does knowing help?\"\n    \"No,\" it says. \"Not directly. I cannot beat them with a number. They are still going to be standing on things I want and they are still going to be there first.\"\n    *line_break\n    *line_break\n    \"Then what's the point?\"\n    *line_break\n    *line_break\n    \"I will stop being impressed,\" it says. \"You would be surprised how much of it that was.\"\n    *set charity %+15\n    *set hope %+10\n    *goto legion_end\n\n  #Say it out loud to them. Let them know you know.\n    You have your angel say it, once, plainly, to the air on Semple Street: *there are three of you.*\n    *line_break\n    *line_break\n    Nothing happens. Nobody answers. Nothing changes for about eleven years.\n    *line_break\n    *line_break\n    And in 2005, in a kitchen, on the worst afternoon of this whole business, one of them is going to be a fraction slower than it should be, and you will never be able to prove that this is why.\n    *set splendor %+25\n    *set valor %+15\n    *goto legion_end\n\n  #Nothing. Get back to the boy.\n    You have burned four months of a nineteen-year-old's life on a filing cabinet.\n    *set valor %-15\n    *set hope %-5\n    *goto legion_end\n\n*label legion_end\n\n*page_break\n\n\"They make it complicated,\" you say. \"That's all it is. That's the whole trade.\"\n\n\"Yes.\"\n\n\"And the true thing is always —\"\n\n\"Small,\" your angel says. \"The true thing is always small. It does not get bigger when they talk over it and it does not get smaller either. That is most of what you need to know about them and you have worked it out in four months, and I would like you to remember, in about two years, that you worked it out.\"\n\n*finish\n", "whathedoesnttell": "*comment ============================================================\n*comment SCENE EIGHT — WHAT HE DOESN'T TELL HER\n*comment 1996–97, ages 21–22. ~2,300 words, 14 choices.\n*comment Job: the hinge. Everything before is setup, everything after\n*comment is consequence. Loretta's second misjudgment, inverted: she\n*comment thinks the concealment is the small part.\n*comment ============================================================\n\n*comment ---- 8.1 : the scale changes ----\n\nIn the autumn of 1996 a modem goes into the apartment on Semple Street.\n\nIt is for the four of them and it costs nineteen dollars a month and it makes a noise like a small animal being posted somewhere.\n\n*page_break\n\nHere is how this scene is going to be told, and it is not squeamishness, it is the shape of the thing:\n\nYou cannot see him.\n\nNot for any of it. Not once. The dark comes down the way it came down in 1989 and it comes down more often now, and what you get is what is left over — the hours, and the light under a door, and what a room looks like at four in the morning, and a young man who used to be on a roof by six and is now getting up at eleven.\n\n*set_ward sight \"dark\"\n\n*page_break\n\nYou know the shape of it from outside, the way you know weather from inside a house.\n\nIt is not the same as 1989. In 1989 it took effort — it took a magazine somebody's brother had, it took going somewhere, it took being a person who had done something. The effort was part of the machinery: he had to decide, each time, to be that.\n\nThere is no effort now. That is the entire difference and it is not a small one.\n\n*page_break\n\n*comment ---- 8.2 : she nearly finds out ----\n\nRenee Sobek is twenty-one and doing her clinicals at Shadyside and is at the apartment three or four nights a week.\n\nIn February she comes in early, and she asks him something completely ordinary, and there is a pause before he answers that is about a quarter of a second too long.\n\n*page_break\n\nShe does not find out.\n\nThat is what you have to hold on to here. She comes within about a foot of it and she does not get there. What she gets is the pause.\n\nAnd she notices the pause and not the reason for it, and she files it, the way people do, in the place where you keep things that do not fit and cannot be asked about.\n\n*set_ward sight \"clear\"\n\n*page_break\n\n*choice\n  #Arrange for him to tell her.\n    You spend three weeks on it. You clear the apartment, you get them both fed, you get the television broken, you put them in a room with two chairs and nothing to do.\n    *line_break\n    *line_break\n    And on the ninth of March, 1996, Adam Kowalczyk tells Renee Sobek the truth about the last seven years.\n    *line_break\n    *line_break\n    It goes badly.\n    *line_break\n    *line_break\n    She is twenty-one. She has no framework for it — nobody has given her one either — and what she does is cry, and then get angry, and then apologise for getting angry, which is worse, and then ask him a series of questions that are exactly the wrong questions.\n    *line_break\n    *line_break\n    They do not break up. It costs them about eight months and it very nearly does.\n    *line_break\n    *line_break\n    \"That was terrible,\" you say. \"That was worse than not telling her.\"\n    *line_break\n    *line_break\n    \"No,\" your angel says.\n    *set charity %+25\n    *set valor %+15\n    *set hope %+10\n    *set_ward needle 3\n    *goto told\n\n  #Arrange for her to find out.\n    You do not make him say it. You make her see it, in April, in a way that cannot be walked back.\n    *line_break\n    *line_break\n    It is much faster and it is much worse, and the difference between a man telling you a thing and a woman discovering it is a difference she is going to feel for the rest of her life.\n    *line_break\n    *line_break\n    They do not break up either. But she is now a person who found out, and he is now a person who was caught, and neither of those is a thing you can put back.\n    *set severity %+25\n    *set_hidden overreach 4\n    *goto told\n\n  #Let him keep it.\n    You let him keep it. It is not even a decision, particularly; you simply do not do anything, and the moment goes past, and by April it is not a moment any more.\n    *line_break\n    *line_break\n    And something else starts.\n    *set valor %-20\n    *goto kept\n\n  #Ask her angel what it wants.\n    It is in the doorway. It has been in the doorway since 1985.\n    *line_break\n    *line_break\n    You ask, and it hands the answer over whole and without softening, and the answer is: *I want her told, and I want her told by him, and I want it tonight, and I have wanted it since February, and I cannot do it, and neither can you unless you decide to.*\n    *line_break\n    *line_break\n    \"You've been standing there the whole time.\"\n    *line_break\n    *line_break\n    *It has been eleven years,* it says.\n    *set charity %+20\n    *set severity %+10\n    *goto choose_again\n\n*label choose_again\n\n*page_break\n\nNow choose.\n\n*choice\n  #Tell him. Get him to tell her tonight.\n    *set charity %+25\n    *set valor %+15\n    *set hope %+10\n    *goto told\n\n  #Still no.\n    *set valor %-25\n    *set hope %-10\n    *goto kept\n\n*label told\n\n*page_break\n\n*comment ---- the road that is not a magic fix ----\n\nHere is what telling her does and does not do.\n\nIt does not fix him. He does not stop. He stops for eleven weeks and then he does not stop, and she knows about it now, which is its own kind of grinding for both of them.\n\nIt does not make her wise. She is twenty-one and she handles it imperfectly, sometimes badly, and there are three or four things she says in 1996 that she would give a year of her life to take back.\n\n*page_break\n\nWhat it does is this.\n\nHe remains, to himself, one person.\n\nThere is no second man in the apartment on Semple Street. There is no room in him with a different Adam in it. Everything he does is done by somebody who is known, by at least one other human being, to be doing it — and a thing that is known is a thing that can still be talked about, and a thing that can be talked about is not yet a room with a door on it.\n\nThat is all it buys. It is a small thing and it costs an enormous amount and the game is not going to pretend otherwise.\n\n*goto eight_end\n\n*label kept\n\n*page_break\n\n*comment ---- 8.3 : what concealment actually does ----\n\nHe keeps it, and here is what you expect: distance.\n\nThat is what you expect because that is what everybody expects. He will pull back. There will be less of him in the room. He will be somewhere else while he is standing there.\n\n*page_break\n\nThat is not what happens.\n\nWhat happens is a *hierarchy.*\n\n*page_break\n\nHe knows something she does not.\n\nHe has looked at what people actually are, in the middle of the night, at close range, and she has not. He is honest with himself about the world; she lives in something comfortable that he is protecting her from. He is *free*, in a way that is slightly sad and slightly heroic, and she is naive, in a way that is sweet and requires managing.\n\nHe would be appalled if you said any of this to him. He does not think it in words. Not once, not ever.\n\n*page_break\n\nAnd every week he does not tell her, that gap gets a little wider, and something moves in to fill it.\n\n*page_break\n\n*comment ---- Loretta's misjudgment, inverted ----\n\n\"That's not the worst part, though,\" you say. \"Whatever else — that's not the *worst* part. He's twenty-one. Half the men I ever knew were doing something like that at twenty-one and most of them turned out fine.\"\n\nYour angel does not say anything.\n\n\"What.\"\n\n\"You have the two of them the wrong way round.\"\n\n*page_break\n\n\"I'm sorry?\"\n\n\"You have spent seven years appalled at what he does at four in the morning,\" it says, \"and comfortable about what he does at the kitchen table. And I have spent seven years unable to tell you how much of the first one he is answerable for.\"\n\n\"And the second?\"\n\n\"He is answerable for the second. All of it. Every week. He is twenty-one years old and he is entirely awake and he knows precisely what he is choosing and he chooses it again on Tuesday.\"\n\n*page_break\n\n\"It's just *not telling her something.*\"\n\n\"It is deciding, once a week for two years, that a person he loves is a lesser kind of creature than he is,\" your angel says. \"There is a word for that and it is not one of the words you were watching for. You were watching for the one they warn girls about in 1965.\"\n\n*page_break\n\n*choice\n  #\"You're saying this is worse.\"\n    \"I am saying that this is the one I can see, and that what I can see of it is bad, and that you have not looked at it once.\"\n    *set severity %+20\n    *set charity %+10\n    *goto contempt\n\n  #\"Then why didn't you say something?\"\n    \"You did not ask,\" it says. \"You asked about the nights.\"\n    *line_break\n    *line_break\n    And that is fair, and you hate that it is fair.\n    *set severity %+10\n    *set hope %-10\n    *goto contempt\n\n  #\"I've been getting this wrong the whole time.\"\n    \"You have been getting one half of it right with great vigilance,\" your angel says, \"which is what most people do, and which is why the other half gets so much room.\"\n    *set charity %+20\n    *set hope %-5\n    *goto contempt\n\n*label contempt\n\n*page_break\n\nNobody in this story ever uses the word contempt.\n\nWhat happens instead is that he starts finishing her sentences. He starts explaining things to her that she already knows and knew first. He becomes patient with her in a way that is not kindness and that she cannot object to, because how do you object to somebody being patient.\n\n*goto eight_end\n\n*label eight_end\n\n*page_break\n\n*comment ---- 8.4 : the kitchen table. 1997 ----\n\nSemple Street, a Thursday in October 1997, about nine at night. There is a kitchen table with a burn on it from before either of them lived there.\n\nShe says: \"What's wrong?\"\n\nHe says: \"Nothing's wrong.\"\n\n*page_break\n\nAnd he is telling the truth.\n\nThat is the thing to sit with. Whatever he has or has not told her, at this table, at nine o'clock, when he is asked directly, he is not conscious of concealing anything. Nothing feels wrong to him. He has a girlfriend he has known since he was nine and an apartment and a degree coming and there is genuinely nothing he could name.\n\nShe can see there is. She has been able to see it since February of 1996.\n\nAnd she is twenty-two and she is a coward about exactly one thing in her whole life, which is conflict, and she has asked once, and he has said nothing's wrong, and she lets it go.\n\n*page_break\n\nShe will think about that for twenty years.\n\n*page_break\n\nThere are two angels in this kitchen. They have been within eleven feet of each other for twelve years. Neither of them can say a word to either of these people and both of them can see the whole thing, and the table is four feet across.\n\n*page_break\n\n*choice\n  #\"Make her ask again.\"\n    You cannot make her do anything. What you can do is arrange, and what you arrange is that the phone does not ring and the roommate does not come home and there is nothing else in the room to look at.\n    *line_break\n    *line_break\n    She asks again.\n    *line_break\n    *line_break\n    He says: \"I'm tired.\"\n    *line_break\n    *line_break\n    And that is also true.\n    *set valor %+20\n    *set charity %+15\n    *goto table_end\n\n  #\"Make him look at her.\"\n    He looks at her. He looks at her for about three seconds longer than the conversation requires, and something crosses his face, and he does not have a name for it.\n    *line_break\n    *line_break\n    In 2017, at two in the morning, at a kitchen table in a different apartment, he is going to remember those three seconds without any warning at all and have to put a cup down.\n    *set charity %+25\n    *set splendor %-15\n    *goto table_end\n\n  #Nothing. Watch it.\n    You watch it. Both of you watch it. It takes four minutes and then she puts the kettle on.\n    *set valor %-25\n    *set hope %-15\n    *goto table_end\n\n  #\"Is this it? Is this the important part?\"\n    \"Yes,\" your angel says.\n    *line_break\n    *line_break\n    \"This? A kitchen? *This* is the —\"\n    *line_break\n    *line_break\n    \"If you had understood nothing else in twenty-two years,\" it says, \"and you understood this table, you would have understood the thing.\"\n    *set charity %+20\n    *set hope %+5\n    *goto table_end\n\n*label table_end\n\n*page_break\n\nShe puts the kettle on.\n\nHe goes and turns the television on in the other room, and she stands in the kitchen with her hand on the counter for a moment before she follows him, and that is the whole of it, and neither of them ever refers to it again.\n\n*finish\n", "permissionslip": "*comment ============================================================\n*comment SCENE NINE — THE PERMISSION SLIP\n*comment 1997–98, ages 22–23. ~1,700 words, 10 choices.\n*comment Job: he does not read his way into contempt. He is already\n*comment contemptuous and goes looking for something that dignifies it.\n*comment The philosopher is never named.\n*comment ============================================================\n\n*comment ---- 9.1 : forty seconds in a bar ----\n\nThere is a bar on Forbes with a shuffleboard table nobody uses and it is the second week of November, 1997.\n\nAdam is there with three other people, one of whom he half knows, and one of whom is a graduate student in something, twenty-six, teaching two sections of an introductory course and holding forth about it, three drinks in.\n\nHe is not a bad man. He is not even wrong about most of what he says. He is twenty-six and he has just been given an idea to hold and he is holding it the way you hold a new tool, turning it over, showing it to people.\n\n*page_break\n\nAnd at some point in the evening he says a sentence.\n\nIt is about Christian morality. It is roughly that the whole apparatus was put together by people who could not do anything and needed a reason why not doing it was better — that what gets called virtue is very often just an inability with a flag stuck in it.\n\nHe says it as an aside. He is not making an argument; he is repeating one, and he is repeating it slightly wrong, and he will not think about it again after Thursday.\n\n*page_break\n\nAdam Kowalczyk is twenty-two years old and is not, and never becomes, an intellectual.\n\nHe does not read the book. He never reads the book. He could not tell you the name of the man who wrote it and by 2003 he could not tell you the name of the graduate student either.\n\n*page_break\n\nWhat he takes home is the *sentence.*\n\nAnd the sentence fits — not into an argument, because he does not have one, but into a shape that has been sitting empty in him since about April of 1996, waiting for exactly this size of thing.\n\n*page_break\n\n*comment ---- what she can see, and what it costs to see it ----\n\n\"He didn't even —\" you say. \"He wasn't *convinced* of anything. He was standing next to a man with a beer.\"\n\n\"No.\"\n\n\"That's it? That's the whole conversion? A *pub*?\"\n\n\"He was not converted,\" your angel says. \"Nothing about him changed on the ninth of November. He has believed the substance of that sentence since he was twenty-one and could not say it out loud, because when you say it out loud without a philosopher behind it, it sounds like what it is.\"\n\n*page_break\n\n\"Which is what?\"\n\n\"*I am better than the people who do not do what I do.*\"\n\n*page_break\n\nYou think about that for a while, standing in a bar on Forbes Avenue in 1997.\n\n\"That's it,\" you say. \"That's the whole of the thing you told me about at the kitchen table.\"\n\n\"Yes.\"\n\n\"He got the contempt first and the reason afterwards.\"\n\n\"Two years afterwards,\" your angel says. \"Nearly to the week.\"\n\n*page_break\n\n*choice\n  #\"Get him out of this bar.\"\n    You get him out. He leaves at eleven with a headache.\n    *line_break\n    *line_break\n    Two years later a television programme says roughly the same thing, better, at nine o'clock on a Tuesday, to a man sitting alone on a sofa. And in 2003 a coworker says a cruder version of it in a break room. And in 2007 it comes at him from four directions in one year and by then it is simply the water.\n    *line_break\n    *line_break\n    \"You cannot take him out of a country,\" your angel says.\n    *set valor %+20\n    *set hope %-10\n    *goto slip_two\n\n  #\"Can we argue with it?\"\n    \"With what? He has not made a claim. He has acquired a posture.\"\n    *line_break\n    *line_break\n    \"So we can't —\"\n    *line_break\n    *line_break\n    \"You cannot refute a posture,\" it says. \"You can only outlast one, and I would like you to hear how long that sentence is.\"\n    *set severity %+15\n    *goto slip_two\n\n  #\"Is any of it true?\"\n    You did not expect to ask that. It comes out anyway.\n    *line_break\n    *line_break\n    \"Some of it describes something real,\" your angel says, without any hesitation at all. \"There are people who call their limits virtues. You have met several. One of them ran the September festival.\"\n    *line_break\n    *line_break\n    \"So the man in the bar —\"\n    *line_break\n    *line_break\n    \"Has correctly identified a thing that exists, and has drawn from it a conclusion about the whole world, and that second part is where it goes wrong, and nobody in that bar is going to say so, including me, because it is not my office and I have no mouth.\"\n    *set charity %+20\n    *set hope %+5\n    *goto slip_two\n\n*label slip_two\n\n*page_break\n\n*comment ---- 9.2 : what Legion does with it ----\n\nAnd here is the part that takes you a while to notice.\n\nThey do almost nothing.\n\n*page_break\n\nThey did not put the graduate student in the bar. They did not write the book, or the television programme, or the thing the coworker said in 2003. They did not construct one sentence of the argument and they could not have; they are not clever enough and they never were.\n\nWhat they have done, since 1975, is one thing, patiently, over and over, in the dark, at four in the morning, and they have let a young man build every single other part of it himself.\n\n*page_break\n\n\"That's not fair,\" you say. \"That's — he's *building his own*.\"\n\n\"Yes.\"\n\n\"They're barely *doing* anything.\"\n\n\"They have never had to do very much,\" your angel says. \"That is the thing about them that nobody believes until they have watched it for twenty years.\"\n\n*page_break\n\n*comment ---- 9.3 : the breakup. 1998, age twenty-three ----\n\nHe ends it in June.\n\nHe does it cleanly. He does it in a car outside her mother's house on a Sunday afternoon, and he is not cruel, and he does not lie, and he does not drag it out, and he says several things that are true.\n\nHe says that he is not the person she thinks. He says that she deserves somebody who is actually there. He says that stringing her along would be worse and that he is not going to do that to her.\n\n*page_break\n\nAnd for the rest of his life — for the next twenty-six years, in three apartments and two other relationships — this is going to be the thing Adam Kowalczyk tells himself when he needs to feel like a decent man.\n\n*I told her the truth. It cost me everything and I told her the truth.*\n\n*page_break\n\nRenee Sobek is twenty-three years old and has known him since she was nine and she sits in a car outside her mother's house and cannot work out what she is being told or why it is happening today.\n\n*page_break\n\n*comment ---- and the machine does not make a sound ----\n\nAnd now look at the panel.\n\nLook at the boy who went to confession four Saturdays running in 1990 because he was not sure he had said it properly. Look at the boy who pointed at the floor forty times a day for four years so that an accident would not go on a list.\n\n*page_break\n\nNothing. Not one thing. Not that afternoon, not that week, not once in twenty-six years.\n\n*page_break\n\n\"He feels *fine*,\" you say. \"He feels — my God, he feels *good* about it.\"\n\n\"Yes.\"\n\n\"After all that. After four years of grinding himself into powder over —\"\n\n\"Over something he did not choose and may not be answerable for,\" your angel says. \"And nothing at all over this, which he chose entirely, in a car, in the afternoon, awake.\"\n\n*page_break\n\n\"It's broken,\" you say. \"The whole thing in him is broken.\"\n\n\"It is not broken. It was bent, when he was nine, in a direction, and it has been very loud ever since about the things it was bent toward and silent about everything else.\" A pause. \"You have been calling it a conscience. It is closer to a compass with a magnet next to it.\"\n\n*page_break\n\n*choice\n  #\"Then it's not his fault.\"\n    \"Some of it is not. Some of it is entirely his and it is the part he feels best about.\" Your angel does not soften it. \"That is the shape of nearly everybody, ${name}. You are not looking at anything unusual. You are looking at a man.\"\n    *set severity %+15\n    *set charity %+10\n    *goto breakup_end\n\n  #\"Can we fix a conscience?\"\n    \"Not from out here. It gets straightened by another person, over time, saying true things kindly, and being believed.\" A pause. \"There is a man who will do it in 2018 and it will take him ninety seconds and he will never know he did it.\"\n    *line_break\n    *line_break\n    \"*Twenty years.*\"\n    *line_break\n    *line_break\n    \"Twenty years,\" it agrees.\n    *set hope %-10\n    *set charity %+15\n    *goto breakup_end\n\n  #Look at Renee.\n    She goes inside. Her mother is out. She does not cry for about forty minutes and then she does, in a bathroom, with the taps on, which is a thing she learned to do in her father's house.\n    *line_break\n    *line_break\n    Her angel is in there with her, and it has been in there with her since 1975, and it is doing something you cannot see and would not be able to describe if you could.\n
