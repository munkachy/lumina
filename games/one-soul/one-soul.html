  *set charity %+25\n    *set hope %-5\n    *goto breakup_end\n\n*label breakup_end\n\n*page_break\n\n*comment ---- 9.4 : her angel goes ----\n\nIn September she takes a post in Columbus, because a friend from the programme is going and because there is nothing keeping her in Pittsburgh, and that second part is new.\n\nHer angel goes with her. Obviously. That is where she is.\n\n*page_break\n\nIt stops in a doorway on the way out — the same doorway, on Dobson Street, where the two of them stood in 1985 and nodded and said nothing for four years.\n\nAnd it hands one thing over.\n\n*page_break\n\nIt is not an accusation. That is what undoes you. There is nothing in it of blame at all — it is simply the fact, handed over entire, the way they do, and it is:\n\n*line_break\n*line_break\n*She would have stayed.*\n*line_break\n*line_break\n\n*page_break\n\n*choice\n  #\"I know.\"\n    You know. You have known since the ninth of March, 1996.\n    *set severity %+10\n    *set hope %-15\n    *goto gone\n\n  #\"So would we.\"\n    Your angel says it for you and the other angel receives it and there is a moment there — you will never be sure of this and you will think about it for twenty-six years — where something passes between the two of them that is not information.\n    *set charity %+25\n    *set hope %+10\n    *goto gone\n\n  #\"Tell it I'm sorry.\"\n    \"It knows,\" your angel says. \"It knew before you did. It cannot be lied to and it cannot be apologised to either, not usefully, because it already has the whole of it.\"\n    *line_break\n    *line_break\n    \"Tell it anyway.\"\n    *line_break\n    *line_break\n    Your angel tells it anyway.\n    *set charity %+20\n    *set splendor %-10\n    *goto gone\n\n  #Say nothing.\n    You say nothing. The other angel waits a moment, which it did not have to do, and then it goes.\n    *set valor %-20\n    *set hope %-10\n    *goto gone\n\n*label gone\n\n*page_break\n\nAnd then there is one angel on Dobson Street instead of two, and there has been one angel on Dobson Street instead of two for twenty-six years, and the roof is empty because the last of the birds went in 1994.\n\n*finish\n", "longmiddle": "*comment ============================================================\n*comment SCENE TEN — THE LONG MIDDLE\n*comment 1999–2016, ages 24–41. ~1,700 words, 12 choices.\n*comment Job: seventeen years in twelve fast decisions. The pace should\n*comment feel like a life going past. Wilkinsburg. The unexplained\n*comment number. And years where there is genuinely nothing to do.\n*comment ============================================================\n\n*comment ---- 10.1 : the number that should not be there ----\n\nPrayers has been at nothing since February 1986.\n\nExcept that it has not. Since the third week of November 1993 there has been a one sitting in the corner of the panel, small and steady and completely unexplained, and it has not moved in six years, and nothing in the world accounts for it.\n\n*page_break\n\n\"What is that.\"\n\n\"I am not going to tell you.\"\n\n\"You are *not going to tell me?*\"\n\n\"No.\"\n\n*page_break\n\n\"Is it Renee?\"\n\n\"No.\"\n\n\"Is it his mother?\"\n\n\"No.\"\n\n\"Is it —\" and you go through everybody you can think of, and it is none of them, and after a while you stop, and it sits there at one for another seventeen years.\n\n*page_break\n\n*comment ---- 10.2 : Wilkinsburg. 2001, age twenty-six ----\n\nA man at work called Curtis Hale invites him to a service in Wilkinsburg on a Sunday in March 2001, in the way people do — three times, casually, over five months, with no pressure and no follow-up when he says no.\n\nThe fourth time Adam says yes because he has nothing on.\n\n*page_break\n\nThe building used to be a bank. There are two hundred people in it and they are pleased to see each other in a way that is not performed. Somebody's grandmother makes him sit down and puts a bulletin in his hand. The music goes on considerably longer than he expects and about eight minutes into it he stops looking at his watch.\n\nNobody has an angle. That is the thing he cannot get past afterwards. He came in braced for one and there is not one.\n\n*page_break\n\nAt the end they pray for people by name, out loud, and Curtis puts a hand on his shoulder without asking and says his name into a room of two hundred strangers, and about forty of them say it back.\n\n*set_ward prayers 4\n\n*page_break\n\nThe number moves.\n\nThere is no asterisk on it. Nothing in the text remarks on it. It simply goes from one to four and stays there for about nine months and then slowly comes back down as people who met a man once stop remembering to.\n\n*page_break\n\n*choice\n  #\"That counts?\"\n    \"Yes.\"\n    *line_break\n    *line_break\n    You wait for the rest of it, because you were raised in the 1950s in the Hill District and you are waiting for the rest of it.\n    *line_break\n    *line_break\n    \"That is the rest of it,\" your angel says.\n    *set charity %+20\n    *set hope %+15\n    *goto wilkinsburg\n\n  #Say nothing and watch the number.\n    You watch the number.\n    *set charity %+10\n    *set hope %+10\n    *goto wilkinsburg\n\n  #\"They've got half of it wrong in there.\"\n    \"Some of them have some of it wrong. So did your grandmother, and so do you, and so did the woman who taught you in 1961.\" A pause. \"That is a different conversation and it is a real one and it is not this afternoon's.\"\n    *set severity %+15\n    *goto wilkinsburg\n\n*label wilkinsburg\n\n*page_break\n\n*comment ---- and the room is split ----\n\nAfterwards there is coffee, and two men talk to him about the same subject within twenty minutes of each other, and they are on opposite sides of it, and both of them are trying to help.\n\n*page_break\n\nThe first is about sixty and takes it with total seriousness. He speaks about it in terms more frightening than anything Adam has ever heard in a Catholic building — genuinely frightening, in a way that is meant kindly and lands like a hand on the back of the neck. He is not a fanatic. He has a daughter and a bad knee and he is trying to save somebody's life.\n\nThe second is about thirty-five and warm and slightly puzzled that anybody still worries. He says something reassuring and general and means every word of it, and it costs Adam nothing at all to hear, and it is worth exactly what it cost.\n\n*page_break\n\nAdam Kowalczyk goes home with no category for either of them.\n\nHe does not go back. Curtis asks twice more and then stops asking, and they are friendly at work for another six years.\n\n*page_break\n\n*choice\n  #\"Which of those two was right?\"\n    \"Neither of them said the true thing,\" your angel says. \"One of them said a true thing too loudly to a man who was already deaf in that ear. The other said a comfortable thing that was not true.\"\n    *line_break\n    *line_break\n    \"So what was the difference between that room and St. Casimir?\"\n    *line_break\n    *line_break\n    \"About four hundred yards and a great deal of history,\" it says. \"And nothing whatever, this afternoon, on this question. Nobody in either building said it in a way he could use. That has been the whole problem since 1990 and it is not about which building.\"\n    *set charity %+20\n    *set hope %+5\n    *goto middle\n\n  #\"Get him back there next week.\"\n    You try. You spend three months on it. Curtis asks twice more and Adam is genuinely busy the first time and genuinely not the second.\n    *set valor %+20\n    *set hope %-5\n    *goto middle\n\n  #Nothing. It was a Sunday.\n    It was a Sunday. He got up, he went somewhere, some people prayed for him by name, and a number moved.\n    *set valor %-15\n    *set charity %+10\n    *goto middle\n\n*label middle\n\n*page_break\n\n*comment ---- 10.3 : two of them, the same way ----\n\nNicole, 2001 to 2005. Then a long stretch of nothing much. Then Amanda, 2008 to 2013.\n\nThey end the same way and it is not for one reason.\n\n*page_break\n\nThat is what you have to be careful about here, and you get it wrong twice before you get it right.\n\nChastity is at the root of it — you can see the root, you have been looking at the root since 1988 — but a root is not a tree. What is above ground by 2005 is a whole system: the avoidance, the drinking that is two more than he says it is, the work that is not really work but an alibi with a desk, the habit of leaving a room, and eventually the habit of leaving before anybody can leave first.\n\n*page_break\n\nHe can name the pattern by Amanda. He does name it, out loud, once, in 2012, in a car, to Amanda, accurately.\n\nAnd then he does nothing about it, because naming a pattern feels enough like dealing with one to be going on with.\n\n*page_break\n\n*choice\n  #\"He knows. He said it out loud. He *knows.*\"\n    \"Yes.\"\n    *line_break\n    *line_break\n    \"So how does he —\"\n    *line_break\n    *line_break\n    \"Knowing has never been the difficult part,\" your angel says. \"You have known about a stairlift since 2019.\"\n    *line_break\n    *line_break\n    You do not speak to it for about a week.\n    *set severity %+20\n    *set hope %-10\n    *goto seventh\n\n  #\"It's not just the one thing any more.\"\n    \"No. It has not been the one thing since about 1999. It is a way of standing that grew up around one thing and then stopped needing it.\"\n    *set charity %+15\n    *goto seventh\n\n  #Work on Amanda instead.\n    You spend two years on a woman who is not your commission and about whom you know almost nothing, because she is in the room and she is going to be hurt and nobody else appears to be doing anything.\n    *line_break\n    *line_break\n    \"She has her own,\" your angel reminds you.\n    *line_break\n    *line_break\n    \"Then it can have the night off.\"\n    *set charity %+25\n    *set_hidden overreach 5\n    *goto seventh\n\n*label seventh\n\n*page_break\n\n*comment ---- 10.4 : 2007 ----\n\nIn 2007 a crowd shows up.\n\nThere are books in the airport shops and a documentary and three people at work who have opinions now, and for about two years Adam Kowalczyk feels genuinely, physically lighter.\n\n*page_break\n\nAnd here is what that is about, and it is not argument.\n\nHe has believed all of this since he was eighteen. Nothing he encounters in 2007 tells him one thing he had not already decided on a bus in February of 1993.\n\nWhat is new is that there are *other people*, in numbers, saying it out loud, in public, with charts. He has been carrying it privately for fourteen years and now he is not carrying it, and the relief of that is enormous and has nothing whatever to do with whether any of it is true.\n\n*page_break\n\n\"He was lonely,\" you say.\n\n\"He was lonely,\" your angel agrees.\n\n\"That's all it was. Fourteen years of it and it was just —\"\n\n\"It was mostly that. There is an argument in there too and it is not a bad one. But you have put your finger on the load-bearing part.\"\n\n*page_break\n\n*comment ---- 10.5 : nothing to do ----\n\nAnd then there are the years where there is nothing.\n\n*page_break\n\n2009. 2010. 2011. Whole years where you go looking for something to spend your angel on and there is not one thing. He gets up, he goes to a job he does not mind, he comes home, he watches something, he goes to bed. He is not in danger. He is not in grace either, particularly. He is thirty-five years old and nothing is happening to him at all.\n\n*page_break\n\nYou find this much harder than 1989.\n\n*choice\n  #Push. There must be something.\n    There is not. You spend eleven months looking for a lever in a life that does not have one, and at the end of it a man is thirty-six instead of thirty-five.\n    *line_break\n    *line_break\n    \"You are not failing,\" your angel says, eventually. \"There is a difference between failing and attending and you are going to have to learn it, because most of this office is the second one.\"\n yet.\n\nHe does it alone over two weekends, badly, in the way people do — three hours on a shelf of nothing and then a whole room in forty minutes.\n\nAnd in the second drawer of a bureau, under a box of screws, there is a spiral notebook that was bought at a drugstore on Liberty Avenue for fifty-nine cents.\n\n*page_break\n\nHe opens it standing up.\n\n*page_break\n\nThere is one word at the top of the first page, in pencil, and the word is his own name.\n\nAnd under it there is a date — 21.11.93 — and then another date, and another, in a column, in a hand that gets worse as it goes down the page and then worse again on the next page and worse again for two hundred and eighty-three pages, and the last date is the fourth of March, 2016, seven days before he died, in handwriting you can barely read.\n\nTwenty-three years. Every single day. And not one word of comment anywhere in it. Just the name at the top and the dates going down.\n\n*page_break\n\n*set_ward prayers 0\n\nThe number goes to nothing.\n\nIn the same second that you finally understand what it was.\n\n*page_break\n\nAdam Kowalczyk sits down on the floor of his father's bedroom with a notebook in his hands and does not get up for about twenty minutes.\n\n*page_break\n\n*choice\n  #Say nothing. Let him have it.\n    You say nothing. Neither does your angel. There is a man on a floor in Polish Hill and there is nothing in this or any other world that needs to be added to it.\n    *set charity %+25\n    *set splendor %-20\n    *set hope %+15\n    *goto drawer_two\n\n  #\"You knew. You knew for twenty-three years and you wouldn't tell me.\"\n    \"You would have spent them differently,\" your angel says.\n    *line_break\n    *line_break\n    \"*Yes.* That's my — yes, I would have —\"\n    *line_break\n    *line_break\n    \"You would have spent them leaning on a seventy-year-old man to say something out loud that he was never going to say out loud, and he would have stopped writing it down.\"\n    *line_break\n    *line_break\n    You do not have an answer to that. You have not had an answer to that in the eight years since.\n    *set severity %+20\n    *set hope %+10\n    *goto drawer_two\n\n  #\"Twenty-three years and he never said a word.\"\n    \"No.\"\n    *line_break\n    *line_break\n    \"Not one word. To his own son. He couldn't say nine words in a *car* —\"\n    *line_break\n    *line_break\n    \"He said this,\" your angel says. \"Two hundred and eighty-three pages of it. He said it every day for twenty-three years in the only language he was ever given, and his son is holding the whole of it, and it is going to work.\"\n    *set charity %+20\n    *set hope %+20\n    *goto drawer_two\n\n*label drawer_two\n\n*page_break\n\nThis is the bottom.\n\nNot a catastrophe. Nothing has been taken from him that he was using. He has not been punished for anything and nothing has caught up with him and there is no bill.\n\nWhat has happened is that a man of forty-one has found out that he was loved, specifically and daily and at cost, for twenty-three years, by somebody who is now dead and cannot be told anything.\n\n*page_break\n\n*comment ---- 11.2 : EIGHTEEN MONTHS OF CHECKING. 2017–18 ----\n\nIt does not begin as anything.\n\nIn the autumn of 2016 he starts reading at night, mostly because he is not sleeping, and mostly things that are not about this at all. In February of 2017 he reads something that annoys him, and in looking up why it annoys him he finds something that annoys him more.\n\nHe is not searching. He is a forty-two-year-old man who is *checking* — the way you check a bill you are fairly sure is right.\n\n*page_break\n\nHe expects to find the flaw in about a week. He has known where it is since he was eighteen.\n\nIt is not there.\n\n*page_break\n\nThat is the whole of 2017. A man at a kitchen table at two in the morning, mildly irritated, going back a second time to a place where the flaw was definitely supposed to be.\n\n*page_break\n\n*comment ---- what she has been saving ----\n\nEverything you have ever done is available to you now, and this is the one place in forty-three years where a whole game of arranging is going to pay or not.\n\n*choice\n  #Curtis Hale.\n    You have kept a man in his life since 2001 for no reason you could have named at the time. Curtis is sixty-six now and retired to Penn Hills and they have lunch four times a year for no particular reason.\n    *line_break\n    *line_break\n    In June of 2017 Curtis says something at a table in a diner in Verona — not about any of this; about his wife, and about a stretch in the nineties when he was not a good man — and it is the first time in Adam Kowalczyk's adult life that somebody has told him a true thing about themselves without wanting anything.\n    *line_break\n    *line_break\n    It does more than the reading does.\n    *set charity %+25\n    *set hope %+20\n    *goto checking_two\n\n  #The book on the shelf.\n    *if (splendor < 45)\n      It is still there. It went from Dobson Street to Semple Street to Bloomfield in a box that was never unpacked properly, and it is on a shelf, and in October of 2017 at two in the morning a man takes it down because he has run out of other things.\n      *line_break\n      *line_break\n      Twenty-four years on a shelf. You felt like a fool for twenty-four years.\n      *set hope %+20\n      *set charity %+15\n      *goto checking_two\n    *else\n      There is no book. You did not put one there in 1993 and there is nothing on the shelf now but a box of screws he took from his father's house.\n      *line_break\n      *line_break\n      He gets there anyway, more slowly, from the library on Liberty.\n      *set hope %+5\n      *goto checking_two\n\n  #The miracles.\n    He is an evidential man. He always was; it is why the argument on the bus worked on him in four seconds. So you put in front of him the thing that is, at bottom, a report of an investigation — tissue, a laboratory, a date, a place, men who did not want the result they got.\n    *line_break\n    *line_break\n    It does not convert him. It is not that kind of thing and the game is not going to pretend it is. What it does is make him unable to hold the sentence *nobody has ever checked*, which he has been holding since 1993 without ever examining it.\n    *set severity %+15\n    *set hope %+15\n    *goto checking_two\n\n  #Renee.\n    She is in Columbus. She is married, three children, the eldest is twenty. He has not spoken to her since 1998.\n    *line_break\n    *line_break\n    You spend four months on it and in September of 2017 he writes to her. Four paragraphs. It is not about them and it does not ask for anything and it is the hardest thing he has done since the car in 1998.\n    *line_break\n    *line_break\n    She writes back in eleven days and it is longer than his and it is kind, and one line in the middle of it goes into him like a nail: *I always thought there was something you weren't telling me and I decided it was my fault for asking.*\n    *set charity %+25\n    *set hope %+15\n    *set_hidden renee_contact true\n    *goto checking_two\n\n  #Nothing. He is doing this himself.\n    You do not touch it. Not once, for eighteen months, and it is the hardest thing you have done in this entire business and there is no way to tell whether it was right.\n    *set valor %-30\n    *set charity %+25\n    *set hope %+10\n    *goto checking_two\n\n*label checking_two\n\n*page_break\n\n*comment ---- 11.3 : NINETY SECONDS. 2018, age forty-three ----\n\nThe eighth of December, 2018, a Saturday, and the line at his own parish is out into the vestibule because it is Advent, and he stands in it for eleven minutes and then he leaves.\n\nHe does not go home.\n\nHe drives to a church in Swissvale that he has no connection to whatsoever, where there is no line at all, and sits in the back for twenty minutes, and then goes in.\n\n*page_break\n\nFather Emeka Nwosu is fifty-one, from Enugu, eleven years in this diocese, filling in because the pastor is at a funeral. He has a bad back and a completely unhurried manner and he has heard everything there is.\n\n*page_break\n\n\"How long has it been?\"\n\n\"Twenty-five years.\"\n\n\"All right,\" Father Nwosu says. Not warmly and not coldly. The way you would say it about a bus.\n\n*page_break\n\nIt takes a while. It is not orderly. Somewhere in the middle of it Adam Kowalczyk says a sentence he has been carrying since he was fifteen, which is that he knows exactly what he is.\n\nAnd Father Nwosu says:\n\n*page_break\n\n*line_break\n\"No. Somebody told you what to stop doing. That is a different sentence and you have had them mixed up for a long time.\n\n\"Listen. This was never a rule. Rules are things we invent to keep people off the grass. This is a description — of what a person is, and therefore of what it costs to practise treating one as a thing. It is the same reason you do not put your hand in a fire. Nobody has ever thought the fire was oppressing them.\n\n\"And one more thing, and then I am going to give you your penance because there are people outside.\n\n\"He is not disgusted by you. He has never once in your life been disgusted by you. I want you to notice that you have believed that since you were fifteen years old and that nobody ever actually said it to you.\"\n*line_break\n\n*page_break\n\nNinety seconds.\n\nNot one word of it is new information. Every part of it was available in 1990 and in 1993 and in 2001 and at four separate points where you got him within nine feet of somebody who could have said it.\n\n*page_break\n\nHe sits in a car in Swissvale afterwards for about half an hour without turning the radio on.\n\n*if (splendor < 45)\n  *set_ward needle 4\n  And the needle moves. All the way, to the top, where it has never been.\n  *goto ninety_two\n*elseif (severity > 70)\n  *set_ward needle 3\n  And the needle does not move.\n  *line_break\n  *line_break\n  He heard it. He believed most of it. And forty-three years of being looked at severely has built something in him that hears *He is not disgusted by you* and files it under *that is what they have to say*, and the needle stays where it has been since 1993.\n  *line_break\n  *line_break\n  He goes back to Mass anyway, every week, out of something much closer to fear than to freedom. It holds. It is real. It is not the same thing.\n  *goto ninety_two\n*else\n  *set_ward needle 4\n  And the needle moves, most of the way, unevenly, the way a thing moves when it has been stuck for twenty-eight years.\n  *goto ninety_two\n\n*label ninety_two\n\n*page_break\n\n*choice\n  #\"That's it? That's all it took?\"\n    \"Ninety seconds,\" your angel says.\n    *line_break\n    *line_break\n    \"*Ninety seconds.* I have been at this since — I have watched him — and a man in Swissvale with a bad back does it in *ninety seconds* —\"\n    *line_break\n    *line_break\n    \"Yes.\"\n    *line_break\n    *line_break\n    \"Then what was I for?\"\n    *line_break\n    *line_break\n    \"You got him into the car,\" it says.\n    *set severity %+15\n    *set hope %+15\n    *goto reading\n\n  #\"Does he know what he just did?\"\n    \"No. He has four people outside and a bad back and he will not think about this again after Tuesday.\"\n    *line_break\n    *line_break\n    \"Will he ever know?\"\n    *line_break\n    *line_break\n    \"Yes,\" your angel says. \"Not here.\"\n    *set charity %+25\n    *set hope %+20\n    *goto reading\n\n  #Say nothing. Sit in the car with him.\n    You sit in the car with him for half an hour in a church lot in Swissvale in December. Nothing happens. He does not pray and he does not cry and at one point he checks his phone.\n    *set charity %+20\n    *set valor %-20\n    *set hope %+10\n    *goto reading\n\n*label reading\n\n*page_break\n\n*comment ---- 11.4 : reading him ----\n\n*if (heard_him_first)\n  There is one more thing and you have been carrying it since before the world had light in a different man.\n\nThat is the thing this has to be honest about. He is the same man, facing a different direction, badly, most days.\n\nHe is late to Mass constantly. He goes to the eleven because he cannot get up for the nine. He does not join anything. He would not be able to give you an account of what he believes if you put a gun to his head; he could give you an account of what he has stopped arguing with.\n\n*page_break\n\nHe is kinder than he was. He could not tell you why and does not notice.\n\nHe goes to see his mother twice a week instead of twice a month, and Ewa Kowalczyk, who is seventy-one and sharp as a tack, notices immediately and says nothing whatsoever about it for six years.\n\n*if (renee_contact)\n  He and Renee write about three times a year. It is not about them. In 2021 she sends a photograph of her middle one in a nursing uniform and he puts it on the refrigerator, where a man of forty-six with no children has a photograph of somebody else's daughter, and does not think this is strange.\n\n*page_break\n\n*set_ward prayers 3\n\nAnd the number, which has been at nothing since March of 2016, comes back — not to what it was in 1980, not close, but a woman in Wilkinsburg who has never met him has him on a list, and Curtis Hale prays for him in a car, and his mother has started again after forty years.\n\n*page_break\n\n*comment ---- 11.6 : THE BEDSIDE. 2024 ----\n\nThe diagnosis is in June and it is not the kind you argue with.\n\nHe is forty-nine. He does four months of it and does them without much complaint, which surprises everybody including him.\n\n*page_break\n\nBy the middle of October he is at his mother's house on Dobson Street, in the front room, because that is where the hospital bed fits.\n\n*image dobson-room.webp A front room in the afternoon, a bed by the window, a chair beside it.\n\nAnd on the fifteenth, a Tuesday, at about four in the afternoon, the light in that room is the colour of weak tea, and there is a chair beside the bed with nobody in it, because Ewa has gone to the kitchen to do something she does not need to do.\n\n*page_break\n\nYou have seen this room before.\n\n*page_break\n\nYou saw it for four seconds, forty-nine years ago, from a doorway, and you looked at the chair and the jar on the nightstand and the strip of light on the floor, and by the time you thought to look at his face you were already going.\n\nYou are looking at his face now.\n\n*page_break\n\n*comment ---- all three ----\n\nAnd all three of them are here.\n\nThey are not pretending to be a crowd. There is no time left for that and they have not bothered. There is no Belphegor and no Asmodeus and no message being taken; there are three of them, standing in a front room in Polish Hill, and one of them is doing all the work as it has done since 1975.\n\n*page_break\n\nAnd it is not about lust. It has not been about lust for twenty-six years.\n\n*page_break\n\nWhat it puts to him is this, and it puts it in his own voice, which is the only voice he has ever been unable to argue with:\n\n*line_break\n*line_break\n*You wasted it.*\n\n*Twenty-five years. You had six. You have always known six was not enough and you knew it in the car in Swissvale and you went ahead anyway because it was better than nothing, and better than nothing is what you got.*\n\n*And you know exactly what you did to her, and it is far too late, and there is not one thing you can do about it from here.*\n*line_break\n*line_break\n\n*page_break\n\nEvery word of that is true.\n\nThey still cannot lie. Not on the last afternoon, not even now.\n\n*page_break\n\n*comment ---- three verbs, one last time ----\n\n*set_ward sight \"clouded\"\n\nYou have three things and you have had three things since a floor that was not a floor, and there is a clock in this room, and the clock is a man's breathing.\n\n*choice\n  #STAND on it. Get between him and it.\n    You put your angel on the thought itself — not on the man, on the suggestion, on the place wher orty-nine years is now applied to carrying him, and that is what carrying is.\n\n*page_break\n\nIt does not judge him.\n\nIt has never judged anything. Not the candy on Liberty Avenue in 1980, not the finger, not the car outside Renee's mother's house in June of 1998, not one time in forty-nine years. It is not equipped for it and it has never wanted to be.\n\nIt carries him the way it has carried every prayer he ever said, including the four words he could not finish when he was nine.\n\n*page_break\n\n*comment ---- the name ----\n\nAnd Adam Kowalczyk sees you.\n\nNot you — you are not there any more, or you are there and are not the point. He sees *it*. For the first time in forty-nine years and about one hour.\n\n*page_break\n\nAnd he says its name.\n\n*page_break\n\nNot the one you have been using since 1979, which was never anything, which you made up at a kitchen table in the Hill District because it seemed rude to keep saying *hey.*\n\nThe real one. The one that is not a word, that has no sound in it, that nobody with a mouth was ever going to manage — and he says it perfectly, first time, without effort, the way you would say your own address.\n\nBecause he can now.\n\nBecause knowing it was never the problem.\n\n*page_break\n\n*comment ---- and it stops ----\n\nAnd then there is a threshold, and your angel goes to it, and stops.\n\n*page_break\n\nThat is the office. That is the whole of it and that is the end of it. It carries and it hands over and it does not go in, and nothing is said to it, and nothing is explained.\n\nThe light does not go out. It is more that you are outside of it, suddenly, the way you are outside a house.\n\n*page_break\n\nYou do not hear anything.\n\nNobody is going to tell you.\n\n*page_break\n\n*comment ---- the reading ----\n\n\"What happened?\" you say. \"What just — is he —\"\n\n\"I do not know.\"\n\n\"You *carried* him —\"\n\n\"To the door,\" it says. \"I have carried a great many to the door. I have never once been told.\"\n\n*page_break\n\n*if ((needle >= 4) and (hope >= 65))\n  *goto homing\n*elseif (hope >= 50)\n  *goto latehour\n*elseif (hope >= 30)\n  *goto unfinished\n*else\n  *goto longhope\n\n*label homing\n*comment ---- ENDING A : THE HOMING ----\n\nBut you can look at what there is, and there is a great deal of it, and none of it is nothing.\n\nHe asked for a priest himself, in June, before he was frightened — while the thing was still a word on a scan and not a fact in a room. He went to Mass on the twelfth of October badly and late, three days before, in a coat over pyjamas, and his mother drove.\n\n*if (renee_contact)\n  There is a photograph of somebody else's daughter on a refrigerator in Bloomfield.\nThe notebook is on the nightstand next to the jar. He carried it from one house to another in August and could not say why.\n\nAnd the last thing he said in the world was four words about his mother.\n\n*page_break\n\n\"That is a good deal to be going on with,\" your angel says.\n\n\"It's not a verdict.\"\n\n\"No. There is no verdict here for you and there was never going to be. But you asked me what there is, and there is that, and I would not trade it.\"\n\n*achieve charity\n*goto whereyou\n\n*label latehour\n*comment ---- ENDING B : THE LATE HOUR ----\n\nBut you can look at what there is.\n\nHe came back frightened rather than free — you know that, you were in the car in Swissvale, you watched the needle not move all the way. And it held. Six years of getting up for the eleven o'clock because he could not manage the nine, and never being able to say why it helped, and going anyway.\n\nHolding is not nothing. A great deal of the world is held rather than believed.\n\n*page_break\n\n\"It's thin,\" you say.\n\n\"It is thin,\" your angel agrees. \"And it is six years long, and he did it while nobody was watching, and I would rather have it than not have it.\"\n\n*goto whereyou\n\n*label unfinished\n*comment ---- ENDING C : UNFINISHED ----\n\nBut you can look at what there is, d it is the reason you were sent.\"\n\n*page_break\n\nYou do not say anything for a while.\n\n\"How long is that?\" you say. \"The waiting?\"\n\n\"I have no idea,\" it says. \"I have never once minded.\"\n\n*goto whereyou\n\n*label whereyou\n\n*page_break\n\n*comment ---- \"Where were you?\" ----\n\nThere is one more thing and it is yours, and you have been carrying it since 1979, and harder since 2019, and hardest since last Thursday.\n\n*page_break\n\n\"Where were you?\" you say.\n\n*page_break\n\nYou are not asking about Adam.\n\n*page_break\n\nAnd it does not explain anything. There is no explanation and it is not going to invent one for you and neither is anybody else, in this world or the next, and you have known that for about forty-nine years now.\n\n*page_break\n\nWhat you get is a location.\n\n*line_break\n*line_break\n\"On the twenty-first of March, 1979, when you made up my name at that table, I was at your left shoulder, about as far as the salt.\n\n\"When Walter went, I had my hand under your elbow on the way out of the room, and you thought that was the nurse.\n\n\"In 2019, in recovery, for eleven hours, and again on Thursday.\n\n\"And when the statues went off the windowsill I was standing exactly where I am standing now, which is where I have been standing since the twelfth of August, 1953, which is the day you were born.\"\n*line_break\n*line_break\n\n*page_break\n\nThat is the whole answer. There is not one word of consolation in it and no suggestion whatever that it should have been enough.\n\n*page_break\n\n*choice\n  #\"That's not an answer.\"\n    \"No,\" it agrees. \"It is a location. It is the only true thing I have and I have given it to you.\"\n    *set hope %+15\n    *goto sentback\n  #\"Was it enough? For any of them?\"\n    \"I do not know,\" it says. \"Nobody has ever told me that either.\"\n    *set hope %+10\n    *goto sentback\n  #Say nothing.\n    You say nothing, and neither does it, and that goes on for a while and is not uncomfortable.\n    *set hope %+10\n    *goto sentback\n\n*label sentback\n\n*page_break\n\n*comment ---- sent back ----\n\nAnd then there is a window, and a parking structure, and a cup of apple juice that has been on a tray since last night.\n\n*page_break\n\nNothing has changed.\n\n*page_break\n\nThere is porcelain all over the floor. The nurse has not come in yet, because no time has passed at all — not four minutes, not one. There are fourteen broken angels around your chair and your arm is still out.\n\nYou do not have your legs. You are not going to get them. Nothing has been fixed, nothing has been explained, and the therapist is still coming at ten.\n\n*page_break\n\n\"At least,\" your angel says, \"you were not made a pope.\"\n\nYou turn your head.\n\n\"I beg your pardon?\"\n\n\"You were given one,\" it says. \"One man, for forty-nine years, and you have found it almost more than you could carry. Some of them are given a diocese. There is a woman in Manila with nine grandchildren who is answerable for rather more than you are, and a priest in this city who is answerable for four hundred, and none of them will be shown any of it beforehand.\"\n\n*achieve pope\n\n*page_break\n\n\"Was I any good at it?\"\n\n\"You will find out,\" it says, \"at the same time I do.\"\n\n*page_break\n\n*comment ---- the corridor ----\n\nAnd then, last of all, it tells you the one thing it did not show you.\n\n*page_break\n\nFour doors down this corridor, in room 314, there is a man of forty-nine who has about nine hours left.\n\nNobody is with him. His mother went home at six because she is seventy-one and she has to sleep sometime, and she will not get back before it happens, and she is going to carry that for the rest of her life.\n\n*page_break\n\nRoom 314 has the same window as this one. It has the same view of the same parking structure, and the same ceiling tile with the water stain on it, and at this hour the light in there is the colour of weak tea.\n\nYou have been in that room before. Once. For about four seconds, forty-nine years ago, and you spent all four of them looking for whatever it was that was doing that to you.\n\n*page_break\n\nYou have no legs.\n\nGoing down that corridor means ringing the bell for a nurse you have been short with all week. It means being got into a chair, which takes two people and eleven minutes and hurts. It means being wheeled into the room of a man you have never met, to sit with him, for no reason you could give anybody who asked.\n\n*page_break\n\n*choice\n  #Ring the bell.\n    You ring the bell.\n    *achieve corridor\n    *goto went\n\n  #Don't.\n    You do not ring the bell.\n    *goto stayed\n\n*label went\n\n*page_break\n\nIt takes fourteen minutes, not eleven, because the first nurse is with somebody else.\n\n*page_break\n\nRoom 314 has a window in it too, and the same view, and the light is off.\n\nYou cannot see your angel. There is nothing in this room at all. Forty-nine years you have stood next to it and now you are in the same eight feet of air as it and there is nothing there, nothing, not a shimmer, not a shape.\n\n*page_break\n\nAnd you know exactly where it is standing.\n\nBecause it is where it always stands.\n\n*page_break\n\nYou do not say anything to him. You would not know what to say and he is past it anyway.\n\nYou put your hand on the bed.\n\n*page_break\n\n*goto final\n\n*label stayed\n\n*page_break\n\nYou do not ring the bell.\n\nYou sit in a chair by a window with fourteen broken angels on the floor around you, and down the hall a machine is going off, and it is going to go off for another eleven minutes before anybody comes.\n\n*page_break\n\nNothing punishes you for this. Nobody says anything about it. Your angel does not leave and does not reproach you and is still standing where it always stands, and will be standing there in 2029 and in 2034 and on whatever afternoon your own turns out to be.\n\n*page_break\n\nYou have been awake since four in the morning.\n\n*goto fin /* ---------- parse ---------- */
function parse(src){
  const out=[];
  src.split(/\r?\n/).forEach((raw,i)=>{
    const t=raw.replace(/\t/g,'  ');
    const ind=t.length-t.replace(/^ +/,'').length, s=t.trim();
    if(!s){out.push({ind,k:'blank',line:i});return;}
    const cm = s[0]==='*' ? s.match(/^\*([a-z_]+)\s?(.*)$/) : null;
    if(cm){out.push({ind,k:'cmd',c:cm[1],a:cm[2],line:i});}
    else if(s[0]==='#'){out.push({ind,k:'opt',a:s.slice(1).trim(),line:i});}
    else out.push({ind,k:'text',a:s,line:i});
  });
  return out;
}

/* ---------- expressions ---------- */
function val(t){t=t.trim();
  if(/^-?\d+$/.test(t))return +t;
  if(/^".*"$/.test(t))return t.slice(1,-1);
  if(t==='true')return true; if(t==='false')return false;
  return (t in S.vars)?S.vars[t]:0;}
function evalExpr(e){
  e=e.trim().replace(/^\((.*)\)$/s,'$1').trim();
  for(const op of [' and ',' or ']){let d=0;
    for(let i=0;i<e.length;i++){
      if(e[i]==='(')d++;else if(e[i]===')')d--;
      else if(d===0&&e.substr(i,op.length)===op)
        return op===' and '?(evalExpr(e.slice(0,i))&&evalExpr(e.slice(i+op.length)))
                           :(evalExpr(e.slice(0,i))||evalExpr(e.slice(i+op.length)));}}
  e=e.replace(/^\((.*)\)$/s,'$1').trim();
  const m=e.match(/^(.+?)\s*(>=|<=|!=|=|>|<)\s*(.+)$/); if(!m)return !!val(e);
  const a=val(m[1]),b=val(m[3]);
  return {'>=':a>=b,'<=':a<=b,'!=':a!=b,'=':a==b,'>':a>b,'<':a<b}[m[2]];}
function fair(c,n){n=+n;const v=n>=0?c+(100-c)*n/100:c+c*n/100;return Math.max(1,Math.min(99,Math.round(v)));}
function doSet(arg){
  const m=arg.match(/^(\S+)\s+(.*)$/); if(!m)return;
  const k=m[1]; let r=m[2].trim();
  if(GATED.includes(k) && !S.vars.formed) return;      /* not hers to shape yet */
  const fm=r.match(/^%\s*([+-])\s*(\d+)$/);

  const rl=r.match(/^([+-])\s*(\d+)$/);
  if(rl){S.vars[k]=(+S.vars[k]||0)+(rl[1]==='-'?-1:1)*(+rl[2]);return;}
  S.vars[k]=val(r);}

    if(c==='stat_chart'){S.page.push({t:'chart'});S.pc=skipBlock(a,S.pc,n.ind);continue;}
    if(c==='input_text'){S.page.push({t:'input',v:arg.trim()});S.pc++;return render();}
    if(c==='if'||c==='elseif'||c==='else'){
      if(c==='else'||evalExpr(arg)){S.pc++;}
      else{let j=skipBlock(a,S.pc,n.ind);
        while(j<a.length&&a[j].k==='cmd'&&(a[j].c==='elseif'||a[j].c==='else')&&a[j].ind===n.ind){
          if(a[j].c==='else'||evalExpr(a[j].a)){S.pc=j+1;j=-1;break;}
          j=skipBlock(a,j,n.ind);}
        if(j>=0)S.pc=j;}
      continue;}
    if(c==='choice'||c==='fake_choice'){
      const opts=[];let j=S.pc+1,oi=null;
      while(j<a.length){const m=a[j];
        if(m.k==='blank'){j++;continue;}
        if(m.ind<=n.ind)break;
        if(m.k==='opt'){if(oi===null)oi=m.ind;if(m.ind===oi)opts.push({label:m.a,body:j+1,line:m.line,scene:S.scene});}
        j++;}
      S.choices={opts,after:j};return render();}
    S.pc++;
  }
  render();
}
function advanceScene(){const i=ORDER.indexOf(S.scene);
  if(i>=0&&i+1<ORDER.length)gotoScene(ORDER[i+1]);
  else{S.page.push({t:'end'});S.scene=null;}}

/* ---------- render ---------- */
function deltaText(b){const a=P[S.scene],o=[];
  for(let j=b;j<a.length&&j<b+70;j++){const n=a[j];if(n.k!=='cmd')continue;
    if(n.c==='set'||n.c==='set_hidden')o.push(n.a);
    if(n.c==='goto'||n.c==='goto_scene')break;}
  return o.join(' · ');}
const NICE={valor:['Valor','Patience'],severity:['Severity','Mercy'],splendor:['Splendor','Hiddenness'],
  charity:['Charity',null],hope:['Hope',null]};
function flashDeltas(before){
  const rows=[];
  for(const k in NICE){
    const a=+before[k]||0,b=+S.vars[k]||0,d=b-a;
    if(!d)continue;
    const nm=NICE[k], lab=(d>0||!nm[1])?nm[0]:nm[1], amt=Math.abs(d);
    const col={valor:'var(--cobalt)',severity:'var(--ruby)',splendor:'var(--amber)',
      charity:'var(--verd)',hope:'var(--violet)'}[k];
    rows.push('<div style="color:'+col+'">'+(d>0?'+':'−')+amt+' '+lab+'</div>');
  }
  if(!rows.length)return;
  const f=$('flash'); f.innerHTML=rows.join(''); f.classList.add('show');
  setTimeout(()=>f.classList.remove('show'),2600);
}
function keyOf(n){return n.scene+':'+n.line;}
function textFor(n){const e=S.notes[keyOf(n)];return (e&&e.replacement)?e.replacement:n.v;}
function render(){
  const st=$('stage'); st.innerHTML='';
  if(S.edit&&S.stack.length>1){
    const b=document.createElement('button');b.className='backbtn';b.textContent='◂ previous screen';
    b.onclick=goBack;st.appendChild(b);}
  let lastWasBr=false;
  S.page.forEach(n=>{
    if(n.t!=='br') lastWasBr=false;
    if(n.t==='text'){
      const p=document.createElement('p'), k=keyOf(n), e=S.notes[k];
      p.innerHTML=inline(textFor(n));
      if(e&&e.replacement)p.classList.add('edited');
      else if(e)p.classList.add('hasnote');
      if(S.edit)p.onclick=()=>openNote(k,n.v);
      st.appendChild(p);
    } else if(n.t==='br'){
      if(!lastWasBr){const d=document.createElement('div');d.className='hr';st.appendChild(d);}
      lastWasBr=true; return;
    } else if(n.t==='img'){ st.appendChild(imageEl(n));
    } else if(n.t==='chart'){ st.appendChild(chartEl());
    } else if(n.t==='input'){
      const w=document.createElement('div');w.className='choices';
      w.innerHTML='<input id="tin" style="font-family:Spectral,serif;font-size:1rem;padding:.75rem;background:var(--glass);border:1px solid var(--came);color:var(--ink)">';
      const b=document.createElement('button');b.className='opt';b.textContent='That is it.';
      b.onclick=()=>{const v=$('tin').value.trim();if(v)S.vars[n.v]=v;S.pc++;save();step();};
      w.appendChild(b);st.appendChild(w);
    } else if(n.t==='end'){
      const d=document.createElement('p');d.style.cssText=
        'text-align:center;color:var(--ink3);font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.3em';
      d.textContent='END';st.appendChild(d);}
  });
  if(S.choices){
    const w=document.createElement('div');w.className='choices';
    S.choices.opts.forEach(o=>{
      const k=o.scene+':'+o.line, ov=S.notes[k];
      const lab=(ov&&ov.replacement)?ov.replacement:o.label;
      const row=document.createElement('div');row.style.cssText='display:flex;gap:.4rem;align-items:stretch';
      const b=document.createElement('button');b.className='opt';b.style.flex='1';
      b.innerHTML=inline(lab)+(S.edit?'<span class="delta">'+esc(deltaText(o.body)||'—')+'</span>':'');
      b.onclick=()=>pick(o);
      row.appendChild(b);
      if(S.edit){
        const e=document.createElement('button');e.className='opt';e.style.cssText='flex:0 0 2.6rem;text-align:center;border-left-color:var(--ink3)';
        e.innerHTML='&#9998;'; e.title='edit this option\'s wording';
        e.onclick=ev=>{ev.stopPropagation();openNote(k,o.label);};
        row.appendChild(e);
      }
      w.appendChild(row);});
    st.appendChild(w);
  } else if(S.scene){
    const b=document.createElement('button');b.className='cont';b.textContent='continue';
    b.onclick=()=>{save();step();};st.appendChild(b);}
  $('cwhere').innerHTML=S.scene?'<b>'+esc(S.scene)+'</b>':'end';
  $('cedit').innerHTML=S.edit?'<span class="ed">edit</span>':'';
  window.scrollTo(0,0); save();
}
function redraw(){ const sc=S.choices, pg=S.page; S.page=pg; S.choices=sc; render(); }
function pick(o){ const before=JSON.parse(JSON.stringify(S.vars)); S.pc=o.body; step();
  flashDeltas(before); save(); }
function goBack(){ S.stack.pop(); const h=S.stack.pop(); if(!h)return;
  S.vars=h.vars;S.scene=h.scene;S.pc=h.pc; step(); }

/* ---------- images ---------- */
function imageEl(n){
  const f=document.createElement('figure');
  const got=S.imgs[n.src];
  if(got){
    f.innerHTML='<img class="glazed" src="'+got+'" alt="'+esc(n.alt)+'">'+
      (S.edit?'<figcaption>'+esc(n.src)+' — click to replace</figcaption>':'');
    if(S.edit) f.querySelector('img').onclick=()=>chooseImage(n.src);
  } else {
    f.innerHTML='<div class="imgph glazed">'+esc(n.alt)+
      (S.edit?'<button type="button">add image</button>':'')+'</div>'+
      '<figcaption>'+esc(n.src)+'</figcaption>';
    const b=f.querySelector('button'); if(b) b.onclick=()=>chooseImage(n.src);
  }
  return f;
}
let imgSlot=null;
function chooseImage(slot){ imgSlot=slot; $('pick').value=''; $('pick').click(); }
$('pick').onchange=e=>{
  const file=e.target.files[0]; if(!file||!imgSlot) return;
  const r=new FileReader();
  r.onload=()=>{ const im=new Image();
    im.onload=()=>{
      const max=1200, sc=Math.min(1,max/Math.max(im.width,im.height));
      const cv=document.createElement('canvas');
      cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      const url=cv.toDataURL('image/jpeg',0.8);
      S.imgs[imgSlot]=url; save(); redraw(); pushImage(imgSlot,url);
    };
    im.src=r.result; };
  r.readAsDataURL(file);
};
async function pushImage(slot,url){
  const db=await claude.use('db');
  if(!db){ toast('image saved on this device only'); return; }
  try{ await db.doc('images/'+slot.replace(/[^\w]/g,'_')).set({slot,dataUrl:url,at:new Date().toISOString()});
    toast('image saved for Claude'); }
  catch(err){ toast('image too large — saved locally'); }
}

/* ---------- rose window ---------- */
function petal(cx,cy,r,frac,col){
  return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#000" stroke-width="2"/>'+
         '<circle cx="'+cx+'" cy="'+cy+'" r="'+(r-1)+'" fill="'+col+'" opacity="'+(0.12+0.72*frac)+'"/>'+
         '<circle cx="'+cx+'" cy="'+cy+'" r="'+(r-1)+'" fill="none" stroke="#e3ab48" stroke-width=".7" opacity=".45"/>';
}
function roseSVG(){
  const v=S.vars, V=(+v.valor||50)/100, Se=(+v.severity||50)/100, Sp=(+v.splendor||50)/100,
        C=(+v.charity||50)/100, H=(+v.hope||40)/100;
  return '<svg class="rose" viewBox="0 0 240 240" width="220" height="220" role="img" aria-label="stat rose window">'+
    '<circle cx="120" cy="120" r="116" fill="none" stroke="#000" stroke-width="4"/>'+
    '<circle cx="120" cy="120" r="112" fill="none" stroke="#e3ab48" stroke-width="1" opacity=".5"/>'+
    petal(120,58,30,V,'#5b83d8')+ petal(174,89,30,1-V,'#5b83d8')+
    petal(174,151,30,Se,'#cf5069')+ petal(120,182,30,1-Se,'#cf5069')+
    petal(66,151,30,Sp,'#e3ab48')+ petal(66,89,30,1-Sp,'#e3ab48')+
    '<circle cx="120" cy="120" r="30" fill="none" stroke="#000" stroke-width="2"/>'+
    '<circle cx="120" cy="120" r="29" fill="#4fa583" opacity="'+(0.12+0.72*C)+'"/>'+
    '<circle cx="120" cy="120" r="15" fill="#a988d8" opacity="'+(0.15+0.75*H)+'"/>'+
    '<circle cx="120" cy="120" r="15" fill="none" stroke="#e3ab48" stroke-width=".8" opacity=".6"/>'+
  '</svg>';
}
function bar(l,r,v,c){return '<div class="kv"><span>'+l+(r?' / '+r:'')+'</span><span>'+v+'%</span></div>';}
function chartEl(){const d=document.createElement('div'),v=S.vars;
  d.innerHTML=roseSVG()+
    bar('Valor','Patience',+v.valor||50)+bar('Severity','Mercy',+v.severity||50)+
    bar('Splendor','Hiddenness',+v.splendor||50)+bar('Charity','',+v.charity||50)+
    bar('Hope','',+v.hope||40)+
    '<div class="kv"><span>the needle</span><span>'+(v.needle||1)+' of 4</span></div>'+
    '<div class="kv"><span>prayers</span><span>'+(v.prayers||0)+'</span></div>'+
    '<div class="kv"><span>culpability</span><span>'+(v.culpability||'unknown')+'</span></div>';
  return d;}

/* ---------- panels ---------- */
let noteTarget=null;
const openPanel=h=>{$('panelBody').innerHTML=h;$('panel').classList.add('open');};
const closePanel=()=>$('panel').classList.remove('open');
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1900);}
function showStats(){ openPanel('<h3>The angel you are making</h3>'+chartEl().innerHTML+
  (S.vars.formed?'':'<p style="color:var(--ink3);font-size:.82rem;margin-top:1rem">The three pairs do not move yet. They are his, and you have not been told what your choosing does to him.</p>')); }
function showJump(){let h='<h3>Jump to scene</h3><div class="jumps">';
  ORDER.forEach((s,i)=>h+='<button onclick="jump(\''+s+'\')">'+esc(s)+'<b>'+i+'</b></button>');
  openPanel(h+'</div><p style="color:var(--ink3);font-size:.8rem;margin-top:1rem">Jumping keeps your current stats and does not replay what is in between.</p>');}
function jump(s){gotoScene(s);closePanel();step();}
function openNote(key,original){
  noteTarget={key,original};
  const e=S.notes[key]||{};
  openPanel('<h3>This passage</h3>'+
    '<textarea id="rtxt">'+esc(e.replacement||original)+'</textarea>'+
    '<button class="act prim" onclick="saveNote(\'edit\')">Save my rewrite</button>'+
    (e.replacement?'<button class="act" onclick="revert()">Revert to Claude\'s text</button>':'')+
    '<h3>Or tell Claude what to change</h3>'+
    '<textarea class="note" id="ntxt" placeholder="What is wrong with this?">'+esc(e.note||'')+'</textarea>'+
    '<button class="act" onclick="saveNote(\'rewrite\')">Ask Claude to rewrite</button>'+
    ((e.note||e.replacement)?'<button class="act" onclick="delNote()">Delete this note</button>':''));
  setTimeout(()=>{const t=$('rtxt');if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length);}},60);
}
async function saveNote(kind){
  if(!noteTarget)return;
  const repl=(($('rtxt')||{}).value||'').trim(), note=(($('ntxt')||{}).value||'').trim();
  const rec={kind,scene:noteTarget.key.split(':')[0],line:+noteTarget.key.split(':')[1],
    original:noteTarget.original, note, at:new Date().toISOString()};
  if(repl && repl!==noteTarget.original) rec.replacement=repl;
  S.notes[noteTarget.key]=rec; save(); closePanel(); redraw();
  const db=await claude.use('db');
  if(db){try{await db.doc('notes/'+noteTarget.key.replace(/[^\w]/g,'_')).set(rec);
    toast('saved for Claude');}catch(e){toast('saved on this device');}}
  else toast('saved on this device');
}
function revert(){ if(!noteTarget)return; const e=S.notes[noteTarget.key];
  if(e){delete e.replacement; if(!e.note) delete S.notes[noteTarget.key];}
  save(); closePanel(); redraw(); }
function delNote(){ if(noteTarget){delete S.notes[noteTarget.key];save();closePanel();redraw();} }
function showNotes(){
  const ks=Object.keys(S.notes); let h='<h3>Your notes ('+ks.length+')</h3>';
  if(!ks.length)h+='<p style="color:var(--ink3);font-size:.85rem">Turn on EDIT and click any paragraph.</p>';
  ks.forEach(k=>{const n=S.notes[k];
    h+='<div class="noteitem"><em>'+esc(n.scene)+' · line '+n.line+' · '+(n.replacement?'rewritten':n.kind)+'</em>'+
       esc((n.replacement||n.note||'').slice(0,260))+'</div>';});
  openPanel(h);
}

/* ---------- persistence ---------- */
function save(){try{localStorage.setItem('onesoul',JSON.stringify(
  {vars:S.vars,scene:S.scene,pc:S.pc,notes:S.notes,imgs:S.imgs,edit:S.edit,started:S.started}));}catch(e){}}
function load(){try{const r=JSON.parse(localStorage.getItem('onesoul')||'null');
  if(r){S.vars=r.vars||{};S.scene=r.scene;S.pc=r.pc||0;S.notes=r.notes||{};S.imgs=r.imgs||{};
    S.edit=!!r.edit;S.started=!!r.started;return !!r.scene;}}catch(e){}return false;}

/* ---------- boot ---------- */
function titleScreen(){
  S.scene=null;
  $('stage').innerHTML='<div class="title">'+roseSVG()+'<h1>One Soul</h1>'+
    '<div class="sub">Angelic Orders · Book One</div>'+
    '<div class="tag">You are an angel, and one life is yours to keep.</div></div>';
  const w=document.createElement('div');w.className='choices';
  const b=document.createElement('button');b.className='opt';b.textContent='Begin.';
  b.onclick=()=>{S.started=true;S.vars={};S.stack=[];
    (P.__startup__||[]).forEach(n=>{if(n.k==='cmd'&&n.c==='create'){const m=n.a.match(/^(\S+)\s+(.*)$/);if(m)S.vars[m[1]]=val(m[2].trim());}});
    gotoScene(ORDER[0]);step();};
  w.appendChild(b);
  if(localStorage.getItem('onesoul')){
    const c=document.createElement('button');c.className='opt';c.textContent='Continue where I left off.';
    c.onclick=()=>{load();if(S.scene)step();else b.click();};w.appendChild(c);}
  $('stage').appendChild(w); $('cwhere').textContent='title';
}
function buildBar(){
  const defs=[['stats','Stats',showStats],['notes','Notes',showNotes],['jump','Jump',showJump],
    ['edit','Edit',toggleEdit],['theme','Theme',toggleTheme],['size','A±',cycleSize],['restart','Restart',restart]];
  $('bar').innerHTML='';
  defs.forEach(([id,l,fn])=>{ if(id==='jump'&&!S.edit)return;
    const b=document.createElement('button');b.textContent=l;b.onclick=fn;
    if(id==='edit'&&S.edit)b.classList.add('on');$('bar').appendChild(b);});
}
function toggleEdit(){S.edit=!S.edit;document.body.classList.toggle('editing',S.edit);
  buildBar();save();if(S.scene)redraw();else titleScreen();
  toast(S.edit?'edit mode — click any paragraph':'edit mode off');}
function toggleTheme(){const r=document.documentElement;
  r.setAttribute('data-theme',r.getAttribute('data-theme')==='light'?'dark':'light');}
let sizes=[17,19,21,24],si=1;
function cycleSize(){si=(si+1)%sizes.length;document.documentElement.style.setProperty('--fs',sizes[si]+'px');}
function restart(){if(!confirm('Start again from the beginning?'))return;
  const n=S.notes,i=S.imgs,e=S.edit;localStorage.removeItem('onesoul');
  S.vars={};S.scene=null;S.pc=0;S.stack=[];S.notes=n;S.imgs=i;S.edit=e;save();titleScreen();}

(function(){
  P.__startup__=parse(SCENES.__startup__||'');
  const had=load();
  document.body.classList.toggle('editing',S.edit);
  buildBar();
  if(had&&S.started)step(); else titleScreen();
  addEventListener('keydown',e=>{
    if(e.key==='Escape')closePanel();
    if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='e'){e.preventDefault();toggleEdit();}
    if(S.edit&&e.key==='ArrowLeft'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName))goBack();
  });
})();
</script>
