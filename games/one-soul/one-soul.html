<title>One Soul</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --lead:#07080b; --lead2:#0d1015;
  --glass:#12161c; --glass2:#1a1f27;
  --ink:#ece5d6; --ink2:#a49b88; --ink3:#6b6455;
  --amber:#e3ab48; --cobalt:#5b83d8; --ruby:#cf5069; --verd:#4fa583; --violet:#a988d8;
  --came:#000; --rule:#242a33;
  --fs:19px; --col:34rem;
}
:root[data-theme="light"]{
  --lead:#e7e3d8; --lead2:#efece3;
  --glass:#faf8f2; --glass2:#f1ede2;
  --ink:#15171b; --ink2:#4e5259; --ink3:#8b8577;
  --amber:#8d6110; --cobalt:#1d3d86; --ruby:#93202f; --verd:#28604c; --violet:#5f4790;
  --came:#1b1d21; --rule:#cfc9ba;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--lead); color:var(--ink);
  font-family:Spectral,Georgia,serif; font-size:var(--fs); line-height:1.75;
  -webkit-font-smoothing:antialiased; padding-bottom:5.4rem;
  background-image:
    radial-gradient(ellipse 70% 45% at 50% -8%, rgba(227,171,72,.10), transparent 70%),
    radial-gradient(ellipse 55% 40% at 12% 30%, rgba(91,131,216,.055), transparent 70%),
    radial-gradient(ellipse 55% 40% at 88% 68%, rgba(207,80,105,.05), transparent 70%);
  background-attachment:fixed;
}
/* ---------- the came: a lead frame around everything ---------- */
.frame{position:fixed;inset:0;z-index:45;pointer-events:none}
.frame::before{content:"";position:absolute;inset:0;
  border:9px solid var(--came);
  box-shadow:inset 0 0 0 1px rgba(227,171,72,.20), inset 0 0 60px rgba(0,0,0,.55)}

main{max-width:var(--col);margin:0 auto;padding:5.6rem 1.5rem 2rem;position:relative;z-index:1}

/* ---------- prose ---------- */
p{margin:0 0 1.2rem;text-wrap:pretty}
strong{font-weight:600;color:var(--amber)}
em{font-style:italic}
.hr{height:.55rem}
figure{margin:1.8rem 0}
figure img{width:100%;display:block}
.glazed{position:relative;border:1px solid var(--came);
  box-shadow:0 0 0 1px rgba(227,171,72,.22), 0 8px 30px rgba(0,0,0,.5)}
figure figcaption{font-family:"IBM Plex Mono",monospace;font-size:.63rem;letter-spacing:.16em;
  color:var(--ink3);margin-top:.6rem;text-transform:uppercase;text-align:center}
.imgph{aspect-ratio:3/2;background:
    linear-gradient(150deg,rgba(91,131,216,.16),rgba(227,171,72,.10) 45%,rgba(207,80,105,.13));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;
  padding:1.6rem;text-align:center;font-family:"IBM Plex Mono",monospace;
  font-size:.68rem;color:var(--ink2);line-height:1.8}
.imgph button{font-family:"IBM Plex Mono",monospace;font-size:.64rem;letter-spacing:.16em;
  text-transform:uppercase;background:rgba(0,0,0,.45);border:1px solid var(--amber);
  color:var(--amber);padding:.5rem 1rem;cursor:pointer}

/* ---------- choices : glass lit from behind ---------- */
.choices{margin:2.4rem 0 1rem;display:flex;flex-direction:column;gap:.55rem}
button.opt{
  font-family:Spectral,Georgia,serif;font-size:1rem;line-height:1.55;text-align:left;
  color:var(--ink);border:1px solid var(--came);border-left:4px solid var(--cobalt);
  background:linear-gradient(100deg, rgba(91,131,216,.13), rgba(91,131,216,.03) 60%, transparent);
  padding:.9rem 1.15rem;cursor:pointer;position:relative;overflow:hidden;
  transition:box-shadow .18s, border-left-color .18s, transform .12s;
}
button.opt:nth-child(2){border-left-color:var(--ruby);
  background:linear-gradient(100deg, rgba(207,80,105,.13), rgba(207,80,105,.03) 60%, transparent)}
button.opt:nth-child(3){border-left-color:var(--amber);
  background:linear-gradient(100deg, rgba(227,171,72,.13), rgba(227,171,72,.03) 60%, transparent)}
button.opt:nth-child(4){border-left-color:var(--verd);
  background:linear-gradient(100deg, rgba(79,165,131,.13), rgba(79,165,131,.03) 60%, transparent)}
button.opt:nth-child(5){border-left-color:var(--violet);
  background:linear-gradient(100deg, rgba(169,136,216,.13), rgba(169,136,216,.03) 60%, transparent)}
button.opt:hover,button.opt:focus-visible{
  box-shadow:inset 0 0 42px -6px currentColor, 0 0 26px -10px var(--amber);
  outline:none;transform:translateX(2px)}
button.opt .delta{display:block;font-family:"IBM Plex Mono",monospace;font-size:.63rem;
  letter-spacing:.1em;color:var(--ink3);margin-top:.4rem}
button.cont{display:block;margin:2.4rem auto 0;font-family:"IBM Plex Mono",monospace;
  font-size:.66rem;letter-spacing:.28em;text-transform:uppercase;
  background:none;border:1px solid var(--rule);color:var(--ink2);
  padding:.68rem 2rem;cursor:pointer;transition:.18s}
button.cont:hover{border-color:var(--amber);color:var(--amber);
  box-shadow:0 0 24px -10px var(--amber)}

/* ---------- chrome ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:46;background:var(--lead);
  border-top:1px solid var(--came);box-shadow:0 -1px 0 rgba(227,171,72,.18);
  display:flex;gap:.1rem;padding:.45rem .6rem;justify-content:center;flex-wrap:wrap}
.bar button{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.16em;
  text-transform:uppercase;background:none;border:1px solid transparent;color:var(--ink3);
  padding:.5rem .72rem;cursor:pointer;transition:.15s}
.bar button:hover{color:var(--amber)}
.bar button.on{color:var(--amber);border-color:var(--amber)}
.crumb{position:fixed;top:0;left:0;right:0;z-index:46;background:var(--lead);
  border-bottom:1px solid var(--came);box-shadow:0 1px 0 rgba(227,171,72,.18);
  padding:.5rem 1.1rem;font-family:"IBM Plex Mono",monospace;font-size:.6rem;
  letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);
  display:flex;justify-content:space-between;gap:1rem}
.crumb b{color:var(--amber);font-weight:500}
.crumb .ed{color:var(--ruby)}

/* ---------- panels ---------- */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(27rem,100%);z-index:60;
  background:var(--lead2);border-left:1px solid var(--came);
  box-shadow:-1px 0 0 rgba(227,171,72,.2), -20px 0 60px rgba(0,0,0,.6);
  overflow-y:auto;padding:1.5rem 1.35rem 4rem;transform:translateX(101%);
  transition:transform .22s;font-family:"IBM Plex Sans",sans-serif;font-size:.9rem}
.panel.open{transform:none}
.panel h3{font-family:"IBM Plex Mono",monospace;font-size:.63rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink3);margin:1.7rem 0 .7rem;font-weight:400}
.panel h3:first-child{margin-top:0}
.panel .x{position:absolute;top:.7rem;right:1rem;background:none;border:none;
  color:var(--ink3);font-size:1.4rem;cursor:pointer;line-height:1}
.kv{display:flex;justify-content:space-between;padding:.42rem 0;border-bottom:1px solid var(--rule);
  font-family:"IBM Plex Mono",monospace;font-size:.74rem;color:var(--ink2)}
.kv span:last-child{color:var(--amber)}
.panel textarea{width:100%;min-height:8rem;background:var(--glass);color:var(--ink);
  border:1px solid var(--rule);padding:.65rem;font-family:Spectral,Georgia,serif;
  font-size:.95rem;line-height:1.6;resize:vertical}
.panel textarea.note{font-family:"IBM Plex Sans",sans-serif;font-size:.88rem;min-height:5.5rem}
.panel button.act{width:100%;padding:.62rem;margin-top:.5rem;background:var(--glass);
  border:1px solid var(--rule);color:var(--ink2);font-family:"IBM Plex Mono",monospace;
  font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
.panel button.act:hover{border-color:var(--amber);color:var(--amber)}
.panel button.act.prim{border-color:var(--amber);color:var(--amber)}
.jumps{display:flex;flex-direction:column;gap:1px}
.jumps button{text-align:left;background:var(--glass);border:none;border-left:3px solid var(--rule);
  color:var(--ink2);padding:.5rem .7rem;cursor:pointer;font-family:"IBM Plex Sans",sans-serif;
  font-size:.82rem;display:flex;justify-content:space-between;gap:.6rem}
.jumps button:hover{color:var(--amber);border-left-color:var(--amber)}
.jumps button b{font-family:"IBM Plex Mono",monospace;font-size:.64rem;color:var(--ink3);font-weight:400}
.noteitem{background:var(--glass);border-left:3px solid var(--ruby);padding:.55rem .75rem;
  font-size:.82rem;margin-bottom:.5rem;color:var(--ink2)}
.noteitem em{display:block;color:var(--ink3);font-size:.68rem;font-family:"IBM Plex Mono",monospace;
  margin-bottom:.28rem;font-style:normal;letter-spacing:.1em}

/* ---------- stat flash ---------- */
.flash{position:fixed;left:50%;top:2.7rem;transform:translateX(-50%);z-index:70;
  display:flex;flex-direction:row;flex-wrap:wrap;gap:.35rem;justify-content:center;
  pointer-events:none;opacity:0;transition:opacity .3s}
.flash.show{opacity:1}
.flash div{font-family:"IBM Plex Mono",monospace;font-size:.74rem;letter-spacing:.14em;
  text-transform:uppercase;padding:.32rem .8rem;background:var(--lead);
  border:1px solid currentColor;box-shadow:0 4px 18px rgba(0,0,0,.7);
  animation:rise .45s ease-out}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;bottom:4.6rem;left:50%;transform:translateX(-50%);z-index:70;
  background:var(--glass2);border:1px solid var(--amber);color:var(--amber);
  padding:.5rem 1rem;font-family:"IBM Plex Mono",monospace;font-size:.66rem;
  letter-spacing:.14em;text-transform:uppercase;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* ---------- edit affordances ---------- */
body.editing p{cursor:text;transition:box-shadow .12s}
body.editing p:hover{box-shadow:-.7rem 0 0 rgba(227,171,72,.10), .7rem 0 0 rgba(227,171,72,.10),
  0 0 0 .7rem rgba(227,171,72,.10)}
p.hasnote{border-right:2px solid var(--ruby);padding-right:.55rem}
p.edited{border-right:2px solid var(--verd);padding-right:.55rem}
.backbtn{font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.16em;
  text-transform:uppercase;background:none;border:1px solid var(--rule);color:var(--ink3);
  padding:.35rem .75rem;cursor:pointer;margin-bottom:1.5rem}
.backbtn:hover{color:var(--amber);border-color:var(--amber)}

/* ---------- title ---------- */
.title{text-align:center;padding:2.5rem 0 1rem}
.title h1{font-size:clamp(3rem,13vw,5.2rem);margin:.6rem 0 0;font-weight:600;
  letter-spacing:-.025em;line-height:.92;
  background:linear-gradient(175deg,var(--amber),#f3d9a0 40%,var(--amber));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.title .sub{font-family:"IBM Plex Mono",monospace;font-size:.64rem;letter-spacing:.3em;
  text-transform:uppercase;color:var(--ink3);margin-top:1.3rem}
.title .tag{font-style:italic;color:var(--ink2);margin-top:1.5rem;font-size:1.05rem}
.rose{display:block;margin:0 auto}
@media(max-width:32rem){ main{padding-top:4.6rem} .arch{height:3.4rem} }
</style>

<div class="frame">
</div>
<div class="crumb"><span id="cwhere">—</span><span id="cedit"></span></div>
<main id="stage"></main>
<div class="bar" id="bar"></div>
<div class="panel" id="panel"><button class="x" onclick="closePanel()">&times;</button><div id="panelBody"></div></div>
<div class="toast" id="toast"></div>
<div class="flash" id="flash"></div>
<input type="file" id="pick" accept="image/*" style="display:none">

<script>
/* =================================================================
   Scriptorium engine — One Soul
   ================================================================= */
const SCENES = {"__startup__": "*title One Soul\n*subtitle Angelic Orders, Book One\n*author Scriptorium\n\n*scene_list\n  windowsill\n  assembly\n  fourhours\n  ordinarytime\n  otherwatch\n  vigil\n  whattheytoldhim\n  legion\n  whathedoesnttell\n  permissionslip\n  longmiddle\n  thehour\n  threshold\n\n*comment ---------------- YOU ----------------\n*comment Set in scene zero, off a whiteboard by the door. The year is\n*comment fixed — everything downstream depends on 1979 and 2024 — so the\n*comment age is implied and never stated. Nothing else about you is.\n*create name \"Loretta\"\n*create angelname \"Angelo\"\n*create formed false\n\n*comment ---------------- THE ANGEL ----------------\n*comment Three opposed pairs. High valor IS low patience: one slider, two names.\n*comment Your choices do not merely track these. They form them, and what\n*comment they form is permanent, because he is not the kind of thing that changes.\n*create valor 50\n*create severity 50\n*create splendor 50\n\n*comment Charity is not opposed to anything. It is what the rest is for.\n*create charity 50\n\n*comment ---------------- LORETTA ----------------\n*comment Hope belongs to her, not to him. The blessed do not hope; they possess.\n*comment She is a wayfarer and it is the only stat she owns, and the endings\n*comment are read off it.\n*create hope 40\n\n*comment ---------------- ADAM ----------------\n*create needle 1\n*create prayers 0\n*create consolation 3\n*create sight \"clear\"\n*create culpability \"unknown\"\n\n*comment ---------------- HIDDEN ----------------\n*create overreach 0\n*create heard_him_first false\n*create caught_the_lie false\n*create asked_for 0\n*create tactic 0\n*create rescued false\n*create glimpsed false\n*create tried_to_make_him_sin false\n*create birds 0\n\n*comment ---------------- ACHIEVEMENTS ----------------\n*achievement stood_aside visible 50 Let Them\n  Decline to obstruct, once, on purpose.\n  Stood aside in 1984 and waited thirty-four years to find out.\n\n*achievement counted visible 50 Three\n  Count them without being told.\n  Counted them. There were three.\n\n*achievement storm visible 25 Josie\n  Bring a bird home through weather.\n  Brought a hen home from Springfield in a crosswind.\n\n*achievement argued visible 25 By Who\n  Argue with an angel and lose.\n  Argued with an angel and lost, on the first day.\n\n*achievement impossible visible 50 Not That\n  Ask him to do something he cannot do.\n  Asked him to do something he cannot do, and found out what that looks like.\n\n*achievement corridor visible 100 Down the Hall\n  Go.\n  Went.\n\n*achievement mercy visible 50 Mercy\n  Finish with Mercy at 80 or above.\n  Formed an angel who is gentle with failure.\n\n*achievement severity visible 50 Severity\n  Finish with Severity at 80 or above.\n  Formed an angel who does not look away from anything.\n\n*achievement patience visible 50 Patience\n  Finish with Patience at 80 or above.\n  Formed an angel who can wait longer than a human life.\n\n*achievement valour visible 50 Valour\n  Finish with Valor at 80 or above.\n  Formed an angel who moves first and asks after.\n\n*achievement hidden visible 50 Hiddenness\n  Finish with Hiddenness at 80 or above.\n  Formed an angel nobody will ever notice.\n\n*achievement splendour visible 50 Splendour\n  Finish with Splendor at 80 or above.\n  Formed an angel you can feel come into a room.\n\n*achievement charity visible 100 Charity\n  Finish with Charity at 90 or above.\n  Formed an angel who never once stopped.\n\n*achievement pope hidden 100 At Least You Weren't Pope\n  ---\n  Some people are given more than one.\n\n*goto_scene windowsill\n", "windowsill": "*comment ============================================================\n*comment SCENE ZERO — THE WINDOWSILL\n*comment Tuesday 15 October 2024. Target 1,200 words, 4 choices.\n*comment Job: establish the player, break them, teach the whole\n*comment mechanic inside one joke, end on Adam's last four seconds.\n*comment ============================================================\n\nYou have been awake since four in the morning.\n\nThe room has a window in it, which the brochure made a great deal of. What the window looks at is the third level of a parking structure. If you angle yourself and it is early enough, you can see a piece of sky over the top of it, about the size of a bath towel.\n\nIt is early enough. The sky is doing nothing.\n\nYour sister went home Sunday. The physical therapist comes at ten and is twenty-four years old and says *we* when she means *you*. There is a cup of apple juice on the tray that has been there since last night, and somebody will take it away eventually, and until then it is yours.\n\nThey took the second leg on Thursday.\n\n*page_break\n\nBy the door there is a whiteboard, and somebody has written on it in green marker: TODAY IS TUESDAY. THE WEATHER IS CLOUDY. YOUR NURSE IS DEVON.\n\nAnd above that, in the box that says PATIENT, there is your name.\n\n*choice\n  #Loretta.\n    *set name \"Loretta\"\n    *goto pickedname\n  #Bernadette.\n    *set name \"Bernadette\"\n    *goto pickedname\n  #Dolores.\n    *set name \"Dolores\"\n    *goto pickedname\n  #Yolanda.\n    *set name \"Yolanda\"\n    *goto pickedname\n  #That is not my name.\n    What is it?\n    *input_text name\n    *goto pickedname\n\n*label pickedname\n\nSomebody has spelled it right, which is not nothing.\n\n*page_break\n\nThere is one photograph on the tray table, face down, because you turned it over on Friday and have not turned it back. Walter, on a folding chair at somebody's wedding in 1988, squinting.\n\n*page_break\n\nOn the windowsill there are fourteen porcelain angels.\n\nYou asked for them. Your niece brought them in two shoeboxes with dish towels between the layers, and she set them up in a row while you watched, and she was so pleased about it that you said thank you twice.\n\nEvery one of them is a woman in a nightgown.\n\nSix have harps. Two have their eyes closed in a way you did not use to mind. One is holding a lamb, and you have owned it for thirty-one years and you have never once worked out what the lamb is doing there. One is a raffle prize from the sodality in 1994 and is not, when you look at it honestly, very well made.\n\nAnd one is from Walter, the Christmas before he died, and it says GUARDIAN ANGEL WATCHING OVER ME on the base in gold, and he was not a man who bought that kind of thing, and he must have stood in a shop and picked it up and thought: yes. That one.\n\nYou have prayed to yours every day of your adult life. Out loud, most days.\n\nAnd in 1979 you gave it a name, because nobody had ever given you one and it seemed rude to keep saying *hey*.\n\n*choice\n  #Angelo.\n    *set angelname \"Angelo\"\n    *goto namedit\n  #Buddy.\n    *set angelname \"Buddy\"\n    *goto namedit\n  #Sunshine.\n    *set angelname \"Sunshine\"\n    *goto namedit\n  #Pete.\n    *set angelname \"Pete\"\n    *goto namedit\n  #Something else.\n    What did you call it?\n    *input_text angelname\n    *goto namedit\n\n*label namedit\n\n${angelname}. You were twenty-six and you were doing your best.\n\n*page_break\n\nYou put your hand out.\n\nIt is not a rampage. It is one motion with your forearm, and it takes about a second and a half, and then it is very loud and then it is very quiet and you are still sitting there with your arm out.\n\nNobody comes. Somewhere down the hall a machine is going off and it has been going off for ten minutes and nobody is coming for that either.\n\nYou say, to the ceiling, in a completely ordinary voice:\n\n*line_break\n*line_break\nI have talked to you every day since 1979.\n\nI made up a name for you because nobody ever gave me one.\n\nI have got nothing back in forty-five years that I could point at and say, that. That was you.\n\nAnd they took the other leg on Thursday.\n*line_break\n*line_break\n\nThat is the whole prayer. It is not blasphemy. There is a whole book of the Bible where a man says considerably worse and God's complaint at the end of it is not about the tone.\n\n*page_break\n\n*comment ---- 0.3 : something is in the room ----\n\nThere is something in the room.\n\nYou know before you look, the way you know when a person has come up behind you in a kitchen. And when you look, the first thing you notice is not the size of it and not the light coming off it.\n\nThe first thing you notice is that it is not looking at you with any expression at all.\n\nNot a cold expression. Not a kind one. Expression is a thing that faces do, and there is no face. There is nothing in the room that is arranged for you to read.\n\nIt does not have a harp. It does not have a nightgown. It is not a woman. It is not a man either, and the more you look at it the more you understand that neither of those words was ever going to be any use here, and that you have spent forty-five years talking to something you had the wrong shape for entirely.\n\nYou are not afraid, which surprises you.\n\nYou are furious, which does not.\n\n*page_break\n\nWhat do you say to it?\n\n*choice\n  #\"Get out.\"\n    You have thrown people out of rooms before and it has always worked.\n    *line_break\n    *line_break\n    It does not move. It does not indicate that it has declined to move. It is simply still there, the way a wall is still there, and you understand that you have just said *get out* to a wall.\n    *set hope %-5\n    *goto whereveryouwere\n\n  #\"Where were you?\"\n    You do not plan to say it. It comes out the way a cough comes out.\n    *line_break\n    *line_break\n    Something happens then — not a change of expression, because there is no face for one — but something in the room *turns toward the question*, the way a dog's ears turn.\n    *line_break\n    *line_break\n    It does not answer. Not yet. You will get that answer, but you have forty-nine years to go first, and neither of you knows that yet.\n    *set charity %+20\n    *set hope %+10\n    *goto whereveryouwere\n\n  #\"You're not real. I'm on morphine.\"\n    A reasonable position. You are, in fact, on morphine.\n    *line_break\n    *line_break\n    \"You are on four milligrams,\" it says, \"and you took the last one at eleven, and you have never in your life hallucinated anything, and you are stalling.\"\n    *line_break\n    *line_break\n    You are stalling.\n    *set hope %+5\n    *goto whereveryouwere\n\n  #Nothing. You look at it and you wait.\n    You are good at this. You waited out Walter, two children and a county pension office.\n    *line_break\n    *line_break\n    It is better at it than you are. It is not even trying.\n    *set hope %+5\n    *goto whereveryouwere\n\n*label whereveryouwere\n\n*page_break\n\n*comment ---- 0.4 : the arrangement ----\n\n\"You broke your statues,\" it says.\n\n\"They were mine.\"\n\n\"Yes.\"\n\n\"Fourteen of them and not one of them looked anything like you.\"\n\n\"No,\" it says. \"They did not.\"\n\nYou wait for the rest of it. In your experience there is always a rest of it, and it usually starts with *now.*\n\nThere is no rest of it. It is just standing there having agreed with you, and after a while you realise it is going to keep standing there having agreed with you until you say something else.\n\n*page_break\n\nSo you say: \"Well? Are you going to do something, or what?\"\n\n\"I am waiting to be told what to do.\"\n\n\"By who?\"\n\n*page_break\n\n\"You.\"\n\n*page_break\n\n*comment ---- 0.5 : she does not take this well ----\n\nThe apple juice is still on the tray. The machine down the hall has stopped. You have been in this room for eleven days and this is the first thing that has happened in it.\n\n\"I'm sorry,\" you say. \"*What?*\"\n\n\"There is a man,\" it says. \"He is not in this room. He was given to me before he existed and I have been beside him since, and he has never known it, and he has about nine hours left. For as long as this lasts, what I am to do about him will reach me through you.\"\n\n\"Through *me.*\"\n\n\"Yes.\"\n\n\"Why?\"\n\n\"Because you broke your statues.\"\n\n*choice\n  #\"That's not a reason. That's a punishment.\"\n    \"It may be both,\" it says. \"Those are not opposites. A man was struck dumb for nine months for a smaller question than the one you asked, and it was the best thing that ever happened to him, and he wrote a song about it afterwards.\"\n    *line_break\n    *line_break\n    \"I'm not writing anything.\"\n    *line_break\n    *line_break\n    \"No,\" it agrees.\n    *set hope %-5\n    *goto refuse\n\n  #\"I'm not qualified.\"\n    \"No,\" it says. \"That is correct and it does not change anything. I am not going to explain the arrangement to you and then take it back because you have raised an objection to it. You have raised a good objection. It is still the arrangement.\"\n    *set charity %+10\n    *goto refuse\n\n  #\"What if I get it wrong?\"\n    \"You will.\"\n    *line_break\n    *line_break\n    You wait for the part where it softens that.\n    *line_break\n    *line_break\n    It does not soften that.\n    *set hope %-10\n    *goto refuse\n\n  #\"What if I tell you to do something wicked?\"\n    \"Then I will not do it, and you will have found out something about the arrangement that I would rather you found out now than later.\"\n    *line_break\n    *line_break\n    \"That's it? That's the whole safety catch?\"\n    *line_break\n    *line_break\n    \"It has held for a while,\" it says.\n    *set_hidden tried_to_make_him_sin true\n    *set charity %+10\n    *goto refuse\n\n*label refuse\n\n*page_break\n\n*comment ---- 0.6 : the formation, stated once and not repeated ----\n\n\"There is one more thing and then we will begin.\"\n\nYou have a bad feeling about the one more thing.\n\n\"I am not what I will be,\" it says. \"What you decide is not only going to reach him. It is going to reach *me.* Every time you choose, some part of what I am hardens into the shape you chose, and it does not come back, and at the end of this I will be a particular kind of thing forever, and the kind will be the one you made.\"\n\nYou look at it for a while.\n\n*choice\n  #\"So God is letting a woman with no legs and a tenth-grade education build an angel.\"\n    \"Yes.\"\n    *goto whydothat\n  #\"So this is Build-A-Bear. I am in a hospital bed at Build-A-Bear.\"\n    \"I do not know what that is.\"\n    *line_break\n    *line_break\n    \"You pick out the fur, and you pick out the little voice box, and then you put a heart in it, and you have to kiss the heart first. My granddaughter made a rabbit.\"\n    *line_break\n    *line_break\n    \"Then yes,\" it says. \"It is somewhat like that.\"\n    *line_break\n    *line_break\n    \"Oh, *don't*.\"\n    *goto whydothat\n  #\"You have had four seconds. I have had seventy years. Which of us should be doing this?\"\n    \"Neither of us was consulted,\" it says.\n    *goto whydothat\n  #Nothing. You look at it for a while.\n    You look at it for a while. It waits. It is extremely good at waiting and you are about to find out how good.\n    *goto whydothat\n\n*label whydothat\n\n\"Why would He do that?\"\n\n*page_break\n\n\"I have wondered,\" it says, \"whether it is because you told Him, every day for forty-five years, that you would have done it differently.\"\n\n*set formed true\n\n*page_break\n\n*comment ---- 0.7 : the end of Adam, four seconds ----\n\nYou are going to say something. You have several things ready.\n\nAnd then the room is gone.\n\n*image adam-room.webp A dim room, late afternoon, a bed seen from the doorway.\n\nYou are standing in a doorway. It is October and it is afternoon, and the light coming in is the colour of weak tea. There is a bed. There is a shape in the bed that is a man, and he is not old, and he is very near the end of something, and there is a chair beside him with nobody in it.\n\nAnd you know this room.\n\n*page_break\n\nNot the man. You have never seen the man. **The room.**\n\nYou have never been in it and you know it anyway, and the knowing is physical and slightly sickening, like missing a step in the dark. You know the ceiling tile with the water stain on it. You know the exact grey of that light and what time it has to be for the light to do that. You know, without going over there, that the window looks at the third level of a parking structure.\n\n*page_break\n\nYou have about four seconds and you spend every one of them on the wrong thing.\n\nYou look at the window. You look at the chair. You look at a jar of something on the nightstand, and the strip of light on the floor, and the door frame, and the ceiling again — turning the room over the way a woman turns a house over looking for her glasses, hunting for whatever it is that is doing this to you.\n\nAnd by the time it occurs to you to look at his face, you are already going.\n\n*page_break\n\n*set_hidden glimpsed true\n\n\"That was the end,\" it says.\n\n\"Bring me back. I wasn't ready, I didn't see —\"\n\n\"No.\"\n\n\"I need to see how it —\"\n\n\"You will,\" it says. \"In forty-nine years.\"\n\n*page_break\n\nAnd then there is no room, and no parking structure, and no floor.\n\nAnd no light yet either.\n\n*achieve argued\n\n*finish\n", "assembly": "*comment ============================================================\n*comment SCENE ONE — THE ASSEMBLY\n*comment ~4,000 words. The angels are made, described, and named by\n*comment kind. The angel sets the scene in dialogue. Lucifer summons\n*comment them to look and SHE decides whether hers goes — and what\n*comment that does, it does to HIM, permanently. Then the war, in\n*comment which the angel acts and she commands.\n*comment ============================================================\n\nThere is no light.\n\nYou want to say it is dark, but dark is a thing that happens in rooms, and this is not that. There is no room. There is nothing at all, and you are in the middle of it, and you are not frightened, because being frightened is also something that happens in rooms.\n\n*page_break\n\nThen there is light, and the light is not from anywhere.\n\nAnd then everything that is ever going to exist except the world begins to exist, all at once, in front of you.\n\n*page_break\n\n*comment ---- the making ----\n\nIt is not gradual and there is no sound.\n\nOne instant there is nothing. The next instant the whole of that emptiness is full of enormous living creatures, standing, in ranks, going back further than you can follow — and not one of them was there a moment ago and not one of them is confused about being here.\n\nThey are made in the same instant. All of them. There is no first one and no last one, and the ones nearest to you are still opening their wings for the first time when the ones a mile back have already turned to face the light.\n\n*page_break\n\nAnd then, about a foot from your left shoulder, one of them is standing.\n\n*page_break\n\n*comment ---- hers ----\n\nIt is about eleven feet tall.\n\nIt has a face and the face is not a person's face and you cannot afterwards tell anybody what is wrong with it, because nothing is wrong with it; it is simply not made out of the parts a face is made out of and it is looking at you.\n\nThere are four wings. Two of them are folded down and hold light the way a wet road holds light. The other two are not folded and are the reason you have taken a step back.\n\nIt is armed. There is a shield on its left arm, oval, taller than a man, and a sword at the hip that is not drawn, and neither of those existed four seconds ago either.\n\n*page_break\n\nAnd you are afraid.\n\nNot startled. Not nervous. You are experiencing the specific thing that every single person in Scripture experiences at this exact moment and that the Bible does not bother to describe because everyone who has had it already knows — a flat, physical, animal dread that has nothing to do with danger and does not go away when you understand that you are not going to be hurt.\n\n*page_break\n\nEvery angel in that book opens with the same sentence and you always thought it was a formality.\n\nIt is not a formality. It is a *safety instruction.*\n\n*page_break\n\n\"Do not be afraid,\" the angel says.\n\n\"That is not going to work.\"\n\n\"No,\" it agrees. \"It never does. We say it anyway.\"\n\n*page_break\n\n*comment ---- the dialogue that sets the scene ----\n\n\"Where are we?\"\n\n\"In the beginning.\"\n\n\"The beginning of *what*?\"\n\n\"Of everything that is not God,\" the angel says. \"This is the first day. That is the first hour of it. We are about four seconds old, all of us, including me, and you are the only thing here that has ever been anywhere else.\"\n\n*page_break\n\n\"And you're —\"\n\n\"Yes.\"\n\n\"You're the one I've been —\"\n\n\"Since 1979,\" it says. \"Yes.\"\n\n*page_break\n\nYou look at eleven feet of armed creature with four wings and a face you cannot hold in your head.\n\n\"I have been calling you ${angelname},\" you say.\n\n\"I know.\"\n\n\"It's a stupid name.\"\n\n\"Yes,\" the angel says.\n\n*page_break\n\n*comment ---- the kinds ----\n\n\"What are the others?\"\n\n\"Look at them and I will tell you. Start close and work outward, and stop when you cannot see any more, because that is going to happen sooner than you expect.\"\n\n*page_break\n\n*image assembly-ranks.webp Ranks of enormous winged figures on a plain of light, receding into brightness.\n\nThe ones nearest you are the ones most like a person. Two arms, two legs, a face, wings, and a shield — and they are the ones you can look at longest, and they are shoulder to shoulder in ranks that go off to both sides until they stop being individual creatures and become a texture.\n\n\"Those are the last of the nine,\" the angel says. \"The messengers, and then us. One of us for each of them, when there are any. I am standing in that rank in about eleven minutes.\"\n\n*page_break\n\nBehind them the shapes get harder to hold.\n\nThere is a rank where the creatures have too many wings — six each, and four of the six are not for flying. Two are held across the face. Two are held across the feet. It takes you a while to work out that they are covering *themselves*, not you, and that whatever they are covering themselves from is in front of them and not behind.\n\nThey are on fire. Not burning. On fire, the way a bar of iron in a forge is on fire, all the way through, as a state rather than an event.\n\n*page_break\n\n\"Seraphim,\" the angel says. \"Do not try to hear what they are saying to each other. You will and you should not.\"\n\n*page_break\n\nFurther back, and worse.\n\nFour faces on one creature, arranged around a head that has no back to it: a man, a lion, an ox, an eagle, and all four of them awake at once and none of them the main one. Four wings. Feet like a calf's foot, polished, which is somehow the detail that undoes you. Between them and under them there is something moving that is the colour of coals when you have knocked the ash off.\n\nAnd they do not turn. When they go, they go straight — every direction is already in front of them, so they never once turn around, and watching a thing that large move without turning is the point at which you have to look at your own hands for a moment.\n\n*page_break\n\n\"Cherubim,\" the angel says.\n\n\"They're *guarding* something.\"\n\n\"Not yet. In about six days.\"\n\n*page_break\n\nAnd beside those there are wheels.\n\nNot on anything. Wheels standing upright, on their own, as tall as buildings, and inside each wheel there is a second wheel set crossways, and the rims are full of eyes. Not decorated with eyes. *Full* of them, set into the metal at every angle, and every one of them open, and every one of them working.\n\nThey do not look at you and you would like it noted that this is worse.\n\n*page_break\n\n\"Thrones,\" says the angel.\n\n*page_break\n\nAnd past the Thrones you lose it.\n\nThere is no wall and nothing is hidden from you. It is that your eyes — you do not have eyes; whatever you are using — stop being able to make a shape out of what is there. The further back you go, the less like a *thing* each one is, and the more like a fact, and by the time you are eight ranks back you are looking at columns of fire that are certainly alive and are certainly not anything you have a word for, and past those there is only brightness, and the brightness is not empty.\n\n*page_break\n\n\"I can't see them.\"\n\n\"No.\"\n\n\"Why can I see *you*?\"\n\n*page_break\n\n\"Because I am the nearest one to what you are,\" the angel says. \"That is the whole reason. The lower we are, the more like you we look, and the more like you we look the more of us you can hold. You are looking at the bottom of the stairs and it is the only part of the stairs you were ever going to be able to see.\"\n\n*page_break\n\n*comment ---- the throne ----\n\nAnd at the far end of all of it, on a height, there is a throne with fire on it that burns nothing.\n\nYou cannot look straight at what is on the throne. You can look at what comes off it, and that is enough — enough to know exactly Who that is, and what He is owed, and that you owe it.\n\nAnd it is not enough to make saying no impossible. There is a gap left in it, deliberately, and you are looking right at the gap.\n\n*page_break\n\n*comment ---- the speech rule ----\n\n\"How do you all talk to each other?\"\n\n\"We do not talk. If I decide to let one of them know something, he knows it — all of it, instantly, exactly as I know it. Nothing is said. Nothing comes out wrong. And nothing can be invented, because I cannot hand over a thing I do not have.\"\n\n\"So none of you can lie.\"\n\n\"None of us can lie. There is exactly one decision any of us ever gets to make about anything in our heads. Keep it, or give it.\"\n\n*page_break\n\n\"And everyone can tell which one you did,\" you say.\n\nThe angel looks at you.\n\n\"Yes,\" it says. \"How did you know that?\"\n\n\"Because I've worked in an office.\"\n\n*page_break\n\n*comment ---- the silence ----\n\nThen, up ahead in the ranks, one of them turns his back on the throne.\n\nAnd shuts.\n\nNot stops moving. *Stops letting anyone in.* For as long as this plain has existed, which is about four seconds, every mind on it has been open to every other, and now one of them is not, and the whole line feels the door close at the same instant.\n\nNothing like this has happened. There has not been time yet for anything to have happened.\n\n*page_break\n\n*comment ---- the vision ----\n\nAnd then everyone is shown something.\n\n*image annunciation.webp A room at dawn. A young woman sitting on the edge of a rumpled bed. A column of gold light standing in the corner.\n\nA room. Early — the light is still grey. A girl sitting on the edge of a bed with the covers shoved around, barefoot, her hair not done, like somebody who has just this second sat up.\n\nStanding in the corner of the room is a light. Not a lamp. It is upright, about as tall as a person, and it is looking at her.\n\nShe is looking back. She is not afraid. Her mouth is moving.\n\nThat is all of it. Nobody explains it. Nobody on this plain knows what it is, and you can feel a hundred thousand minds not knowing at once, like a held breath.\n\n*page_break\n\nYou have had that picture on a wall since you were six.\n\nNot one of them has.\n\n*page_break\n\n*comment ---- his call ----\n\nThe one who shut turns round.\n\nHe is at the head of the line. He is the brightest thing on the plain that you are able to look at, and that has to be said first, because everything after it depends on it.\n\n\"I know what that is,\" he says. \"Come and see it.\"\n\n*page_break\n\nAnd he opens what he has and holds it out.\n\nNot one word of it is twisted. Everything in his hands is exactly true and he has not bent any of it and he does not need to.\n\nWhat is not in his hands is the only thing that matters.\n\n\"Come and look,\" he says. \"Then decide. He is asking you to say yes to a thing He will not show you. I am asking less.\"\n\n*page_break\n\nAnd they go.\n\nNot all of them. Not most. But thousands break rank and go forward to look at what he is holding, and they are not rebels, and they are not fools, and a great many of them are going to come back and refuse him.\n\n*page_break\n\nYour angel turns to you.\n\n\"Do I go?\"\n\n*page_break\n\n*choice\n  #Go and look.\n    *set_hidden heard_him_first true\n    \"Go on. I want to know what he's got.\"\n    *line_break\n    *line_break\n    The angel goes forward with several thousand others and stands in front of him and looks.\n    *line_break\n    *line_break\n    And what it sees is exactly what he said. Every fact of it, true, entire — a girl on the edge of a bed, and what she is made of, and what she is worth by weight, and what is going to be asked of eleven feet of armed creature on her account.\n    *line_break\n    *line_break\n    It comes back. It does not agree with him. It never agrees with him.\n    *set severity %+20\n    *goto looked\n\n  #Stay where you are.\n    \"No. Stay here.\"\n    *line_break\n    *line_break\n    \"You do not want to know what it is?\"\n    *line_break\n    *line_break\n    \"I've had it on my wall since I was six,\" you say. \"I know exactly what it is. Stay where you are.\"\n    *line_break\n    *line_break\n    The angel stays where it is.\n    *set severity %-15\n    *set charity %+15\n    *goto stayed\n\n  #\"What happens if you go?\"\n    \"I do not know,\" the angel says. \"Nothing has ever happened before. This is the first thing that has ever happened.\"\n    *line_break\n    *line_break\n    You look at the thousands going forward. You look at the ones staying. Neither group is doing anything wrong and you cannot tell them apart.\n    *line_break\n    *line_break\n    \"Then stay here,\" you say.\n    *set severity %-10\n    *set charity %+10\n    *set hope %+5\n    *goto stayed\n\n*label looked\n\n*page_break\n\n*comment ---- what it did, and to whom ----\n\nYou are about to ask what he showed it.\n\n\"He was not lying,\" the angel says, before you can. \"He has never once lied. Everything he is holding out there is true.\"\n\n\"Then what's the problem?\"\n\n*page_break\n\n\"There is a thing he left out, and it is the only thing that matters, and he can leave it out because it is not a fact.\" A pause. \"The thing he left out is *and that is good.* Facts are the only thing any of us can hand over. What you make of a fact stays inside, where nobody can reach it, and that is where he has gone.\"\n\n*page_break\n\n\"All right,\" you say. \"So you went and looked and he was wrong and you came back. No harm done.\"\n\n*page_break\n\nThe angel does not answer for a moment.\n\n*page_break\n\n\"I am going to say this once, because you will need it in about forty-nine years.\n\n\"I did not agree with him. I have never agreed with him and I never will and that was settled before I went. But the first account of a human being that I ever received, I received from him. Every one I have looked at since, I have looked at with his figures already in my hand.\n\n\"It did not change my mind. **It changed my eye.**\"\n\n*page_break\n\n\"That's — I *sent* you. That was me. I told you to —\"\n\n\"Yes,\" the angel says. \"That is how this works. You have just done the first thing you will ever do to me and it is permanent, and I am not blaming you, and I would like you to notice that it took four seconds and it did not feel like anything at the time.\"\n\n*goto michael\n\n*label stayed\n\n*page_break\n\nYou watch thousands of them go forward and look, and you watch most of them come back, and it is impossible to tell from here which are which.\n\n\"What did he show them?\"\n\n\"Facts,\" the angel says. \"All of them true. He has never lied and he is not lying now. What he leaves out is *and that is good*, and he can leave it out because that is not a fact, it is a judgement, and a judgement stays inside where nobody can reach it.\"\n\n*page_break\n\n\"So the ones who went and looked —\"\n\n\"Most of them are standing over there refusing him right now. They will be fine.\" A pause. \"They will also never look at a human being again without his figures in their hand. It did not change their minds. It changed their eyes, and it is not undone, and none of them thought it was worth anything at the time.\"\n\n*page_break\n\nYou look at eleven feet of armed creature that did not go, because you told it not to.\n\nYou do not say anything, and neither does it.\n\n*goto michael\n\n*label michael\n\n*page_break\n\n*comment ---- his assent : hers to watch, not to make ----\n\nAnd then, from the middle of the ranks — not from the front, not from any of the burning ones, not from under any standard — four words.\n\n*line_break\n*line_break\n**\"Who is like God?\"**\n*line_break\n*line_break\n\nIt does not answer him. It does not take up one single thing he said. It walks straight out of the argument and stands somewhere else, and that turns out to be the only move there has ever been.\n\n*page_break\n\nAnd beside you the angel does something.\n\nYou do not see it decide. There is nothing to see. There is no pause and no weighing and no working it through — one instant it is a creature that has not answered and the next instant it is a creature that has, and the whole of it went into the answer at once, and there is none of it left over.\n\n*page_break\n\n\"Tell me what to do,\" you say.\n\n\"That one was not yours,\" the angel says. \"That one was mine. It is the only thing I will ever do that nobody could do for me and nobody can take off me, and it is finished.\"\n\n*page_break\n\nThen it brings its shield up off its shoulder and sets its feet.\n\n\"Everything after it is yours. Starting now, and you should know that I am not going to move until you say something.\"\n\n*page_break\n\n*comment ============================================================\n*comment ---- THE WAR ----\n*comment ============================================================\n\nThe line closes.\n\nIt takes about a second and there is nothing beautiful about it. Shields come across and overlap — left edge over the right edge of the shield beside it, so that every one of them is holding half a shield in front of the one on their left and trusting the one on their right to do the same. The rank behind steps up and puts a hand flat on the back of the rank in front.\n\nYou are behind your angel with a shield you did not ask for and both your legs.\n\n*page_break\n\n*comment ---- and everything else, fighting its own way ----\n\nAnd the rest of it does not fight like that at all.\n\nThe messengers are not in the wall. They are above it, in numbers, at a height, going back and forth along the line so fast that what you actually see is a disturbance in the light like heat over a road.\n\nThe four-faced ones are not in ranks either. They are out on the flanks and they are not advancing, they are simply *arriving* — one moment on the left, one moment nine hundred yards away on the right, without crossing anything in between, because every direction is already in front of them and they have never turned round in their lives.\n\nThe wheels are turning where they stand, and every eye in every rim is open, and none of them is looking at the enemy.\n\nAnd behind all of it, at a height, there are columns of fire that you cannot resolve into anything, and they are not moving, and it is very clear that whatever they are doing is the largest thing happening here and that you are not going to be shown it.\n\n*page_break\n\n\"What are the ones on fire doing?\"\n\n\"Burning,\" your angel says.\n\n\"That's not —\"\n\n\"That is the answer,\" it says. \"Ask me in about a hundred thousand years.\"\n\n*page_break\n\n*comment ---- what the wall is for ----\n\nAhead of you, four hundred yards of clear ground, and then their line, doing the same thing.\n\n\"What are the shields *for*?\" you say. \"Nothing here can be cut. Nothing here bleeds. What are we —\"\n\n\"Listen,\" says your angel.\n\n*page_break\n\nAnd you listen, and you can hear him.\n\nHe has not stopped talking since he turned round. He is behind their line and he is still going, and what every shield on this plain is doing — the wall, the flanks, the wheels, all of it — is keeping his voice off the ones standing behind you.\n\n*page_break\n\nBecause there are ones behind you who have not answered.\n\nNot many. A few thousand, in the rear, unarmed, and they can hear him perfectly well, and every second the line holds is a second they get to think without him in it.\n\n*page_break\n\n**A gap in this wall is not a place a sword gets through. It is a place a voice gets through.**\n\n*page_break\n\n*comment ---- ENGAGEMENT ONE ----\n\nTheir line starts forward.\n\nYour angel does not move. It has not moved since it set its feet. It turns its head about four inches, which on a creature that size is a considerable gesture, and it says:\n\n\"Tell me.\"\n\n*choice\n  #HOLD. Lock up and let them come.\n    *set valor %-20\n    *set severity %+15\n    *set_hidden tactic 1\n    \"Hold. Don't give them a foot.\"\n    *line_break\n    *line_break\n    Your angel hands it to the two beside it and they hand it on, and the word goes down four miles of line faster than a word can go, and the whole of it sets — feet braced, shields down hard, the rank behind leaning in.\n    *line_break\n    *line_break\n    They come in at a walk and hit like a building falling over. Nothing gives. Nobody is hurt, because nobody here can be hurt, and it is the most violent thing you have ever stood behind.\n    *line_break\n    *line_break\n    You hold for what feels like an hour. Behind you, several hundred minds decide, in the quiet, and decide well.\n    *goto engagement2\n\n  #ADVANCE. Walk it forward. Take the ground off them.\n    *set valor %+20\n    *set severity %+10\n    *set_hidden tactic 2\n    \"Forward. Walk it into them.\"\n    *line_break\n    *line_break\n    Your angel puts its shoulder into the shield and steps, and the line steps with it, and it is not a charge and it is not supposed to be — it is a slow grinding shove across four hundred yards that takes everything the wall has.\n    *line_break\n    *line_break\n    It works. They get the ground. And the line is longer now than it was, and thinner, and you can see it thin from where you are standing.\n    *goto engagement2\n\n  #THE WEDGE. Find the seam in their line and drive a point into it.\n    *set valor %+25\n    *set splendor %+20\n    *set_hidden tactic 3\n    \"There. That seam, on the left — put a point in it and go through.\"\n    *line_break\n    *line_break\n    Your angel says one thing to the two beside it and the line folds itself into a triangle in about four seconds, and your angel is nine ranks from the tip and moving up.\n    *line_break\n    *line_break\n    The point goes into the seam you picked and the seam opens.\n    *line_break\n    *line_break\n    They are through. It is the loudest thing that has ever happened.\n    *line_break\n    *line_break\n    And there is a hole behind them where their own line used to be joined.\n    *goto engagement2\n\n*label engagement2\n\n*page_break\n\n*comment ---- ENGAGEMENT TWO : the gap ----\n\nAnd then there is a gap.\n\n*if (tactic = 3)\n  It is the one you made. It was always going to be the one you made.\n*elseif (tactic = 2)\n  Somewhere off to the right the line got thin enough, and something leaned on the thin part, and it opened about the width of a door.\n*else\n  Off to the left, one of them under a standard went forward when he should not have, on his own, for a reason that is his and that you will never learn.\n\n*page_break\n\nIt is about the width of a door.\n\nAnd through it, perfectly clearly, into the rear ranks where the unarmed ones are standing, comes his voice.\n\n*page_break\n\nYou can hear what he is saying to them. It is not what he said before. It is smaller and better aimed and it is addressed to each of them by what they are, and there is no answer to it anywhere on this plain, because it is not an argument.\n\n*page_break\n\nYour angel has already turned round. It is looking at you and it is not looking at the gap.\n\n\"Tell me. Now.\"\n\n*choice\n  #\"Get in it. You. Now.\"\n    *set valor %+25\n    *set charity %+20\n    *set severity %-10\n    Your angel goes.\n    *line_break\n    *line_break\n    It goes out of the wall at a run, which you did not know it could do, and it puts itself in the hole with nothing on its left because there is nobody on its left, and it holds the gap with a shield and a shoulder and the whole of a will that is four seconds old.\n    *line_break\n    *line_break\n    It closes. It costs the right flank, which sags while nobody is looking at it.\n    *goto engagement3\n\n  #\"Leave it. Push somewhere else and make them close it.\"\n    *set severity %+25\n    *set valor %+15\n    *set charity %-10\n    Cold, and correct.\n    *line_break\n    *line_break\n    Your angel does not look at the gap again. It puts everything into the far side, and their line has to answer that, and answering it costs them the ones they had standing in the gap, and it shuts on its own in about a minute.\n    *line_break\n    *line_break\n    A minute is a long time to have a door open.\n    *goto engagement3\n\n  #\"Forget the gap. Go and stand in front of the ones behind it.\"\n    *set charity %+30\n    *set splendor %-20\n    *set valor %-10\n    Your angel leaves the wall entirely.\n    *line_break\n    *line_break\n    Everything on that plain sees it do it and nothing follows it. It goes back through its own ranks to the unarmed ones at the rear and stands in front of them — one creature, one shield, in the open, in the way.\n    *line_break\n    *line_break\n    They can still hear him. But now they can see something standing between them and him, and it turns out that being stood in front of does a thing that arguing does not.\n    *goto engagement3\n\n  #\"I don't know. You decide.\"\n    \"I cannot,\" your angel says. There is no impatience in it at all. \"I have not been given anything to decide with. You are what I have been given.\"\n    *line_break\n    *line_break\n    \"I don't *know* —\"\n    *line_break\n    *line_break\n    \"Say something.\"\n    *line_break\n    *line_break\n    You say the first thing in your head, which is *close it*, and the wall closes badly, in a way that costs four hundred yards and eleven of the ones at the rear.\n    *set hope %-15\n    *set valor %-15\n    *goto engagement3\n\n*label engagement3\n\n*page_break\n\n*comment ---- ENGAGEMENT THREE : the last one ----\n\nAnd then it is nearly over, and there is one left.\n\n*page_break\n\nOne of them, in the open, halfway between the two lines, that has not answered. It has been standing there the whole time. It is not hiding and it is not running — it is simply out there in the middle of a battle, unarmed, working it out, and everything on both sides has been going round it for an hour.\n\nTheir line is closing. In about forty seconds it will be behind theirs, and it will still be free, and it will still get to choose — and it will be choosing with his voice a foot away and nothing else in earshot.\n\n*page_break\n\nYour angel is watching you.\n\n\"Tell me.\"\n\n*choice\n  #\"Go and get it.\"\n    *set valor %+25\n    *set charity %+25\n    *set_hidden rescued true\n    Your angel breaks the line a second time and goes out into open ground, and every eye in every wheel on that plain turns at once, which is the only time all day that they do.\n    *line_break\n    *line_break\n    It gets there. It puts its shield over the thing and walks it back with an arm across it the whole way, at a walk, not hurrying, while thousands of creatures on both sides watch it do it.\n    *line_break\n    *line_break\n    It comes back with it.\n    *goto endwar\n\n  #\"Hold the line. It has to choose on its own.\"\n    *set valor %-25\n    *set severity %+20\n    *set charity %+15\n    \"No. Leave it. It has to do this by itself.\"\n    *line_break\n    *line_break\n    Your angel does not move. Everything about eleven feet of armed creature is pointed at that open ground and it does not move one inch, because you told it not to.\n    *line_break\n    *line_break\n    The thing in the open works it out by itself, with four seconds left, and comes in running.\n    *goto endwar\n\n  #\"Say something to it. Shout.\"\n    *set splendor %+30\n    *set valor %+10\n    \"Say something. I don't care what. Let it hear a voice that isn't his.\"\n    *line_break\n    *line_break\n    Your angel puts the four words into the open ground with everything it has, and it is the first sound you have heard on this plain that was made on purpose to be heard.\n    *line_break\n    *line_break\n    The thing in the open looks up.\n    *goto endwar\n\n*label endwar\n\n*page_break\n\n*comment ---- the fall ----\n\nAnd then it is over, and the way it is over is not a rout and not a surrender.\n\nThey go down.\n\nNot thrown, exactly — though *thrown* is the word that gets used later and it is close enough. They turned away from the only thing holding them up, and they kept turning, and there was nowhere else to go.\n\nA third of the lights on that plain go out at once.\n\n*page_break\n\nAnd where they were is not dark. It is worse than dark. It is a shape in the middle of the light that the light does not go into.\n\n*page_break\n\n*if (rescued)\n  The one your angel went out and got is standing four feet away, and he will not look at anybody, and you understand that he is going to be like this from now on. He is the one who took too long. That is in him permanently, the way everything decided today is in everybody permanently, and there is no undoing it and nobody is going to try.\n\n  In 1931 he is going to be given a woman in Tbilisi who takes too long about everything — who cannot make up her mind, who stands in doorways, who is still deciding at eighty-one what she should have said in 1949.\n\n  He is going to be exactly the right angel for her.\n\n  Nobody is ever going to tell either of them why.\n  *page_break\n\n*comment ============================================================\n*comment ---- WHAT THAT WAS ----\n*comment ============================================================\n\nThe shield is gone off your arm. So are your legs.\n\nYou are sitting down, or you would be if there were anything to sit on, and you are shaking, and you do not have a body to shake with.\n\n*page_break\n\n\"What,\" you say, \"in the name of God, was *that.*\"\n\n*page_break\n\n\"A war,\" says the angel.\n\n\"There were *shields.* There was a wedge. You had a *sword on your hip* —\"\n\n\"Yes.\"\n\n\"Was any of it real?\"\n\n*page_break\n\n\"All of it,\" the angel says. \"And you saw about as much of it as a photograph of a house shows you of living in the house.\"\n\n*page_break\n\n\"Nothing here has a body. Nothing was cut and nothing bled and there was no ground under you and there were no shields — and every single thing you did, you did, and it counted, and it is why several hundred of us are on this side of the line instead of the other one.\n\n\"There was a wall and the wall was real. It was not made of light and it was not made of anything. What it was made of is that several thousand of us decided, in the same instant, to stand between him and them and not move. There is no word in your language for that. There is no picture of it either. *Shield* is the best one that exists and it is not a bad one.\"\n\n*page_break\n\n\"So you dressed it up. For me.\"\n\n\"No.\" Very flat. \"A man wrote this down once. He saw a dragon, and a woman standing on the moon, and a lamb that had been killed and was walking about. He was not decorating anything. He was being *accurate*, at the only resolution he had — and so were you, and so was I when I put a shield on your arm, because you were not going to survive the other way of seeing it.\"\n\n*page_break\n\n\"And the legs?\"\n\n\"You have never needed legs to stand between two things,\" the angel says. \"You are going to find that out again in about forty-nine years.\"\n\n*page_break\n\n*comment ---- the orders, and the ninth ----\n\nThere is work. Not the same work for all of them.\n\nThe plain is ordered — it was ordered from the first second and you had simply not noticed, the way you do not notice the shape of your own hand.\n\nThere are the ones on fire, who stand nearest and do nothing else. There are the four-faced ones, who are about to be given a garden. There are the wheels. There are ones who are given a nation, and ones who are given a Church, and ones who go where the fallen are and hold them off and consider that enough forever.\n\nAnd at the bottom — the word is not an insult, it is just where it is — the last of the nine.\n\nNot a nation. Not a Church. Not an army.\n\nOne person. One. Each.\n\n*page_break\n\n\"That's you.\"\n\n\"That is me.\"\n\n\"You were nine ranks from the *tip of the wedge.* I watched you go in.\"\n\n\"Yes.\"\n\n\"And they're giving you one man.\"\n\n\"Yes.\"\n\n*page_break\n\nYou look up at eleven feet of armed creature that has just fought a war and is being handed, as its portion, a baby in Pittsburgh.\n\n\"Does that bother you?\"\n\n\"No,\" it says. \"Later you will meet minds that assume it must. They will be wrong.\"\n\n*page_break\n\n*comment ---- the commission ----\n\nOne of the burning ones comes down the line.\n\nYou cannot look at it. It does not acknowledge you at all — not rudely; you are simply not what it is here about.\n\n\"His name is Adam Kowalczyk. He will be born in four hours, in Pittsburgh, in a hospital on the side of a hill, to two people who are frightened in different ways and will not discuss it. You will be there before the doctor is.\"\n\nYou wait for more.\n\n\"That is the commission. Everything else you work out yourself.\"\n\nThere is no more.\n\n*page_break\n\n*comment ---- her one question ----\n\n\"She may ask one thing,\" it says, and it is talking about you, and it is still not looking at you.\n\n*page_break\n\nOne thing. About a man who does not exist yet, whose whole life you are about to spend, and about whom you know exactly one fact: that in October of 2024 he will be in a bed in the middle of the afternoon with nobody in the chair.\n\n*choice\n  #\"What is he going to suffer?\"\n    You get the shape of it and not one second of the timing, and for forty-nine years you will see it coming and never know when.\n    *set_hidden asked_for 1\n    *set severity %+15\n    *goto go\n\n  #\"Who is he going to love?\"\n    You get the names and not the outcomes. You will meet a nine-year-old girl in 1984 already knowing she is in this, and not knowing how, and it will be unbearable.\n    *set_hidden asked_for 2\n    *set charity %+15\n    *goto go\n\n  #\"What is he going to be good at?\"\n    You get his gift, whole, in one piece. Then you spend forty-nine years watching a man not use it.\n    *set_hidden asked_for 3\n    *set severity %+10\n    *set hope %-10\n    *goto go\n\n  #\"Nothing. I'll find out.\"\n    The burning one does not react. Your angel does — not visibly, because there is nothing on it to be visible with, but you have been talking to it since 1979 and you know.\n    *set_hidden asked_for 4\n    *set charity %+25\n    *set hope %+15\n    *goto go\n\n*label go\n\n*page_break\n\nAnd then there is no plain, and no throne, and no line, and no wheels.\n\nIt is 1975, and it is June, and it is raining.\n\n*finish\n", "fourhours": "*comment ============================================================\n*comment SCENE TWO — FOUR HOURS\n*comment 1975. ~1,000 words, 4 choices.\n*comment Job: hit every limit inside ten minutes. Establish\n*comment culpability:unknown. First sight of them — and she cannot\n*comment get a count.\n*comment ============================================================\n\nMagee-Womens Hospital sits on the side of a hill in Oakland and it is the fourteenth of June, 1975, and it is raining the way it rains in June, warm and without conviction.\n\nYou are inside before the doctor is.\n\n*page_break\n\nThere is a woman on the bed who is twenty-two and whose name is Ewa, and she is doing this without much help because it is 1975 and that is the arrangement. Her husband is in a corridor. He has been in the corridor for two hours and he has smoked four cigarettes in a stairwell and come back each time and sat down again and not said anything to anybody.\n\nAnd there is a woman in the corridor too, seventy-seven years old, in a coat she has had since the war, working a rosary with her thumb.\n\n*page_break\n\nAnd then there is a person in the room who was not there four seconds ago.\n\nYou have seen a lot of babies. You have had two. You are not prepared for this at all, because what you are looking at is not a baby, or not only — you are seeing him the way your angel sees him, which is all of him at once, from the outside, entirely.\n\nYou know his weight. You know his temperature. You know the rate of his heart and that his left hand is a little slower to open than his right and that he will be right-handed and that this is already decided in him and nobody will know it for three years.\n\n*page_break\n\nAnd you cannot get in.\n\nNot a crack. Not a sliver. You are looking at a person from the outside with perfect clarity and there is a door in the middle of him that you are not going through, now or ever.\n\n\"What's in there?\" you say.\n\n\"I do not know.\"\n\n\"You don't *know?* You just told me the temperature of his —\"\n\n\"I know everything about him that can be known from outside,\" it says. \"There is exactly one Person who can see into that room and I am not Him. Neither are you. Neither is anything else that was ever made.\"\n\n*page_break\n\n*comment ---- 2.2 : the panel, and the word that never changes ----\n\nAnd there is a thing you can see now, off to the side, the way you can see your own nose if you think about it.\n\nThere are numbers.\n\nSome of them are about your angel — you do not understand them yet and you will spend forty-nine years learning to read them. Some of them are about the boy. And there is one that is not a number at all. It is a word, and the word is:\n\n*line_break\n*line_break\n**unknown**\n*line_break\n*line_break\n\n\"What's that one?\"\n\n\"Whether he is guilty of anything.\"\n\n\"He's four minutes old.\"\n\n\"Yes. And that word will not change when he is nine, or eighteen, or forty-three, or in the last hour. Not once, in the whole of it.\"\n\n*page_break\n\n\"Why not?\"\n\n\"Because to know whether a person is guilty you have to know what he understood and what he agreed to, and both of those are in the room I cannot enter.\" It does not say this heavily. It says it the way you would say the bus is late. \"You are going to want that word to change. It is going to be the hardest thing about this. I am telling you now so that you stop waiting for it.\"\n\nYou look at the word for a while.\n\nIt does not change.\n\n*page_break\n\n*comment ---- 2.3 : the toolkit ----\n\n\"So what *can* you do?\"\n\n\"Try something.\"\n\n*choice\n  #Move something. Anything. Move the curtain.\n    The curtain moves. It is not dramatic — it is about what a draught would do, and a nurse glances at the window and goes back to what she is doing.\n    *line_break\n    *line_break\n    \"That is real,\" your angel says. \"That is a genuine thing I can do and it is not nothing. In 2005 something roughly that size is going to be the difference between eighteen more years and none.\"\n    *set valor %+10\n    *goto tools\n\n  #Put a thought in the mother's head. Tell her it's going to be all right.\n    Nothing happens.\n    *line_break\n    *line_break\n    \"Not *in*,\" it says. \"I can put a thing in front of a person. I cannot put a thing inside one. There is no door on that side either.\"\n    *line_break\n    *line_break\n    \"Then what's the point of —\"\n    *line_break\n    *line_break\n    \"I can make the old woman in the corridor stand up,\" it says, \"and come in, and say it out loud to her daughter-in-law's face. That is the whole trade. Everything I do for the next forty-nine years, somebody else has to actually do.\"\n    *set charity %+15\n    *goto tools\n\n  #Touch him. Just once.\n    You reach out. There is nothing there to reach with. You feel the shape of the refusal before you feel anything else, and it is not cruelty, it is more like reaching for a word in a language you were never taught.\n    *line_break\n    *line_break\n    \"No,\" your angel says. \"Not once. Not in forty-nine years.\"\n    *set severity %-10\n    *set hope %-5\n    *goto tools\n\n  #Nothing. Watch him.\n    You watch him.\n    *line_break\n    *line_break\n    Your angel does not say anything, and you understand, some hours later, that this was the correct answer and that it was not going to tell you so.\n    *set valor %-15\n    *set charity %+20\n    *goto tools\n\n*label tools\n\n*page_break\n\n*comment ---- 2.4 : the others ----\n\nThere is something else in the room.\n\nYou find it the way you find a wasp — not by looking, by the change in the air. It is over by the door and it is not doing anything much and it does not acknowledge you.\n\nThen there is a second one.\n\nThen you are not sure whether the second one is a second one, or whether it is the first one and you have counted wrong, and you go back and forth on this for a while and get nowhere.\n\n*page_break\n\n\"How many are there?\"\n\n\"I do not know.\"\n\n\"You said you know everything that can be known from —\"\n\n\"About *him*,\" it says. \"Not about those. Those are minds like mine and they can keep what they like, and what they have chosen to keep is how many of them there are.\"\n\n\"That's it? That's the strategy? *Confusing you about the number?*\"\n\n\"Yes,\" it says.\n\nYou laugh. It is the first time you have laughed since Thursday and it comes out badly.\n\n\"That's *pathetic.*\"\n\n\"It has worked on me for a long time,\" it says.\n\n*page_break\n\n*comment ---- 2.5 : St Casimir ----\n\nThen it is three weeks later and you are in a church on Brereton Street with green tile in the sanctuary and a radiator that knocks.\n\nIt is a small crowd. The father is here and does not know what to do with his hands. The mother has an aunt on one side of her and nobody on the other.\n\nThe old woman is holding the baby, because when the moment came Ewa's hands were shaking too badly and Halina simply put out her arms and took him and nobody said anything about it.\n\n*page_break\n\nThe priest pours the water and says the words.\n\nAnd something happens.\n\nYou are not going to be able to describe this either. Nobody in the building sees it. The priest does not see it. He is thinking about the eleven o'clock and whether the boiler is going to hold.\n\nBut something arrives in the boy that was not in him, and it is not a feeling and it is not a decoration, and the closest you can get is that a room in him that was shut is now open, and something is now living in it, and it is going to be very difficult to get out.\n\n*page_break\n\n\"Is that —\"\n\n\"Yes.\"\n\n\"Every time? Every baby?\"\n\n\"Every time. Every baby. In a hall in Manila this morning and in a hospital in Cairo tonight and here, now, in front of a radiator that knocks.\"\n\nYou watch the old woman hand him back.\n\n\"Nobody sees it,\" you say.\n\n\"No.\"\n\n*page_break\n\n*comment ---- 2.6 : Halina begins ----\n\nThat night, in a house on Dobson Street with four rooms and one furnace, an old woman gets down on the floor beside a bed — which at seventy-seven costs her something, and takes a while, and hurts — and says a name out loud.\n\n*set_ward prayers 5\n\nOne of the numbers moves.\n\nYou do not notice. There is no reason you would. It is a small number in the corner of a lot of numbers, and it has just gone up, and it is going to keep going up every night for eleven years, and then something is going to happen to it that you will not understand for another thirty.\n\n*page_break\n\nIn the kitchen, Ewa hears her mother-in-law through the wall and rolls her eyes at the ceiling, affectionately, the way you do about an old woman who prays out loud.\n\n*finish\n", "ordinarytime": "*comment ============================================================\n*comment SCENE THREE — ORDINARY TIME\n*comment 1980–1988, ages five to thirteen. ~5,200 words, 28 choices.\n*comment Job: eight years of an unremarkable boyhood with no cosmic\n*comment scenery, in which the player learns to read a child and gets\n*comment one crucial reading badly wrong.\n*comment ============================================================\n\n*comment ---- 3.1 : THE VOLUME KNOB. 1980, age five ----\n\nLiberty Avenue, a Saturday in March, and the bakery smells the way bakeries smelled before anybody thought about it.\n\nEwa is at the counter arguing pleasantly about a bill. Adam is five and is standing at hip height in front of a tray of paczki, and there is a wire rack, and the rack has a gap in it, and on the other side of the gap there is a small paper twist of hard candy that costs four cents and belongs to a man named Mr. Rzepka.\n\nYou watch him look at it.\n\nYou watch him look at his mother.\n\n*page_break\n\nAnd then you see something that you are not going to forget, and it takes about a second and a half.\n\nHe hears it. That is the part. There is something in him that says *no* — quietly, without drama, the ordinary domestic no that everybody has — and you can see it arrive, and you can see him register it.\n\nAnd then you watch him turn it down.\n\nNot argue with it. Not overrule it. He does the thing you do with a radio in another room: he simply makes it quieter, on purpose, because he wants the candy more than he wants the noise.\n\nIt works. He notices that it works.\n\n*page_break\n\nThen he puts the candy in his pocket.\n\n\"Oh, for heaven's sake,\" you say. \"It's four cents.\"\n\nYour angel does not answer.\n\nYou look at it. It is not looking at the candy. It is looking at the boy the way a man looks at a crack in a foundation wall.\n\n\"What,\" you say.\n\n\"He has just learned the most useful thing he will ever learn,\" it says. \"In about a second and a half. And nobody in this building saw it happen, and it will still be working in 1998, and there is no tool I have that touches it.\"\n\n*page_break\n\n*comment ---- choice 1 ----\n\nHe is five, and he has four cents of stolen candy in his pocket, and there is a man behind a counter who has known his grandmother for thirty years.\n\n*choice\n  #Put Mr. Rzepka's eyes on him.\n    The old man turns around at exactly the wrong moment for a five-year-old, and looks straight at the pocket, and does not say anything, and goes back to the bill.\n    *line_break\n    *line_break\n    Adam eats the candy that night under a blanket and it is the best thing he has ever tasted, and part of why it is the best thing he has ever tasted is that he got away with it while being looked at.\n    *line_break\n    *line_break\n    \"That went wrong,\" you say.\n    *line_break\n    *line_break\n    \"Most of them do.\"\n    *set severity %+15\n    *goto knob_end\n\n  #Put his grandmother's face in his head.\n    You do not put it *in.* You put it in front of him — the smell of her coat, which is in the shop because she was in the shop yesterday, and it is enough to make him think of her, and thinking of her makes him think of a thing she said about hands.\n    *line_break\n    *line_break\n    He puts the candy back.\n    *line_break\n    *line_break\n    And then, forty seconds later, at the door, he takes it again.\n    *line_break\n    *line_break\n    \"You have to be joking,\" you say.\n    *set charity %+15\n    *set severity %-10\n    *goto knob_end\n\n  #Nothing. Let him have it.\n    You let him have it.\n    *line_break\n    *line_break\n    Your angel does not object and does not approve. Nothing visible happens for eighteen years.\n    *set valor %-20\n    *goto knob_end\n\n*label knob_end\n\n*page_break\n\n*comment ---- 3.2 : HALINA. 1982, age seven ----\n\nTwo years later, and the thing you notice first about Halina Kowalczyk is that she is funny on purpose.\n\nNot warm, exactly. Warm is not the word. She is eighty-four, she has buried a husband and a country, she has opinions about the Pope, the new priest, her daughter-in-law's soup, and a neighbour called Mrs. Duda who she says has been dying since 1961 and is very good at it.\n\nShe says all this in front of Adam, in Polish and in English, and he thinks she is the funniest person alive, which she is.\n\n*page_break\n\nAnd she is teaching him to pray.\n\nShe does it badly, in the sense that she has no idea what she is doing and no training whatsoever. She does it well, in the sense that it is working.\n\nShe kneels him down beside the bed at seven o'clock. She makes him say the words out loud because *God is not a mind reader*, which is theologically wrong and which she believes with her whole chest. She tells him that when you cannot think of anything to say you say the same thing again, and that this is not cheating.\n\n*page_break\n\nShe also tells him two things that are not true.\n\nThe first is small and you will forget about it.\n\nThe second she tells him in October, sitting on the edge of the bed with her hand flat on the blanket, and it is this: that God is keeping a list, and that the list is very detailed, and that the whole business of confession is getting the list right.\n\nShe does not say it to frighten him. She says it the way you would explain a bus timetable. She is eighty-four years old and this is what somebody told her in 1908 in a village that does not exist any more, and it has held her up through two wars, and she is handing it on because it is the best thing she has.\n\n*page_break\n\n*comment ---- choice 2 : the temptation to improve on her ----\n\n*set_ward needle 1\n\nHe is seven. He makes his first confession in three weeks.\n\n*choice\n  #Correct it. Arrange for a sister at the school to put it properly.\n    It half works. Sister Anne Marie is thirty-one and reasonably well trained and she says something clear and true about mercy to a room of twenty-two children on a Tuesday.\n    *line_break\n    *line_break\n    And Adam, who is seven, files it under *school*, along with the times tables, and files what his grandmother said under *true*.\n    *line_break\n    *line_break\n    \"That is the difficulty,\" your angel says. \"She has his heart and the sister has forty minutes.\"\n    *set severity %+15\n    *set_hidden overreach 1\n    *goto halina_end\n\n  #Leave it. She is giving him something better than accuracy.\n    You leave it.\n    *line_break\n    *line_break\n    What she gives him instead is a habit, which is a thing you cannot get from a correct explanation, and which will still be operating faintly in 2018 when everything else has been gone for twenty-five years.\n    *line_break\n    *line_break\n    And the list stays in.\n    *set valor %-20\n    *set charity %+15\n    *goto halina_end\n\n  #Strengthen the parts that are right and let the rest alone.\n    You work on the habit and not the content. You make the seven o'clock easier — a night she is tired, a night he is not — and you leave her theology entirely alone, and you feel like a coward about it for eleven years.\n    *line_break\n    *line_break\n    You were not being a coward.\n    *set severity %-15\n    *set splendor %-10\n    *set charity %+15\n    *goto halina_end\n\n*label halina_end\n\n*page_break\n\nHe makes his first confession on a Saturday and comes out and his grandmother is waiting at the back and gives him a look he will remember when he is forty.\n\nHe makes his first communion in a suit that does not fit.\n\
