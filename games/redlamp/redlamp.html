<title>The Red Lamp</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --lead:#0a0705; --lead2:#120d09;
  --glass:#171009; --glass2:#20170e;
  --ink:#e8ddc9; --ink2:#a8977c; --ink3:#736550;
  --amber:#e0a94a; --cobalt:#b8892f; --ruby:#c23a34; --verd:#8a7a4a; --violet:#8f6f5a;
  --came:#000000; --rule:#2a2016;
  --fs:19px; --col:34rem;
}
:root[data-theme="light"]{
  --lead:#e6e0d4; --lead2:#efeae0;
  --glass:#faf7f0; --glass2:#f1ece1;
  --ink:#1a1510; --ink2:#544a3c; --ink3:#8a7d68;
  --amber:#8a5c10; --cobalt:#6b4a12; --ruby:#8d1f1a; --verd:#4a4222; --violet:#6b4b3a;
  --came:#1a1510; --rule:#d2c9b8;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--lead); color:var(--ink);
  font-family:Spectral,Georgia,serif; font-size:var(--fs); line-height:1.75;
  -webkit-font-smoothing:antialiased; padding-bottom:5.4rem;
  background-image:
    radial-gradient(ellipse 42% 30% at 50% 4%, rgba(194,58,52,.10), transparent 70%),
    radial-gradient(ellipse 90% 55% at 50% 108%, rgba(224,169,74,.055), transparent 72%);
  background-attachment:fixed;
}
/* ---------- the bulkhead frame ---------- */
.frame{position:fixed;inset:0;z-index:45;pointer-events:none}
.frame::before{content:"";position:absolute;inset:0;
  border:7px solid var(--came);
  box-shadow:inset 0 0 0 1px rgba(224,169,74,.10), inset 0 0 110px rgba(0,0,0,.75)}
.frame::after{content:"";position:absolute;inset:7px;pointer-events:none;
  border-top:1px solid rgba(194,58,52,.16)}

main{max-width:var(--col);margin:0 auto;padding:5.6rem 1.5rem 2rem;position:relative;z-index:1}

/* ---------- prose ---------- */
p{margin:0 0 1.2rem;text-wrap:pretty}
strong{font-weight:600;color:var(--amber)}
em{font-style:italic}
.hr{height:.55rem}
figure{margin:1.8rem 0}
figure img{width:100%;display:block}
.glazed{position:relative;border:1px solid var(--came);
  box-shadow:0 0 0 1px rgba(224,169,74,.18), 0 8px 34px rgba(0,0,0,.7)}
figure figcaption{font-family:"IBM Plex Mono",monospace;font-size:.63rem;letter-spacing:.16em;
  color:var(--ink3);margin-top:.6rem;text-transform:uppercase;text-align:center}
.imgph{aspect-ratio:3/2;background:
    linear-gradient(150deg,rgba(194,58,52,.10),rgba(224,169,74,.09) 50%,rgba(0,0,0,.2));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;
  padding:1.6rem;text-align:center;font-family:"IBM Plex Mono",monospace;
  font-size:.68rem;color:var(--ink2);line-height:1.8}
.imgph button{font-family:"IBM Plex Mono",monospace;font-size:.64rem;letter-spacing:.16em;
  text-transform:uppercase;background:rgba(0,0,0,.45);border:1px solid var(--amber);
  color:var(--amber);padding:.5rem 1rem;cursor:pointer}

/* ---------- choices : lit panels ---------- */
.choices{margin:2.4rem 0 1rem;display:flex;flex-direction:column;gap:.55rem}
button.opt{
  font-family:Spectral,Georgia,serif;font-size:1rem;line-height:1.55;text-align:left;
  color:var(--ink);border:1px solid var(--came);border-left:4px solid var(--cobalt);
  background:linear-gradient(100deg, rgba(224,169,74,.11), rgba(224,169,74,.02) 60%, transparent);
  padding:.9rem 1.15rem;cursor:pointer;position:relative;overflow:hidden;
  transition:box-shadow .18s, border-left-color .18s, transform .12s;
}
button.opt:nth-child(2){border-left-color:var(--ruby);
  background:linear-gradient(100deg, rgba(194,58,52,.13), rgba(194,58,52,.03) 60%, transparent)}
button.opt:nth-child(3){border-left-color:var(--amber);
  background:linear-gradient(100deg, rgba(184,137,47,.12), rgba(184,137,47,.02) 60%, transparent)}
button.opt:nth-child(4){border-left-color:var(--verd);
  background:linear-gradient(100deg, rgba(138,122,74,.12), rgba(138,122,74,.02) 60%, transparent)}
button.opt:nth-child(5){border-left-color:var(--violet);
  background:linear-gradient(100deg, rgba(143,111,90,.12), rgba(143,111,90,.02) 60%, transparent)}
button.opt:hover,button.opt:focus-visible{
  box-shadow:inset 0 0 42px -6px currentColor, 0 0 26px -10px var(--amber);
  outline:none;transform:translateX(2px)}
button.opt .delta{display:block;font-family:"IBM Plex Mono",monospace;font-size:.63rem;
  letter-spacing:.1em;color:var(--ink3);margin-top:.4rem}
button.cont{display:block;margin:2.4rem auto 0;font-family:"IBM Plex Mono",monospace;
  font-size:.66rem;letter-spacing:.28em;text-transform:uppercase;
  background:none;border:1px solid var(--rule);color:var(--ink2);
  padding:.68rem 2rem;cursor:pointer;transition:.18s}
button.cont:hover{border-color:var(--amber);color:var(--amber);
  box-shadow:0 0 24px -10px var(--amber)}

/* ---------- chrome ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:46;background:var(--lead);
  border-top:1px solid var(--came);box-shadow:0 -1px 0 rgba(224,169,74,.14);
  display:flex;gap:.1rem;padding:.45rem .6rem;justify-content:center;flex-wrap:wrap}
.bar button{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.16em;
  text-transform:uppercase;background:none;border:1px solid transparent;color:var(--ink3);
  padding:.5rem .72rem;cursor:pointer;transition:.15s}
.bar button:hover{color:var(--amber)}
.bar button.on{color:var(--amber);border-color:var(--amber)}
.crumb{position:fixed;top:0;left:0;right:0;z-index:46;background:var(--lead);
  border-bottom:1px solid var(--came);box-shadow:0 1px 0 rgba(224,169,74,.14);
  padding:.5rem 1.1rem;font-family:"IBM Plex Mono",monospace;font-size:.6rem;
  letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);
  display:flex;justify-content:space-between;gap:1rem}
.crumb b{color:var(--amber);font-weight:500}
.crumb .ed{color:var(--ruby)}

/* ---------- panels ---------- */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(27rem,100%);z-index:60;
  background:var(--lead2);border-left:1px solid var(--came);
  box-shadow:-1px 0 0 rgba(224,169,74,.16), -20px 0 60px rgba(0,0,0,.6);
  overflow-y:auto;padding:1.5rem 1.35rem 4rem;transform:translateX(101%);
  transition:transform .22s;font-family:"IBM Plex Sans",sans-serif;font-size:.9rem}
.panel.open{transform:none}
.panel h3{font-family:"IBM Plex Mono",monospace;font-size:.63rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink3);margin:1.7rem 0 .7rem;font-weight:400}
.panel h3:first-child{margin-top:0}
.panel .x{position:absolute;top:.7rem;right:1rem;background:none;border:none;
  color:var(--ink3);font-size:1.4rem;cursor:pointer;line-height:1}
.kv{display:flex;justify-content:space-between;padding:.42rem 0;border-bottom:1px solid var(--rule);
  font-family:"IBM Plex Mono",monospace;font-size:.74rem;color:var(--ink2)}
.kv span:last-child{color:var(--amber)}
.panel textarea{width:100%;min-height:8rem;background:var(--glass);color:var(--ink);
  border:1px solid var(--rule);padding:.65rem;font-family:Spectral,Georgia,serif;
  font-size:.95rem;line-height:1.6;resize:vertical}
.panel textarea.note{font-family:"IBM Plex Sans",sans-serif;font-size:.88rem;min-height:5.5rem}
.panel button.act{width:100%;padding:.62rem;margin-top:.5rem;background:var(--glass);
  border:1px solid var(--rule);color:var(--ink2);font-family:"IBM Plex Mono",monospace;
  font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
.panel button.act:hover{border-color:var(--amber);color:var(--amber)}
.panel button.act.prim{border-color:var(--amber);color:var(--amber)}
.jumps{display:flex;flex-direction:column;gap:1px}
.jumps button{text-align:left;background:var(--glass);border:none;border-left:3px solid var(--rule);
  color:var(--ink2);padding:.5rem .7rem;cursor:pointer;font-family:"IBM Plex Sans",sans-serif;
  font-size:.82rem;display:flex;justify-content:space-between;gap:.6rem}
.jumps button:hover{color:var(--amber);border-left-color:var(--amber)}
.jumps button b{font-family:"IBM Plex Mono",monospace;font-size:.64rem;color:var(--ink3);font-weight:400}
.noteitem{background:var(--glass);border-left:3px solid var(--ruby);padding:.55rem .75rem;
  font-size:.82rem;margin-bottom:.5rem;color:var(--ink2)}
.noteitem em{display:block;color:var(--ink3);font-size:.68rem;font-family:"IBM Plex Mono",monospace;
  margin-bottom:.28rem;font-style:normal;letter-spacing:.1em}

/* ---------- stat flash ---------- */
.flash{position:fixed;left:50%;top:2.7rem;transform:translateX(-50%);z-index:70;
  display:flex;flex-direction:row;flex-wrap:wrap;gap:.35rem;justify-content:center;
  pointer-events:none;opacity:0;transition:opacity .3s}
.flash.show{opacity:1}
.flash div{font-family:"IBM Plex Mono",monospace;font-size:.74rem;letter-spacing:.14em;
  text-transform:uppercase;padding:.32rem .8rem;background:var(--lead);
  border:1px solid currentColor;box-shadow:0 4px 18px rgba(0,0,0,.7);
  animation:rise .45s ease-out}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;bottom:4.6rem;left:50%;transform:translateX(-50%);z-index:70;
  background:var(--glass2);border:1px solid var(--amber);color:var(--amber);
  padding:.5rem 1rem;font-family:"IBM Plex Mono",monospace;font-size:.66rem;
  letter-spacing:.14em;text-transform:uppercase;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* ---------- edit affordances ---------- */
body.editing p{cursor:text;transition:box-shadow .12s}
body.editing p:hover{box-shadow:-.7rem 0 0 rgba(227,171,72,.10), .7rem 0 0 rgba(227,171,72,.10),
  0 0 0 .7rem rgba(227,171,72,.10)}
p.hasnote{border-right:2px solid var(--ruby);padding-right:.55rem}
p.edited{border-right:2px solid var(--verd);padding-right:.55rem}
p.stalenote{border-right:2px dashed var(--amber);padding-right:.55rem}
.backbtn{font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.16em;
  text-transform:uppercase;background:none;border:1px solid var(--rule);color:var(--ink3);
  padding:.35rem .75rem;cursor:pointer;margin-bottom:1.5rem}
.backbtn:hover{color:var(--amber);border-color:var(--amber)}

/* ---------- title ---------- */
.title{text-align:center;padding:2.5rem 0 1rem}
.title h1{font-size:clamp(3rem,13vw,5.2rem);margin:.6rem 0 0;font-weight:600;
  letter-spacing:-.025em;line-height:.92;
  background:linear-gradient(175deg,var(--amber),#f3d9a0 40%,var(--amber));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.title .sub{font-family:"IBM Plex Mono",monospace;font-size:.64rem;letter-spacing:.3em;
  text-transform:uppercase;color:var(--ink3);margin-top:1.3rem}
.title .tag{font-style:italic;color:var(--ink2);margin-top:1.5rem;font-size:1.05rem}
.rose{display:block;margin:0 auto}
@media(max-width:32rem){ main{padding-top:4.6rem} .arch{height:3.4rem} }
</style>

<script>
/* =================================================================
   Scriptorium engine — The Red Lamp
   ================================================================= */
const SCENES = {"__startup__": "*title The Red Lamp\n*subtitle St. Wenceslaus, Braddock Avenue\n*author Scriptorium\n\n*scene_list\n  one_door\n  two_night\n  three_dawn\n\n*comment ---------------- THE ONLY STATE THIS STORY KEEPS ----------------\n*comment No stats. No character sheet. Three facts, and the reader's memory.\n\n*comment You found the 1900-1909 register in the sacristy and read your own name.\n*create name false\n\n*comment You drank tonight. Irreversible. Locks every good ending.\n*create fed false\n\n*comment You made an act of perfect contrition. Changes the dawn and nothing else.\n*create contrite false\n\n*comment ---------------- ACHIEVEMENTS ----------------\n*achievement ondrej visible 50 Ondrej\n  Find out what you were called.\n  Found your own name in a green cloth book, written in 1904 by a man with good handwriting.\n\n*achievement stole visible 25 The Purple Stole\n  Sit in the box on the wrong side of the screen.\n  Sat where the priest sits, in the dark, with a stole on a nail beside you.\n\n*achievement rope visible 25 Ninety-One Steps\n  Go all the way up.\n  Went up ninety-one steps to look at a bell nobody has rung since 1974.\n\n*achievement kubica visible 25 Fr. Kubica\n  Find the man behind the plywood.\n  Found the founding pastor where they left him in 1931, which was a busy year for you both.\n\n*achievement thermos visible 25 Half the Thermos\n  Accept something from Verna Sowka.\n  Accepted tea from a seventy-nine-year-old woman who was frightened of you and poured it anyway.\n\n*achievement decade visible 50 One Decade\n  Say something with her.\n  Said ten of them with a woman whose beads are worn to the string on exactly one decade.\n\n*achievement contrition visible 100 Perfect Contrition\n  Be sorry for the right reason.\n  Was sorry because of who was offended, and not because of what was coming.\n\n*achievement absolved visible 100 Absolved\n  Reach 5:40 and go to the man with the keys.\n  Confessed ninety-four years to a tired priest in thirty-four minutes and was forgiven.\n\n*achievement dawn visible 100 A Happy Death\n  Be in the nave at 6:14 with nothing owing.\n  Was in the fourth pew on the Mary side when the light came down Braddock Avenue.\n\n*achievement allnight hidden 50 Nothing Owing\n  ---\n  Went the whole night without taking anything from anybody.\n\n*goto_scene one_door\n", "one_door": "*comment ==================== ACT ONE — THE DOORWAY ====================\n*comment Every reader reads all of this. The world goes here: the font, the lamp,\n*comment the doors, the sun at 6:14, and what you are. Four choices, no deaths.\n*comment Bottleneck at the end: Verna locks the outer doors at midnight.\n\nThe outer doors of St. Wenceslaus are oak and they are standing open, and you are through them before you have decided anything.\n\nBehind you, Braddock Avenue is wet and empty under the sodium lights, and there are two of them at the corner by the shuttered pharmacy who have been walking behind you since the bridge. They are not hurrying. They have never once had to hurry.\n\nYou are in a vestibule with a terrazzo floor and a rack of missalettes and a radiator ticking under the window. It smells of candle wax and wet coats. Somewhere ahead, past a second set of doors with glass in them, there is a red light burning that you can see from here and cannot look at.\n\nYou have not needed to breathe since April of 1931.\n\nYou are breathing anyway, hard, because the room expects it.\n\n*page_break\n\nBetween you and the inner doors there is a granite bowl on a granite pillar.\n\nIt is knee-high and it is directly in the way, because whoever built this place in 1897 put it exactly where a person coming in from the street would have to pass it. That was the point. Somebody filled it on Saturday and nobody has emptied it, and the surface of the water is perfectly still, and there is a hairline crack in the granite that somebody patched once with the wrong colour of grout.\n\nThe vestibule is four paces across. The bowl takes up one of them, in the middle, and there are two ways round it.\n\nThe wall route is the long way. It runs under the window in the outer door — a foot of clear glass at head height, put there in 1897 so the ushers could see who was coming — and it holds you in that window for the better part of three seconds.\n\nThere are two of them on Braddock Avenue who have been walking behind you since the bridge. They are not hurrying and they do not need to. If either of them is on the steps in the next three seconds, the wall route puts your face in that glass.\n\nThe other way is straight through the middle, past the bowl, at speed.\n\n*choice\n  #Take the wall, under the window, and hope the steps are empty.\n    *goto wall\n  #Go straight through the middle and take whatever the water does.\n    *goto straight\n\n*label wall\n*page_break\n\nYou take the wall.\n\nThe radiator is on and it is the first warmth you have felt in a week, and you are aware of how absurd it is that you notice. Your left sleeve brushes the pillar. Forty centimetres of air between your coat and the water, and you keep every one of them.\n\nThree seconds in the window. At the second one there is a shape at the bottom of the church steps, and it stops, and it looks up.\n\nThen you are through the inner doors and out of the frame, and whoever it was does not come up after you, and you will spend the next hour deciding whether that is because they did not see you or because they did.\n\nYou get into the nave with nothing worse than the feeling of having been looked at by something that did not turn its head.\n\n*goto nave_back\n\n*label straight\n*page_break\n\nYou go straight past it, close enough that your coat swings over the rim.\n\nIt is not a burn. Everybody says burn, and it is not that. It is the feeling of a name being said in a room you are standing in, when you had been sure nobody there knew it — that lurch under the sternum, the whole body going still and hot at once.\n\nYou are on your knees on the terrazzo before you understand that you have gone down.\n\nIt lasts nine seconds. When it passes you are looking at the underside of the bowl from twenty centimetres away, at the place where the granite was patched with the wrong grout, and at a shape cut into the pillar's base that you can just make out in the dark: a year. **1897.**\n\nYou get up. Your hands are shaking, and they have not shaken in a very long time.\n\n*goto nave_back\n\n*label nave_back\n*page_break\n\nThe nave of St. Wenceslaus is twenty-two pews on each side and one light left on, over the stair to the choir loft, and everything else in the building is dark except at the far end.\n\nAt the far end, up three steps and behind a rail that nobody ever got around to taking out, there is a small brass box in the wall, and above it, hanging on a chain from the ceiling, a wick burning in red glass.\n\nIt has been burning since 1897 and it is not electric. It is a wick standing in oil in a red glass, and it goes out for one reason only, which is that the box is empty.\n\nThe box is emptied once a year. On the Thursday night of Holy Week they take Him out of the building altogether, and the lamp is put out, and the doors of the box are left standing open on nothing until the Saturday. Verna Sowka has watched that fifty-eight times and has told two priests to their faces that it is the worst thing she knows.\n\nEvery other night of the year it burns. It burned through the blizzard of 1977 when the parish had no power and no heat for nine days, because it is a wick in oil and does not care what the electricity is doing.\n\nYou cannot look at it. Not the way you cannot look at the sun — the way you cannot look at somebody you did something to.\n\nYou take the last pew on the left and sit down in a church for the first time since Coolidge was president.\n\nAnd here is the thing you cannot account for, then or afterwards: you did not have to sit down.\n\nThere is a choir loft over your head, a tower stair behind the curtain, a sacristy with a window in it and a basement with no windows at all. Any of those would hide a man from a car park. You have chosen instead the one bench in the building from which you can see the far end of it, and you have sat down facing that way, and you are not going to move.\n\nYou came in here because you were driven in. You are still sitting here for some other reason and you do not have a word for it, and you have not had a word for it since you were seven years old.\n\n*choice\n  #Look up at the far end anyway. Get the measure of it.\n    *goto looked\n  #Keep your eyes on the floor. You know what is up there.\n    *goto floor\n\n*label looked\n*page_break\n\nYou look up the length of the nave at the red glass.\n\nFour seconds, and you are looking at the floor again and your jaw is locked so hard that something in it grinds. There is no light in this building bright enough to hurt anybody. The one over the choir stair is a forty-watt bulb. That is not what happened.\n\nWhat happened is that somebody was in the room and had been the whole time, and you had been behaving as though the room were empty, and for four seconds you were not able to keep that up.\n\nYou sit very still until it stops.\n\n*goto verna_speaks\n\n*label floor\n*page_break\n\nYou keep your eyes down.\n\nThere is a hymn number card on the back of the pew in front, still showing last Sunday's numbers, and a cracked leather kneeler, and a hole in the wood where somebody's grandson worked at it with a pencil forty years ago. You look at all of that instead.\n\nIt does not help as much as you expected. You can feel where the far end of the building is the way you can feel where a stove is in a dark kitchen.\n\n*goto verna_speaks\n\n*label verna_speaks\n*page_break\n\nThen the fourth pew on the other side says: \"Well.\"\n\n*page_break\n\nShe has turned round on the bench with one arm over the back of it, the way you turn round in a car, and she is looking straight at you. Seventy-nine or eighty. A clear plastic rain bonnet still tied under her chin. A thermos on the seat beside her and a rosary in her right hand with the beads of one decade worn down to the string.\n\nShe has been here since eleven. She is here every Thursday from eleven to midnight and has been for thirty-one years, since the parish signed up for perpetual adoration in 1994 and the roster fell apart inside two years and nobody told her.\n\nShe is frightened of you. You can hear it from four metres away: the heart going, the small catch in the breath. She is frightened in the complete physical way that an animal is frightened, and she has not moved, and she is not going to.\n\nShe has also, in the eleven seconds since you sat down, worked out what you are. You can watch her do it. Her eyes go to the font behind you, and then to the width of the gap you left going round it, and then to your hands; and then something in her face closes over, the way a ledger closes.\n\nHer mother came out of a village forty kilometres from Trenčín in 1921 with one small vocabulary of things you do not say out loud after dark, and the word for what you are is in it. Verna Sowka has not believed that word since she was about eleven years old.\n\nShe believes it now. It took her eleven seconds and she has not screamed and she has not run, and you have been doing this since 1931 and have never once had either of those things not happen.\n\n\"You came in fast,\" she says. \"Is somebody after you?\"\n\n*choice\n  #Tell her yes, and find out what your own voice sounds like.\n    *goto said_yes\n  #Say nothing and let her decide what you are.\n    *goto said_nothing\n  #Go up the choir loft stair, out of her sight.\n    *goto loft\n\n*label said_yes\n*page_break\n\n\"Yes,\" you say.\n\nYour own voice surprises you. It is a week since you used it and it comes out wrong — too quiet, and with the flat vowels of a mill town that stopped talking like that forty years ago.\n\nVerna Sowka looks at you for a while.\n\n\"Then sit further in,\" she says. \"Anybody at that door can see you where you are.\"\n\n*goto after_verna\n\n*label said_nothing\n*page_break\n\nYou say nothing.\n\nIt goes on a long time. She does not fill it, which is not what you expected; she just keeps her arm over the back of the pew and looks at you, and her heart goes, and after a while she nods slightly at something she has worked out on her own.\n\n\"All right,\" she says. \"Then sit further in. Anybody at that door can see you where you are.\"\n\n*goto after_verna\n\n*label loft\n*page_break\n\nThe stair to the choir loft is behind a curtain by the inner doors and it takes you up eleven steps to a gallery with an organ console under a dust sheet and four rows of benches nobody has sat in since the parish stopped having a choir.\n\nFrom up here you can see the whole nave, the red lamp at the end of it, and the top of a clear plastic rain bonnet in the fourth pew on the Mary side.\n\nShe has not turned back round. She is still looking at where you were.\n\n\"You can stay up there if you like,\" she says, in a normal voice, to the empty pew you left. \"It's warmer down here and the bench is padded, and I'm not going anywhere until midnight.\"\n\nYou come down. You are not sure why, and you will think about it later.\n\n*goto after_verna\n\n*label after_verna\n*page_break\n\nYou move up four pews. It is not much and it puts a pillar between you and the glass of the inner doors, and she watches you do it and then turns back round to face the front, which is the thing that undoes you slightly — that she turns her back.\n\nOut in the lot, under the sodium light on the pole by the fence, someone is standing.\n\nHe is not moving. He has his hands in his coat pockets and his head tipped slightly, the way a man stands when he is waiting for somebody to finish an argument he already knows the end of. He does not come any closer than the chain-link fence, and he will not come closer all night, and you know exactly why and it is not the reason people think.\n\nHis name is Marek. He is the one who made you, in a boarding house on Talbot Avenue in April of 1931, and he has not raised his voice to you in ninety-four years.\n\nHe is not here to kill you. He is here to take you home, which he regards as the same errand and a kindness, and he is probably right about the second part.\n\nThe two at the corner by the shuttered pharmacy are the ones who would do the other thing, if it came to that. Marek has never done that part himself. He stands at fences and waits, and in ninety-four years you have not once seen it fail to work.\n\n*page_break\n\nAt three minutes to midnight Verna Sowka gets up, badly, holding the pew in front of her, and walks the whole length of the nave past you and out into the vestibule.\n\nYou hear the outer doors close. You hear the bolt go over. You hear the key turn, twice, and then a small sound of a key being put into a coat pocket.\n\nShe comes back and stands at the end of your pew with her hand on the rail.\n\n\"They lock at midnight,\" she says. \"I do it, because I'm the last one out on Thursdays.\" She is still frightened. It has not gone down at all in the last twenty minutes; if anything it is worse, now that she is close enough to see your hands. \"Only I'm not going out. Not with that one standing in the lot.\"\n\nShe does not say *that one* the way you say it about a stranger.\n\n\"He came to the fence and he stopped,\" she says. \"Nobody stops at a fence. You stop at a fence if you can't go past it.\" She holds on to the pew rail. \"I've known what was standing out there since about ten past.\"\n\nShe sits down on the end of the pew in front of yours, sideways, so she can see you.\n\n\"Sun's up at ten past six,\" she says. \"I looked it up on the phone. Fourteen minutes past, if you want it exact.\"\n\n*page_break\n\nShe says it the way you would say a bus time.\n\nShe has locked the two of you in together on purpose. She is seventy-nine, her hip is bad, and the nearest door she could reach is forty metres away behind a bolt she threw herself.\n\nYou ask her whether she understands what she has just done. It is the only question in the building.\n\n\"I'm not stupid, son.\" She pulls her coat straight over her knees. \"I've a bad valve. Aortic. They told me in June to get my affairs in order and I told them I've had my affairs in order since nineteen ninety-eight.\" She says it exactly the way she said the sunrise time. \"So there isn't a great deal you can threaten me with that isn't already on the calendar.\"\n\n\"That's not the same as safe.\"\n\n\"No,\" Verna agrees. \"It isn't. I'm frightened half to death and I'd be obliged if you didn't make me say that twice.\" She looks down the length of the nave at the red glass. \"But somebody has to sit with you. There's nobody else in the building and I'm the one that's here, and I've been telling Him for thirty-one years that I'd take whatever He sent on a Thursday.\"\n\nShe thinks about that and evidently decides it was too grand.\n\n\"And I'd rather be scared in here,\" she says, \"than scared out there in the dark with the pair of them. That's most of it, if you want it honest.\"\n\nShe puts her hands back in her lap.\n\n\"Six hours and something,\" she says. \"I'd usually be home by now.\"\n\n*choice\n  #\"Open the door and go home. I am asking you.\"\n    *goto go_home\n  #\"Why would you do that? You do not know one thing about me.\"\n    *goto why\n\n*label go_home\n*page_break\n\n\"Open that door,\" you say. \"Go home. I'm asking you.\" Your voice comes out wrong; a week unused, and the flat vowels of a mill town that stopped talking like that forty years ago. \"You don't know what's sitting in this pew.\"\n\n\"I understand fine.\" She works the thermos cap loose with both hands, because her hands are not good either. \"You came in off the street with your coat on and you went past that font like it bit you, and then you sat in the back like a man at his own mother's funeral.\" She pours an inch of tea into the cap. \"I've been coming here thirty-one years, son. I know what people look like when they've come in to get away from something. It's most of them.\"\n\n\"And the one in the lot?\"\n\n\"That one didn't come in,\" Verna says.\n\n*goto act_one_end\n\n*label why\n*page_break\n\n\"Why would you do that?\" you say.\n\nShe thinks about it properly, which very few people do when you ask them a real question.\n\n\"Because I've had this hour thirty-one years and nobody has ever needed it,\" she says at last. \"Not once. I sat here every Thursday from eleven to twelve and it was me and Him and the radiator.\" She gets the thermos cap loose with both hands. \"And tonight there's somebody in the back of my church at eleven o'clock at night with his coat on, and he's been shaking since the vestibule.\"\n\nShe pours an inch of tea into the cap.\n\n\"So I'm not going out to the car park. Don't ask me twice, because the second time I'd have to think about it.\"\n\n*goto act_one_end\n\n*label act_one_end\n*page_break\n\n*goto_scene two_night\n", "two_night": "*comment ==================== ACT TWO — THE NIGHT ====================\n*comment A walk through one building, in three hours, each ending at the nave.\n*comment Two-way forks throughout; one three-way at the top of Hour Two.\n*comment Deaths available: the sacrarium, the tabernacle, the fourth pew,\n*comment the lot, the font. All signposted. Sets `name` and, if `name`, `contrite`.\n\n*comment ---------------- HOUR ONE: the tea, the phone, the sacristy ----------------\n\nMidnight and four minutes. The radiator ticks. Out in the lot the sodium light buzzes at a frequency you can hear and she cannot, and under it a man stands at the fence with his hands in his pockets and has not moved in fifty minutes.\n\nVerna Sowka holds out the thermos cap. There is about an inch of tea in it and it is steaming, and her hand is not steady, and she holds it out anyway across the back of the pew.\n\n\"It's got sugar in,\" she says. \"I don't know if that's a thing or not.\"\n\n*choice\n  #Take the cap out of her hand, and let her watch you hold it.\n    *goto tea_yes\n  #\"I can't,\" and watch what that does to her face.\n    *goto tea_no\n\n*label tea_yes\n*page_break\n\nYou take it. The cap is warm through your fingers and that is the whole of it — you cannot taste tea, you have not tasted anything but the one thing since 1931, and both of you know within about four seconds that this was never about the tea.\n\n\"Well,\" Verna says, taking it back. \"That's that sorted.\"\n\nShe screws the cap on. Her hands have stopped shaking, which is not the same as her being less afraid; she is exactly as afraid as she was, and she has simply put her hands somewhere else.\n*achieve thermos\n\n*goto phone\n\n*label tea_no\n*page_break\n\n\"I can't,\" you say.\n\n\"No.\" She looks at the cap for a second and then drinks it herself, in one go, the way you take medicine. \"No, I didn't think so. I don't know what I was doing there.\"\n\nShe does know. So do you. It is the thing people do at a wake when there is nothing else in the house to offer, and she has done it at a great many wakes.\n\n*goto phone\n\n*label phone\n*page_break\n\nAt twenty past twelve the telephone rings.\n\nIt is a real bell, not an electronic one — a landline in the sacristy behind the sanctuary, on the wall by the vesting case, that the parish has kept because two of the four churches in this grouping have no cell coverage in the basement.\n\nIt rings eleven times and stops. Then it starts again.\n\nVerna has gone very still. \"Nobody calls that,\" she says. \"Not at this hour. If Father wants me he rings my cell.\"\n\nThe number is on the sign in front of the church, in white plastic letters, and has been since 1962.\n\nOut in the lot, the man at the fence has a phone against his ear and is looking at the building.\n\n*choice\n  #Go the length of the nave and answer it yourself.\n    *goto answer\n  #Let it ring, and find out how long he is willing to wait.\n    *goto let_ring\n\n*label let_ring\n*page_break\n\nYou let it ring.\n\nIt rings for forty minutes. Eleven, and a pause, and eleven again, with the pause getting shorter, and the sound coming up the sanctuary steps and down the length of the nave and into the back of your skull.\n\nAt one o'clock Verna gets up.\n\n\"I'll get it, then,\" she says.\n\nYou are in front of her before you have decided to be — across the aisle, four metres in under a second, and you have not moved like that in front of a living person in eleven years and you see exactly what it does to her face.\n\n\"I'll go,\" you say.\n\n*goto answer\n\n*label answer\n*page_break\n\nThe sacristy is behind the sanctuary on the gospel side, through a low door, and you go the long way round the outside of the rail so that you do not have to cross in front of the brass box.\n\nIt is a working room and it smells like one: linen, lemon oil, the vesting case with its shallow drawers, a credence table, an electric kettle, a wall safe with a dial, a stone sink in the corner with a second tap and no drain to the sewer. Under the window there is a shelf of green cloth account books with years stamped on the spines, back to 1897.\n\nThe phone is on the wall. You pick it up.\n\n\"Ondrej,\" says Marek.\n\n*page_break\n\nYou have not heard that word in ninety-four years. It goes through you like the font did.\n\n\"You do not remember it,\" he says. \"I know that. You stopped saying it in the winter of 1954, in a rooming house on Wick Avenue in Youngstown, and I have not heard it out of you since. I have kept it. That is one of the two useful things I have done in my life.\"\n\nHis voice has not aged the way voices age, and there is nothing theatrical in it, and he does not use contractions, because he learned this language formally from a man in about 1890 and it set that way.\n\n\"Now the arithmetic. I am at the fence. I will be at the fence at fourteen minutes past six, which is five hours and fifty-four minutes from now. The two on Braddock Avenue will be at the corner. Nobody is coming through that door.\n\n\"You come out, or the sun comes in. There is no third thing. I am not saying that to frighten you. I am saying it because it is the entire content of tonight and neither of us has anything to add to it.\"\n\n*choice\n  #Ask him why he came himself, after ninety-four years of sending others.\n    *goto why_himself\n  #\"Why will you not come in here? In ninety-four years I have never asked.\"\n    *goto why_not_in\n  #Put the phone back on the hook while he is still talking.\n    *goto hung_up\n\n*label why_not_in\n*page_break\n\n\"Why won't you come in?\" you say. \"Ninety-four years. I never asked.\"\n\nThe line goes quiet.\n\nIt stays quiet for eleven seconds, which is a thing you have never got out of Marek, not in Youngstown, not in the winter of 1954, not once.\n\n\"I was baptised,\" he says.\n\n*page_break\n\n\"In a wooden church about six hundred kilometres east of Trnava, in a year I am not going to give you, by a priest whose name I have kept and am also not going to give you. My mother carried me. There was snow on the road and my father stayed with the horse.\"\n\nThe sodium light buzzes. Forty metres away, through two sets of doors, he does not move at all.\n\n\"That is the whole of the answer and it is not what you have spent ninety-four years assuming. It is not a rule and it is not a curse and nobody forbids me anything. It is that I have had a great deal longer at this than you have. What that font did to you at the door tonight is what this car park is doing to me now, at the fence, forty metres out, through a wall.\"\n\nA pause.\n\n\"I am not able to bear it. I stopped pretending I might learn to in about 1840.\"\n\n*page_break\n\n\"Ondrej,\" he says. \"You have never asked me that. Ninety-four years, and you asked me tonight, at twenty past twelve, from inside.\"\n\nThere is something in his voice that you do not have a name for and are not going to be given time to work out.\n\n\"I want that recorded,\" Marek says. \"By me, to myself, at this fence. It is recorded.\"\n\n*goto registers_offer\n\n*label why_himself\n*page_break\n\n\"Because you left,\" Marek says. \"Not because you killed anybody, not because of the business in Youngstown. Because you *left*, and the others watched you do it, and now four of them are thinking about a thing they were not thinking about in August.\"\n\nA pause. In the lot, forty metres away through two sets of doors, he shifts his weight.\n\n\"I am not angry. I have not been angry with you at any point, including August.\" Another pause. \"April of 1931. A boarding house on Talbot Avenue, second floor, the room at the back. Four men dead in that house in eleven days and you were the fifth on the list, and your lungs were full, and I gave you ninety-four years.\"\n\n\"You always say that part.\"\n\n\"Because it is true,\" says Marek, \"and I do not say untrue things. That has been the trouble with me from the beginning.\"\n\n*choice\n  #\"Then say the other true one. Say what I have done since.\"\n    *goto marek_true\n  #\"Ninety-four years of what, Marek?\"\n    *goto marek_of_what\n\n*label marek_true\n*page_break\n\n\"You always stop in the same place,\" you say. \"*I gave you ninety-four years.* Then nothing. Finish it.\"\n\n\"No.\"\n\n\"Finish it, Marek.\"\n\n\"No,\" says Marek, \"and I will tell you exactly why, and then we will both wish I had not.\n\n\"The rest of that sentence is *and you did what you did with them.* If I say it out loud you will hear me taking it, because that is what you have wanted from me since about 1955, and I am not going to.\"\n\nThe sodium light buzzes.\n\n\"Approximately six hundred people. I have never kept the number and I do not believe you have either. Not one of them is mine. I have wanted to take them off you for thirty years, because you are the only thing I have ever made that I liked, and I cannot, because they are not mine to take and there is nobody I could hand them to.\"\n\n*goto registers_offer\n\n*label marek_of_what\n*page_break\n\n\"Ninety-four years of what?\" you say.\n\n\"Of everything,\" says Marek, without any weight on it at all. \"Two wars. Four presidents you had opinions about. The night at the Aliquippa works. Nine hundred sunsets over that river and you watched every one of them and told me twice that it was the only thing worth having.\"\n\nHe is not selling. That is the difficulty. He is doing an inventory, and the inventory is accurate, and there are good things in it.\n\n\"And about six hundred people,\" he says. \"Give or take. I have never kept the number and I do not believe you have either.\"\n\n*goto registers_offer\n\n*label hung_up\n*page_break\n\nYou put the phone back on the hook.\n\nIt does not ring again. That is worse. It means he has said the part he came to say — *come out, or the sun comes in* — and is content to wait for six hours to see which, and Marek waiting is the oldest fact in your life.\n\nHe will not come in. He has never in ninety-four years told you why and you have never in ninety-four years asked, and standing in a sacristy at one in the morning with your hand still on a telephone, you find that you have always known the answer and have simply not let yourself have it.\n\nThe two at the corner will come in, if he asks them to. They are younger and they do not know yet what they cannot do.\n\n*goto registers_offer\n\n*label registers_offer\n*page_break\n\nThe room is quiet. The kettle has a hard-water ring inside it. Somebody has left a stack of Mass cards and a roll of tape on the credence table, and there is a mop in the corner standing in a bucket that was emptied and not rinsed.\n\nTwo things in this room are not ordinary.\n\nThe first is the shelf of green account books under the window, thirteen of them, each stamped with a decade. **REGISTRUM BAPTIZATORUM.** Names, dates, parents, godparents, written by hand for a hundred and twenty-eight years.\n\nThe second is the sink in the corner. It has two taps and one of them runs into a stone basin that does not drain into the sewer; it drains straight down into the ground under the church, because what goes into it is not allowed to go anywhere else. There is a small glass cup on the ledge beside it with a film of water in the bottom, left there after the last Mass and not yet washed.\n\n*choice\n  #Take down the book with 1900 on the spine.\n    *goto the_book\n  #Pick up the glass cup on the ledge beside the stone sink.\n    *goto the_cup\n\n*label the_cup\n*page_break\n\nYou pick it up. It is ordinary glass, the kind you get in a restaurant supply catalogue, and there is perhaps a thimble of water in it, and it has been standing since Sunday evening.\n\nYou know what was in it before the water. You know exactly what this cup is for: the priest rinses his fingers into it after he has handled the Host, and the water goes down the stone sink into the ground, because even a fragment must not go into a drain.\n\nHere is what you have not looked at for the last hour, because you have been busy.\n\nYou have not fed in nine days.\n\nNine days, and four hours inside a building that has been doing to you since the vestibule what this building does, and every one of those four hours has cost something you do not have. There is a woman in the fourth pew with a bad valve and the only key. There is a man at a fence who will still be at the fence at dawn. Your hands are not steady and have not been since the font.\n\nAnd here, on a ledge, in a rinsing cup somebody meant to wash on Sunday evening, is a thimble of water that was in a room with Him four days ago.\n\nIt will not help. You know that with the part of you that has been going in and out of churches since 1931 and can tell a rinse from a Person at forty metres through a wall.\n\nThe other part is not listening. The other part is saying: *it touched Him, and it is right there in your hand, and there is not one person alive who would ever have to know.*\n\n*choice\n  #Lift the cup off the ledge.\n    *goto lifted_cup\n  #Put your hands behind your back and read the label on the kettle.\n    *goto put_it_down\n\n*label lifted_cup\n*page_break\n\nYou lift it.\n\nIt weighs nothing. It is a restaurant-supply glass with a chip out of the base, and you hold it up between your eye and the sacristy window, and the water in the bottom catches the sodium light off the car park and goes orange.\n\nFour days ago a tired man in his thirties rinsed his fingers into this over the stone sink, and did it badly, the way you do a thing you have done nine thousand times, and set the glass down on the ledge and forgot it.\n\nNothing about it is holy. Everything about what is happening in your hand is not about the water.\n\nYou are aware, standing there, that you have stopped moving. You have been standing at this sink with a glass at eye level for some seconds now, and the reason you have stopped is that some part of you is waiting to be interrupted — for the door, for a voice, for a hand on your arm.\n\nThe sacristy is very quiet. There is a kettle and a mop in a bucket and nobody at all.\n\n*choice\n  #Drink it.\n    *goto ending_ablutions\n  #Set it down square with the edge and take your hands off the sink.\n    *goto put_it_down\n\n*label put_it_down\n*page_break\n\nYou put the cup back on the ledge, exactly where it was, square with the edge.\n\nThen you stand with both hands on the stone rim of that sink for some time, in a small room with a hard-water kettle and a mop in a bucket, and you do not do anything at all, and that is not nothing.\n\n*goto the_book\n\n*label ending_ablutions\n*page_break\n\nYou drink it.\n\nA second and a half, and in that second and a half you understand exactly what you have just done, in order, like a list.\n\nYou did not do sacrilege. Sacrilege is up three steps behind a brass door and you did not go near it. You did something smaller and worse. You were in a building with Him in it for four hours, and you did not say one word to Him, and then you went into the back room and tried to get a piece of the effect off a ledge, quickly, in silence, out of a glass somebody meant to wash.\n\nYou treated Him as a medicine. Nine days hungry and four hours hurting, and given a whole night and an open building, that is what you came up with.\n\nThe water has never hurt anybody. The water is not what this is.\n\nThe thing that goes through you is not chemistry. It is the whole ninety-four years arriving at once with nothing between you and it, the way it arrives at the end anyway, only now, standing up, in the sacristy, at one in the morning.\n\nThey find the glass on the floor. They never find you at all.\n\n*ending The Ablutions\n\n*label the_book\n*page_break\n\nThe 1900 book comes off the shelf heavier than it looks. Green cloth boards gone black at the corners, and the pages inside are ruled in faint blue with the columns printed in Latin and the entries in ink.\n\nYou are not looking for anything. You want that understood, later, when you think about this: you are a man with six hours to get through, in a room with a book in it.\n\nThe handwriting from 1904 belongs to somebody with a good hand and a slow pen. Every entry is the same shape. Name, born, baptised, parents, godparents.\n\nYour thumb stops on the twenty-first of August.\n\n*page_break\n\n**Hlavatý, Ondrej Michal — natus 14 Aug 1904 — bapt. 21 Aug 1904 — par. Ján Hlavatý et Anna (Sokolová) — spon. Michal Sokol, Terézia Bártová.**\n\nOndrej Michal Hlavatý.\n\nYou were born in August of 1904 in a house on Talbot Avenue, four streets from this building, to a man who worked the open hearth and a woman from Trenčín who never learned to write English and signed with a cross, and eight days later they carried you four streets in a shawl and put your head over a granite bowl in a vestibule.\n\nThat bowl. That vestibule. The one you could not get past an hour ago.\n\n*set name true\n*achieve ondrej\n\n*page_break\n\nYou sit down on the floor of the sacristy with your back against the vesting case and the book open on your knees, and you stay there for a while.\n\nThere is a second entry four lines down in the same hand — *Sokolová, Terézia* — and a third, in 1907, that is a brother you did not know you had and who must have died small, because the parish burial books are on the same shelf and you do not open them.\n\nNinety-four years. You have been a great many things in ninety-four years and none of them had a name, and you had genuinely stopped believing there had ever been one.\n\nThere was one. It is written down. It has been on this shelf, forty metres from where you were sitting, the whole time.\n\n*choice\n  #Say it out loud in the empty sacristy.\n    *goto said_aloud\n  #Close the book and put it back on the shelf, third from the left.\n    *goto put_back\n\n*label said_aloud\n*page_break\n\n\"Ondrej Michal Hlavatý,\" you say, to a vesting case and a kettle with a hard-water ring in it.\n\nIt is a Slovak name and your mouth still knows how to do it, which is the part that takes the legs out from under you: the *ch*, and the accent on the first syllable, and the long *y* at the end, all of it still in there under ninety-four years like a tool in a drawer nobody opened.\n\nYou say it four more times. Then you stop, because there is a woman in the fourth pew who can hear a great deal better than she lets on.\n\n*goto hour_two\n\n*label put_back\n*page_break\n\nYou close the book and put it back on the shelf, third from the left, square with the others.\n\nYou do not say it. Not out loud, not in a small room at one in the morning, with nobody to hear it but a kettle.\n\nIt is in you now regardless. That is what you find out on the way back down the sanctuary steps: that reading it was enough to do the damage, and that there was never a version where you read that line and walked away the same thing you were.\n\n*goto hour_two\n\n*label hour_two\n*page_break\n\n*comment ---------------- HOUR TWO: the building ----------------\n\nHalf past one. You come back out through the low door and down the outside of the rail, and the nave is exactly as you left it: twenty-two pews on each side, one bulb over the choir stair, and the red lamp at the far end doing what it has done since 1897.\n\nVerna has moved. She is in the fourth pew still but she has turned sideways with her bad leg up on the bench, and she has her coat over her knees, and she is awake.\n\n*if (name)\n  \"You found something,\" she says.\n\n  You have. You are not going to say it out loud yet, because saying it out loud is a different act from reading it, and you are not ready for the different act.\n*if (name = false)\n  \"You look worse,\" she says. \"I didn't think that was on the table.\"\n\nFour hours and forty minutes until the sun comes down Braddock Avenue and through the east window, which was given in 1924 by a family called Hlavatý and shows a man knocking at a door that has no handle on his side.\n\nYou cannot sit still.\n\n*choice\n  #Go to the box on the epistle side.\n    *goto confessional\n  #Go up the ninety-one steps to the bell you helped hang.\n    *goto tower\n  #Go down the concrete stair to the undercroft, where there are no windows.\n    *goto undercroft\n  #Go back out to the vestibule and look at the doors.\n    *goto vestibule\n\n*label vestibule\n*page_break\n\nThe vestibule is four paces across, with a terrazzo floor and a rack of missalettes and a radiator that has cycled off.\n\nThe outer doors are bolted and the key is in a seventy-nine-year-old woman's coat pocket in the fourth pew. Through the glass you can see the lot: the sodium light, the chain-link fence, a man standing at it with his hands in his pockets who has not changed position in two hours, and beyond the fence, at the corner by the shuttered pharmacy, two more.\n\nBetween you and the doors is a granite bowl on a granite pillar, filled on Saturday, with a hairline crack patched in the wrong colour of grout and **1897** cut into the base.\n\nYou were carried past that bowl in a shawl in August of 1904. You have been past it once tonight, going the other way, and you remember what it cost.\n\n*choice\n  #Put your hand down into the water in the granite bowl.\n    *goto hand_in\n  #Leave the bowl alone and go back into the nave.\n    *goto back_to_nave\n\n*label hand_in\n*page_break\n\nYou put your hand in the water.\n\nNot to leave; there is nowhere to leave to and the bolt is thrown. You do it the way a man puts his hand on a stove he has been told about.\n\n*if (name)\n  It is not a burn. It is your mother's name — Anna, from Trenčín, who could not write English and signed with a cross — and it is the weight of a shawl, and it is a room full of people in 1904 who are all now dead, and it is somebody saying *Ondrej Michal* out loud over this exact bowl and meaning it as a promise that has never once been withdrawn.\n\n  You take your hand out. The water is still moving. You stand and watch it go still, which takes about eleven seconds, and you do not go back into the nave for a while.\n*if (name = false)\n  It is not a burn. It is somebody in the room saying a word you cannot hear, which they have been saying since 1897, and which is addressed to you, and which you have no way of receiving because you do not know what you are called.\n\n  You take your hand out. It is the loneliest four seconds of ninety-four years.\n\n*goto back_to_nave\n\n*label confessional\n*page_break\n\nThe confessional is wood, on the epistle side, between the fourth and fifth windows: three doors, the middle one for the priest and one on each side for whoever comes. Nobody has used the face-to-face room in fifteen years. It smells of old varnish and the particular dust that gets into carved wood and stays.\n\nThe penitent's side has a kneeler and a screen and a card on the wall with the Act of Contrition printed on it in two languages, the English one gone brown at the folds.\n\nThe priest's side has a chair, a small light with a bulb out, and a purple stole hanging on a nail.\n\n*choice\n  #Kneel on the penitent's side, where you knelt at nineteen.\n    *goto pen_side\n  #Sit on the wrong side of the screen, in the priest's chair.\n    *goto priest_side\n\n*label priest_side\n*page_break\n\nYou sit in the priest's chair in the dark with a stole on a nail beside you.\n\nIt is the wrong side of the screen and you know it is the wrong side, and you sit there anyway for a quarter of an hour, because from here you can see the shape of the kneeler through the mesh and imagine somebody on it.\n\nThe last time you were on the other side of that screen you were nineteen. It was 1923. You told a man in this box about a girl and about money you took out of your father's coat, and he gave you three Hail Marys and told you to put the money back, and you did.\n\nYou have not been able to think of that as a real memory for a very long time. It has been a thing that happened to somebody in a photograph.\n*achieve stole\n\n*goto pen_side\n\n*label pen_side\n*page_break\n\nYou kneel on the penitent's side, which is worse.\n\nThe kneeler is cracked leather over a board. The screen is a lattice with a cloth behind it, and there is nobody on the other side of it, and there will be nobody until twenty to six.\n\nThe card is on the wall at eye level. *O my God, I am heartily sorry for having offended Thee, and I detest all my sins* — and then a fold, and then the brown part, and you can read all of it, and it is the words that are not the difficulty.\n\nThe difficulty is the first two syllables. Every one of these begins with somebody saying who he is.\n\n*if (name)\n  *goto pen_named\n*if (name = false)\n  *goto pen_nameless\n\n*label pen_nameless\n*page_break\n\n\"Bless me, Father,\" you say, out loud, in an empty box at two in the morning, \"for I have sinned. It has been—\"\n\nAnd there is nothing. Not resistance; a blank. The place where a man says *I* is empty in you, and has been for so long that you had stopped noticing the shape of the hole.\n\nYou get up off the kneeler.\n\nWhatever this is, it does not start here. It starts with somebody's name, and you do not have one, and you have not had one since a boarding house on Talbot Avenue.\n\n*goto back_to_nave\n\n*label pen_named\n*page_break\n\n\"Bless me, Father, for I have sinned,\" you say, out loud, in an empty box at two in the morning. \"It has been a hundred and two years since my last confession. I am Ondrej Michal Hlavatý and I have—\"\n\nYou stop.\n\nNot because the words are hard. Because they are not: they come out of you in the flat vowels of a mill town, in the voice of a man who used to say them at fourteen with his cap in his hands, and hearing that voice again is the worst thing that has happened to you tonight.\n\nThere is nobody behind the screen. You know exactly what that means and exactly what it does not.\n\n*choice\n  #Say the rest of it anyway, to nobody in a box.\n    *goto contrition_here\n  #Get up. This needs a priest and there is no priest.\n    *goto back_to_nave\n\n*label contrition_here\n*page_break\n\nYou say the rest of it.\n\nNot the list. The list would take until dawn and past it and you will make it later, to a man with keys, if there is a later. What you say is the short thing on the card, and you say it the way you were taught to at seven years old by a woman from Trenčín who could not write her own name in English:\n\n*O my God, I am heartily sorry for having offended Thee.*\n\nAnd here is the part nobody warns you about: you find that you mean the middle of it. Not the ending — you are not sorry because of the sun, and you are honest enough at this hour to know that the sun is somewhere in it. But *for having offended Thee.* Him. The One at the end of the building you have not been able to look at since you came in off Braddock Avenue, who has been in the room the whole time, and who you have spent ninety-four years pretending was a fixture.\n\nYou are sorry about *Him*. That is the whole of it and it takes about four seconds.\n\n*set contrite true\n*achieve contrition\n\nYou kneel in a wooden box with your forehead against a lattice screen and nothing whatsoever happens, and you have been alive long enough to know that this is not evidence of anything either way.\n\n*goto back_to_nave\n\n*label tower\n*page_break\n\nThe tower stair is off the vestibule behind a door with a hook on it, and there are ninety-one steps, and you count them because you counted them once before.\n\nAt the top there is a chamber with four louvred openings and a bell in a timber frame, and the rope drops away through a hole in the floor into the dark. **1928** is stamped in the frame where the beam was replaced.\n\nYou know that beam. You cut the shoulder on it in a shop on Rankin Boulevard when you were twenty-four, and you came up here on a Saturday with three other men and a chain hoist, and Fr. Kubica sent up a crate of beer at four o'clock and stood at the bottom shouting instructions that nobody could hear.\n\nNobody has rung this bell since 1974.\n*achieve rope\n\n*page_break\n\nFrom the louvres you can see the whole of it: the wet roofs going down to the river, the two of them still at the corner by the pharmacy, and directly below, in the lot, the top of Marek's head under the sodium light.\n\nHe knows you are up here. He does not look up. Looking up would be a move and Marek does not make moves; he stands still for a century and the world comes to him, which is how he got you the first time.\n\n*choice\n  #Take hold of the rope, and think about who would come.\n    *goto rope_now\n  #Leave the rope where it is and go back down the stairs.\n    *goto back_to_nave\n\n*label rope_now\n*page_break\n\nYou take the rope. It is old hemp gone slick and it fits your hands, and one pull would put nine hundred pounds of bronze into motion over Braddock Avenue at two in the morning.\n\nWho comes? Police, in about six minutes. A patrol car, one officer, a young man with a flashlight coming into a dark church where a starving thing has been sitting for three hours.\n\nYou know exactly how that goes. You have known since about 1940 exactly how that goes.\n\nYou let the rope go. It swings against the frame twice, and the bell does not sound, and you stand there in the tower with your hands empty and understand that you have just decided something and that it counts.\n\n*goto back_to_nave\n\n*label undercroft\n*page_break\n\nThe stair down is behind the sacristy: bare concrete, a handrail, and a light switch at the bottom that you do not use.\n\nThe undercroft is the whole footprint of the church. Furnace at the far end, ticking. Folding tables stacked against a wall. A refrigerator with a hum and a sheet of paper taped to it that says PLEASE LABEL. Six decades of parish festival bunting in a cardboard box.\n\nThere are no windows. Not one, anywhere, on any wall.\n\nNothing down here will ever see the sun.\n\n*page_break\n\nBehind a plywood partition at the east end, where the ground rises, there is a slab with a name cut into it.\n\n**JOZEF KUBICA · KŇAZ · 1861–1931 · REQUIESCAT IN PACE**\n\nFr. Kubica built this church out of instalments off a payroll, buried the men it took to build it, and died in the summer of 1931, which was a busy season for you also.\n\nHe shouted instructions up a tower at you in 1928 that nobody could hear. He would have been the man on the other side of the screen in 1923.\n*achieve kubica\n\n*page_break\n\nYou could stay down here.\n\nNot could — *can*. There is no window in this room and none in the passage and none on the stair, and if you were behind that plywood at fourteen minutes past six you would be behind it at seven, and at noon, and on Friday, and the whole thing would simply carry on.\n\nThe refrigerator hums. Upstairs, four decks of floorboards away, a seventy-nine-year-old woman is sitting in the fourth pew with her leg up.\n\nYou go back up. Not because you decided to. Because you have not finished, and something in you knows the difference between a hiding place and a decision, and you have used up a great deal of your life on the first one.\n\n*goto back_to_nave\n\n*label back_to_nave\n*page_break\n\n*comment ---------------- HOUR THREE: the aisle ----------------\n\nHalf past three. The radiator has cycled off and the building is going cold, and the only sounds in it are Verna's breathing four pews up and the sodium light outside doing its frequency.\n\n*if (name)\n  Ondrej Michal Hlavatý. It sits in you now like a stone in a shoe. You cannot walk anywhere in this building without it.\n*if (name = false)\n  You still have no idea what you were called. It has begun to matter in a way it has not mattered since about 1954.\n\nTwo and three quarter hours. The red lamp burns at the end of the nave and the centre aisle runs the whole length of the building towards it, forty metres of terrazzo and old wax.\n\n*choice\n  #Get up and start up the centre aisle towards the lamp.\n    *goto the_aisle\n  #Sit down in the fourth pew and let her talk to you.\n    *goto with_verna\n\n*label with_verna\n*page_break\n\nYou sit down in the fourth pew, on the end, with a metre of bench between you.\n\nVerna has her rosary in her lap. The beads of the second decade are worn to the string — one decade, out of five, worn down to nothing while the other four are still round.\n\n\"That's from my Peter,\" she says, when she sees where you are looking. \"He's forty-six and he lives in Youngstown and he doesn't call. I do the second one for him.\" She turns the string over. \"Thirty-one years, Thursdays. Somebody in Youngstown's had about sixteen thousand Hail Marys and hasn't the faintest idea.\"\n\nYoungstown. You are still enough for long enough that she notices.\n\n*page_break\n\nYou are also, at half past three in the morning, in the fourth hour of a hunger you have not fed in nine days.\n\nIt is not a rage. That is the thing they get wrong in every film. It is patient and reasonable and it sounds exactly like your own voice, and what it is saying now, very quietly, is that she is seventy-nine, that her hip is bad, that Peter does not call, that she has perhaps six years, and that it would take under four seconds and she would not be frightened for any of them.\n\nEvery word of that is true.\n\n*choice\n  #Get up and move away from her. Now.\n    *goto moved_away\n  #Stay where you are and let her keep talking.\n    *goto stayed_close\n\n*label stayed_close\n*page_break\n\nYou stay.\n\nShe talks about Peter, and about her husband Mikuláš who worked at the Edgar Thomson works and died in 1998, and about the pierogi sale that used to fill the undercroft with four hundred people and now fills it with nine.\n\nAnd the whole time, underneath, that other voice is doing arithmetic, and it is patient, and it is not going anywhere, and it has got all night.\n\nAt ten to four she leans over and puts her hand on your forearm to make a point about the pierogi sale.\n\n*choice\n  #Take her. Four seconds, and she would not be frightened for any of them.\n    *goto ending_pew\n  #Get up out of that pew before your hands decide for you.\n    *goto moved_away\n\n*label ending_pew\n*page_break\n\nFour seconds.\n\nShe is not frightened for any of them, which is the thing you told yourself, and it turns out to have been the true part and not the important part.\n\nAfterwards you sit in the fourth pew on the Mary side with the thermos and the plastic rain bonnet on the bench beside you and a rosary on the floor with one decade worn to the string, and the red lamp goes on burning at the end of the building because it is not a smoke alarm and it does not know.\n\nAt twenty to six Fr. Dan Cusack unlocks the side door with a travel mug in his hand.\n\nYou are out through the sacristy window before he has the lights on. You are in the culvert under the Rankin Bridge by six. You have another ninety-four years, if you want them, and you know now exactly what they are made of, and so do you.\n\n*set fed true\n*ending The Fourth Pew\n\n*label moved_away\n*page_break\n\nYou get up so fast the pew rocks.\n\nYou are eight metres away with your back against a pillar before you have thought about it, and Verna is sitting with her hand still out where your arm was, and she has worked out precisely what just happened, because she is seventy-nine and not a fool.\n\n\"Right,\" she says. Her voice is not steady. \"Right. Well. You'll want to be over there, then.\"\n\nShe stays where she is. She does not move to the door. It takes her a minute and a half to get her breathing down and then she says, to the front of the church rather than to you: \"Was that close?\"\n\n\"Yes.\"\n\n\"Right,\" Verna says again, and picks up the rosary, and starts the second decade.\n\n*goto rosary_offer\n\n*label rosary_offer\n*page_break\n\nShe says them out loud. Not at you — she is not performing, she has done this at half past three on a Thursday for thirty-one years and it is simply what she does.\n\nAt the fourth Hail Mary she stops and holds the string out sideways in your direction without looking round.\n\n\"Second one's for Peter,\" she says. \"You can have the third.\"\n\n*choice\n  #Take the string out of her hand and find the worn decade.\n    *goto took_beads\n  #\"I can't say those,\" and let her do the third one alone.\n    *goto refused_beads\n\n*label refused_beads\n*page_break\n\n\"I can't say those,\" you say.\n\n\"Nobody can say them,\" Verna says. \"That's not what they're for.\" But she takes the string back and does not push it, and she does the third decade herself with her eyes shut, and you stand eight metres off with your back against a pillar and listen to the whole of it.\n\n*goto the_aisle\n\n*label took_beads\n*page_break\n\nYou take the beads.\n\nYou do not say anything. You cannot; the hunger is still four seconds away and it is using your voice for other purposes. But she says them and you hold the string, and at some point in the third decade your thumb finds the worn ones — the second decade, the sixteen thousand for a man in Youngstown who does not call — and stays there.\n\nTen of them. It takes four minutes.\n*achieve decade\n\nWhen she has finished she takes the rosary back, and looks at it, and says, \"Huh,\" and puts it in her coat pocket.\n\n*goto the_aisle\n\n*label the_aisle\n*page_break\n\nTwenty past four. The aisle is forty metres of terrazzo with the wax worn off down the middle where a hundred and twenty-eight years of people have walked.\n\nYou get about halfway.\n\nIt is not a wall and there is nothing dramatic about it. It is the way a room feels when you have wronged the person sitting in it and they have not said anything, and the wrongness is entirely in you, and every step forward is a step further into being seen.\n\nAt the halfway point you are on your knees on the terrazzo, and you are not sure how many pews you have passed.\n\nYou want two things and they are pulling in opposite directions on the same rope, and you have wanted both of them since you came in off Braddock Avenue.\n\nYou want to be nearer. That is the one you cannot explain and have not been able to explain since the vestibule.\n\nAnd you want it to stop — the lamp, the room, the being-seen — and the fastest way to make a thing stop being there is the way you have made things stop being there since 1931.\n\n*page_break\n\nFrom here you can see the whole sanctuary: three steps, the rail nobody removed, the altar, and behind it in the wall a brass box the size of a bread bin with a small key in a lock that has not been turned since Sunday, and above it the lamp.\n\nThe box is not locked well. You could open it in a second and a half. You have opened better than that.\n\n*choice\n  #Go up the three steps, over the rail, and stand at the box.\n    *goto at_the_rail\n  #Stay on your knees halfway up the aisle and go no further.\n    *goto stay_kneeling\n\n*label at_the_rail\n*page_break\n\nYou go up the three steps and over the rail, which nobody has done from that side in a hundred and twenty-eight years except to clean.\n\nUp here the lamp is not at the far end of anything. It is above your head and slightly behind you, and the red comes down over your shoulders and onto your hands and onto the brass door of the box, which is warm, because it is under a lamp.\n\nIt has a keyhole and a small key in it, and the key is turned to the left, and there is nothing else. No bolt, no bar, no wire. A hundred and twenty-eight years of a brass door that anybody in this neighbourhood could have opened at any hour, kept shut by nothing whatsoever except what everybody in the neighbourhood understood it to be.\n\nYour hand is on it.\n\n*choice\n  #Turn the key.\n    *goto ending_tabernacle\n  #Take your hand off the door and step back down.\n    *goto stepped_back\n\n*label stepped_back\n*page_break\n\nYou take your hand off the brass and go back over the rail and down the three steps, and you are on the terrazzo again at the foot of them with your back to the sanctuary.\n\nYou do not remember deciding. That is the part you will have, afterwards, if there is an afterwards: not a decision, just the fact that at some point your hand came off the door, and that the hand is yours and has done a great many things since 1931 and did that one too.\n\n*goto stay_kneeling\n\n*label ending_tabernacle\n*page_break\n\nYou turn the key. The brass door opens the way an old lock opens, which is easily.\n\nInside there is a linen cloth and a covered vessel, and inside that there is bread, and it is not bread.\n\nYou knew that before you touched the door. That is the thing that will never afterwards be arguable: you did not do this because you thought it was empty. You did it because it was full, and because you have spent ninety-four years being unable to bear that anything was full.\n\nWhat you want, when your hand closes, is to *have* Him.\n\nThat is the whole of it and it is not complicated. For ninety-four years you have taken what you wanted into yourself and it has always worked, every time, without exception, and this is the one thing you have ever wanted that you have not been able to take.\n\nIt does not work. It cannot be made to work; a person is not had that way, and the wanting turns over in your hands while you are still holding it. By the time your hand comes down you have stopped trying to have Him and started trying to make Him not be there — and the two turn out to be one thing in different coats, and the one thing is taking.\n\nAnd then nothing happens to you.\n\nThat is the sentence to take away from this. *Nothing happens to you.* No fire, no voice, no hand out of the ceiling. You are not struck down. You are not even prevented. You do the worst thing available to anything in this world, on the second step, under a lamp, and the building lets you — the way a man stands still and lets his son hit him.\n\nFr. Dan Cusack finds the sanctuary at twenty to six. He is thirty-four years old and he has four parishes and he has never had a day like it, and what he does — before the police, before the diocese, before anything — is kneel down on the second step and start to gather up what is on the floor with his hands.\n\nYou are in the culvert under the Rankin Bridge by six.\n\nYou have another ninety-four years, if you want them. You will spend a good many of them working out what kind of thing it is that could have stopped you and did not, and every answer you arrive at will be worse than the one before.\n\n*ending What You Broke\n\n*label stay_kneeling\n*page_break\n\nYou stay where you are, halfway up the aisle, on the terrazzo, with your hands on your knees.\n\n*if (contrite)\n  You have already said the short thing in the box on the epistle side, and you find that having said it does not make this easier and does make it possible. There is a difference. Nobody ever explains the difference and it is the whole of the difference.\n*if (contrite = false)\n  You have not said anything to anybody tonight and you do not say anything now. You kneel on a cold floor halfway up a church because you cannot go forward and will not go back, which is where a great many people have knelt, and none of them were what you are.\n\nBehind you, four pews back, Verna Sowka says: \"You can stop there. He's not counting the yards.\"\n\n*page_break\n\nThe building goes on being cold.\n\nAt twenty past five the sky over the roofs to the east is not lighter, but the quality of the dark is different, the way it is different an hour before.\n\nAt twenty-five to six a car turns off Braddock Avenue into the lot with its headlights on and its wipers going.\n\nMarek steps back from the fence to let it in.\n\n*goto_scene three_dawn\n", "three_dawn": "*comment ==================== ACT THREE — DAWN ====================\n*comment Thirty-four minutes with a priest, and then 6:14. Nine endings live here.\n*comment Cusack absolves; he does not adjudicate metaphysics and he cannot stop\n*comment the sun. Grace is not a cure. Never say that in the text.\n\nTwenty-five to six. The car is a fifteen-year-old Corolla with a diocesan parking sticker and one hubcap missing, and it parks across two spaces because there is nobody to park badly in front of.\n\nThe man who gets out is thirty-four, unshaven, in a black jacket over a clerical shirt with the collar tab pushed in crooked. He has a travel mug in one hand and a ring of keys in the other that he has not sorted since June, and he stands under the sodium light going through them with his thumb.\n\nMarek has stepped back from the fence. He is nine metres away in the dark by the hedge and Fr. Dan Cusack walks past him without seeing him, because Marek has been not being seen since before the mill was built.\n\nThe side door goes. The corridor light comes on.\n\n*page_break\n\n\"Verna,\" says Fr. Cusack, from the sacristy door, in the flat voice of a man who has found something he has to deal with before coffee. \"It's twenty to six.\"\n\n\"I know what time it is, Father.\"\n\n\"You've been here since eleven.\"\n\n\"I have.\"\n\nHe comes out past the rail with the mug still in his hand, and he gets four steps into the sanctuary before he sees you, halfway up the aisle in a coat, forty metres from the nearest working light.\n\nHe stops.\n\n*page_break\n\nTo his enormous credit he does not run and he does not shout. What he does is put the mug down on the second step, which is not where mugs go, and say: \"All right.\"\n\nThen: \"Verna. Come here to me.\"\n\n\"No,\" says Verna Sowka, from the fourth pew. \"You come here to us, and sit down, and I'll tell you what's what.\"\n\n*page_break\n\nIt takes four minutes and she does it badly, and it does not matter, because by the second minute Fr. Cusack has stopped listening to her and started looking at you properly — at where you are on the floor, at how far up the aisle you got, at the fact that you have not once in four minutes looked at the far end of the building.\n\nHe is not a man who believes in this. Nothing in nine years of seminary and four parishes has prepared him for it and he does not, in fact, believe it, and you can hear his heart going like a bird's.\n\nHe gets up off the pew and comes down the aisle to you and stops two metres away.\n\n\"Sunrise is fourteen minutes past six,\" he says. \"Is that right?\"\n\n*page_break\n\nThirty-four minutes.\n\n*choice\n  #\"Father. I want to go to confession, and there are thirty minutes.\"\n    *goto confess_ask\n  #Say nothing. There is nothing he can do about the sun.\n    *goto say_nothing_cusack\n  #Go past him, out through the vestibule, and take what is coming.\n    *goto to_the_doors\n\n*label say_nothing_cusack\n*page_break\n\nYou say nothing.\n\nFr. Cusack waits. He is bad at silences and he waits anyway, standing two metres up the aisle in a jacket with a travel mug going cold on the second step behind him, and after a while he crouches down so that his eyes are level with yours, which nobody has done to you in ninety-four years.\n\n\"I don't know what you are,\" he says. \"I want to say that out loud so you know I'm not pretending. I've got about thirty minutes and no idea, and I'd rather be honest than impressive.\"\n\nHe looks at the floor between you.\n\n\"But I know what I'm for. So I'm going to sit in that box on the epistle side until quarter past six, because that's the only useful thing I've got, and if you come, you come.\"\n\nHe goes and sits in it. You can hear the door.\n\n*goto after_offer\n\n*label confess_ask\n*page_break\n\n\"Father,\" you say. \"I want to go to confession.\"\n\nFr. Cusack's breath goes out of him.\n\n\"Right,\" he says. \"Right. Yes.\" He looks around the church as though the box might have moved. \"Yes. Come on, then.\"\n\n*goto in_the_box\n\n*label after_offer\n*page_break\n\nTen past six. Four minutes.\n\nThe dark over the roofs to the east is the colour it goes just before. Verna has not moved out of the fourth pew. Fr. Cusack is sitting in a wooden box on the epistle side with a purple stole round his neck and the light with the bulb out, and he has been in there for twenty-nine minutes, and he has not come out once to check.\n\n*choice\n  #Go to the box on the epistle side while there is still time.\n    *goto in_the_box\n  #Stay where you are, halfway up the aisle, and let it come.\n    *goto final_nave\n\n*label in_the_box\n*page_break\n\nYou kneel on the penitent's side. Cracked leather over a board, a lattice screen with cloth behind it, and this time there is somebody on the other side of it.\n\n*if (name = false)\n  \"Bless me, Father, for I have sinned,\" you say, and then you stop, be
