cause the next word is a name and you do not have one.\n\n  Behind the screen, Fr. Cusack waits. Then, gently: \"You can start anywhere. It's not a form.\"\n\n  So you start anywhere, and it takes what is left, and it is not orderly. You have no name to put to any of it and that is itself the first thing you confess.\n*if (name)\n  \"Bless me, Father, for I have sinned. It's been a hundred and two years.\" A breath. \"My name is Ondrej Michal Hlavatý. I was baptised in the font in that vestibule, the twenty-first of August, nineteen four.\"\n\n  There is a long pause behind the screen.\n\n  \"Go on,\" says Fr. Cusack.\n\n  So you go on, and it takes what is left.\n\n*page_break\n\nYou do not give him the list. There is no list; there is not time for a list and you both know it inside the first minute, and what you give him instead is the shape of it — what you are, how you came to be it, what you have done with it, and the ninety-four years of deciding every morning not to think about any of that.\n\nHe does not interrupt. Twice he starts to and does not.\n\nAt six minutes past six you get to the end and say the thing on the card, the brown one, in the flat vowels of a mill town.\n\n*if (contrite)\n  You have said it once already tonight, in this box, to nobody. It is not less this time. It is the same thing with a man on the other side of the screen, which turns out to be a different act entirely and not a smaller one.\n*if (contrite = false)\n  *set contrite true\n  *achieve contrition\n  You find, saying it out loud to another human being at six minutes past six in the morning, that you mean the middle of it — *for having offended Thee* — and that the sun coming down Braddock Avenue is somewhere in it too, and that you are not going to pretend otherwise to a priest at this hour.\n\n*page_break\n\nThen Fr. Dan Cusack, thirty-four, four parishes, who does not believe any of this and has not slept properly since Tuesday, says:\n\n\"For your penance—\" and stops.\n\nYou hear him breathe.\n\n\"For your penance, stay where you are and let the light in.\"\n\nAnd then he raises his hand behind a lattice screen in a wooden box in Braddock, Pennsylvania, at eight minutes past six on a Thursday morning, and says the words, all of them, in the right order, without hurrying:\n\n*Deus, Pater misericordiarum... ego te absolvo a peccatis tuis, in nomine Patris, et Filii, et Spiritus Sancti.*\n\n*achieve absolved\n\n*page_break\n\nYou come out of the box.\n\nHe comes out of his side at the same moment, still in the stole, and the two of you stand in the side aisle of St. Wenceslaus for a second and a half, and neither of you has the least idea what the procedure is, because there is no procedure.\n\n\"I can't stop it,\" he says. \"The sun. I want to be clear I can't stop it. I don't have anything for that.\"\n\n\"No.\"\n\n\"Right.\" He wipes his face with his hand. \"Then come and sit down, at least. Not on the floor.\"\n\n*goto final_nave\n\n*label to_the_doors\n*page_break\n\nYou go past him.\n\nFr. Cusack says something behind you and Verna says something sharper, and you are through the inner doors into the vestibule with the terrazzo and the missalette rack and the radiator, and the granite bowl on its pillar with **1897** cut into the base.\n\nThe outer doors are unlocked now, because a priest came in through the side and there is a Corolla in the lot with a diocesan sticker on it.\n\nThrough the glass, under the sodium light, Marek has come back to the fence.\n\n*choice\n  #Go straight past the granite bowl and out through the doors.\n    *goto ending_font\n  #Stop at the doors and talk to him.\n    *goto marek_last\n\n*label ending_font\n*page_break\n\nYou do not go along the wall this time. You go straight, at speed, because there are eight minutes left and speed is the only thing you have ever been able to bring to any of it.\n\nYour coat catches the rim and the bowl comes off the pillar.\n\nIt is granite, it is a hundred and twenty-eight years old, and it weighs a great deal, and when it goes over it goes over onto you, and forty litres of Saturday's water goes across the terrazzo floor of the vestibule in a sheet.\n\nThere is no time at all. There is your mother's name, and a shawl, and a room full of people in August of 1904 who are all now dead, and somebody saying *Ondrej Michal* out loud over this exact bowl and meaning it, and then a great deal of light with no sun in it.\n\nFr. Cusack finds a wet floor, a cracked font on its side, and a coat.\n\nHe kneels down in the water in his good trousers and he stays there a long time, and when the diocese asks him afterwards what happened he says, every time, the same sentence, which is: *A man came in out of the rain and I was late.*\n\n*ending The Font\n\n*label marek_last\n*page_break\n\nYou stop at the glass. He comes to within two metres of the other side of it, which is the closest he has been to this building in ninety-four years.\n\n\"You look terrible,\" Marek says. \"Come out. There is a car at the end of Talbot and you have ten minutes, which is eight more than you need.\"\n\n*if (name)\n  \"You haven't said my name all night,\" you say. \"Not since the phone.\"\n\n  Marek's face does something. It is the first movement you have seen in it since 1931.\n\n  \"No,\" he says. \"I have not. You found it, then.\"\n*if (name = false)\n  \"Say it again,\" you say. \"What you called me on the phone.\"\n\n  \"No,\" says Marek. \"You will only ask what it means, and I do not think I could stand that.\"\n\n*page_break\n\n\"One thing,\" he says, \"and then you will decide, and I will accept whatever it is, because I have never once made you do anything and I am not starting on a Thursday.\n\n\"I found you dying. That is true. I gave you ninety-four years and you have used them, and nothing that happened in them was done by me. Every one of those was yours. I have never told you otherwise and I am not telling you otherwise now.\"\n\nHe puts one hand flat on the glass, which is a thing he has not done.\n\n\"There is nothing in that building for you. It has never once answered you. In ninety-four years, not once, not a word, not a sign — and you know that I do not say untrue things.\"\n\n*page_break\n\nHe is right about all of it.\n\nThat is what you will think about, if there is any afterwards to think in: that every sentence Marek said at that door was true, and that the last one was true and complete and still somehow not the case, and that you have no argument against it and are not going to go.\n\nBehind you, four pews up, an old woman with a bad hip is saying the third decade out loud to nobody.\n\n*choice\n  #Open the outer door and go down the steps to him.\n    *goto ending_out\n  #Turn round and go back up the aisle.\n    *goto final_nave\n\n*label ending_out\n*page_break\n\nYou open the outer door of St. Wenceslaus at eleven minutes past six and go down the steps into the lot.\n\nMarek does not say anything. He does not gloat; he has never gloated, that is not among his faults. He puts his hand on the back of your neck the way he did on Talbot Avenue in April of 1931 and walks you to the car at the end of the street, and the two at the corner by the pharmacy fall in behind, and it is over in ninety seconds.\n\nThree minutes later the sun comes down Braddock Avenue and through a window given in 1924 by a family called Hlavatý, and it lands in the fourth pew on the Mary side, where a seventy-nine-year-old woman is sitting with a rosary and a thermos, waiting for somebody who has gone.\n\nShe keeps the hour. She is there the following Thursday, and the one after that.\n\n*ending Out to Him\n\n*label final_nave\n*page_break\n\nSix minutes past. You come back up the centre aisle of St. Wenceslaus.\n\nVerna Sowka has not moved out of the fourth pew on the Mary side in seven hours. Fr. Cusack is standing at the end of it with his hands at his sides and no idea what to do with them.\n\nThe east window is over the side altar: a man in a red cloak knocking at a door with no handle on his side, given in 1924 by a family whose name you have either found tonight or not.\n\n*if (fed)\n  *goto ending_sunrise_fed\n\n*choice\n  #Sit down in the fourth pew on the Mary side, beside her.\n    *goto sit_down\n  #Go down to the undercroft. There are no windows.\n    *goto ending_undercroft\n\n*label ending_undercroft\n*page_break\n\nYou go through the sacristy and down the concrete stair and behind the plywood partition at the east end, where the ground rises, and you sit down on the floor with your back against a slab that says **JOZEF KUBICA · KŇAZ · 1861–1931.**\n\nUpstairs, at fourteen minutes past six, the light comes through the east window and lies across the fourth pew, and Verna Sowka is in it, and Fr. Dan Cusack is standing at the end of the pew, and neither of them says anything for a long time.\n\nNothing comes down the stairs.\n\n*if (contrite)\n  You spend Friday down there, and Saturday, and by Sunday you are gone through the coal chute and across the river, absolved and alive and no different at all in any way that anybody could measure.\n\n  There is a Thursday in November when you are on Braddock Avenue at eleven at night and the outer doors are open, and you stand across the street for forty minutes and do not go in, and then in December you do.\n\n  It is not an ending. It is what you got instead of one, and it is more than you had any business getting.\n  *ending The Undercroft\n*if (contrite = false)\n  You spend Friday down there, and Saturday, and by Sunday you are gone through the coal chute and across the river.\n\n  Nothing happened. That is the honest account of the night: you sat in a building for seven hours, you were spoken to by an old woman and a tired priest, you did not take anything from anybody, and at fourteen minutes past six you were four metres underneath it all with your back to a dead man's slab.\n\n  Ninety-five years. Then ninety-six.\n\n  Sometimes on a Thursday you are on Braddock Avenue at eleven at night, and the outer doors of St. Wenceslaus are standing open, and you keep walking.\n  *ending Ninety-Five\n\n*label sit_down\n*page_break\n\nYou sit down in the fourth pew on the Mary side, on the end, with a metre of bench between you.\n\nVerna does not move over. She puts her hand out flat on the wood in the space between you, palm up, and leaves it there, and does not look at you, and does not say anything about it.\n\nFr. Cusack sits down in the pew in front and turns sideways.\n\nNine minutes.\n\n*page_break\n\n*if (contrite = false)\n  *goto not_contrite_end\n\nYou cannot receive. You have known that since the vestibule and it has never once been in question tonight: not the box, not the aisle, not the rail. There is no version of this where you go up those three steps and are given anything.\n\nWhat you can do is want it.\n\nThat has a name, and the name is older than this building and older than the country the building is in, and a man from Trenčín taught it to a woman who taught it to a boy in 1911 in a house on Talbot Avenue: that when you cannot come to the table you can ask to be brought, and the asking is not a substitute for anything, and it is not nothing.\n\n*page_break\n\nSo you do that. Sitting down, in a coat, in the fourth pew, at eleven minutes past six.\n\nYou do not say it out loud.\n*if (name)\n  You say your own name first, because everything starts there, and it has taken you the whole night and a green cloth book to be able to.\n\n  *Ondrej Michal Hlavatý.*\n*if (name = false)\n  You have no name to put at the front of it, and you go on anyway, which is its own kind of asking.\n\nAnd then the thing you want, which you have not been able to say in any language since April of 1931, and which is four words long, and which the far end of the building has been waiting to hear for ninety-four years.\n\n*page_break\n\nAt six minutes past thirteen the roofs on the east side of Braddock Avenue go from black to grey.\n\nVerna's hand is still on the wood between you, palm up.\n\n*choice\n  #Take the hand she has left open on the wood between you.\n    *goto took_hand\n  #Leave it where it is. You have not earned that.\n    *goto left_hand\n\n*label left_hand\n*page_break\n\nYou leave her hand where it is.\n\nShe does not move it. At about eleven minutes past she says, without turning her head: \"Suit yourself,\" in exactly the tone she used about the tea, and she leaves it there anyway, palm up, on the wood, for the last three minutes.\n\n*goto dawn_moment\n\n*label took_hand\n*page_break\n\nYou take her hand.\n\nIt is seventy-nine years old and there is a wedding ring worn thin on it and the knuckles are wrong from arthritis, and she closes her fingers round yours and grips hard enough to hurt, which she would be able to do, tonight, to you.\n\n\"There we are,\" says Verna Sowka.\n\n*goto dawn_moment\n\n*label dawn_moment\n*page_break\n\n*if (fed = false)\n  *achieve allnight\n*achieve dawn\n\nAt fourteen minutes past six the sun comes up over the Monongahela and down Braddock Avenue between the shuttered pharmacy and the bank, and it goes through a window given in 1924 by a family called Hlavatý, and it comes into the church.\n\nIt is not the way you expected and you have had ninety-four years to expect it.\n\nIt is not a fire. It is the vestibule again — the granite bowl, the hand in the water, the thing that is not a burn — and it is what happened halfway up the aisle, and it is the four seconds you managed of looking at the far end of the building at midnight, and it is all of that at once and all the way through, and there is nothing left over to be afraid with.\n\n*page_break\n\n*if (name)\n  Somebody in the room says *Ondrej Michal* out loud, over a granite bowl, in August of 1904, and means it as a promise.\n\n  It has never once been withdrawn. That is the last thing you find out and it turns out to have been the only thing.\n*if (name = false)\n  Somebody in the room says a word over a granite bowl in August of 1904 and means it as a promise, and you have never in ninety-four years found out what the word was.\n\n  You find out now. It takes no time at all.\n\nVerna Sowka is holding a coat.\n\n*page_break\n\nFr. Dan Cusack says the 6:30 that morning for nine people. He does not say what it is offered for and nobody asks, because nobody at a weekday Mass in a merged parish ever asks.\n\nAfterwards he goes into the sacristy and puts the 1900 register back on the shelf, third from the left, and stands with his hand on the spine for some time.\n\n*ending A Happy Death\n\n*label not_contrite_end\n*page_break\n\nNine minutes, and nothing to do with them.\n\nYou have not said anything to anybody tonight. Not in the box, not on the aisle, not to the man who sat in a wooden cupboard for twenty-nine minutes on the off chance. You have been in this building for seven hours and you have been perfectly silent in the only direction that was open.\n\nIt is not defiance. You would have to care more than you do for it to be defiance. It is ninety-four years of a habit, and the habit is holding, and you can feel it holding right up to the end.\n\n*page_break\n\n*if (fed = false)\n  *achieve allnight\n\nAt fourteen minutes past six the sun comes down Braddock Avenue and through the east window.\n\nIt is a fire. That is all, and it is quick, and there is no part of it that is addressed to anybody.\n\nVerna Sowka is holding a coat. She stands in the fourth pew with it over her arm for a long time, and Fr. Cusack does not tell her to sit down.\n\n\"He never said,\" she says at last. \"Seven hours. He never said one word to Him, Father. Not one.\"\n\n*ending Sunrise\n\n*label ending_sunrise_fed\n*page_break\n\nThere is no version of this in which you sit down in the fourth pew, because there is nobody in the fourth pew.\n\nYou go out through the sacristy window at nine minutes past six with the sound of Fr. Dan Cusack starting to shout behind you, and you are in the culvert under the Rankin Bridge before the light reaches the water.\n\nNinety-five years. Then ninety-six.\n\nThe parish keeps the Thursday hour going for about four months out of respect and then it lapses, the way it lapsed in 1996, and after that the lamp burns from eleven to midnight over an empty church, which is what it was doing before she came and what it will do after.\n\n*ending The Fourth Pew\n", "__order__": "one_door two_night three_dawn"};

function parse(src){
  const out=[];
  src.split(/\r?\n/).forEach((raw,i)=>{
    const t=raw.replace(/\t/g,'  ');
    const ind=t.length-t.replace(/^ +/,'').length, s=t.trim();
    if(!s){out.push({ind,k:'blank',line:i});return;}
    const cm = s[0]==='*' ? s.match(/^\*([a-z_]+)\s?(.*)$/) : null;
    if(cm){out.push({ind,k:'cmd',c:cm[1],a:cm[2],line:i});}
    else if(s[0]==='#'){out.push({ind,k:'opt',a:s.slice(1).trim(),line:i});}
    else out.push({ind,k:'text',a:s,line:i});
  });
  return out;
}
const P={}; for(const k in SCENES) P[k]=parse(SCENES[k]);
const ORDER=(SCENES.__order__||'').split(/\s+/).filter(Boolean);

/* ---------- expressions ---------- */
function val(t){t=t.trim();
  if(/^-?\d+$/.test(t))return +t;
  if(/^".*"$/.test(t))return t.slice(1,-1);
  if(t==='true')return true; if(t==='false')return false;
  return (t in S.vars)?S.vars[t]:0;}
function evalExpr(e){
  e=e.trim().replace(/^\((.*)\)$/s,'$1').trim();
  for(const op of [' and ',' or ']){let d=0;
    for(let i=0;i<e.length;i++){
      if(e[i]==='(')d++;else if(e[i]===')')d--;
      else if(d===0&&e.substr(i,op.length)===op)
        return op===' and '?(evalExpr(e.slice(0,i))&&evalExpr(e.slice(i+op.length)))
                           :(evalExpr(e.slice(0,i))||evalExpr(e.slice(i+op.length)));}}
  e=e.replace(/^\((.*)\)$/s,'$1').trim();
  const m=e.match(/^(.+?)\s*(>=|<=|!=|=|>|<)\s*(.+)$/); if(!m)return !!val(e);
  const a=val(m[1]),b=val(m[3]);
  return {'>=':a>=b,'<=':a<=b,'!=':a!=b,'=':a==b,'>':a>b,'<':a<b}[m[2]];}
function fair(c,n){n=+n;const v=n>=0?c+(100-c)*n/100:c+c*n/100;return Math.max(1,Math.min(99,Math.round(v)));}
function doSet(arg){
  const m=arg.match(/^(\S+)\s+(.*)$/); if(!m)return;
  const k=m[1]; let r=m[2].trim();
  if(GATED.includes(k) && !S.vars.formed) return;      /* not hers to shape yet */
  const fm=r.match(/^%\s*([+-])\s*(\d+)$/);
  if(fm){S.vars[k]=fair(+S.vars[k]||50,(fm[1]==='-'?-1:1)*(+fm[2]));return;}
  const rl=r.match(/^([+-])\s*(\d+)$/);
  if(rl){S.vars[k]=(+S.vars[k]||0)+(rl[1]==='-'?-1:1)*(+rl[2]);return;}
  S.vars[k]=val(r);}

/* ---------- text ---------- */
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const subst=t=>t.replace(/\$\{(\w+)\}/g,(_,k)=>(k in S.vars?S.vars[k]:''));
function inline(t){return esc(subst(t))
  .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
  .replace(/(^|[\s(“"—-])\*([^*\n]+)\*/g,'$1<em>$2</em>')
  .replace(/_(.+?)_/g,'<em>$1</em>');}

/* ---------- run ---------- */
function gotoScene(n){if(!P[n])return false;S.scene=n;S.pc=0;return true;}
function findLabel(sc,l){const a=P[sc];for(let i=0;i<a.length;i++)
  if(a[i].k==='cmd'&&a[i].c==='label'&&a[i].a.trim()===l.trim())return i;return -1;}
function skipBlock(a,i,ind){let j=i+1;while(j<a.length&&(a[j].k==='blank'||a[j].ind>ind))j++;return j;}

function step(pushHistory){
  if(pushHistory!==false) S.stack.push({vars:JSON.parse(JSON.stringify(S.vars)),scene:S.scene,pc:S.pc});
  if(S.stack.length>500) S.stack.shift();
  S.page=[];S.choices=null;
  let g=0;
  while(S.scene&&g++<20000){
    const a=P[S.scene];
    if(S.pc>=a.length){advanceScene();continue;}
    const n=a[S.pc];
    if(n.k==='blank'){S.pc++;continue;}
    if(n.k==='text'){S.page.push({t:'text',v:n.a,scene:S.scene,line:n.line});S.pc++;continue;}
    if(n.k==='opt'){S.pc=skipBlock(a,S.pc,n.ind);continue;}
    const c=n.c,arg=n.a;
    if(['comment','label','title','subtitle','author','scene_list','achievement','save_game'].includes(c)){S.pc++;continue;}
    if(['create','set','set_hidden','temp','set_ward'].includes(c)){doSet(arg);S.pc++;continue;}
    if(c==='achieve'){S.vars['ach_'+arg.trim()]=true;S.pc++;continue;}
    if(c==='line_break'){S.page.push({t:'br'});S.pc++;continue;}
    if(c==='page_break'){S.pc++;
      /* A break with nothing above it is not a screen. This happens whenever an
         option's body is a bare *goto and the label it lands on opens with a
         *page_break: the reader would get an empty page and a Continue button. */
      if(!S.page.length)continue;
      return render();}
    if(c==='image'){const m=arg.match(/^(\S+)\s*(.*)$/)||[];S.page.push({t:'img',src:m[1]||'',alt:m[2]||''});S.pc++;continue;}
    if(c==='goto'){const i=findLabel(S.scene,arg);S.pc=i<0?S.pc+1:i+1;continue;}
    if(c==='goto_scene'){const p=arg.trim().split(/\s+/);if(gotoScene(p[0])&&p[1]){const i=findLabel(S.scene,p[1]);if(i>=0)S.pc=i+1;}continue;}
    if(c==='finish'){advanceScene();continue;}
    if(c==='ending'){S.page.push({t:'end',v:arg.trim()});S.scene=null;return render();}
    if(c==='stat_chart'){S.page.push({t:'chart'});S.pc=skipBlock(a,S.pc,n.ind);continue;}
    if(c==='input_text'){S.page.push({t:'input',v:arg.trim()});S.pc++;return render();}
    if(c==='if'||c==='elseif'||c==='else'){
      if(c==='else'||evalExpr(arg)){S.pc++;}
      else{let j=skipBlock(a,S.pc,n.ind);
        while(j<a.length&&a[j].k==='cmd'&&(a[j].c==='elseif'||a[j].c==='else')&&a[j].ind===n.ind){
          if(a[j].c==='else'||evalExpr(a[j].a)){S.pc=j+1;j=-1;break;}
          j=skipBlock(a,j,n.ind);}
        if(j>=0)S.pc=j;}
      continue;}
    if(c==='choice'||c==='fake_choice'){
      /* Options may be nested inside *if / *elseif / *else at any depth: only the
         branch that is true contributes its options to the menu. */
      const opts=[];
      const scan=(start,ind)=>{
        let j=start;
        while(j<a.length){const m=a[j];
          if(m.k==='blank'){j++;continue;}
          if(m.ind<=ind)break;
          if(m.k==='opt'){opts.push({label:m.a,body:j+1,line:m.line,scene:S.scene});
            j=skipBlock(a,j,m.ind);continue;}
          if(m.k==='cmd'&&m.c==='if'){
            let k=j,done=false;
            while(k<a.length&&a[k].k==='cmd'&&['if','elseif','else'].includes(a[k].c)&&a[k].ind===m.ind){
              if(!done&&(a[k].c==='else'||evalExpr(a[k].a))){scan(k+1,a[k].ind);done=true;}
              k=skipBlock(a,k,m.ind);}
            j=k;continue;}
          j++;}
        return j;};
      const after=scan(S.pc+1,n.ind);
      if(!opts.length){S.pc=after;continue;}
      S.choices={opts,after};return render();}
    S.pc++;
  }
  render();
}
function advanceScene(){const i=ORDER.indexOf(S.scene);
  if(i>=0&&i+1<ORDER.length)gotoScene(ORDER[i+1]);
  else{S.page.push({t:'end'});S.scene=null;}}

/* ---------- render ---------- */
function deltaText(b){const a=P[S.scene],o=[];
  for(let j=b;j<a.length&&j<b+70;j++){const n=a[j];if(n.k!=='cmd')continue;
    if(n.c==='set'||n.c==='set_hidden')o.push(n.a);
    if(n.c==='goto'||n.c==='goto_scene')break;}
  return o.join(' · ');}
const NICE={valor:['Valor','Patience'],severity:['Severity','Mercy'],splendor:['Splendor','Hiddenness'],
  charity:['Charity',null],hope:['Hope',null]};
function flashDeltas(before){
  const rows=[];
  for(const k in NICE){
    const a=+before[k]||0,b=+S.vars[k]||0,d=b-a;
    if(!d)continue;
    const nm=NICE[k], lab=(d>0||!nm[1])?nm[0]:nm[1], amt=Math.abs(d);
    const col={valor:'var(--cobalt)',severity:'var(--ruby)',splendor:'var(--amber)',
      charity:'var(--verd)',hope:'var(--violet)'}[k];
    rows.push('<div style="color:'+col+'">'+(d>0?'+':'−')+amt+' '+lab+'</div>');
  }
  if(!rows.length)return;
  const f=$('flash'); f.innerHTML=rows.join(''); f.classList.add('show');
  setTimeout(()=>f.classList.remove('show'),2600);
}
function keyOf(n){return n.scene+':'+n.line;}
function textFor(n){const e=S.notes[keyOf(n)];
  if(!e||!e.replacement) return n.v;
  if(e.original && e.original!==n.v) return n.v;   /* stale — never overwrite the wrong line */
  return e.replacement;}
function render(){
  const st=$('stage'); st.innerHTML='';
  if(S.edit&&S.stack.length>1){
    const b=document.createElement('button');b.className='backbtn';b.textContent='◂ previous screen';
    b.onclick=goBack;st.appendChild(b);}
  let lastWasBr=false;
  S.page.forEach(n=>{
    if(n.t!=='br') lastWasBr=false;
    if(n.t==='text'){
      const p=document.createElement('p'), k=keyOf(n), e=S.notes[k];
      p.innerHTML=inline(textFor(n));
      if(e&&e.stale)p.classList.add('stalenote');
      else if(e&&e.replacement)p.classList.add('edited');
      else if(e)p.classList.add('hasnote');
      if(S.edit)p.onclick=()=>openNote(k,n.v);
      st.appendChild(p);
    } else if(n.t==='br'){
      if(!lastWasBr){const d=document.createElement('div');d.className='hr';st.appendChild(d);}
      lastWasBr=true; return;
    } else if(n.t==='img'){ st.appendChild(imageEl(n));
    } else if(n.t==='chart'){ st.appendChild(chartEl());
    } else if(n.t==='input'){
      const w=document.createElement('div');w.className='choices';
      w.innerHTML='<input id="tin" style="font-family:Spectral,serif;font-size:1rem;padding:.75rem;background:var(--glass);border:1px solid var(--came);color:var(--ink)">';
      const b=document.createElement('button');b.className='opt';b.textContent='That is it.';
      b.onclick=()=>{const v=$('tin').value.trim();if(v)S.vars[n.v]=v;S.pc++;save();step();};
      w.appendChild(b);st.appendChild(w);
    } else if(n.t==='end'){
      const d=document.createElement('p');d.style.cssText=
        'text-align:center;color:var(--ink3);font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.3em';
      d.innerHTML=n.v?('<div style="font-size:.62rem;opacity:.6;margin-bottom:.9rem">the end of this way through</div>'
        +'<div style="font-family:Spectral,Georgia,serif;font-size:1.5rem;letter-spacing:.02em;color:var(--amber);text-transform:none">'+esc(n.v)+'</div>')
        :'END';
      st.appendChild(d);
      const again=document.createElement('button');again.className='cont';
      again.textContent='go back to the door';
      again.onclick=()=>{const n2=S.notes,i2=S.imgs,e2=S.edit;localStorage.removeItem('redlamp');
        S.vars={};S.scene=null;S.pc=0;S.stack=[];S.notes=n2;S.imgs=i2;S.edit=e2;save();titleScreen();};
      st.appendChild(again);}
  });
  if(S.choices){
    const w=document.createElement('div');w.className='choices';
    S.choices.opts.forEach(o=>{
      const k=o.scene+':'+o.line, ov=S.notes[k];
      const lab=(ov&&ov.replacement)?ov.replacement:o.label;
      const row=document.createElement('div');row.style.cssText='display:flex;gap:.4rem;align-items:stretch';
      const b=document.createElement('button');b.className='opt';b.style.flex='1';
      b.innerHTML=inline(lab)+(S.edit?'<span class="delta">'+esc(deltaText(o.body)||'—')+'</span>':'');
      b.onclick=()=>pick(o);
      row.appendChild(b);
      if(S.edit){
        const e=document.createElement('button');e.className='opt';e.style.cssText='flex:0 0 2.6rem;text-align:center;border-left-color:var(--ink3)';
        e.innerHTML='&#9998;'; e.title='edit this option\'s wording';
        e.onclick=ev=>{ev.stopPropagation();openNote(k,o.label);};
        row.appendChild(e);
      }
      w.appendChild(row);});
    st.appendChild(w);
  } else if(S.scene){
    const b=document.createElement('button');b.className='cont';b.textContent='continue';
    b.onclick=()=>{save();step();};st.appendChild(b);}
  $('cwhere').innerHTML=S.scene?'<b>'+esc(S.scene)+'</b>':'end';
  $('cedit').innerHTML=S.edit?'<span class="ed">edit</span>':'';
  window.scrollTo(0,0); save();
}
function redraw(){ const sc=S.choices, pg=S.page; S.page=pg; S.choices=sc; render(); }
function pick(o){ const before=JSON.parse(JSON.stringify(S.vars)); S.pc=o.body; step();
  flashDeltas(before); save(); }
function goBack(){ S.stack.pop(); const h=S.stack.pop(); if(!h)return;
  S.vars=h.vars;S.scene=h.scene;S.pc=h.pc; step(); }

/* ---------- images ---------- */
function imageEl(n){
  const f=document.createElement('figure');
  const got=S.imgs[n.src];
  if(got){
    f.innerHTML='<img class="glazed" src="'+got+'" alt="'+esc(n.alt)+'">'+
      (S.edit?'<figcaption>'+esc(n.src)+' — click to replace</figcaption>':'');
    if(S.edit) f.querySelector('img').onclick=()=>chooseImage(n.src);
  } else {
    f.innerHTML='<div class="imgph glazed">'+esc(n.alt)+
      (S.edit?'<button type="button">add image</button>':'')+'</div>'+
      '<figcaption>'+esc(n.src)+'</figcaption>';
    const b=f.querySelector('button'); if(b) b.onclick=()=>chooseImage(n.src);
  }
  return f;
}
let imgSlot=null;
function chooseImage(slot){ imgSlot=slot; $('pick').value=''; $('pick').click(); }
$('pick').onchange=e=>{
  const file=e.target.files[0]; if(!file||!imgSlot) return;
  const r=new FileReader();
  r.onload=()=>{ const im=new Image();
    im.onload=()=>{
      const max=1200, sc=Math.min(1,max/Math.max(im.width,im.height));
      const cv=document.createElement('canvas');
      cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      const url=cv.toDataURL('image/jpeg',0.8);
      S.imgs[imgSlot]=url; save(); redraw(); pushImage(imgSlot,url);
    };
    im.src=r.result; };
  r.readAsDataURL(file);
};
async function pushImage(slot,url){
  const db=await claude.use('db');
  if(!db){ toast('image saved on this device only'); return; }
  try{ await db.doc('images/'+slot.replace(/[^\w]/g,'_')).set({slot,dataUrl:url,at:new Date().toISOString()});
    toast('image saved for Claude'); }
  catch(err){ toast('image too large — saved locally'); }
}

let noteTarget=null;
const openPanel=h=>{$('panelBody').innerHTML=h;$('panel').classList.add('open');};

function openNote(key,original){

function draftRecord(kind){
  const repl=(($('rtxt')||{}).value||'').trim(), note=(($('ntxt')||{}).value||'').trim();
  const rec={kind,scene:noteTarget.key.split(':')[0],line:+noteTarget.key.split(':')[1],
    original:noteTarget.original,note,at:new Date().toISOString(),synced:false};
  if(repl&&repl!==noteTarget.original) rec.replacement=repl;
  return rec;}
let draftTimer=null;
function draftSave(){
  if(!noteTarget)return;

    save(); updateSyncPill(); pushOne(noteTarget.key); },700);}
async function pushOne(key){
  const r=S.notes[key]; if(!r)return;

  try{ const body=Object.assign({},r); delete body.synced;
    await db.doc('notes/'+key.replace(/[^A-Za-z0-9]/g,'_')).set(body);
    r.synced=true; save(); updateSyncPill(); }
  catch(e){ dbState='error'; updateSyncPill(); }}
async function saveNote(kind){
  if(!noteTarget)return;

  const db=await getDB();

    await db.doc('notes/'+key.replace(/[^A-Za-z0-9]/g,'_')).set(body);
    S.notes[key].synced=true; save(); toast('saved'); }
  catch(e){ dbState='error'; toast('NOT SAVED — open NOTES and tap Sync'); }

function revert(){ if(!noteTarget)return; const e=S.notes[noteTarget.key];
  if(e){delete e.replacement; if(!e.note) delete S.notes[noteTarget.key];}
  save(); closePanel(); redraw(); }

/* ---------- persistence ---------- */
let storageBroken=false;
function put(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}
  catch(e){if(k==='rl_notes')storageBroken=true;return false;}}
function got(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
function save(){
  put('rl_progress',{vars:S.vars,scene:S.scene,pc:S.pc,edit:S.edit,started:S.started});
  put('rl_notes',S.notes); put('rl_imgs',S.imgs);}
function load(){
  const r=got('rl_progress')||got('redlamp');
  S.notes=got('rl_notes')||(r&&r.notes)||{};
  S.imgs=got('rl_imgs')||(r&&r.imgs)||{};
  if(r){S.vars=r.vars||{};S.scene=r.scene;S.pc=r.pc||0;S.edit=!!r.edit;S.started=!!r.started;}
  return !!(r&&r.scene);}

/* ---- notes are anchored to the TEXT they were written against, not the
   line number, so that editing the source upstream cannot silently move a
   rewrite onto the wrong paragraph ---- */
function sourceLine(scene,line){
  const a=P[scene]; if(!a) return null;
  const n=a.find(x=>x.line===line);
  return (n && (n.k==='text'||n.k==='opt')) ? n.a : null;
}
function reanchor(){
  let moved=0, stale=0;
  for(const key of Object.keys(S.notes)){
    const r=S.notes[key]; if(!r.original) continue;
    const [scene,ln]=[key.split(':')[0], +key.split(':')[1]];
    if(sourceLine(scene,ln)===r.original){ delete r.stale; continue; }
    const a=P[scene]||[];
    const hit=a.find(x=>(x.k==='text'||x.k==='opt')&&x.a===r.original);
    if(hit){
      delete S.notes[key];
      r.line=hit.line; delete r.stale;
      S.notes[scene+':'+hit.line]=r; moved++;
    } else { r.stale=true; stale++; }
  }
  if(moved) save();
  return {moved,stale};
}

/* ---- the database is the source of truth for notes ---- */
let DB=null, dbState='connecting';
async function getDB(){
  if(DB)return DB;
  try{ if(typeof claude==='undefined'||!claude.use){dbState='none';return null;}
    DB=await claude.use('db'); dbState=DB?'ready':'none'; return DB; }
  catch(e){ dbState='none'; return null; }}
async function pullFromDB(){
  const db=await getDB(); if(!db){updateSyncPill();return;}
  let changed=false;
  try{ const snap=await db.collection('notes').get();
    (snap.docs||[]).forEach(d=>{ if(!d.exists)return; const r=d.data(); if(!r||!r.scene)return;
      const key=r.scene+':'+r.line, mine=S.notes[key];
      if(!mine||(r.at||'')>(mine.at||'')){S.notes[key]=Object.assign({},r,{synced:true});changed=true;} });
  }catch(e){ dbState='error'; }
  try{ const snap=await db.collection('images').get();
    (snap.docs||[]).forEach(d=>{ if(!d.exists)return; const r=d.data();
      if(r&&r.slot&&r.dataUrl&&!S.imgs[r.slot]){S.imgs[r.slot]=r.dataUrl;changed=true;} });
  }catch(e){}
  const rr=reanchor();
  if(changed||rr.moved){ save(); if(S.scene) redraw(); }
  if(rr.moved) toast(rr.moved+' notes re-anchored');
  updateSyncPill();}
async function pushAll(){
  const db=await getDB(); if(!db){toast('no connection — nothing pushed');return;}
  let n=0;
  for(const k in S.notes){ const r=S.notes[k]; if(r.synced) continue;
    try{ const body=Object.assign({},r); delete body.synced;
      await db.doc('notes/'+k.replace(/[^A-Za-z0-9]/g,'_')).set(body); r.synced=true; n++; }catch(e){} }
  save(); toast(n?('pushed '+n):'everything already saved'); updateSyncPill(); showNotes();}
function notesAsText(){
  const ks=Object.keys(S.notes).sort();
  if(!ks.length) return 'No notes.';
  let out='ONE SOUL — author notes ('+ks.length+')\n';
  ks.forEach(k=>{ const r=S.notes[k];
    out+='\n--- '+r.scene+' · line '+r.line+' ---\n';
    if(r.original)    out+='WAS: '+r.original+'\n';
    if(r.replacement) out+='NOW: '+r.replacement+'\n';
    if(r.note)        out+='NOTE: '+r.note+'\n';
  });
  return out;
}
function copyNotes(){
  const t=notesAsText();
  const ta=document.createElement('textarea');
  ta.value=t; ta.style.cssText='position:fixed;top:-999px'; document.body.appendChild(ta);
  ta.select();
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast('copied'),()=>{});
  else toast(ok?'copied':'select the box below and copy');
  openPanel('<h3>Notes, as text</h3><p style="color:var(--ink3);font-size:.82rem">'+
    (ok?'Copied to the clipboard. ':'')+'Paste this into the conversation and I will apply it to the source.</p>'+
    '<textarea style="min-height:22rem;font-family:\'IBM Plex Mono\',monospace;font-size:.72rem" onclick="this.select()">'+
    esc(t)+'</textarea><button class="act" onclick="showNotes()">Back</button>');
}
function unsyncedCount(){let n=0;for(const k in S.notes) if(!S.notes[k].synced)n++;return n;}
function updateSyncPill(){
  const el=$('csync'); if(!el)return;
  const u=unsyncedCount();
  if(dbState==='ready'&&!u&&!storageBroken) el.innerHTML='<span style="color:var(--verd)">saved</span>';
  else if(dbState==='connecting') el.innerHTML='<span style="color:var(--ink3)">connecting</span>';
  else if(u) el.innerHTML='<span style="color:var(--ruby)">'+u+' unsaved</span>';
  else if(dbState==='none') el.innerHTML='<span style="color:var(--ink3)">local</span>';
  else el.innerHTML='<span style="color:var(--ruby)">offline</span>';}

/* ---------- boot ---------- */
function titleScreen(){
  S.scene=null;
  $('stage').innerHTML='<div class="title">'+lampSVG()+'<h1>The Red Lamp</h1>'+
    '<div class="sub">St. Wenceslaus, Braddock Avenue · Thursday, 11:04 p.m.</div>'+
    '<div class="tag">You have been dead for ninety-four years, you are being hunted by your own kind, and the only unlocked door on Braddock Avenue was this one.</div></div>';
  const w=document.createElement('div');w.className='choices';
  const b=document.createElement('button');b.className='opt';b.textContent='Begin.';
  b.onclick=()=>{S.started=true;S.vars={};S.stack=[];
    (P.__startup__||[]).forEach(n=>{if(n.k==='cmd'&&n.c==='create'){const m=n.a.match(/^(\S+)\s+(.*)$/);if(m)S.vars[m[1]]=val(m[2].trim());}});
    gotoScene(ORDER[0]);step();};
  w.appendChild(b);
  if(localStorage.getItem('redlamp')){
    const c=document.createElement('button');c.className='opt';c.textContent='Continue where I left off.';
    c.onclick=()=>{load();if(S.scene)step();else b.click();};w.appendChild(c);}
  $('stage').appendChild(w); $('cwhere').textContent='title';
}
function buildBar(){
  const defs=[['notes','Notes',showNotes],['jump','Jump',showJump],
    ['edit','Edit',toggleEdit],['theme','Theme',toggleTheme],['size','A±',cycleSize],['restart','Restart',restart]];
  $('bar').innerHTML='';
  defs.forEach(([id,l,fn])=>{ if(id==='jump'&&!S.edit)return;
    const b=document.createElement('button');b.textContent=l;b.onclick=fn;
    if(id==='edit'&&S.edit)b.classList.add('on');$('bar').appendChild(b);});
}
function toggleEdit(){S.edit=!S.edit;document.body.classList.toggle('editing',S.edit);
  buildBar();save();if(S.scene)redraw();else titleScreen();
  toast(S.edit?'edit mode — click any paragraph':'edit mode off');}
function toggleTheme(){const r=document.documentElement;
  r.setAttribute('data-theme',r.getAttribute('data-theme')==='light'?'dark':'light');}
let sizes=[17,19,21,24],si=1;
function cycleSize(){si=(si+1)%sizes.length;document.documentElement.style.setProperty('--fs',sizes[si]+'px');}
function restart(){if(!confirm('Start again from the beginning?'))return;
  const n=S.notes,i=S.imgs,e=S.edit;localStorage.removeItem('redlamp');
  S.vars={};S.scene=null;S.pc=0;S.stack=[];S.notes=n;S.imgs=i;S.edit=e;save();titleScreen();}

(function(){
  P.__startup__=parse(SCENES.__startup__||'');
  const had=load();
  document.body.classList.toggle('editing',S.edit);
  buildBar();
  if(had&&S.started)step(); else titleScreen();
  reanchor(); updateSyncPill(); pullFromDB();
  setInterval(function(){ if(unsyncedCount()) pushAll(); },30000);
  addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') pullFromDB(); });
  addEventListener('keydown',e=>{
    if(e.key==='Escape')closePanel();
    if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='e'){e.preventDefault();toggleEdit();}
    if(S.edit&&e.key==='ArrowLeft'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName))goBack();
  });
})();
</script>
