properly for six weeks, and eleven thousand tonnes of refinery is still in orbit over Kem.\" She turns a page. \"Nobody is complaining. I want to know how you chose.\"\n*if (kem_vol)\n  \"You put the odds on an open channel and asked for volunteers, and a station pipe fitter named Ines Halloway went into the crawl because, and I quote your own log, *she knew where the wheel was and you did not.*\" She looks up. \"Was that command, Commander, or was that an auction?\"\n\n*choice\n  #Defend it. Line by line, without an inch.\n    *set nerve %+10\n    *set rule %+10\n    *set standing %+6\n    You take her through it: the timings, the suit ratings, the alternative that was not available, the ninety thousand people below and the forty-one in the hall. You do not concede a single point, because there is not a single point you think is wrong.\n\n    It works. Not because it is eloquent — because it is arithmetic, and Ivanescu has spent twenty-two years listening to people who could not produce any.\n    *goto board_ossa\n  #Concede the part that was wrong and defend the rest.\n    *set candor %+14\n    *set rule %+4\n    You give her one thing before she asks for it — the fourteen minutes, or the flank run, or the thing you have known was wrong since the day after — and you defend everything else.\n\n    \"Thank you,\" says Ivanescu. \"Do you know how rarely that happens? An officer who concedes exactly one thing is either very honest or extremely good at this. I have not decided which you are and I am not going to today.\"\n    *set standing %+8\n    *goto board_ossa\n  #\"Assessor, four hundred and eleven people are alive. Ask me the next question.\"\n    *set nerve %+12\n    *set candor %-8\n    *set rule %+8\n    You say it politely and you stop talking, and the silence goes on for eleven seconds, which at a Board is a geological era.\n\n    \"No,\" Ivanescu says at last. \"Four hundred and eleven people being alive is the reason you are sitting in a chair and not standing. It is not an answer and you know it is not an answer, and I will ask the next question when I have had this one.\"\n\n    You give it to her. It takes four minutes and it is worse for the delay.\n    *set standing %-6\n    *goto board_ossa\n\n*label board_ossa\n*page_break\n\n*comment ---------------- The thing she was not expected to raise ----------------\n\n\"Ossa,\" says Ivanescu.\n\nYou had not prepared for Ossa. Nobody prepares for Ossa. It is a catalogue entry.\n\n*if (quiet_named)\n  \"You declined to instrument a resonant body of primary scientific interest, and you wrote your reasons into the catalogue in a document that contains nothing but instrument readings.\" She reads it out, all of it, in a flat voice, in a room with carpet. *This judgement was mine and is not a precedent.*\n\n  \"Commander. Everything is a precedent.\"\n*if (quiet_named = false)\n  \"You instrumented a resonant body and permanently altered it by one part in nine thousand.\"\n  *if (candor > 60)\n    \"And then you wrote the damping figure into the catalogue entry, which nobody has done in the Survey's history, because nobody has ever been obliged to.\" She reads it out, all of it, flatly, in a room with carpet.\n  *if (candor <= 60)\n    \"The damping is in your ship's data and not in the catalogue entry. It is not concealment; nobody would look. I found it because I read the ship's data, which I do, which is why I have never been reversed.\"\n\n*choice\n  #\"It was a rock, Assessor. It is still a rock.\"\n    *set rule %+10\n    *set standing %+4\n    \"It has no rights, nobody to ask, and no future that anyone will ever check on. That is precisely why I wrote down what I did to it. A thing with nobody to complain on its behalf is the only kind of thing where the record is the whole of the accountability.\"\n\n    Ivanescu puts her pen down for the first time.\n\n    \"Commander,\" she says, \"I am going to use that at a conference and I am not going to attribute it, and I am telling you now so that it is not a theft.\"\n    *set standing %+8\n    *goto board_other\n  #\"A rating found it. A rating did the arithmetic. Put her name in the finding.\"\n    *set crew %+14\n    *set rule %-6\n    *set candor %+10\n    You spend your time at a Board of Inquiry getting a twenty-two-year-old comms rating's name into a Survey document.\n\n    Ivanescu hears you out completely. Then: \"I will put it in the finding. I will also tell you, because you are going to hear it from somebody less kind: an officer who does this at their own inquiry is either a very good commander or is managing me. Both work. Neither is free.\"\n    *set rel_sec %+14\n    *set standing %+4\n    *goto board_other\n  #\"I would rather talk about Sedge.\"\n    *set candor %-12\n    *set rule %+6\n    \"I am sure you would,\" Ivanescu says, and moves on, and writes one word, and you spend the next four minutes trying to work out which one.\n    *set standing %-4\n    *goto board_other\n\n*label board_other\n*page_break\n\n*comment ---------------- Such other matters ----------------\n*comment The hinge. Candour's moment of glory sits in this choice.\n\n\"*And such other matters as the Board shall determine*,\" Ivanescu says. \"That line is in every convening order. It is not a threat. It is there because inquiries find things.\"\n\nShe closes the Sedge folder and does not open another one.\n\n\"Commander. Is there anything you wish to bring to this Board yourself?\"\n\n*if (kept_secret)\n  *comment The player is carrying Beye, or the letter, or the false finding.\n  There is a book on your ship with a sentence in it that is true and not honest, and you wrote it.\n\n  *choice\n    #Tell her. All of it, unprompted, before she asks.\n      *set candor %+20\n      *set rule %+6\n      *set standing %-10\n      *set board_verdict \"referred\"\n      *achieve candour\n      You tell a Survey Board of Inquiry, without being asked, that you concealed a hundred and nineteen counts of Article Nine aboard your own ship.\n\n      It takes six minutes. Nobody interrupts you. The junior member stops writing halfway through and does not start again.\n\n      When you finish, Ivanescu sits back.\n\n      \"Do you know,\" she says, \"that I have been an assessor for twenty-two years and that has happened four times.\" She looks at the ceiling for a moment. \"Three of the four are still serving. All three of them are better officers than the ones who did not.\"\n      *set kept_secret false\n      *goto board_finding\n    #\"No, Assessor.\"\n      *set candor %-16\n      *set rule %+10\n      *set board_verdict \"clean\"\n      \"No, Assessor.\"\n\n      It is two words and it is a lie and it costs you nothing at all today, and Ivanescu accepts it and closes the folder, and the inquiry moves to its finding.\n\n      You will carry that for a very long time. Not the concealment — the two words, said out loud, in a room with carpet, to a woman who told you at the start that she was not trying to catch you.\n      *goto board_finding\n    #\"There is. And I am not going to tell you what it is.\"\n      *set candor %+8\n      *set rule %+14\n      *set standing %-8\n      *set board_verdict \"referred\"\n      \"There is a matter, Assessor. It is aboard my ship, it is disposed of, it is within a master's authority, and I am not bringing it to this Board.\"\n\n      A very long silence.\n\n      \"That,\" says Ivanescu slowly, \"is the most dangerous sentence anybody has said in this room in four years, and it is not a lie, and I cannot compel you.\" She writes for some time. \"I will note that you were asked and answered. Commander — if this ever comes to me a second time, that note is the whole of the case.\"\n      *goto board_finding\n*if (kept_secret = false)\n  *choice\n    #\"No, Assessor. Everything I have done is in the log.\"\n      *set candor %+10\n      *set standing %+6\n      *set board_verdict \"clean\"\n      \"No, Assessor. It is all in the log, including the parts I would rather were not.\"\n\n      \"Yes,\" she says. \"I noticed. That is not a common quality and it is not a comfortable one and I would not lose it if I were you.\"\n      *goto board_finding\n    #Ask her the question instead. \"Assessor — why was I given this ship?\"\n      *set candor %+12\n      *set rule %-6\n      *set board_verdict \"clean\"\n      *set board_asked true\n      She stops.\n\n      \"You have not been told.\" It is not a question. She looks at the junior member and then at the folder she has not opened. \"No. Of course you have not.\"\n      *goto board_finding\n    #\"Yes. Sub-Lieutenant Beye.\"\n      *set candor %+14\n      *set crew %+6\n      *set board_verdict \"clean\"\n      *if (article_nine = \"charged\")\n        \"You have already sent this Board a twenty-four-year-old and it took us forty minutes,\" you say. \"I would like the finding to record that the transmissions contained no operational intelligence beyond the ship's daily position, that he had no answer from Tessine Station in four months, and that he flew the *Tern* through a nine-metre lane at the *Corvine* eleven weeks before I charged him.\"\n\n        Ivanescu reads it back to you and enters it. \"It will not restore him,\" she says. \"It will be in the file for a hundred years. Sometimes that is the only thing on offer.\"\n        *set rel_sec %+10\n      *if (article_nine = \"inquiry\")\n        \"A ship's inquiry heard it and I bound myself to the finding in advance,\" you say. \"I would like the Board to note that I did not overrule three officers who were sitting in judgement on a man I had already decided about.\"\n\n        \"That is noted,\" says Ivanescu, \"and it is more unusual than you appear to think.\"\n      *goto board_finding\n\n*label board_finding\n*page_break\n\n*comment ---------------- The finding ----------------\n\nThe Board sits for two days and delivers in eleven minutes.\n\n*if (board_verdict = \"referred\")\n  The finding refers the conduct of the master of CS *Perpetua* to the Survey's disciplinary authority for consideration, notes that the master brought the matter forward voluntarily, and — in one sentence that will matter more than the rest of the document combined — *records that the vessel remains under the master's command pending that consideration.*\n\n  You keep your ship. That is what it means. You keep your ship and there is a file open on Marl Colony with your name on it and no date on it.\n  *set standing %-10\n*if (board_verdict = \"clean\") and (standing > 62)\n  The finding commends the master of CS *Perpetua* for conduct at Kem Station, records the Sedge decision without criticism, and — in a paragraph nobody expected — recommends that the Survey issue guidance on the second sentence of Standing Order Four, *the present text having been shown by this inquiry to be capable of four defensible readings.*\n\n  You have not been exonerated. You have been used, which is better.\n  *set standing %+10\n*if (board_verdict = \"clean\") and (standing <= 62)\n  The finding records the events at Sedge and Kem Station, makes no criticism, offers no commendation, and closes the inquiry.\n\n  Four pages. Nothing in them about you at all. ${xoname} says that is the best possible outcome and ${xothey} is right, and it is still like being handed back a coat.\n\n*page_break\n\n*comment ---------------- Why you were given this ship ----------------\n*comment Promise #3, paid.\n\nAfterwards, in the corridor with the real carpet, Ivanescu catches you up.\n\n\"You will not have been told this,\" she says, \"because the Survey does not tell people this, and I have decided that not telling you would be a small piece of cowardice that I am too old for.\"\n\nShe has the folder she never opened.\n\n\"When a master is relieved, the Survey asks the outgoing officer to name three officers he believes could take the command. It is a courtesy. Nobody honours it. The names go in a file and the file is closed and the appointment is made by a committee on Ilium.\"\n\nShe hands you one page.\n\n\"Ivo Halloran did not name three. He named one.\"\n\n*page_break\n\nThe page is a Survey form with two lines filled in. The handwriting is short and plain and you have seen it before, on one hundred and nineteen mornings, quoted back at you by a twenty-four-year-old.\n\n**RECOMMENDED FOR COMMAND, CS PERPETUA, COLD REACH:**\n**Lt. Cdr. ${name}.**\n\nAnd under it, where the form asks for grounds, one sentence:\n\n***She will not do what I did.***\n\n*if (pcthey = \"he\")\n  *comment the form uses the officer's own pronoun\n  ***He will not do what I did.***\n*if (pcthey = \"they\")\n  ***They will not do what I did.***\n\n*choice\n  #\"Assessor — is that a compliment?\"\n    *set candor %+12\n    Ivanescu takes a long time.\n\n    \"I have read that sentence perhaps forty times,\" she says, \"and I have never once been able to decide. I think that is deliberate. I think he knew exactly what he was writing and I think he knew it would reach you eventually and I think he wanted you to have to work it out.\" She takes the page back. \"I am sorry. That is the honest answer and it is not much of a gift.\"\n    *set standing %+4\n    *goto board_end\n  #\"Where is he?\"\n    *set nerve %+10\n    *set crew %+8\n    \"Tessine Station. Harbour pilot, third grade, on a contract he renews every six months.\" Ivanescu looks at you steadily. \"It is nine days from here on your patrol track and you are going that way in the spring, and I am telling you that because I am not required to and because somebody should.\"\n    *set halloran_regard %+8\n    *goto board_end\n  #Say nothing. Hand the page back.\n    *set candor %-14\n    *set rule %+10\n    You read it once, hand it back, thank her for her time, and walk down a corridor with real carpet at exactly your normal pace.\n\n    You get eleven metres. Then you stop, in an empty corridor on Marl Colony, for about forty seconds, and then you go on.\n    *goto board_end\n\n*label board_end\n*page_break\n\n${xoname} is waiting at the dock with the ship's readiness board.\n\n*if (strain >= 45)\n  Eleven items amber. The yard at Marl has done what a colony yard can do, which is not a great deal, and the number two coolant loop has been replaced with a part that was manufactured for a different class of ship and has been persuaded.\n*if (strain < 45)\n  Nine items green, two amber, and the number two coolant loop, which the Marl yard has now also failed to stop whistling, which brings the total number of yards in the Concord that have failed to stop it whistling to eleven.\n\n*choice\n  #Tell ${xoname} about the page.\n    *set candor %+14\n    *set rel_xo %+14\n    You tell your first officer, at a dock, on a colony, that the man whose ship this was named you and wrote one sentence about it.\n\n    *if (xo = \"marand\")\n      Marand does not react for four seconds. Then: \"*She will not do what I did.*\" She turns it over. \"Captain — I have served under eleven masters and I have never heard one of them give another one a weapon that good and call it a recommendation.\" A pause. \"He meant it kindly. I am nearly certain he meant it kindly.\"\n    *if (xo = \"ferreo\")\n      Ferreo goes very quiet, which by now you know is the real Ferreo. \"My father has been a delegate for thirty years,\" he says at last, \"and no one has ever written a sentence about me that I would not want read out. That is not a boast. I have just worked out that it is the opposite.\"\n    *if (xo = \"tanaka\")\n      Tanaka-Osei eats the rest of what she is holding. \"Right,\" she says. \"So he's been reading your log for four months through a kid at 0410, and eight months ago he put your name on a form and said you wouldn't do what he did.\" She looks at you. \"Captain, has it occurred to you that he might have been checking?\"\n    *goto board_last\n  #Tell nobody. Take the readiness board and go aboard.\n    *set candor %-14\n    *set rule %+10\n    You take the board, sign it, and walk up the ramp of a twenty-six-year-old survey ship with one sentence in your head that you are not going to say out loud to anybody for a very long time.\n\n    It is yours. That is a real thing and it is worth something and it is also, you notice, exactly what Halloran did with Ceyla.\n    *set rel_xo %-4\n    *goto board_last\n  *if (chap != \"none\")\n    #Tell ${chapname}, and nobody else.\n      *set candor %+8\n      *set rule %-4\n      *set rel_chap %+16\n      You tell one person on the ship, and it is not the first officer.\n\n      *if (chap = \"wren\")\n        Wren listens to the whole thing and then says: \"*She will not do what I did.*\" He turns it over the way Marand would. \"Captain, I have been given that sentence before, in a different form, by a man who was leaving a parish. It is not a compliment and it is not a warning. It is a bequest, and the reason it is unbearable is that you cannot give it back.\"\n      *if (chap = \"onu\")\n        Onu keeps folding for a while. \"He gave you the ship and the reason in the same breath,\" she says, \"and then he did not write to you for eight months. That is a man being careful with somebody. I have seen it done badly. That was not badly.\"\n      *if (chap = \"serat\")\n        \"He is managing you at a distance of four hundred light years, eight months after leaving,\" Serat says, \"and it is working, and I want you to notice that it is working, and then decide separately whether he is right.\"\n      *goto board_last\n\n*label board_last\n*page_break\n\nThe *Perpetua* leaves Marl Colony on the fourth of Concord with a repaired loop, a full hold, and a patrol track that runs spinward for eleven weeks and then turns.\n\nNine days along the turn, on the track, there is a station called Tessine.\n\n*finish\n", "halloran": "*comment placeholder\nChapter placeholder.\n*finish\n", "theweighing": "*comment placeholder\nChapter placeholder.\n*finish\n", "nadire": "*comment placeholder\nChapter placeholder.\n*finish\n", "wrapup": "*comment placeholder\nChapter placeholder.\n*finish\n", "__order__": "orders coldreach leastthatanswers ashaya articlenine quietworld salvage theboard halloran theweighing nadire wrapup"};

const S={vars:{},scene:null,pc:0,page:[],choices:null,stack:[],notes:{},imgs:{},edit:false,started:false};
const $=id=>document.getElementById(id);
const GATED=[];   /* nothing is hidden from a commanding officer */

/* ---------- parse ---------- */
function parse(src){
  const out=[];
  src.split(/\r?\n/).forEach((raw,i)=>{
    const t=raw.replace(/\t/g,'  ');
    const ind=t.length-t.replace(/^ +/,'').length, s=t.trim();
    if(!s){out.push({ind,k:'blank',line:i});return;}
    const cm = s[0]==='*' ? s.match(/^\*([a-z_]+)\s?(.*)$/) : null;
    if(cm){out.push({ind,k:'cmd',c:cm[1],a:cm[2],line:i});}
    else if(s[0]==='#'){out.push({ind,k:'opt',a:s.slice(1).trim(),line:i});}
    else out.push({ind,k:'text',a:s,line:i});
  });
  return out;
}
const P={}; for(const k in SCENES) P[k]=parse(SCENES[k]);
const ORDER=(SCENES.__order__||'').split(/\s+/).filter(Boolean);

/* ---------- expressions ---------- */
function val(t){t=t.trim();
  if(/^-?\d+$/.test(t))return +t;
  if(/^".*"$/.test(t))return t.slice(1,-1);
  if(t==='true')return true; if(t==='false')return false;
  return (t in S.vars)?S.vars[t]:0;}
function evalExpr(e){
  e=e.trim().replace(/^\((.*)\)$/s,'$1').trim();
  for(const op of [' and ',' or ']){let d=0;
    for(let i=0;i<e.length;i++){
      if(e[i]==='(')d++;else if(e[i]===')')d--;
      else if(d===0&&e.substr(i,op.length)===op)
        return op===' and '?(evalExpr(e.slice(0,i))&&evalExpr(e.slice(i+op.length)))
                           :(evalExpr(e.slice(0,i))||evalExpr(e.slice(i+op.length)));}}
  e=e.replace(/^\((.*)\)$/s,'$1').trim();
  const m=e.match(/^(.+?)\s*(>=|<=|!=|=|>|<)\s*(.+)$/); if(!m)return !!val(e);
  const a=val(m[1]),b=val(m[3]);
  return {'>=':a>=b,'<=':a<=b,'!=':a!=b,'=':a==b,'>':a>b,'<':a<b}[m[2]];}
function fair(c,n){n=+n;const v=n>=0?c+(100-c)*n/100:c+c*n/100;return Math.max(1,Math.min(99,Math.round(v)));}
function doSet(arg){
  const m=arg.match(/^(\S+)\s+(.*)$/); if(!m)return;
  const k=m[1]; let r=m[2].trim();
  if(GATED.includes(k) && !S.vars.formed) return;      /* not hers to shape yet */
  const fm=r.match(/^%\s*([+-])\s*(\d+)$/);
  if(fm){S.vars[k]=fair(+S.vars[k]||50,(fm[1]==='-'?-1:1)*(+fm[2]));return;}
  const rl=r.match(/^([+-])\s*(\d+)$/);
  if(rl){S.vars[k]=(+S.vars[k]||0)+(rl[1]==='-'?-1:1)*(+rl[2]);return;}
  S.vars[k]=val(r);}

/* ---------- text ---------- */
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const subst=t=>t.replace(/\$\{(\w+)\}/g,(_,k)=>(k in S.vars?S.vars[k]:''));
function inline(t){return esc(subst(t))
  .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
  .replace(/(^|[\s(“"—-])\*([^*\n]+)\*/g,'$1<em>$2</em>')
  .replace(/_(.+?)_/g,'<em>$1</em>');}

/* ---------- run ---------- */
function gotoScene(n){if(!P[n])return false;S.scene=n;S.pc=0;return true;}
function findLabel(sc,l){const a=P[sc];for(let i=0;i<a.length;i++)
  if(a[i].k==='cmd'&&a[i].c==='label'&&a[i].a.trim()===l.trim())return i;return -1;}
function skipBlock(a,i,ind){let j=i+1;while(j<a.length&&(a[j].k==='blank'||a[j].ind>ind))j++;return j;}

function step(pushHistory){
  if(pushHistory!==false) S.stack.push({vars:JSON.parse(JSON.stringify(S.vars)),scene:S.scene,pc:S.pc});
  if(S.stack.length>500) S.stack.shift();
  S.page=[];S.choices=null;
  let g=0;
  while(S.scene&&g++<20000){
    const a=P[S.scene];
    if(S.pc>=a.length){advanceScene();continue;}
    const n=a[S.pc];
    if(n.k==='blank'){S.pc++;continue;}
    if(n.k==='text'){S.page.push({t:'text',v:n.a,scene:S.scene,line:n.line});S.pc++;continue;}
    if(n.k==='opt'){S.pc=skipBlock(a,S.pc,n.ind);continue;}
    const c=n.c,arg=n.a;
    if(['comment','label','title','subtitle','author','scene_list','achievement','save_game'].includes(c)){S.pc++;continue;}
    if(['create','set','set_hidden','temp','set_ward'].includes(c)){doSet(arg);S.pc++;continue;}
    if(c==='achieve'){S.vars['ach_'+arg.trim()]=true;S.pc++;continue;}
    if(c==='line_break'){S.page.push({t:'br'});S.pc++;continue;}
    if(c==='page_break'){S.pc++;return render();}
    if(c==='image'){const m=arg.match(/^(\S+)\s*(.*)$/)||[];S.page.push({t:'img',src:m[1]||'',alt:m[2]||''});S.pc++;continue;}
    if(c==='goto'){const i=findLabel(S.scene,arg);S.pc=i<0?S.pc+1:i+1;continue;}
    if(c==='goto_scene'){const p=arg.trim().split(/\s+/);if(gotoScene(p[0])&&p[1]){const i=findLabel(S.scene,p[1]);if(i>=0)S.pc=i+1;}continue;}
    if(c==='finish'){advanceScene();continue;}
    if(c==='ending'){S.page.push({t:'end'});S.scene=null;return render();}
    if(c==='stat_chart'){S.page.push({t:'chart'});S.pc=skipBlock(a,S.pc,n.ind);continue;}
    if(c==='input_text'){S.page.push({t:'input',v:arg.trim()});S.pc++;return render();}
    if(c==='if'||c==='elseif'||c==='else'){
      if(c==='else'||evalExpr(arg)){S.pc++;}
      else{let j=skipBlock(a,S.pc,n.ind);
        while(j<a.length&&a[j].k==='cmd'&&(a[j].c==='elseif'||a[j].c==='else')&&a[j].ind===n.ind){
          if(a[j].c==='else'||evalExpr(a[j].a)){S.pc=j+1;j=-1;break;}
          j=skipBlock(a,j,n.ind);}
        if(j>=0)S.pc=j;}
      continue;}
    if(c==='choice'||c==='fake_choice'){
      /* Options may be nested inside *if / *elseif / *else at any depth: only the
         branch that is true contributes its options to the menu. */
      const opts=[];
      const scan=(start,ind)=>{
        let j=start;
        while(j<a.length){const m=a[j];
          if(m.k==='blank'){j++;continue;}
          if(m.ind<=ind)break;
          if(m.k==='opt'){opts.push({label:m.a,body:j+1,line:m.line,scene:S.scene});
            j=skipBlock(a,j,m.ind);continue;}
          if(m.k==='cmd'&&m.c==='if'){
            let k=j,done=false;
            while(k<a.length&&a[k].k==='cmd'&&['if','elseif','else'].includes(a[k].c)&&a[k].ind===m.ind){
              if(!done&&(a[k].c==='else'||evalExpr(a[k].a))){scan(k+1,a[k].ind);done=true;}
              k=skipBlock(a,k,m.ind);}
            j=k;continue;}
          j++;}
        return j;};
      const after=scan(S.pc+1,n.ind);
      if(!opts.length){S.pc=after;continue;}
      S.choices={opts,after};return render();}
    S.pc++;
  }
  render();
}
function advanceScene(){const i=ORDER.indexOf(S.scene);
  if(i>=0&&i+1<ORDER.length)gotoScene(ORDER[i+1]);
  else{S.page.push({t:'end'});S.scene=null;}}

/* ---------- render ---------- */
function deltaText(b){const a=P[S.scene],o=[];
  for(let j=b;j<a.length&&j<b+70;j++){const n=a[j];if(n.k!=='cmd')continue;
    if(n.c==='set'||n.c==='set_hidden')o.push(n.a);
    if(n.c==='goto'||n.c==='goto_scene')break;}
  return o.join(' · ');}
const NICE={valor:['Valor','Patience'],severity:['Severity','Mercy'],splendor:['Splendor','Hiddenness'],
  charity:['Charity',null],hope:['Hope',null]};
function flashDeltas(before){
  const rows=[];
  for(const k in NICE){
    const a=+before[k]||0,b=+S.vars[k]||0,d=b-a;
    if(!d)continue;
    const nm=NICE[k], lab=(d>0||!nm[1])?nm[0]:nm[1], amt=Math.abs(d);
    const col={valor:'var(--cobalt)',severity:'var(--ruby)',splendor:'var(--amber)',
      charity:'var(--verd)',hope:'var(--violet)'}[k];
    rows.push('<div style="color:'+col+'">'+(d>0?'+':'−')+amt+' '+lab+'</div>');
  }
  if(!rows.length)return;
  const f=$('flash'); f.innerHTML=rows.join(''); f.classList.add('show');
  setTimeout(()=>f.classList.remove('show'),2600);
}
function keyOf(n){return n.scene+':'+n.line;}
function textFor(n){const e=S.notes[keyOf(n)];
  if(!e||!e.replacement) return n.v;
  if(e.original && e.original!==n.v) return n.v;   /* stale — never overwrite the wrong line */
  return e.replacement;}
function render(){
  const st=$('stage'); st.innerHTML='';
  if(S.edit&&S.stack.length>1){
    const b=document.createElement('button');b.className='backbtn';b.textContent='◂ previous screen';
    b.onclick=goBack;st.appendChild(b);}
  let lastWasBr=false;
  S.page.forEach(n=>{
    if(n.t!=='br') lastWasBr=false;
    if(n.t==='text'){
      const p=document.createElement('p'), k=keyOf(n), e=S.notes[k];
      p.innerHTML=inline(textFor(n));

      else if(e&&e.replacement)p.classList.add('edited');

    } else if(n.t==='input'){

      const b=document.createElement('button');b.className='opt';b.textContent='That is it.';
      b.onclick=()=>{const v=$('tin').value.trim();if(v)S.vars[n.v]=v;S.pc++;save();step();};
      w.appendChild(b);st.appendChild(w);
    } else if(n.t==='end'){
      const d=document.createElement('p');d.style.cssText=
        'text-align:center;color:var(--ink3);font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.3em';
      d.textContent='END';st.appendChild(d);}
  });
  if(S.choices){
    const w=document.createElement('div');w.className='choices';
    S.choices.opts.forEach(o=>{
      const k=o.scene+':'+o.line, ov=S.notes[k];
      const lab=(ov&&ov.replacement)?ov.replacement:o.label;
      const row=document.createElement('div');row.style.cssText='display:flex;gap:.4rem;align-items:stretch';
      const b=document.createElement('button');b.className='opt';b.style.flex='1';
      b.innerHTML=inline(lab)+(S.edit?'<span class="delta">'+esc(deltaText(o.body)||'—')+'</span>':'');
      b.onclick=()=>pick(o);
      row.appendChild(b);
      if(S.edit){
        const e=document.createElement('button');e.className='opt';e.style.cssText='flex:0 0 2.6rem;text-align:center;border-left-color:var(--ink3)';
        e.innerHTML='&#9998;'; e.title='edit this option\'s wording';
        e.onclick=ev=>{ev.stopPropagation();openNote(k,o.label);};
        row.appendChild(e);
      }
      w.appendChild(row);});

    b.onclick=()=>{save();step();};st.appendChild(b);}
  $('cwhere').innerHTML=S.scene?'<b>'+esc(S.scene)+'</b>':'end';
  $('cedit').innerHTML=S.edit?'<span class="ed">edit</span>':'';
  window.scrollTo(0,0); save();
}

  flashDeltas(before); save(); }

/* ---------- the repeater: a ship's instrument ---------- */
function pol(cx,cy,r,deg){const a=(deg-90)*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
function arcPath(cx,cy,r,a0,a1){
  const [x0,y0]=pol(cx,cy,r,a0),[x1,y1]=pol(cx,cy,r,a1);
  return 'M'+x0.toFixed(2)+' '+y0.toFixed(2)+'A'+r+' '+r+' 0 '+(a1-a0>180?1:0)+' 1 '+x1.toFixed(2)+' '+y1.toFixed(2);
}
function gauge(cx,cy,r,a0,a1,frac,col){
  const mid=a0+(a1-a0)*frac, half=a0+(a1-a0)/2;
  const [tx0,ty0]=pol(cx,cy,r-7,half),[tx1,ty1]=pol(cx,cy,r+7,half);
  return '<path d="'+arcPath(cx,cy,r,a0,a1)+'" fill="none" stroke="#01040a" stroke-width="11" opacity=".55"/>'+
         '<path d="'+arcPath(cx,cy,r,a0,a1)+'" fill="none" stroke="'+col+'" stroke-width="9" opacity=".16"/>'+
         (frac>0.005?'<path d="'+arcPath(cx,cy,r,a0,mid)+'" fill="none" stroke="'+col+'" stroke-width="9" opacity=".92"/>':'')+
         '<line x1="'+tx0.toFixed(1)+'" y1="'+ty0.toFixed(1)+'" x2="'+tx1.toFixed(1)+'" y2="'+ty1.toFixed(1)+'" stroke="#dce6ee" stroke-width="1" opacity=".45"/>';
}
function repeaterSVG(){
  const v=S.vars,
    N=(+v.nerve||50)/100, C=(+v.candor||50)/100, W=(+v.crew||50)/100, R=(+v.rule||50)/100,
    St=(+v.standing||40)/100, Sr=Math.min(+v.strain||0,100)/100;
  return '<svg class="rose" viewBox="0 0 240 240" width="222" height="222" role="img" aria-label="command repeater">'+
    '<circle cx="120" cy="120" r="117" fill="none" stroke="#01040a" stroke-width="5"/>'+
    '<circle cx="120" cy="120" r="113" fill="none" stroke="#54bfd6" stroke-width=".8" opacity=".35"/>'+
    '<path d="'+arcPath(120,120,105,0.01,359.98)+'" fill="none" stroke="#54bfd6" stroke-width="2" opacity=".10"/>'+
    (Sr>0.005?'<path d="'+arcPath(120,120,105,0,Math.max(1,359*Sr))+'" fill="none" stroke="#d9584f" stroke-width="2.6" opacity=".8"/>':'')+
    gauge(120,120,88,  8, 82, N,'#54bfd6')+
    gauge(120,120,88, 98,172, C,'#e8a33d')+
    gauge(120,120,88,188,262, W,'#6fbf83')+
    gauge(120,120,88,278,352, R,'#9b8ade')+
    '<circle cx="120" cy="120" r="42" fill="none" stroke="#01040a" stroke-width="3"/>'+
    '<circle cx="120" cy="120" r="40" fill="#54bfd6" opacity="'+(0.07+0.30*St).toFixed(3)+'"/>'+
    '<circle cx="120" cy="120" r="'+(11+26*St).toFixed(1)+'" fill="#e8a33d" opacity="'+(0.14+0.44*St).toFixed(3)+'"/>'+
    '<circle cx="120" cy="120" r="40" fill="none" stroke="#54bfd6" stroke-width=".8" opacity=".55"/>'+
    '<text x="120" y="19" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="7" letter-spacing="2" fill="#5a6c7d">HULL</text>'+
  '</svg>';
}

function draftRecord(kind){

let draftTimer=null;
function draftSave(){

async function pushOne(key){

    r.synced=true; save(); updateSyncPill(); }
  catch(e){ dbState='error'; updateSyncPill(); }}
async function saveNote(kind){

  catch(e){ dbState='error'; toast('NOT SAVED — open NOTES and tap Sync'); }

function revert(){ if(!noteTarget)return; const e=S.notes[noteTarget.key];

async function delNote(){ if(!noteTarget)return;

  delete S.notes[key]; save(); closePanel(); redraw(); updateSyncPill();
  const db=await getDB(); if(db){try{await db.doc('notes/'+key.replace(/[^A-Za-z0-9]/g,'_')).delete();}catch(e){}}}
function showNotes(){

/* ---------- persistence ---------- */
let storageBroken=false;
function put(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}
  catch(e){if(k==='pp_notes')storageBroken=true;return false;}}
function got(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
function save(){
  put('pp_progress',{vars:S.vars,scene:S.scene,pc:S.pc,edit:S.edit,started:S.started});
  put('pp_notes',S.notes); put('pp_imgs',S.imgs);}
function load(){
  const r=got('pp_progress')||got('perpetua');
  S.notes=got('pp_notes')||(r&&r.notes)||{};
  S.imgs=got('pp_imgs')||(r&&r.imgs)||{};
  if(r){S.vars=r.vars||{};S.scene=r.scene;S.pc=r.pc||0;S.edit=!!r.edit;S.started=!!r.started;}
  return !!(r&&r.scene);}

/* ---- notes are anchored to the TEXT they were written against, not the
   line number, so that editing the source upstream cannot silently move a
   rewrite onto the wrong paragraph ---- */
function sourceLine(scene,line){
  const a=P[scene]; if(!a) return null;
  const n=a.find(x=>x.line===line);
  return (n && (n.k==='text'||n.k==='opt')) ? n.a : null;
}
function reanchor(){
  let moved=0, stale=0;
  for(const key of Object.keys(S.notes)){
    const r=S.notes[key]; if(!r.original) continue;
    const [scene,ln]=[key.split(':')[0], +key.split(':')[1]];
    if(sourceLine(scene,ln)===r.original){ delete r.stale; continue; }
    const a=P[scene]||[];
    const hit=a.find(x=>(x.k==='text'||x.k==='opt')&&x.a===r.original);
    if(hit){
      delete S.notes[key];
      r.line=hit.line; delete r.stale;
      S.notes[scene+':'+hit.line]=r; moved++;
    } else { r.stale=true; stale++; }
  }
  if(moved) save();
  return {moved,stale};
}

/* ---- the database is the source of truth for notes ---- */
let DB=null, dbState='connecting';
async function getDB(){
  if(DB)return DB;
  try{ if(typeof claude==='undefined'||!claude.use){dbState='none';return null;}
    DB=await claude.use('db'); dbState=DB?'ready':'none'; return DB; }
  catch(e){ dbState='none'; return null; }}
async function pullFromDB(){
  const db=await getDB(); if(!db){updateSyncPill();return;}
  let changed=false;
  try{ const snap=await db.collection('notes').get();
    (snap.docs||[]).forEach(d=>{ if(!d.exists)return; const r=d.data(); if(!r||!r.scene)return;
      const key=r.scene+':'+r.line, mine=S.notes[key];
      if(!mine||(r.at||'')>(mine.at||'')){S.notes[key]=Object.assign({},r,{synced:true});changed=true;} });
  }catch(e){ dbState='error'; }
  try{ const snap=await db.collection('images').get();
    (snap.docs||[]).forEach(d=>{ if(!d.exists)return; const r=d.data();
      if(r&&r.slot&&r.dataUrl&&!S.imgs[r.slot]){S.imgs[r.slot]=r.dataUrl;changed=true;} });
  }catch(e){}
  const rr=reanchor();
  if(changed||rr.moved){ save(); if(S.scene) redraw(); }
  if(rr.moved) toast(rr.moved+' notes re-anchored');
  updateSyncPill();}
async function pushAll(){
  const db=await getDB(); if(!db){toast('no connection — nothing pushed');return;}
  let n=0;
  for(const k in S.notes){ const r=S.notes[k]; if(r.synced) continue;
    try{ const body=Object.assign({},r); delete body.synced;
      await db.doc('notes/'+k.replace(/[^A-Za-z0-9]/g,'_')).set(body); r.synced=true; n++; }catch(e){} }
  save(); toast(n?('pushed '+n):'everything already saved'); updateSyncPill(); showNotes();}
function notesAsText(){
  const ks=Object.keys(S.notes).sort();
  if(!ks.length) return 'No notes.';
  let out='ONE SOUL — author notes ('+ks.length+')\n';
  ks.forEach(k=>{ const r=S.notes[k];
    out+='\n--- '+r.scene+' · line '+r.line+' ---\n';
    if(r.original)    out+='WAS: '+r.original+'\n';
    if(r.replacement) out+='NOW: '+r.replacement+'\n';
    if(r.note)        out+='NOTE: '+r.note+'\n';
  });
  return out;
}
function copyNotes(){
  const t=notesAsText();
  const ta=document.createElement('textarea');
  ta.value=t; ta.style.cssText='position:fixed;top:-999px'; document.body.appendChild(ta);
  ta.select();
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast('copied'),()=>{});
  else toast(ok?'copied':'select the box below and copy');
  openPanel('<h3>Notes, as text</h3><p style="color:var(--ink3);font-size:.82rem">'+
    (ok?'Copied to the clipboard. ':'')+'Paste this into the conversation and I will apply it to the source.</p>'+
    '<textarea style="min-height:22rem;font-family:\'IBM Plex Mono\',monospace;font-size:.72rem" onclick="this.select()">'+
    esc(t)+'</textarea><button class="act" onclick="showNotes()">Back</button>');
}
function unsyncedCount(){let n=0;for(const k in S.notes) if(!S.notes[k].synced)n++;return n;}
function updateSyncPill(){
  const el=$('csync'); if(!el)return;
  const u=unsyncedCount();
  if(dbState==='ready'&&!u&&!storageBroken) el.innerHTML='<span style="color:var(--verd)">saved</span>';
  else if(dbState==='connecting') el.innerHTML='<span style="color:var(--ink3)">connecting</span>';
  else if(u) el.innerHTML='<span style="color:var(--ruby)">'+u+' unsaved</span>';
  else if(dbState==='none') el.innerHTML='<span style="color:var(--ink3)">local</span>';
  else el.innerHTML='<span style="color:var(--ruby)">offline</span>';}

/* ---------- boot ---------- */
function titleScreen(){
  S.scene=null;
  $('stage').innerHTML='<div class="title">'+repeaterSVG()+'<h1>Perpetua</h1>'+
    '<div class="sub">A first command</div>'+
    '<div class="tag">One worn-out survey ship, a crew you choose yourself, and the rule that ruined the captain before you.</div></div>';
  const w=document.createElement('div');w.className='choices';
  const b=document.createElement('button');b.className='opt';b.textContent='Begin.';
  b.onclick=()=>{S.started=true;S.vars={};S.stack=[];
    (P.__startup__||[]).forEach(n=>{if(n.k==='cmd'&&n.c==='create'){const m=n.a.match(/^(\S+)\s+(.*)$/);if(m)S.vars[m[1]]=val(m[2].trim());}});
    gotoScene(ORDER[0]);step();};
  w.appendChild(b);
  if(localStorage.getItem('perpetua')){
    const c=document.createElement('button');c.className='opt';c.textContent='Continue where I left off.';
    c.onclick=()=>{load();if(S.scene)step();else b.click();};w.appendChild(c);}
  $('stage').appendChild(w); $('cwhere').textContent='title';
}
function buildBar(){
  const defs=[['stats','Stats',showStats],['notes','Notes',showNotes],['jump','Jump',showJump],
    ['edit','Edit',toggleEdit],['theme','Theme',toggleTheme],['size','A±',cycleSize],['restart','Restart',restart]];
  $('bar').innerHTML='';
  defs.forEach(([id,l,fn])=>{ if(id==='jump'&&!S.edit)return;
    const b=document.createElement('button');b.textContent=l;b.onclick=fn;
    if(id==='edit'&&S.edit)b.classList.add('on');$('bar').appendChild(b);});
}
function toggleEdit(){S.edit=!S.edit;document.body.classList.toggle('editing',S.edit);
  buildBar();save();if(S.scene)redraw();else titleScreen();
  toast(S.edit?'edit mode — click any paragraph':'edit mode off');}
function toggleTheme(){const r=document.documentElement;
  r.setAttribute('data-theme',r.getAttribute('data-theme')==='light'?'dark':'light');}
let sizes=[17,19,21,24],si=1;
function cycleSize(){si=(si+1)%sizes.length;document.documentElement.style.setProperty('--fs',sizes[si]+'px');}
function restart(){if(!confirm('Start again from the beginning?'))return;
  const n=S.notes,i=S.imgs,e=S.edit;localStorage.removeItem('perpetua');
  S.vars={};S.scene=null;S.pc=0;S.stack=[];S.notes=n;S.imgs=i;S.edit=e;save();titleScreen();}

(function(){
  P.__startup__=parse(SCENES.__startup__||'');
  const had=load();
  document.body.classList.toggle('editing',S.edit);
  buildBar();
  if(had&&S.started)step(); else titleScreen();
  reanchor(); updateSyncPill(); pullFromDB();
  setInterval(function(){ if(unsyncedCount()) pushAll(); },30000);
  addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') pullFromDB(); });
  addEventListener('keydown',e=>{
    if(e.key==='Escape')closePanel();
    if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='e'){e.preventDefault();toggleEdit();}
    if(S.edit&&e.key==='ArrowLeft'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName))goBack();
  });
})();
</script>
