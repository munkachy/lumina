h minute. Ilse Novy has a broken pelvis and a boy of nineteen walks out on his own feet and then sits down suddenly on the ice and cannot get up for some time.\n\nThe wedge goes forty minutes after that and takes the gallery, and there is nobody in it, and nobody ever finds out whether the fast way would have worked.\n\n*goto ice_after\n\n*label ice_after\n*page_break\n\n*comment ---------------- After ----------------\n\n${medname} works on Ilse Novy in the Rest's two-bed clinic for three hours with the storm hitting the roof.\n\n*if (med = \"nour\")\n  Nour asks her name at the beginning. At the end, when Novy is under and it can make no difference to anyone, Nour says it again, out loud, to nobody: *Ilse Novy.* Then she washes her hands for a long time.\n*if (med = \"sorrel\")\n  Sorrel talks the whole way through, quietly, about nothing — the weather on Sarn, a dog he had, the correct way to make coffee, which the third watch does not know. Novy is unconscious for two hours of it. He goes on talking anyway.\n*if (med = \"vasi\")\n  Vasi narrates the whole procedure aloud, level and unhurried, for the record. Afterwards, when you play the recording back, the part that stays with you is that in three hours and eleven minutes his voice does not change once, including at the point where he nearly loses her.\n\n*if (halbard = \"generous\")\n  Three miners with grey lung are on the second day of a course that will buy them a decade, and Ambrit has not mentioned it and will not.\n*if (halbard = \"refused\")\n  Fen Doury, fifty-eight, is on the line at the gallery mouth passing blocks with everybody else, and he does not look at you once, and it is not because he is angry.\n*if (halbard = \"split\")\n  Fen Doury, fifty-eight, is on the line at the gallery mouth passing blocks with everybody else. He was not one of the two. He works his shift and then he works somebody else's.\n*if (halbard = \"delegated\")\n  ${medname} comes out of the clinic at 0400, and you realise that you have not asked ${medthem} how the three miners were chosen, and that ${medthey} has been waiting nine hours for you to.\n  *set rel_med %-4\n\n*page_break\n\nAt the mast, in the last of the storm, Ambrit hands you a crate. It is ice wine.\n\n\"For the ship,\" she says. \"Not for you. Don't get ideas.\"\n\n*choice\n  #\"Administrator. Tell me who the ship is named for.\"\n    *set candor %+6\n    *set rule %-4\n    Ambrit looks at you as though you have asked her the price of the moon.\n\n    \"How would I know? You people name them after your own dead.\" She thinks about it, though. She actually thinks about it. \"Ivo never said either, and Ivo talked.\" She shrugs. \"Ask a priest. They keep lists.\"\n    *if (chap = \"wren\")\n      You do, eleven days later, and Wren says: \"Yes,\" and then nothing else for so long that you have to ask him a second time.\n      *set plaque true\n      *set rel_chap %+6\n    *if (chap = \"onu\")\n      You do, eleven days later, and Onu says \"Perpetua\" as if you had asked whether water was wet, and then goes on folding.\n      *set plaque true\n      *set rel_chap %+6\n    *if (chap = \"serat\")\n      You do, eleven days later, and Serat looks it up properly and comes back with three candidates and a recommendation, which is exactly what you asked for and somehow not what you wanted.\n    *if (chap = \"none\")\n      You will ask three more people over the next four months. None of them will know.\n      *achieve empty_berth\n    *goto ch2end\n  #\"Was he a good captain?\"\n    *set candor %+10\n    *set crew %+6\n    \"Ivo?\" Ambrit fastens her coat. \"He was a good *man*, which is not the same thing and I'd never have said so to his face.\"\n\n    She looks at the field, and the *Tern*, and the boy of nineteen being helped up the ramp.\n\n    \"He'd have gone in first, mind. Every time. Whether it was clever or not.\" She glances at you. \"You want to know what I make of you, you'll have to come back in six months like everybody else.\"\n    *set standing %+4\n    *goto ch2end\n  #Say nothing. Take the crate. Go.\n    *set candor %-10\n    *set rule %+6\n    You take the crate. You thank her for the hospitality, which is a lie about the block and the truth about everything else, and you go up the ramp.\n\n    At the top you look back. She is still standing at the mast in the last of the storm, watching you leave, the way she has watched thirty-eight Survey ships leave, and you understand with complete clarity that she is not going to decide anything about you today and that this is entirely reasonable.\n    *goto ch2end\n\n*label ch2end\n*page_break\n\n*comment ---------------- The log ----------------\n\nThe master's night log is four lines on most days. Tonight it is not.\n\n*choice\n  #Write all of it. The doses, the delay, the gallery, and what you were thinking.\n    *set candor %+14\n    *set rel_xo %+6\n    You write six hundred words. Two miners, one gallery, eleven doses and where they went, and — because there is a box on the form headed *master's remarks* and nobody has ever told you what it is for — four sentences about the fourteen minutes you spent not sending anyone into number four.\n\n    Somewhere in the Survey there is an archive where that log will sit for thirty years, and you have just put your own hesitation in it, in your own hand, on your first port call.\n    *if (xo = \"marand\")\n      Marand countersigns it at 0500 without comment. Two days later you find that she has copied the *master's remarks* into her own notebook, word for word, and you do not ask why.\n    *goto ch2close\n  #Write what happened. Leave out what you were thinking.\n    *set candor %-8\n    *set rule %+6\n    Four hundred words, complete, accurate, and airless. Times, names, doses, outcome. Anybody reading it in thirty years will know exactly what occurred at Halbard's Rest and nothing whatsoever about who was in command.\n\n    That is what the form is for. It is also, you notice, a choice.\n    *goto ch2close\n  #Write the minimum the regulation requires.\n    *set candor %-16\n    *set rule %+8\n    *set standing %-3\n    Ninety words. Position, event, casualties, disposition. It takes four minutes.\n\n    You look at it for rather longer than four minutes before you sign it.\n    *goto ch2close\n\n*label ch2close\n*page_break\n\nYou take her out of Halbard orbit at 0640 with a crate of ice wine in the number three locker beside four bottles that belong to somebody else.\n\n*if (told_crew = \"halloran\")\n  On the mess deck, somebody has written *HALLORAN* on the whiteboard by the coffee urn, and under it, in a different hand, *and Ambrit says he'd have gone in first*, and under that, in a third hand, and this is the part that matters, *so did ours.*\n*if (told_crew != \"halloran\")\n  On the mess deck, somebody has written *ONE DOWN* on the whiteboard by the coffee urn, and a number: three hundred and fifty-six. That is how many days are left.\n\nAhead there are eleven more settlements, three member colonies, and forty light years of thin badly charted nothing.\n\nBehind you, in a book with a cloth spine, your name has been added to the roll of Halbard's Rest, which is not an honour, and which means that if you die there they are obliged to bury you.\n\n*finish\n", "leastthatanswers": "*comment ============ CHAPTER THREE — THE LEAST THAT ANSWERS ============\n*comment The first real Reticence case, and the Ceyla shape in miniature: a\n*comment faction asks, the recognised government forbids, and the rule does not\n*comment say who counts as \"the world.\" Mission's moment of glory.\n*comment Ledger: Sedge, independent, pop. 41,000. Two settlements — the Landing\n*comment (council, Speaker Idris Vane) and the Fold (6,200 people, broke away\n*comment eleven years ago, speaker Cassa Doon). Blight in the staple grain.\n*comment Perpetua carries 400 kg of Concord seed stock and one water plant.\n\nSedge is green, which is the problem.\n\nFrom four hundred kilometres up you can see the river and the town at the bend of it and the grain running away east for ninety kilometres in strips, and the strips are three different colours. The dark green is healthy. The pale green is infected and does not know it yet. The yellow is finished.\n\nThere is a great deal of yellow.\n\n\"Rust blight,\" ${engname} says, looking over your shoulder at the plot, because everyone on this ship reads everyone else's screens. \"My grandmother had it on Sarn. It takes two seasons and then it takes everything.\"\n\nForty-one thousand people live down there. They are not Concord members. They came out here sixty years ago on a charter ship and they have never asked the Concord for anything, and that fact is about to become the most important thing in your year.\n\n*page_break\n\n*comment ---------------- The Landing ----------------\n\nThe council meets in a grain hall with the doors open because it is harvest month and nobody has told the weather that there is nothing to harvest.\n\n**Speaker Idris Vane** is about fifty-five, in a good coat, and has been elected nine times. He has three points and he makes them in order.\n\nOne: Sedge has a blight and knows it. Two: Sedge has a plan — consolidate the outlying settlements, pool the seed, ration for four years, and come out the other side smaller. Three: the Concord's assistance is not required, and Sedge will not be having a Survey ship's opinion about its internal arrangements.\n\nHe says all of this pleasantly, in a hall with the doors open, in front of about two hundred people.\n\n*if (background = \"diplomatic\")\n  You have sat at four treaty tables and you know exactly what this is. It is not addressed to you. It is addressed to the two hundred people behind him, and the parts that sound like courtesy are load-bearing.\n  *set standing %+4\n*if (background != \"diplomatic\")\n  It takes you until the middle of the second point to understand that he is not talking to you at all.\n\n*page_break\n\n*choice\n  #\"Speaker, what is the plan for the Fold?\"\n    *set candor %+12\n    *set rule %+4\n    The hall goes quiet in a way that tells you the question was already in the room and you have simply been the one to say it.\n\n    Vane does not lose his footing. \"The Fold will consolidate with everybody else.\"\n\n    \"And if it does not?\"\n\n    \"Then the Fold will have made a choice,\" Vane says, \"as it did eleven years ago, and Sedge will not be able to help it, and that will be very sad.\" He looks at you levelly. \"Commander, you have been on this world for two hours.\"\n    *set sedge_open true\n    *goto vane_two\n  #Thank him, accept the refusal, and ask only for the mail manifest.\n    *set candor %-12\n    *set rule %+8\n    *set standing %+5\n    You thank him for his time, confirm that the Survey has no standing to offer unrequested assistance to a non-member world, hand over the mail, and ask for a signature on the manifest.\n\n    Vane signs it. Then, at the door, quietly, so that the hall cannot hear him: \"You are the first one in six years who did not offer. I want you to know that I noticed.\"\n\n    You are not sure whether you have been complimented or filed.\n    *goto vane_two\n  #\"How many people are in the outlying settlements?\"\n    *set candor %+6\n    *set crew %+4\n    *set rule %-4\n    A fair question, asked flatly, about a number.\n\n    Vane gives it: eleven thousand across nine settlements, of whom six thousand two hundred are in the Fold. Then he gives you the rest without being asked — the tonnage, the ration arithmetic, the four-year projection — because he is a man who has done the work and would like somebody competent to see it.\n\n    The arithmetic is honest. That is the thing you take away. Vane's plan is not a cruelty. It is a plan by a man with a blight and no help, and it works, and it works better if the Fold comes in.\n    *set standing %+3\n    *goto vane_two\n\n*label vane_two\n*page_break\n\n*comment ---------------- Cassa Doon ----------------\n\nThat night, at the shuttle field, a woman is waiting by the *Tern* in the dark, and ${secname} sees her before you do.\n\n*if (sec = \"oyelaran\")\n  Oyelaran has her against the fuselage with one hand before you have finished turning round, and then lets her go the moment you say his name, and then stands exactly where he can get back to her in one step.\n*if (sec = \"whitlow\")\n  Whitlow does not move. She says, \"Evening,\" and lets the woman come to them, and watches her hands the whole way in.\n*if (sec = \"mott\")\n  Mott simply stands up out of the dark, all two and a half metres of her, and the woman makes a small involuntary noise and then, to her credit, does not run.\n\nHer name is **Cassa Doon** and she speaks for the Fold: six thousand two hundred people, forty kilometres upriver, who split from the Landing eleven years ago over a water tax and have been paying for it ever since.\n\nShe has walked two days to be at this fence.\n\n\"Our seed is gone,\" she says. \"All of it, not most. And eleven days ago the council cut our allocation off the main line to seventeen per cent, which they are entitled to do, and which means that by midwinter we are either in the Landing on their terms or we are dead.\"\n\nShe has a folder. Everybody in this system has a folder.\n\n*page_break\n\n*if (background = \"line\")\n  You have stood at enough fences at night to know that the folder is not the point. The point is that she walked two days, which means she has already been told no by everybody closer.\n*if (background = \"science\")\n  The folder is data and it is good data — soil counts, spore loads, a yield curve. You read it standing up under a work light and it takes you ninety seconds to see that she has not exaggerated anything, and about four minutes to see what she has left out.\n*if (background = \"diplomatic\")\n  The folder is a negotiating position and you can see the shape of it before she opens it. She is not asking for what she wants. She is asking for slightly more than what she wants, so that you can win something by cutting it down.\n\nWhat she is asking for is this: two hundred kilos of Concord seed stock, which you have, and one portable water plant, which you also have, and which was requisitioned for a member colony four systems from here that will not miss it for eleven months.\n\n*choice\n  #\"Does your council know you are here?\"\n    *set candor %+8\n    *set rule %+6\n    \"No,\" she says. \"And if you tell them, they'll cut us to nothing and say we broke faith, and they will be right, and we will still be dead.\"\n\n    She says it without heat. That is what makes it land.\n    *set sedge_open true\n    *goto wardroom\n  #\"You are asking me to take a side in your politics.\"\n    *set rule %+10\n    *set candor %+6\n    \"I'm asking you for water and seed,\" Doon says. \"You're the one calling it politics.\"\n\n    \"It becomes politics the moment a Concord ship gives six thousand people what the recognised government of this world has refused them. That is not an opinion. That is the second sentence of my standing orders.\"\n\n    \"Then your standing orders have a body count,\" she says, \"and I would like to know what it is.\"\n    *set standing %-3\n    *goto wardroom\n  #Say nothing and let her finish. All of it.\n    *set candor %-10\n    *set nerve %-8\n    You let her talk for nineteen minutes at a fence in the dark, and you do not interrupt once, and at the end of it she stops and looks at you and says, \"You haven't said anything.\"\n\n    \"No.\"\n\n    \"Is that a no?\"\n\n    \"It is not anything yet.\"\n\n    She takes that better than you expected, which tells you she has been managed by professionals before and has decided to let it happen because there is nothing else on offer.\n    *set rule %+4\n    *goto wardroom\n  #Bring her aboard. Feed her. Then hear it properly.\n    *set crew %+10\n    *set nerve %+8\n    *set rule %-6\n    You put a speaker of the Fold in the *Tern* and take her up to a Concord Survey vessel in orbit over her own world, which is not illegal and is going to look like exactly one thing to anybody in the Landing with a telescope.\n\n    She eats like somebody who has walked for two days. Then she talks for an hour in the wardroom with all five of your officers present, and by the end of it every one of them has a position, and you have lost the ability to pretend this is a small matter.\n    *set sedge_open true\n    *set standing %-6\n    *set rel_xo %-4\n    *goto wardroom\n\n*label wardroom\n*page_break\n\n*comment ---------------- The wardroom ----------------\n*comment The centrepiece. Five officers, five positions, and the player decides\n*comment how the room is run rather than what it concludes.\n\nYou call your officers together at 2200 and put Standing Order Four on the table, which is a thing you can do literally, because there is a card.\n\n**No officer of the Survey shall move the history of a world that has not asked. Where a world has asked, the officer shall give the least that answers.**\n\nTwo sentences. A hundred and forty-three years old. Written by people who had just finished a forty-year war that started, among other reasons, because three worlds each decided that a fourth needed help.\n\n*if (xo = \"marand\")\n  \"The world has not asked,\" Marand says. \"The Fold is not the world. Six thousand two hundred people are not a world, they are a faction, and the day the Survey starts deciding which faction is really the world is the day the Concord stops meaning anything. That is my advice and I would like it in the log.\"\n*if (xo = \"ferreo\")\n  \"The world has not asked,\" Ferreo says, \"which is a lovely sentence, and in about four months it is going to be read out at an inquiry by somebody who has never been within nine days of here. I am not saying give them the seed. I am saying that whichever way you go, you are going to be explaining it to a man in a good coat, and I would pick the version you can explain.\"\n*if (xo = \"tanaka\")\n  \"I ran freight for twelve years,\" Tanaka-Osei says. \"Every famine I ever saw, the government's plan was fine, and the people who died were the ones forty kilometres upriver who weren't in the plan. That's not politics, that's distance.\"\n\n*if (sec = \"oyelaran\")\n  \"If you put stores on the ground at the Fold,\" Oyelaran says, \"the council will come and take them, and then somebody will decide to guard them, and then this ship is in a shooting war on an independent world over grain. I have seen it. It takes about eleven days.\"\n*if (sec = \"whitlow\")\n  \"Before anybody decides anything,\" Whitlow says, \"I would like to know why the Fold's seed is *all* gone when the Landing's is only two-thirds gone, forty kilometres apart, same blight. That is not weather. Somebody did something, or somebody failed to, and I would like to know which before we hand out stores.\"\n*if (sec = \"mott\")\n  Mott says: \"On my world we say that a rule which has never cost you anything is not a rule, it is a preference.\" Then she says nothing else for the rest of the meeting, and it is the only thing anyone remembers.\n\n*if (med = \"nour\")\n  \"Seventeen per cent of allocation, six thousand people, midwinter,\" Nour says. \"I have run those camps. You do not get six thousand dead. You get about four hundred dead and five thousand six hundred who are shorter for the rest of their lives. That is what this decision is actually about and I want the number said out loud.\"\n*if (med = \"sorrel\")\n  Sorrel says, \"Four hundred,\" in a small voice, having done the same arithmetic, and then does not say anything else, and looks at the table.\n*if (med = \"vasi\")\n  \"Four hundred dead, five thousand six hundred stunted, and a natural experiment in blight resistance across two isolated populations,\" Vasi says. \"I am aware of how that sounds. It is nevertheless what is in front of us, and one of those three facts is the only one anybody will still care about in fifty years.\"\n\n*if (chap = \"wren\")\n  Wren says nothing for a long time. Then: \"May I ask a question rather than give an answer? Everyone in this room has said what the rule permits. Has anyone said what we would be doing if the rule did not exist?\"\n*if (chap = \"onu\")\n  \"I have carried water into places the government did not want water carried,\" Onu says, still folding, \"in three orders and on two worlds, and I was wrong once and I have never been able to work out which time.\"\n*if (chap = \"serat\")\n  \"What I am hearing,\" Serat says, \"is that everyone here has already decided and would like the Captain to say it first.\"\n*if (chap = \"none\")\n  At the foot of the table the chair is empty, and the argument goes round it, and lands nowhere.\n\n*page_break\n\n*choice\n  #Let it run. All of it. However long it takes.\n    *set rule %-14\n    *set crew %+8\n    You let them go for two hours. It gets bad-tempered twice and personal once, and at 0015 ${engname} says something that stops the room, and at 0040 you realise that nobody is performing any more and that this is the most useful thing that has happened aboard this ship.\n\n    You do not get a recommendation out of it. You get five people who now know exactly what the others think, which is worth more, and will be worth more still in eleven weeks.\n    *set rel_xo %+6\n    *set rel_med %+6\n    *set rel_sec %+6\n    *goto sedge_decide\n  #Take it round the table once, in order, and then close it.\n    *set rule %+6\n    Each of them gets four minutes. You take it in order of seniority, which means ${xoname} goes first and sets the frame, and you notice too late that this was a decision.\n\n    At 2320 you close the meeting. It was efficient. It was also, you suspect, a slightly smaller conversation than the one you needed.\n    *set rel_xo %+4\n    *goto sedge_decide\n  #Ask each of them one question and answer none.\n    *set rule %+10\n    *set candor %-10\n    You go round the table asking questions and giving nothing back, which is a thing you can do and which works, in the sense that you leave the wardroom with everything they have and none of them with anything of yours.\n\n    *if (chap = \"wren\")\n      Wren stays behind afterwards, stacking chairs he did not sit on. \"You did that well,\" he says. \"I have watched a bishop do it. He was also very good at it.\" And then he goes to bed, having said nothing at all, and you lie awake for an hour.\n      *set rel_chap %-4\n    *goto sedge_decide\n  *if (chap = \"none\")\n    #Look at the empty chair at the foot of the table.\n      *set rule %+8\n      *set candor %-6\n      There is nobody to ask. You look at the empty chair at the foot of the table for slightly too long, and then you say, \"Right. ${xoname},\" and the meeting starts, and afterwards you cannot account for the four seconds and neither can anyone else.\n      *achieve empty_berth\n      *goto sedge_decide\n  *if (chap != \"none\")\n    #Ask ${chapname} first, before anyone else.\n      *set rule %-8\n      *set rel_chap %+12\n      You ask the chaplain first, before the first officer, in front of the wardroom, which is not how a Meridian's table works and which everybody notices.\n      *if (chap = \"wren\")\n        Wren looks genuinely alarmed. \"Captain, I have no view on the seed stock. I have a view on you, and it is not for a meeting.\"\n      *if (chap = \"onu\")\n        Onu puts down what she is folding, which she has not done once in three weeks. \"Feed them,\" she says. \"Then argue. That is the whole of my advice and it is not very sophisticated.\"\n      *if (chap = \"serat\")\n        \"I would rather go last,\" Serat says, \"because if I go first everybody calibrates to me, and you will get one opinion five times.\"\n      Then you take it round the table properly, and the meeting is better for having started somewhere unexpected.\n      *goto sedge_decide\n\n*label sedge_decide\n*page_break\n\n*comment ---------------- The decision ----------------\n\nAt 0300 you are alone in the master's cabin, three metres by four, with a viewport and a desk bolted to the deck.\n\nIn your hold: four hundred kilos of gene-corrected seed, requisitioned for three member colonies on this circuit, of which two hundred kilos are surplus to the manifest by any honest reading. One portable water plant, requisitioned for a colony four systems from here that will not need it for eleven months.\n\nOutside: a world that has not asked, and six thousand two hundred people inside it who have.\n\n*if (plaque)\n  Twenty centimetres from your face, in brass: *THE LEAST THAT ANSWERS.*\n\n*page_break\n\n*choice\n  #Nothing. The world has not asked. Hold the line.\n    *set sedge \"held\"\n    *set crew %-14\n    *set rule %+10\n    *set standing %+8\n    You write it out in full so that you cannot pretend later that you did it by accident.\n\n    *The recognised government of Sedge has declined Concord assistance. The Fold is not the recognised government. Standing Order Four does not permit me to decide which part of a world is the world. Assistance declined. No stores landed.*\n\n    Then you sit and look at it, and you understand for the first time in your life that Standing Order Four is not a shield. It is a thing you do to people. A hundred and forty-three years ago eleven worlds finished killing each other and agreed that this would be cheaper, and tonight the bill comes to about four hundred names you will never know.\n\n    You sign it.\n    *goto sedge_after\n  #The water plant. Not the seed. Water is life; seed is a harvest, and a harvest is politics.\n    *set sedge \"water\"\n    *set rule %+8\n    *set nerve %-4\n    *set standing %+4\n    *achieve least\n    It takes you two hours to convince yourself and eleven minutes to write.\n\n    A water plant does not change who governs Sedge. It does not restore the Fold's independence or break the council's plan or feed anybody through a winter. It keeps six thousand two hundred people alive and thirsty and exactly as dependent on the Landing as they were yesterday, and it can be defended, in a hall, in front of a Board, sentence by sentence.\n\n    *The least that answers.* You are aware, writing it, that you have used those four words to mean *the smallest thing I can give without being punished*, and that this is not what they say.\n\n    It is still the only reading of them that you can carry.\n    *goto sedge_handover\n  #Everything. Seed and water, to the Fold, in daylight, with my name on it.\n    *set sedge \"gave\"\n    *set crew %+8\n    *set nerve %+14\n    *set candor %+10\n    *set standing %-12\n    *achieve more\n    You do not do it quietly, because doing it quietly would be the worse crime — it would mean you knew.\n\n    *0410. Two hundred kilos seed stock and one portable water plant landed at the Fold, Sedge, by my direct order, in contravention of Standing Order Four. The recognised government of this world refused assistance. I have given it to six thousand two hundred people who asked for it. I request that this entry be forwarded to the Board of Inquiry with my commission.*\n\n    Then you go up to the bridge and tell the officer of the watch to signal the Landing and tell them what you are about to do, before you do it, which is the part that will actually cost you.\n    *goto sedge_handover\n  #Everything — through the council. Concord stores, Concord terms, Concord witnesses.\n    *set sedge \"council\"\n    *set rule %+12\n    *set candor %+6\n    *set standing %+3\n    You signal Speaker Vane at 0500 and offer him four hundred kilos of seed and a water plant for the whole of Sedge, on one condition: the Survey witnesses the distribution, settlement by settlement, against the register, including the Fold.\n\n    It is not assistance to a faction. It is assistance to the world, which is entitled to refuse it, and which will not, because Vane is a serious man with a blight.\n\n    He accepts in ninety minutes, which is fast enough to tell you that he has been awake all night too.\n\n    What you have done is hand a man his own plan back with your hand still on it. It is legal. ${xoname} calls it *elegant*, and you cannot tell whether that is praise.\n    *set rel_xo %+8\n    *goto sedge_handover\n\n*label sedge_handover\n*page_break\n\n*comment ---------------- The handover ----------------\n\nWhatever you have decided, it goes down in the *Tern*, and somebody has to be in it.\n\n*choice\n  #I go down with it myself.\n    *set nerve %+10\n    *set crew %+6\n    *set standing %-4\n    You go. It is not necessary and everybody knows it is not necessary, and ${xoname} says so, once, correctly, for the log.\n\n    You stand in a field forty kilometres upriver at seven in the morning while six thousand two hundred people work out what has arrived, and a man you have never met shakes your hand for eleven seconds without saying anything, and you carry that hand for a year.\n    *set rel_xo %-3\n    *goto sedge_after\n  #${xoname} takes it down. That is what a first officer is for.\n    *set rule %+6\n    *set crew %-4\n    *set rel_xo %+8\n    ${xoname} takes the *Tern* down and does it exactly right and reports in eleven sentences, and you sit on the bridge and watch the plot and find that you would very much rather have been there, and file that away as something to watch in yourself.\n    *goto sedge_after\n  #Send ${secname}. If this goes wrong it goes wrong on the ground.\n    *set rule %+8\n    *set nerve %-6\n    *set rel_sec %+10\n    *if (sec = \"oyelaran\")\n      Oyelaran goes down with four hands and no visible weapons, having spent forty minutes making certain that there are no visible weapons, and comes back up having talked to eleven people and learned that the council has already moved two trucks to within nine kilometres of the Fold.\n    *if (sec = \"whitlow\")\n      Whitlow goes down and comes back with the answer to her own question: the Fold's seed store was in a low barn, the council's water cut dropped the river weir, the weir dropped the water table, the barn flooded in the spring, and nobody did anything to anybody. It was arithmetic. It is somehow worse.\n    *if (sec = \"mott\")\n      Mott goes down, and the Fold has never seen a Karsk, and by the middle of the afternoon there are nine children following her at a distance of exactly four metres, and she has named all of them.\n    *goto sedge_after\n\n*label sedge_after\n*page_break\n\n*comment ---------------- What it costs ----------------\n\n*if (sedge = \"held\")\n  You are eleven days out of Sedge before the arithmetic finishes arriving.\n  *if (crew > 55)\n    It arrives in the mess deck first, the way these things do. Nobody says anything to you. Nobody has to. For four days the ship is quiet in a way that is not restful, and then ${xoname} tells you that a rating has asked to be transferred at the next member colony, and that the reason given on the form is *personal*.\n    *set rel_xo %-4\n  *if (crew <= 55)\n    It arrives as a number in a Concord bulletin four months later: Sedge, consolidation completed, three hundred and eighty-one excess deaths, winter of the blight. Under the Concord's reporting standards that is a *successful* consolidation, because the projection was four hundred.\n  *set sedge_dead 381\n  Three years from now, Sedge will have a crop again. Forty thousand people will be alive on a world that was never made to depend on anybody, and the Concord will not have decided which part of Sedge was really Sedge, and that will still be true in a hundred years, and it will still have cost three hundred and eighty-one people.\n\n  Both of those sentences are true at once. Nobody ever tells you how to hold two true sentences at the same time.\n  *set standing %+6\n\n*if (sedge = \"water\")\n  The water plant runs. It is not glamorous: a shed, a pipe, and eleven cubic metres an hour.\n  *set sedge_dead 190\n  Nineteen people die at the Fold that winter of things that are not thirst, and about a hundred and seventy more across the outlying settlements where you did not go, and the Fold consolidates with the Landing in the spring on the council's terms, exactly as Vane planned, only slower and with fewer funerals.\n\n  Speaker Vane files no protest. What he files is a note of thanks, correctly worded, which arrives at Concord Central four months later and does you a great deal of good, and which is the single most uncomfortable piece of paper you will receive all year.\n  *set standing %+5\n\n*if (sedge = \"gave\")\n  The Fold plants in eleven days.\n  *set sedge_dead 40\n  Speaker Vane's protest reaches Concord Central in six weeks. It is nine pages and it is not hysterical; it is the careful, wounded document of a man who had a plan and was overruled by a foreigner in orbit, and every single fact in it is correct.\n\n  Forty people die at the Fold that winter, which is what happens when six thousand people who were going to starve merely have a very bad time instead.\n\n  And eleven years from now the Fold will still be there, separate, watered, and fed, and the council of Sedge will still be able to name the ship.\n  *set standing %-8\n\n*if (sedge = \"council\")\n  The distribution takes nine days and ${xoname} witnesses every hour of it against the register, settlement by settlement, including the Fold, where Vane's own inspector has to stand in a field and count sacks in front of six thousand people who have not been counted in for eleven years.\n  *set sedge_dead 96\n  Ninety-six people die on Sedge that winter, across the whole world, of the ordinary things.\n\n  In the spring the Fold votes to rejoin the Landing, narrowly, and Cassa Doon votes against and loses and stays anyway. Nobody thanks you. Sedge does not think it was helped. Sedge thinks it made a plan and the plan worked, which is exactly what you wanted and gives you nothing at all to hold.\n  *set standing %+8\n\n*page_break\n\n*comment ---------------- The last conversation on the ground ----------------\n*comment Reaction block: reads all four pairs plus standing. Reconvergent —\n*comment every branch ends at the same place with a different thing understood.\n\nBefore you break orbit, Speaker Idris Vane comes up to the ship. He has never been aboard a Survey vessel. He looks at the deckhead the whole way down the corridor.\n\nHe wants to say one thing, and it takes him three attempts.\n\n*if (rule > 62)\n  \"You did not ask me what I wanted,\" he says at last. \"Not once, in nine days. You asked me what I had done and what I planned and what the numbers were, and then you decided.\" He turns his hat over. \"I have been elected nine times, Commander. Nobody has asked me what I wanted since I was forty. I find I do not mind it as much as I expected to.\"\n*if (rule <= 62)\n  \"You asked eleven people what they thought,\" he says at last, \"including a woman who walked two days to stand at your fence, and I watched you do it, and I could not tell at any point what you had already decided.\" He turns his hat over. \"I have been elected nine times. That is a very useful thing to be unable to tell about a person.\"\n\n*if (candor > 62)\n  \"And you told me the truth in a hall with the doors open, in front of two hundred people, which was either brave or careless.\"\n*if (candor <= 62)\n  \"And you told me very little, which I respect, and which means that in six months I will not know whether to be grateful to you or not.\"\n\n*if (crew > 62)\n  He looks at the corridor, at the ratings flattening themselves against the bulkhead to let him past. \"Your people watch you,\" he says. \"Mine watch me too. It is not the same watching and I would rather have yours.\"\n*if (crew <= 62)\n  He looks at the corridor. \"You run a quiet ship,\" he says, which is not entirely a compliment on a world where the loudest thing anybody owns is a grain drier.\n\n*if (nerve > 62)\n  At the airlock he says: \"You move fast. Faster than the last one, and he was not slow.\" He does not say whether that is good.\n*if (nerve <= 62)\n  At the airlock he says: \"You are careful. The last one was not, at the end.\" He does not say whether that is good.\n\n*page_break\n\n*choice\n  #\"Speaker — was I wrong?\"\n    *set candor %+10\n    *set rule %-6\n    You ask a man whose world you have just been standing on whether you were wrong, in a corridor, with your own ratings within earshot.\n\n    Vane thinks about it for a long time. He is not being kind.\n\n    *if (standing > 55)\n      \"No,\" he says. \"I think you were correct and I think it cost something, and I think you know exactly what, and I think that is as much as anybody gets.\" He puts his hat on. \"It is more than Halloran got.\"\n      *set standing %+4\n    *if (standing <= 55)\n      \"I do not know yet,\" he says. \"Ask me in three years. I will still be here.\" He puts his hat on. \"That is the difference between us, Commander. You leave.\"\n    *goto tell_ship\n  #\"You will have a Vaunt ship here inside two years. Be ready.\"\n    *set candor %+12\n    *set nerve %+8\n    *set standing %-5\n    You tell an independent world, without authorisation, that a rival power is going to come for it.\n\n    Vane does not look surprised, which is the worst part. \"We have had two Vaunt traders in eleven months,\" he says. \"Very polite. Very good prices. They asked whether the Concord had ever given us anything.\" He looks at you. \"Until this week I could say no.\"\n    *set sedge_open true\n    *goto tell_ship\n  #Shake his hand and say nothing.\n    *set candor %-10\n    *set rule %+6\n    You shake his hand at the airlock and say the correct things about safe harvests, and he says the correct things back, and it takes ninety seconds and nothing whatsoever passes between you.\n\n    *if (background = \"diplomatic\")\n      Which is, you are aware, the single most useful outcome available, and you have arranged it deliberately, and you are getting extremely good at it, and somewhere around the third exchange of correct things you catch yourself enjoying it.\n      *set standing %+4\n    *goto tell_ship\n\n*label tell_ship\n*page_break\n\n*comment ---------------- What you tell the ship ----------------\n\nA hundred and twelve people know what you did. About ninety of them have an opinion. The intercom is on the bulkhead.\n\n*choice\n  #Explain it. The whole reasoning, out loud, to everybody.\n    *set candor %+14\n    *set crew %+6\n    You take nine minutes on the intercom and walk a hundred and twelve people through Standing Order Four, both sentences, and what you decided and why, including the part where you are not certain.\n\n    *if (candor > 70)\n      It works, and it works for a reason you did not expect: not because you persuaded them, but because a crew nine days from help will forgive almost any decision except being managed, and you have just spent nine minutes not managing them.\n      *set rel_xo %+6\n      *set rel_sec %+6\n      *set rel_med %+6\n    *if (candor <= 70)\n      It half works. The ones who agreed with you agree with you more. The ones who did not now have nine minutes of your reasoning to be specific about, and specificity is not always a gift.\n    *goto sedge_log\n  #Post the log entry on the mess board. Unedited. Let them read it.\n    *set candor %+10\n    *set rule %-8\n    *set crew %+8\n    You do not explain anything. You have ${xoname} post the master's log entry, in full, unedited, on the mess board beside the whiteboard and the coffee urn, and you do not go down to see who is reading it.\n\n    It is there for four days. On the fifth morning somebody has written under it, in pencil, in a hand nobody ever identifies: *fair enough.*\n\n    You have that board photographed, and you do not tell anyone why.\n    *set rel_xo %+5\n    *goto sedge_log\n  #Nothing. They will work it out.\n    *set candor %-14\n    *set rule %+8\n    You say nothing at all, and a hundred and twelve people work it out, and what they work out is roughly correct and entirely without your fingerprints on it, and about a fifth of it is wrong in ways you will not discover for months.\n\n    *if (crew > 60)\n      ${medname} mentions, three weeks later and apparently at random, that the third watch believes you argued with Speaker Vane for two hours and lost. You have never spoken to Speaker Vane for more than eleven minutes at a stretch.\n    *goto sedge_log\n\n*label sedge_log\n*page_break\n\nYou are four days out of Sedge, at 0200, when the sensor watch finds something and does not know what to do about it, and wakes ${xoname}, who wakes you.\n\nIt is a track. Nine hours old, cold, and running out of Sedge space towards the coreward edge of the Reach on a heading that no trader uses.\n\n*if (background = \"line\")\n  You have chased tracks like this for six years on the Sarn frontier and you know what it is before ${engname} finishes the profile. It is a warship, running quiet, with a drive signature nobody in the Concord builds.\n*if (background != \"line\")\n  ${engname} runs the profile three times. The third time ${engthey} stops talking in the middle of a sentence.\n\n*if (eng = \"dorr\")\n  Dorr looks at the signature for a long moment. \"I am sorry,\" he says. \"That is a Vaunt cruiser. Fourth pattern, Kes-Arahel yards, and I helped build the coolant baffle that makes it look like that on your sensors.\"\n\n  Nobody on the bridge says anything. Dorr adds, quietly: \"It has been there the whole time we were at Sedge.\"\n*if (eng != \"dorr\")\n  It is a Vaunt cruiser. Fourth pattern, Kes-Arahel yards, and by the time you have the profile it is nine hours gone.\n\n  It has been there the whole time you were at Sedge.\n\n*page_break\n\nWhatever you did at the Fold, somebody watched you do it.\n\n*finish\n", "ashaya": "*comment ==================== CHAPTER FOUR — ASHAYA ====================\n*comment First contact with the Vaunt. Oleyo is courteous, exact, does not lie,\n*comment and is right about a thing you cannot accept. He thanks you for Sedge.\n*comment Budget: 11 tests. First deaths are possible here.\n*comment Ledger: the freighter Corvine, independent, 41 aboard, reactor event\n*comment nine hours from the Marl jump point. Ashaya is 4 hours out; you are 11.\n\nThe distress call comes in at 0340 on the automatic band and it is not a voice, it is a beacon, which is worse.\n\n**CORVINE, INDEPENDENT, MARL TRANSIT. REACTOR EVENT. FORTY-ONE SOULS. NO CONTAINMENT.**\n\n${xoname} has the plot up before you are on the bridge.\n\n\"Eleven hours at cruise,\" ${xothey} says. \"Nine and a half if we push her. There is also a second ship answering.\" A pause. \"Four hours out. Vaunt.\"\n\nThe bridge of a Meridian is nine metres across and everybody in it can hear everything anybody says.\n\n*page_break\n\n*if (eng = \"osimo\")\n  Osimo comes up from below without being called, which he has done twice in four months, both times when somebody was about to ask his engines for something. \"You can have nine and a half,\" he says. \"You cannot have it twice.\"\n*if (eng = \"kallas\")\n  Kallas is already talking. \"Nine and a half is not the number, the number is nine and forty because the number two loop will not take a sustained overpressure past the eighth hour, and before you ask, yes, I can give you nine and forty, and no, I would not.\"\n*if (eng = \"dorr\")\n  \"I am sorry,\" Dorr says. \"Nine and a half will cost you a coolant loop and possibly the seals. That is not a refusal. That is the price, and you should have it before you decide.\"\n\n*choice\n  #Push her. Nine and a half hours.\n    *set nerve %+12\n    *set strain +11\n    *set crew %-4\n    \"Nine and a half, ${engname}. Take what you need.\"\n\n    The *Perpetua* is twenty-six years old and she goes, and for nine and a half hours the number two coolant loop stops whistling, which is the single most frightening thing that has happened aboard this ship.\n    *set rel_eng %-4\n    *goto ashaya_arrive\n  #Eleven hours at cruise. She is old and there is another ship already closer.\n    *set nerve %-12\n    *set rule %+6\n    *set strain +3\n    \"Cruise, Mister Beye.\"\n\n    Beye says \"Aye, Captain\" in a voice with nothing in it at all, and holds cruise for eleven hours, and does not look at you once.\n    *set rel_eng %+8\n    *goto ashaya_arrive\n  #Ask ${engname} for the largest number ${engthey} will stand behind.\n    *set rule %-10\n    *set crew %+6\n    *set strain +7\n    *set rel_eng %+10\n    You ask for the number ${engthey} will put ${engtheir} name to, and you get it, and it is ten hours and ten minutes, and it is not a compromise — it is the actual number, which nobody has asked ${engthem} for before.\n    *goto ashaya_arrive\n\n*label ashaya_arrive\n*page_break\n\n*comment ---------------- The Ashaya ----------------\n\nYou come out of transit into a field of debris the size of a small moon's ring, and there are two ships in it.\n\nOne is the *Corvine*: eleven thousand tonnes of independent freighter, broken across the middle, venting from four points, turning slowly the wrong way. Her aft third is a furnace.\n\nThe other is the *Ashaya*.\n\nShe is four hundred metres of white, and she is beautiful, and everything about her says the same thing in a different way: that the people who built her were not making compromises with a budget. Where the *Perpetua* has a welded seam from something that happened years ago, the *Ashaya* has a continuous hull. Where you have four guns, she has an arrangement you cannot identify at all.\n\nShe has twelve shuttles in the air and she has been working for six hours.\n\n*if (eng = \"dorr\")\n  Beside you, Dorr has gone completely still. He built the coolant baffle on that class. He has not seen one from the outside since he was thirty-six.\n  *set rel_eng %-5\n\n*page_break\n\nThe signal comes across before you have finished the approach, in Concord Standard, unaccented, on an open channel that everybody on both ships can hear.\n\n\"Concord vessel, this is *Ashaya* of Kes-Arahel, Sar Vehn Oleyo commanding. We have taken twenty-nine off the *Corvine*. Twelve remain in the forward habitat ring, which is intact and will remain intact for approximately four hours. We are not going to get them.\"\n\nA pause of exactly the right length.\n\n\"I am glad you have come, Commander. I would rather it were you than nobody.\"\n\n*set met_oleyo true\n\n*choice\n  #\"Ashaya, this is Perpetua. Why are you not going to get them?\"\n    *set candor %+10\n    *set rule %+4\n    \"Because the transit from my ship to the forward ring passes within nine metres of the aft third,\" Oleyo says, \"and the aft third is at four thousand degrees and will fail asymmetrically at some point in the next four hours, and I do not know when. The transit is one hundred and forty seconds each way. I have run it nine times with instruments. I would be sending eleven of my people to a place where I cannot tell them when the wall falls.\"\n\n    \"Twelve for eleven.\"\n\n    \"Twelve *probable* for eleven *possible*,\" Oleyo says, \"which is not the same arithmetic, and which I am aware sounds like an excuse, and is not one.\"\n    *goto ashaya_council\n  #\"Ashaya, we will take them. Stand off and keep your shuttles clear of my approach.\"\n    *set nerve %+14\n    *set rule %+8\n    *set oleyo %-4\n    \"Understood, Commander. My lanes are yours. I will hold at nine kilometres and my medical bay is open to you and will remain open whatever happens.\"\n\n    He does not argue. He does not warn you. He clears his shuttles out of your way in under two minutes and then his ship goes quiet, and it is somehow much worse than being argued with.\n    *goto ashaya_council\n  #\"Ashaya, Perpetua. Give me your instrument data on the aft third. All of it.\"\n    *set rule %-6\n    *set candor %+6\n    *set oleyo %+8\n    \"All of it,\" Oleyo agrees, and it arrives in ninety seconds: nine passes, full spectrum, uncompressed, with his own crew's annotations in Vaunt still on it and no attempt to clean them up.\n\n    ${engname} has it inside four minutes and comes back looking unhappy.\n\n    \"It is good data,\" ${engthey} says. \"It is better data than we could take. And it says what he said it says.\"\n    *set rel_eng %+6\n    *goto ashaya_council\n\n*label ashaya_council\n*page_break\n\n*comment ---------------- The twelve ----------------\n\nTwelve people in the forward habitat ring of the *Corvine*. Four hours, probably. One hundred and forty seconds each way through a lane nine metres from a wall at four thousand degrees.\n\nYour ship has two shuttles. The *Tern* carries nine at a squeeze.\n\nTwo runs.\n\n*if (sec = \"oyelaran\")\n  \"Two runs, four crew, and I will fly the second one myself,\" Oyelaran says. \"I am not being noble, Captain. I am the most expendable qualified body on this ship and that is an actual category.\"\n*if (sec = \"whitlow\")\n  \"Two runs,\" Whitlow says, \"and if the wall goes it goes during the second, because it always goes during the second, and I would like that said before anybody volunteers.\"\n*if (sec = \"mott\")\n  \"I will fly neither,\" Mott says, \"because I am too heavy for the *Tern* with nine aboard, and that is the only reason, and I want it said out loud so that nobody invents a better one for me.\"\n\n*if (med = \"nour\")\n  Nour says: \"Twelve people who are conscious, uninjured, and have been listening to their own ship burn for six hours. I will need the mess deck cleared, not sickbay.\"\n*if (med = \"sorrel\")\n  Sorrel says: \"Do we know their names?\" and somebody says no, and he says, \"We will in an hour,\" and goes to find out, and comes back with all twelve.\n*if (med = \"vasi\")\n  Vasi says: \"Twelve, uninjured. If the wall fails during a transit I will have nine burns and no burn ward and I will be triaging in the *Tern*'s bay by torchlight. I mention it so that you are choosing it rather than discovering it.\"\n\n*if (chap = \"wren\")\n  Wren asks whether he may go on the second run. You say no. He accepts it immediately and completely, and then asks whether he may be in the bay when they come aboard, and that one you cannot refuse.\n*if (chap = \"onu\")\n  Onu is already in the shuttle bay laying out blankets, having asked nobody, and when you find her there she says, \"Two runs?\" without looking up.\n*if (chap = \"serat\")\n  Serat says: \"Whatever you decide, decide it in the next eleven minutes. Past that the crew stops preparing and starts waiting, and waiting is where people get hurt.\"\n*if (chap = \"none\")\n  Nobody asks to go on the second run. It does not occur to you until much later that on Halloran's ship, somebody would have.\n\n*page_break\n\n*choice\n  #Two runs. Volunteers only. I fly the second one.\n    *set nerve %+14\n    *set crew %+8\n    *set rule %+6\n    *set standing %-4\n    *set ashaya_pc true\n    You are the commanding officer of a Concord Survey vessel and you are going to fly a shuttle through a nine-metre lane, and ${xoname} tells you exactly what ${xothey} thinks of that, on the record, in one sentence, and then stops.\n    *goto ashaya_run\n  #Two runs. Volunteers only. ${secname} runs it.\n    *set nerve %+8\n    *set rule %+6\n    *set rel_sec %+8\n    You ask for volunteers and get twenty-two of them inside ninety seconds, which is a thing you will think about for the rest of your life.\n    *goto ashaya_run\n  #One run. Nine of the twelve. Then we reassess.\n    *set nerve %-8\n    *set rule %+10\n    *set crew %+6\n    *set ashaya_split true\n    Nine, then look at the wall again, then decide. It is the coward's arithmetic and it is also the only version where you are not committing to the second transit before you have any new information, and both of those sentences are true.\n    *goto ashaya_run\n  #Signal Oleyo. Ask him to put his shuttles back in and do it together.\n    *set rule %-12\n    *set crew %+6\n    *set oleyo %+14\n    *set candor %+8\n    There is a silence of about four seconds on the open channel.\n\n    \"Commander,\" Oleyo says, \"I have declined this transit. If I now fly it beside you, my declining it was a lie, and I do not tell them.\" Another pause. \"But my shuttles are faster than yours and my crews are better and neither of those facts is in dispute. So: I will fly the lane empty, ahead of each of your runs, at the same distance, thirty seconds early. If the wall fails, it fails on me first and your pilot turns.\"\n\n    ${xoname} says, very quietly, \"That is not a rescue. That is a canary.\"\n\n    \"Yes,\" says Oleyo, on the open channel, because he has excellent ears. \"That is what it is.\"\n    *set ashaya_canary true\n    *goto ashaya_run\n\n*label ashaya_run\n*page_break\n\n*comment ---------------- The lane ----------------\n*comment Multi-level: nerve band x strain band determines losses. Reconvergent\n*comment in structure — everybody gets the twelve out or does not — but the cost\n*comment differs and is remembered for the rest of the book.\n\nBeye flies the first run.\n\nOne hundred and forty seconds out. He talks the whole way, which he has never done, a flat unbroken commentary of numbers and distances, and at the ninety-second mark the *Corvine*'s aft third throws off a plume that lights the inside of the *Tern* like a window at noon and he does not stop talking.\n\nHe brings back nine.\n\n*page_break\n\n*if (ashaya_split)\n  You look at the wall again. It is worse. The instruments say between forty minutes and four hours and cannot be made to say anything more useful than that.\n\n  There are three people still in the forward ring. Their names, because ${medname} found out, are Aleta Ruso, Bin Chey, and a boy of sixteen called Otho Marn who is Ruso's sister's son and who has been talking to your comms rating for two hours about nothing at all.\n\n  *choice\n    #Go. Now, before it gets worse.\n      *set nerve %+14\n      *set crew %+6\n      *goto ashaya_second\n    #Ask for the *Ashaya*'s read one more time, then go.\n      *set rule %-6\n      *set oleyo %+8\n      Oleyo's data comes back in forty seconds and says the same thing his last nine passes said. He adds one line, in his own hand, in Concord Standard: *I would go now, Commander. I would not have gone at all, and if I were going I would go now.*\n      *goto ashaya_second\n    #Nobody flies that lane twice. Signal the ring and tell them the truth.\n      *set nerve %-16\n      *set crew %+14\n      *set rule %+10\n      *set candor %+12\n      *goto ashaya_abandon\n\n*if (ashaya_split = false)\n  *goto ashaya_second\n\n*label ashaya_second\n*page_break\n\nThe second run goes at the hundred and eleventh minute.\n\n*if (ashaya_canary)\n  A Vaunt shuttle flies the lane empty thirty seconds ahead of it. You watch it on the plot: a white spark going in where nobody has to go, at exactly the distance, exactly on time. Its pilot's name is on the manifest Oleyo sent unasked. It is Sar Deneth Iru and she is twenty-six years old.\n  *set oleyo %+6\n\n*if (ashaya_pc)\n  You fly it.\n\n  One hundred and forty seconds is a very long time. At sixty seconds you understand, in a way that no briefing ever conveyed, that the wall is not a wall, it is a *decision* somebody else's ship made six hours ago and is still making. At ninety seconds you find out what your own voice sounds like. At one hundred and eleven you are alongside the forward ring with three people getting in behind you and one of them is a boy of sixteen who says *thank you* like a person being handed a coat.\n*if (ashaya_pc = false)\n  You watch it from the bridge of your own ship on a plot nine metres across with eleven people around you, and it is worse than flying it, and everyone who has done both says so.\n\n*page_break\n\n*if (strain >= 30)\n  The *Perpetua* has been pushed hard and the *Tern* has been pushed harder.\n\n  Eleven seconds out from the ring, on the way home, the *Tern*'s port attitude cluster gives up. It is not the wall. It is nine and a half hours at overpressure and a shuttle that was due for overhaul at Sarn Basin, and the two things you did not do at Sarn Basin were overhaul the *Tern* and refuse the run.\n\n  Beye holds her. He gets her back on the ship's own gravity with the bay doors open and no attitude control at all, and it is the best flying anybody aboard will ever see, and it puts the *Tern* into the far bulkhead at four metres a second.\n\n  Everyone lives. The *Tern* does not. She is written off where she sits.\n  *set tern_lost true\n  *set strain +8\n  *set rel_eng %-6\n\n*if (strain < 30)\n  The *Tern* comes home on time and on her own power, and the bay doors close, and somebody in the bay starts clapping and then stops because nobody else has.\n\n  The *Corvine*'s aft third fails asymmetrically at the two-hundred-and-ninth minute, exactly as Oleyo said it would, and takes the forward habitat ring with it. There is nobody in it.\n\n*set salvage_saved 12\n*goto ashaya_meet\n\n*label ashaya_abandon\n*page_break\n\nYou open the channel to the forward ring yourself, because it is not a thing you can give to anybody else.\n\nYou tell Aleta Ruso, Bin Chey, and a boy of sixteen named Otho Marn that no shuttle is coming; that you have looked at the wall and you have looked at your people and you have decided; and that you are sorry, and that you will stay on the channel.\n\nRuso says: \"How long?\"\n\nYou tell her the truth, which is that nobody knows, and that it is between forty minutes and four hours.\n\nThe channel stays open for two hours and nine minutes. Your comms rating, whose name is Tey Abara and who is twenty-two, stays at the board for all of it and does not hand over. Towards the end Otho Marn asks her what Sarn is like, because he has never been, and she tells him, and she is still telling him when the aft third fails.\n\n*set salvage_saved 9\n*set sedge_dead +3\n*set standing %-6\n*set crew %+10\n\n*if (chap != \"none\")\n  ${chapname} is on the bridge for the last forty minutes, standing behind the comms board, saying nothing, one hand flat on the back of Abara's chair.\n  *set rel_chap %+10\n*if (chap = \"none\")\n  Nobody is standing behind the comms board. Afterwards Abara goes off watch and there is nowhere in particular for her to go, and she goes to the mess, and it is 0400 and the mess is empty.\n  *set rel_med %-4\n\n*goto ashaya_meet\n\n*label ashaya_meet\n*page_break\n\n*comment ---------------- Sar Vehn Oleyo ----------------\n\nSix hours later, with the debris field thinning and twenty-nine survivors on his ship and\n*if (salvage_saved = 12)\n  twelve\n*if (salvage_saved = 9)\n  nine\non yours, Oleyo asks for a meeting and leaves the venue to you.\n\n*choice\n  #He comes aboard the *Perpetua*.\n    *set rule %+8\n    *set nerve %+4\n    *set ashaya_venue \"mine\"\n    He comes across in a shuttle with two people and no weapons and walks up your ramp into a twenty-six-year-old survey ship that smells of cold metal and old coffee, and he looks at everything, and he says nothing about any of it, and you cannot tell whether that is courtesy or a report.\n    *goto oleyo_scene\n  #I go across to the *Ashaya*.\n    *set nerve %+10\n    *set candor %+6\n    *set oleyo %+10\n    *set ashaya_venue \"his\"\n    *set rel_xo %-6\n    ${xoname} objects. Formally, on the record, in the manner of a first officer who intends the objection to be readable in thirty years. You overrule ${xothem} and go.\n\n    The *Ashaya* is quiet inside. That is the thing nobody tells you about Vaunt ships: they are quiet, and the corridors are wide, and there is art on the walls of a working warship, and none of it is about victory.\n    *goto oleyo_scene\n  #Neither. We do this on a screen.\n    *set rule %+10\n    *set candor %-8\n    *set oleyo %-8\n    *set ashaya_venue \"screen\"\n    You do it on a screen, which is correct, which is prudent, and which Oleyo accepts without a flicker.\n\n    \"As you wish, Commander,\" he says, and the whole conversation that follows is nine per cent worse for both of you, and you both know it, and neither of you says so.\n    *goto oleyo_scene\n\n*label oleyo_scene\n*page_break\n\nSar Vehn Oleyo is about fifty. Grey at the temples, a face built for patience, and a uniform without a single decoration on it, because in the Vaunt the decorations are in the record and the record is public and wearing them would be a redundancy.\n\nHe uses your rank scrupulously and never your name.\n\n*if (eng = \"dorr\")\n  The first thing he does is look for Dorr, find him, and address him in Vaunt: three words, quietly, and Dorr answers with two.\n\n  Then, to you, in Concord Standard: \"Lieutenant Dorr built the coolant baffle on the ship you have been looking at all day. My government has a claim on him which it does not exercise at this distance and I have no claim on him at all. I asked after his mother. She is well.\" A pause. \"He knew that. I wanted him to know that I knew he knew.\"\n  *set rel_eng %-8\n  *set oleyo %+4\n\n*if (ashaya_venue = \"his\")\n  On the way in he shows you the *Corvine*'s twenty-nine, in a compartment his people have cleared, with his own crew sitting among them. He does not point it out.\n\n*page_break\n\n\"Three things,\" Oleyo says, \"and then I will stop taking your time.\n\n\"The first is that I have transmitted the *Corvine*'s survivor list to Marl, to Concord Central, and to my own government, complete and identical, on all three, in clear. You will want to verify that. Please do.\n\n\"The second is that\n*if (salvage_saved = 12)\n  you got twelve people out of a lane I had declined, and I was wrong about the fourth hour by nineteen minutes, and if I had been wrong the other way you would have lost a shuttle and a crew. I am telling you that I was wrong. I am not telling you that you were right.\n*if (salvage_saved = 9)\n  you looked at the same wall I looked at and reached the same conclusion, six hours later, with a different ship and a worse instrument fit. Three people died in that ring. I want you to know that I count them on my side of the ledger and not on yours, and that this is not generosity; it is bookkeeping.\n\"\n\nHe stops. He is a man who signals his paragraphs.\n\n\"The third is Sedge.\"\n\n*page_break\n\n*if (sedge = \"held\")\n  \"You went to Sedge,\" Oleyo says, \"and forty-one thousand people had a blight, and six thousand of them asked you for seed, and you gave them nothing, because the recognised government of that world had not asked.\n\n  \"Thank you, Commander. I mean that exactly. For eleven years my government has argued about whether the Concord's restraint is a principle or a posture. It has been an expensive argument. You have settled it in one afternoon, at no cost to me, and I am obliged to you, and I am sorry.\"\n*if (sedge = \"water\")\n  \"You went to Sedge,\" Oleyo says, \"and you gave six thousand people a water plant and withheld the seed, and you wrote in your log that this was *the least that answers.*\n\n  \"Thank you, Commander. I have written that phrase down. It is the most useful four words I have acquired this year.\" He looks at you. \"You should know what I am going to do with them. I am going to read them aloud, in a room on Kes-Arahel, to people who believe the Concord is sincere.\"\n*if (sedge = \"gave\")\n  \"You went to Sedge,\" Oleyo says, \"and a faction asked and a government refused, and you landed the stores anyway and put it in your own log in your own hand.\n\n  \"Thank you, Commander. For eleven years my government has been assured that the Concord will not move. You have made a liar of everyone who told them so, and you have done it on a world that will remember it for a century.\" A pause. \"I do not know yet whether that makes my work harder or easier. Neither do you. That is why I am thanking you and not congratulating you.\"\n*if (sedge = \"council\")\n  \"You went to Sedge,\" Oleyo says, \"and you took a man's own plan, and you handed it back to him with your hand still on it, and now the Concord's stores are in his silos and his name is on the distribution and nobody on that world believes they were helped.\n\n  \"Thank you, Commander. That is the most Vaunt thing I have ever watched a Concord officer do.\" He says it perfectly levelly. \"I do not mean it kindly. I mean that I recognised it, and that recognising it cost me something, and I would rather have gone on thinking your service could not.\"\n\n*page_break\n\n*choice\n  #\"You are welcome. Now tell me what you were doing in Sedge space.\"\n    *set candor %+12\n    *set nerve %+8\n    *set oleyo %+6\n    \"Watching,\" Oleyo says immediately. \"Legally, at nine astronomical units, in space no treaty assigns to anyone. I filed the transit with my government and did not file it with yours, because I am not required to and because you would have moved.\"\n\n    \"That is an answer.\"\n\n    \"It is the whole answer. I am not going to give you a better one and I am not going to give you a worse one.\" He almost smiles. \"Commander, you will find that I am extremely tiresome about this. I do not lie. It is not a virtue. It is that I keep records, and a lie is a second set of books.\"\n    *goto oleyo_ceyla\n  #\"Do not thank me again.\"\n    *set candor %+8\n    *set rule %+8\n    *set oleyo %-6\n    \"Do not thank me again. Not for Sedge, not for anything I do in this Reach, not on an open channel and not in a room. Whatever I decide out here, I do not want it arriving on Kes-Arahel with your gratitude attached to it.\"\n\n    Oleyo considers this properly, which is his most disarming quality.\n\n    \"I cannot agree to that,\" he says at last. \"If you do a thing that helps me I will say so, because if I only said it when it suited me you would be right not to believe me the rest of the time.\" A pause. \"But I understand the request, and I am sorry that it is not available.\"\n    *goto oleyo_ceyla\n  #Say nothing at all and let it sit.\n    *set candor %-14\n    *set rule %+6\n    You let the silence run. It runs for a long time. Oleyo does not fill it, which tells you a great deal about Oleyo.\n\n    *if (nerve <= 45)\n      Eventually he says: \"You are very restful, Commander. The last master of this ship was not.\"\n    *if (nerve > 45)\n      Eventually he says: \"You are holding still on purpose. I do it too. It is a good habit and it does not work on people who have it.\"\n    *goto oleyo_ceyla\n\n*label oleyo_ceyla\n*page_break\n\n\"There is a fourth thing,\" Oleyo says, \"which I said there would not be, and I apologise.\n\n\"I took the Ceyla system. Not a fleet — me, this ship, eleven weeks after Ivo Halloran took nine hundred and six people off Ceyla III in front of my sensors and told my government, without meaning to, that the Concord had nothing in this Reach.\n\n\"Forty-one thousand people on Ceyla II are Vaunt subjects now. They are not being mistreated. Their harvest was better last year than the year before. That is the arrangement, Commander: we are not cruel, we are simply *there*, and afterwards the argument is over.\"\n\nHe looks at his hands.\n\n\"Ivo Halloran is the most honest officer your service has produced in my lifetime, and he is on a station, and I took his system. I have wanted to say that to somebody in a Concord uniform for fourteen months.\"\n\n*set ceyla_known 2\n\n*choice\n  #\"He saved nine hundred and six people.\"\n    *set crew %+10\n    *set candor %+8\n    \"He did,\" Oleyo agrees. \"And he cost forty-one thousand their government, and both of those are his, and he has never once, in any transcript I have read, tried to put down either half of it.\" He looks up. \"Do you understand what I am telling you? I am not attacking him. I am telling you that he is carrying the whole thing, alone, on a station, and that nobody in your service will take any of it off him because taking any of it means admitting the rule did it.\"\n    *set oleyo %+8\n    *goto oleyo_close\n  #\"Then you should be thanking him, not me.\"\n    *set candor %+10\n    *set nerve %+6\n    \"I have written to him twice,\" Oleyo says. \"He has not replied. I did not expect him to and I will write again.\" He straightens his cuff, a gesture you have seen on a Concord delegate in a graving dock four months ago. \"It is not a taunt, Commander. There are eleven people alive in this service who understand what he did, and four of them are Vaunt, and that is a very lonely arithmetic for a man on a station.\"\n    *set oleyo %+10\n    *goto oleyo_close\n  #\"Sar Oleyo. Would you have evacuated Ceyla III?\"\n    *set candor %+14\n    *set rule %-6\n    The question stops him. It is the first time all day.\n\n    \"No,\" he says at last. \"Nine hundred and six against a system: the Weighing does not permit it and I would not have permitted it. I would have held position and observed, exactly as your Survey ordered him to, and I would have been right, and nine hundred and six people would be ash.\"\n\n    A pause.\n\n    \"I have thought about that a great deal, Commander, and I have not been able to make it stop being both of those things at once.\"\n    *set oleyo %+16\n    *goto oleyo_close\n  #\"I am not going to discuss a Concord officer with you.\"\n    *set candor %-12\n    *set rule %+12\n    *set oleyo %-10\n    \"No,\" Oleyo says. \"That is correct and I should not have raised it, and I am not sorry, and both of those are true.\" He stands. \"You are a more careful officer than the last one, Commander. I say that without any pleasure at all.\"\n    *goto oleyo_close\n\n*label oleyo_close\n*page_break\n\nAt the airlock — or on the screen, which is worse — Oleyo asks one more thing, and it is not what you expect.\n\n\"Your ship. *Perpetua.* We name ours for places. You name yours for people.\" He tilts his head. \"Who was she?\"\n\n*choice\n  #\"I do not know.\"\n    *set candor %+12\n    \"I do not know,\" you say. \"I have asked four people. Nobody aboard knows. She has been in commission for twenty-six years.\"\n\n    Oleyo takes this in with what looks, briefly and unmistakably, like distress.\n\n    \"Commander,\" he says, \"that is the single most Concord thing I have ever heard, and I want you to understand that I am not being clever. You carry the names of your dead on your hulls and you have stopped reading them.\" He puts his cap on. \"Find out. Do me the courtesy.\"\n    *set oleyo %+10\n    *goto ashaya_end\n  *if (plaque)\n    #Tell him.\n      *set candor %+8\n      *set rule %-4\n      You tell him: a woman who would not be moved, who was not consoled, and who did not stop; who died a very long time ago, in a way the Concord's founders thought worth carrying on a hull.\n\n      Oleyo listens to all of it without moving.\n\n      \"Thank you,\" he says. \"In the Vaunt we would have named a *place* for her, and it would have been forgotten in a century, and your way is better and I am not permitted to say so at home.\"\n      *set oleyo %+14\n      *goto ashaya_end\n  #\"Why do you want to know?\"\n    *set candor %-6\n    *set rule %+8\n    \"Because I am going to be opposite you for some time,\" Oleyo says, \"and I would rather know what is written on the thing that is opposite me.\" He puts his cap on. \"It is not intelligence, Commander. It is manners.\"\n    *set oleyo %-4\n    *goto ashaya_end\n\n*label ashaya_end\n*page_break\n\nThe *Ashaya* goes coreward at 1900 and is off your plot in under an hour, and the *Perpetua* turns for Marl with\n*if (salvage_saved = 12)\n  twelve\n*if (salvage_saved = 9)\n  nine\nsurvivors in the mess deck and a debris field astern.\n\n*if (tern_lost)\n  The *Tern* is a write-off in the number one bay with her nose folded, and Beye has been to look at her twice, and ${engname} has put a tarpaulin over the front of her because people kept stopping.\n  *if (sec = \"mott\")\n    On the third day Mott takes the tarpaulin off, and writes *TERN* on the *Kittiwake* in proper letters, and puts the tarpaulin back. Nobody asks her about it. It stops being funny and becomes something else.\n\n*choice\n  #Signal Concord Central. Full report, including everything Oleyo said.\n    *set candor %+14\n    *set rule %+6\n    *set standing %-4\n    You transmit all of it: the lane, the twelve, the arithmetic, the meeting, and every word Oleyo said about Ceyla and about Halloran, verbatim, with your own note that you believe he was telling the truth.\n\n    You are aware that a Concord delegate is going to read a Survey commander's assessment that a Vaunt captain was telling the truth, and that this will be filed, and that it will follow you.\n    *goto ashaya_last\n  #Signal Concord Central. The rescue only.\n    *set candor %-10\n    *set rule %+8\n    *set standing %+6\n    Position, casualties, survivors, disposition. Eleven hundred words about a shuttle lane and not one about a conversation.\n\n    It is complete, accurate, and airless, and it is exactly what the form asks for, and the form has never once asked for the only part of the day that mattered.\n    *goto ashaya_last\n  #Signal Central. And signal Tessine Station.\n    *set candor %+10\n    *set crew %+12\n    *set standing %-6\n    You file the report. Then you write a second signal, nine lines, to a harbour pilot on Tessine Station, and you tell him that a Vaunt officer said his name today with respect, and that you thought he should hear it from a Concord ship rather than not at all.\n\n    You do not expect an answer. You do not get one for four months.\n    *set halloran_regard %+12\n    *goto ashaya_last\n\n*label ashaya_last\n*page_break\n\nAt 0200 you go down to the mess deck, where twelve — or nine — people who no longer have a ship are asleep on the benches under Survey blankets.\n\n*if (crew > 62)\n  Somebody has moved the whiteboard so that the day count is not the first thing they see when they wake up. Nobody has told you who. You find out eleven weeks later, by accident, that it was Beye.\n  *set rel_sec %+4\n*if (crew <= 62)\n  The whiteboard still says the day count. Three hundred and eleven. It is the first thing they will see.\n\n*if (oleyo > 62)\n  On the board beside it, somebody has written *ASHAYA* and, under it, *29.* Just the number. Nobody has rubbed it out.\n*if (oleyo <= 62)\n  Somebody has written *VAUNT* on the board and drawn a line under it, and somebody else has written *29* beside it, and somebody has scrubbed at that and given up halfway.\n\nYou stand there for a while, and then you go up, and the number two coolant loop starts whistling again at 0340, which means the ship is cool, which means she is well.\n\n*finish\n", "articlenine": "*comment ==================== CHAPTER FIVE — ARTICLE NINE ====================\n*comment Rule vs Counsel bites hardest here. Guard's moment of glory: carry it\n*comment and the ship never learns. Budget: 12 tests, 15 choices.\n*comment Ledger: Sub-Lieutenant Toma Beye, 24, four years aboard, adored\n*comment Halloran. He has been transmitting the ship's daily log summary to\n*comment Tessine Station on an open band for four months. Halloran has never\n*comment replied. Beye knows that and has kept sending.\n\nIt comes to you on an ordinary Tuesday, in the middle of a stores audit, which is how these things always arrive.\n\n*if (sec = \"whitlow\")\n  Whitlow puts a single sheet of paper on your desk and stands there while you read it, having written nothing down until you finish, which is her whole method and is unbearable when it is aimed at you.\n*if (sec = \"oyelaran\")\n  Oyelaran asks for four minutes with the door shut, stands the entire time, and gives it to you in the order a Marine gives a contact report: what, when, who, and what he has done about it, which is nothing, pending your order.\n*if (sec = \"mott\")\n  Mott has to duck to come in. She says, \"There is a thing I have found which I do not want to have found,\" and then hands you a folder and waits, entirely still, for as long as it takes.\n\nThe comms log for the last four months has one hundred and nineteen entries that should not be there.\n\nThey are short. They go out at 0410, on an open band, from a maintenance channel that has no traffic on it, and they are addressed to a civilian receiver on Tessine Station. Each one carries the previous day's position, the ship's condition, and a summary of the master's log.\n\nThey are signed with a service number. The service number belongs to Sub-Lieutenant Toma Beye, twenty-four, four years aboard, who flew the *Tern* through a nine-metre lane at the *Corvine* and talked the whole way.\n\nThe receiver on Tessine Station is registered to I. Halloran.\n\n*page_break\n\n*comment ---------------- The first ten minutes ----------------\n\nNobody else knows. That will not be true for long, and how long is a decision you are making right now.\n\n*choice\n  #Seal it. Nobody sees this until I have.\n    *set rule %+12\n    *set candor %-10\n    *set rel_sec %-4\n    You seal the comms log under a master's hold, which you are entitled to do and which leaves a mark on the file that is visible forever to anybody who ever looks.\n\n    ${secname} accepts it without expression. \"Four hours or four days, Captain?\"\n\n    You do not have an answer, and ${secthey} does not ask twice.\n    *goto ninetwo\n  #Get ${xoname} in here now.\n    *set rule %-10\n    *set crew %+6\n    *set rel_xo %+10\n    You do not sit on it for eleven seconds. ${xoname} is in the cabin inside four minutes and reads the sheet twice.\n    *if (xo = \"marand\")\n      \"One hundred and nineteen counts,\" Marand says. \"Article Nine. Not eleven, not a lapse. One hundred and nineteen separate decisions on one hundred and nineteen mornings.\" She writes the time in her notebook. \"Whatever you do, Captain, do not let anybody tell you this was a young man being sentimental once.\"\n    *if (xo = \"ferreo\")\n      Ferreo goes pale, which you have not seen. \"Captain, in six weeks a Board is going to ask you when you knew. There is a very short list of correct answers and it starts at *immediately.*\"\n    *if (xo = \"tanaka\")\n      Tanaka-Osei reads it, puts it down, and says: \"Four months, on an open band, and he's the best flier on this ship. Which of those are we dealing with first?\"\n    *goto ninetwo\n  #Go and find Beye. Now, before anybody else does.\n    *set nerve %+12\n    *set rule %+6\n    *set crew %+8\n    You find him in the number two bay with his hands inside the *Kittiwake*'s port cluster, and you say, \"Mister Beye. My cabin. Now,\" in a corridor with four ratings in it, and every one of them knows within the minute.\n\n    It is not discreet. It is also, you decide on the walk up, the last chance anybody has to hear it from you rather than about you.\n    *set candor %+10\n    *set rel_sec %-4\n    *goto ninetwo\n\n*label ninetwo\n*page_break\n\n*comment ---------------- What is in them ----------------\n\nOne hundred and nineteen transmissions. You can read them or you can not read them, and the second is a real option, because reading a man's letters and then judging him is a particular kind of act.\n\n*choice\n  #Read all of them.\n    *set candor %+8\n    *set rule %+6\n    It takes two hours. They are not letters. That is the first surprise: there is no *dear sir*, no news, no self. They are logs. Position, condition, and what the master did, in a flat competent hand, one hundred and nineteen times.\n\n    The second surprise is in the entries themselves. *Captain took the window. Loop still whistling.* *Captain went in second party, forty metres.* *Captain gave the Fold the water plant and not the seed.* No comment. No opinion. Not once, in four months.\n\n    The third surprise is that no
