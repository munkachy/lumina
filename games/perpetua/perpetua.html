<title>Perpetua</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --lead:#05080d; --lead2:#0a0f16;
  --glass:#0d141d; --glass2:#141d29;
  --ink:#dce6ee; --ink2:#8ea2b4; --ink3:#5a6c7d;
  --amber:#e8a33d; --cobalt:#54bfd6; --ruby:#d9584f; --verd:#6fbf83; --violet:#9b8ade;
  --came:#01040a; --rule:#1c2733;
  --fs:19px; --col:34rem;
}
:root[data-theme="light"]{
  --lead:#dfe4e8; --lead2:#eaeef1;
  --glass:#f7f9fb; --glass2:#eaeff4;
  --ink:#10161d; --ink2:#465360; --ink3:#7e8b98;
  --amber:#8a5a08; --cobalt:#0f5a6b; --ruby:#8f2119; --verd:#215c31; --violet:#4d3f8a;
  --came:#141b23; --rule:#c3ccd4;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--lead); color:var(--ink);
  font-family:Spectral,Georgia,serif; font-size:var(--fs); line-height:1.75;
  -webkit-font-smoothing:antialiased; padding-bottom:5.4rem;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(84,191,214,.075), transparent 72%),
    radial-gradient(ellipse 50% 38% at 8% 42%, rgba(232,163,61,.045), transparent 70%),
    radial-gradient(ellipse 50% 38% at 92% 74%, rgba(155,138,222,.04), transparent 70%);
  background-attachment:fixed;
}
/* ---------- the bulkhead frame ---------- */
.frame{position:fixed;inset:0;z-index:45;pointer-events:none}
.frame::before{content:"";position:absolute;inset:0;
  border:7px solid var(--came);
  box-shadow:inset 0 0 0 1px rgba(84,191,214,.16), inset 0 0 70px rgba(0,0,0,.6)}
.frame::after{content:"";position:absolute;inset:7px;pointer-events:none;
  border-top:1px solid rgba(232,163,61,.13); border-bottom:1px solid rgba(232,163,61,.13)}

main{max-width:var(--col);margin:0 auto;padding:5.6rem 1.5rem 2rem;position:relative;z-index:1}

/* ---------- prose ---------- */
p{margin:0 0 1.2rem;text-wrap:pretty}
strong{font-weight:600;color:var(--amber)}
em{font-style:italic}
.hr{height:.55rem}
figure{margin:1.8rem 0}
figure img{width:100%;display:block}
.glazed{position:relative;border:1px solid var(--came);
  box-shadow:0 0 0 1px rgba(84,191,214,.20), 0 8px 30px rgba(0,0,0,.55)}
figure figcaption{font-family:"IBM Plex Mono",monospace;font-size:.63rem;letter-spacing:.16em;
  color:var(--ink3);margin-top:.6rem;text-transform:uppercase;text-align:center}
.imgph{aspect-ratio:3/2;background:
    linear-gradient(150deg,rgba(84,191,214,.13),rgba(232,163,61,.08) 45%,rgba(155,138,222,.11));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;
  padding:1.6rem;text-align:center;font-family:"IBM Plex Mono",monospace;
  font-size:.68rem;color:var(--ink2);line-height:1.8}
.imgph button{font-family:"IBM Plex Mono",monospace;font-size:.64rem;letter-spacing:.16em;
  text-transform:uppercase;background:rgba(0,0,0,.45);border:1px solid var(--amber);
  color:var(--amber);padding:.5rem 1rem;cursor:pointer}

/* ---------- choices : lit panels ---------- */
.choices{margin:2.4rem 0 1rem;display:flex;flex-direction:column;gap:.55rem}
button.opt{
  font-family:Spectral,Georgia,serif;font-size:1rem;line-height:1.55;text-align:left;
  color:var(--ink);border:1px solid var(--came);border-left:4px solid var(--cobalt);
  background:linear-gradient(100deg, rgba(84,191,214,.13), rgba(84,191,214,.03) 60%, transparent);
  padding:.9rem 1.15rem;cursor:pointer;position:relative;overflow:hidden;
  transition:box-shadow .18s, border-left-color .18s, transform .12s;
}
button.opt:nth-child(2){border-left-color:var(--ruby);
  background:linear-gradient(100deg, rgba(217,88,79,.13), rgba(217,88,79,.03) 60%, transparent)}
button.opt:nth-child(3){border-left-color:var(--amber);
  background:linear-gradient(100deg, rgba(232,163,61,.13), rgba(232,163,61,.03) 60%, transparent)}
button.opt:nth-child(4){border-left-color:var(--verd);
  background:linear-gradient(100deg, rgba(111,191,131,.13), rgba(111,191,131,.03) 60%, transparent)}
button.opt:nth-child(5){border-left-color:var(--violet);
  background:linear-gradient(100deg, rgba(155,138,222,.13), rgba(155,138,222,.03) 60%, transparent)}
button.opt:hover,button.opt:focus-visible{
  box-shadow:inset 0 0 42px -6px currentColor, 0 0 26px -10px var(--amber);
  outline:none;transform:translateX(2px)}
button.opt .delta{display:block;font-family:"IBM Plex Mono",monospace;font-size:.63rem;
  letter-spacing:.1em;color:var(--ink3);margin-top:.4rem}
button.cont{display:block;margin:2.4rem auto 0;font-family:"IBM Plex Mono",monospace;
  font-size:.66rem;letter-spacing:.28em;text-transform:uppercase;
  background:none;border:1px solid var(--rule);color:var(--ink2);
  padding:.68rem 2rem;cursor:pointer;transition:.18s}
button.cont:hover{border-color:var(--amber);color:var(--amber);
  box-shadow:0 0 24px -10px var(--amber)}

/* ---------- chrome ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:46;background:var(--lead);
  border-top:1px solid var(--came);box-shadow:0 -1px 0 rgba(84,191,214,.18);
  display:flex;gap:.1rem;padding:.45rem .6rem;justify-content:center;flex-wrap:wrap}
.bar button{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.16em;
  text-transform:uppercase;background:none;border:1px solid transparent;color:var(--ink3);
  padding:.5rem .72rem;cursor:pointer;transition:.15s}
.bar button:hover{color:var(--amber)}
.bar button.on{color:var(--amber);border-color:var(--amber)}
.crumb{position:fixed;top:0;left:0;right:0;z-index:46;background:var(--lead);
  border-bottom:1px solid var(--came);box-shadow:0 1px 0 rgba(84,191,214,.18);
  padding:.5rem 1.1rem;font-family:"IBM Plex Mono",monospace;font-size:.6rem;
  letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);
  display:flex;justify-content:space-between;gap:1rem}
.crumb b{color:var(--amber);font-weight:500}
.crumb .ed{color:var(--ruby)}

/* ---------- panels ---------- */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(27rem,100%);z-index:60;
  background:var(--lead2);border-left:1px solid var(--came);
  box-shadow:-1px 0 0 rgba(84,191,214,.2), -20px 0 60px rgba(0,0,0,.6);
  overflow-y:auto;padding:1.5rem 1.35rem 4rem;transform:translateX(101%);
  transition:transform .22s;font-family:"IBM Plex Sans",sans-serif;font-size:.9rem}
.panel.open{transform:none}
.panel h3{font-family:"IBM Plex Mono",monospace;font-size:.63rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink3);margin:1.7rem 0 .7rem;font-weight:400}
.panel h3:first-child{margin-top:0}
.panel .x{position:absolute;top:.7rem;right:1rem;background:none;border:none;
  color:var(--ink3);font-size:1.4rem;cursor:pointer;line-height:1}
.kv{display:flex;justify-content:space-between;padding:.42rem 0;border-bottom:1px solid var(--rule);
  font-family:"IBM Plex Mono",monospace;font-size:.74rem;color:var(--ink2)}
.kv span:last-child{color:var(--amber)}
.panel textarea{width:100%;min-height:8rem;background:var(--glass);color:var(--ink);
  border:1px solid var(--rule);padding:.65rem;font-family:Spectral,Georgia,serif;
  font-size:.95rem;line-height:1.6;resize:vertical}
.panel textarea.note{font-family:"IBM Plex Sans",sans-serif;font-size:.88rem;min-height:5.5rem}
.panel button.act{width:100%;padding:.62rem;margin-top:.5rem;background:var(--glass);
  border:1px solid var(--rule);color:var(--ink2);font-family:"IBM Plex Mono",monospace;
  font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
.panel button.act:hover{border-color:var(--amber);color:var(--amber)}
.panel button.act.prim{border-color:var(--amber);color:var(--amber)}
.jumps{display:flex;flex-direction:column;gap:1px}
.jumps button{text-align:left;background:var(--glass);border:none;border-left:3px solid var(--rule);
  color:var(--ink2);padding:.5rem .7rem;cursor:pointer;font-family:"IBM Plex Sans",sans-serif;
  font-size:.82rem;display:flex;justify-content:space-between;gap:.6rem}
.jumps button:hover{color:var(--amber);border-left-color:var(--amber)}
.jumps button b{font-family:"IBM Plex Mono",monospace;font-size:.64rem;color:var(--ink3);font-weight:400}
.noteitem{background:var(--glass);border-left:3px solid var(--ruby);padding:.55rem .75rem;
  font-size:.82rem;margin-bottom:.5rem;color:var(--ink2)}
.noteitem em{display:block;color:var(--ink3);font-size:.68rem;font-family:"IBM Plex Mono",monospace;
  margin-bottom:.28rem;font-style:normal;letter-spacing:.1em}

/* ---------- stat flash ---------- */
.flash{position:fixed;left:50%;top:2.7rem;transform:translateX(-50%);z-index:70;
  display:flex;flex-direction:row;flex-wrap:wrap;gap:.35rem;justify-content:center;
  pointer-events:none;opacity:0;transition:opacity .3s}
.flash.show{opacity:1}
.flash div{font-family:"IBM Plex Mono",monospace;font-size:.74rem;letter-spacing:.14em;
  text-transform:uppercase;padding:.32rem .8rem;background:var(--lead);
  border:1px solid currentColor;box-shadow:0 4px 18px rgba(0,0,0,.7);
  animation:rise .45s ease-out}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;bottom:4.6rem;left:50%;transform:translateX(-50%);z-index:70;
  background:var(--glass2);border:1px solid var(--amber);color:var(--amber);
  padding:.5rem 1rem;font-family:"IBM Plex Mono",monospace;font-size:.66rem;
  letter-spacing:.14em;text-transform:uppercase;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* ---------- edit affordances ---------- */
body.editing p{cursor:text;transition:box-shadow .12s}
body.editing p:hover{box-shadow:-.7rem 0 0 rgba(227,171,72,.10), .7rem 0 0 rgba(227,171,72,.10),
  0 0 0 .7rem rgba(227,171,72,.10)}
p.hasnote{border-right:2px solid var(--ruby);padding-right:.55rem}
p.edited{border-right:2px solid var(--verd);padding-right:.55rem}
p.stalenote{border-right:2px dashed var(--amber);padding-right:.55rem}
.backbtn{font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.16em;
  text-transform:uppercase;background:none;border:1px solid var(--rule);color:var(--ink3);
  padding:.35rem .75rem;cursor:pointer;margin-bottom:1.5rem}
.backbtn:hover{color:var(--amber);border-color:var(--amber)}

/* ---------- title ---------- */
.title{text-align:center;padding:2.5rem 0 1rem}
.title h1{font-size:clamp(3rem,13vw,5.2rem);margin:.6rem 0 0;font-weight:600;
  letter-spacing:-.025em;line-height:.92;
  background:linear-gradient(175deg,var(--amber),#f3d9a0 40%,var(--amber));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.title .sub{font-family:"IBM Plex Mono",monospace;font-size:.64rem;letter-spacing:.3em;
  text-transform:uppercase;color:var(--ink3);margin-top:1.3rem}
.title .tag{font-style:italic;color:var(--ink2);margin-top:1.5rem;font-size:1.05rem}
.rose{display:block;margin:0 auto}
@media(max-width:32rem){ main{padding-top:4.6rem} .arch{height:3.4rem} }
</style>

<div class="frame">
</div>
<div class="crumb"><span id="cwhere">—</span><span><span id="csync"></span> <span id="cedit"></span></span></div>
<main id="stage"></main>
<div class="bar" id="bar"></div>
<div class="panel" id="panel"><button class="x" onclick="closePanel()">&times;</button><div id="panelBody"></div></div>
<div class="toast" id="toast"></div>
<div class="flash" id="flash"></div>
<input type="file" id="pick" accept="image/*" style="display:none">

<script>
/* =================================================================
   Scriptorium engine — Perpetua
   ================================================================= */
const SCENES = {"__startup__": "*title Perpetua\n*subtitle A first command\n*author Scriptorium\n\n*scene_list\n  orders\n  coldreach\n  leastthatanswers\n  ashaya\n  articlenine\n  quietworld\n  salvage\n  theboard\n  halloran\n  theweighing\n  nadire\n  wrapup\n\n*comment ---------------- YOU ----------------\n*create name \"Rell\"\n*create pcthey \"she\"\n*create pcthem \"her\"\n*create pctheir \"her\"\n*create pcThey \"She\"\n*create background \"science\"\n*create why \"earned\"\n*create commissioned false\n\n*comment ---------------- THE FOUR LINES ----------------\n*comment Opposed pairs. High is the first name, low is the second. Neither end\n*comment is the good end; the Survey reads all four off your log either way.\n*comment nerve  : Nerve / Restraint  — you move, or you wait\n*comment candor : Candour / Guard    — you say it, or you keep it\n*comment crew   : Crew / Mission     — you protect your people, or you finish the job\n*comment rule   : Rule / Counsel     — you decide, or the room decides\n*create nerve 50\n*create candor 50\n*create crew 50\n*create rule 50\n\n*comment ---------------- THE WORLD ----------------\n*create standing 40\n*create strain 12\n*create oleyo 50\n*create met_oleyo false\n\n*comment ---------------- YOUR OFFICERS ----------------\n*create xo \"\"\n*create xoname \"—\"\n*create xothey \"she\"\n*create xothem \"her\"\n*create xotheir \"her\"\n*create xoThey \"She\"\n*create rel_xo 50\n\n*create eng \"\"\n*create engname \"—\"\n*create engthey \"she\"\n*create engthem \"her\"\n*create engtheir \"her\"\n*create engThey \"She\"\n*create rel_eng 50\n\n*create med \"\"\n*create medname \"—\"\n*create medthey \"she\"\n*create medthem \"her\"\n*create medtheir \"her\"\n*create medThey \"She\"\n*create rel_med 50\n\n*create sec \"\"\n*create secname \"—\"\n*create secthey \"she\"\n*create secthem \"her\"\n*create sectheir \"her\"\n*create secThey \"She\"\n*create rel_sec 50\n\n*create chap \"none\"\n*create chapname \"—\"\n*create chapthey \"he\"\n*create chapthem \"him\"\n*create chaptheir \"his\"\n*create chapThey \"He\"\n*create rel_chap 50\n\n*comment ---------------- WHAT HAS HAPPENED ----------------\n*create told_crew \"nothing\"\n*create halbard \"none\"\n*create sedge \"none\"\n*create sedge_dead 0\n*create sedge_open false\n*create kem_pc false\n*create kem_eng false\n*create kem_vol false\n*create kem_burn false\n*create kem_dead 0\n*create gave_cure false\n*create article_nine \"none\"\n*create kept_secret false\n*create quiet_named false\n*create salvage_saved 0\n*create board_verdict \"open\"\n*create board_candid false\n*create board_asked false\n*create ceyla_known 0\n*create met_halloran false\n*create halloran_regard 50\n*create nadire \"none\"\n*create nadire_saved 0\n*create plaque false\n*create tern_lost false\n*create ashaya_pc false\n*create ashaya_split false\n*create ashaya_canary false\n*create ashaya_venue \"none\"\n*create beye_alive true\n\n*comment ---------------- ACHIEVEMENTS ----------------\n*achievement plaque visible 25 Who She Was\n  Find out who the ship is named for.\n  Found out who she was, and that nobody had asked in twenty-six years.\n\n*achievement empty_berth visible 25 The Empty Berth\n  Sail without a chaplain, and be asked about it.\n  Sailed without one, and was asked, twice, by people who did not agree with each other.\n\n*achievement least visible 50 The Least That Answers\n  Give exactly what Standing Order Four permits, and no more.\n  Gave the least that answers. It answered.\n\n*achievement more visible 50 More Than Answers\n  Break Standing Order Four in front of a witness.\n  Broke it, in front of a witness, and wrote it in the log yourself.\n\n*achievement oleyo_respect visible 50 Sar Vehn Oleyo\n  Finish with the Vaunt captain's regard at 80 or above.\n  Was thanked, at the end, by a man who takes no pleasure in lying.\n\n*achievement whole_crew visible 100 All Hands\n  Reach the last chapter with every officer above 60.\n  Brought all five of them the whole way, and not one of them agreed with you throughout.\n\n*achievement nerve visible 50 Nerve\n  Finish with Nerve at 80 or above.\n  Finished a commander who moves first. It cost what it costs.\n\n*achievement restraint visible 50 Restraint\n  Finish with Restraint at 80 or above.\n  Finished a commander who waits. That cost something too.\n\n*achievement candour visible 50 Candour\n  Finish with Candour at 80 or above.\n  Never once said the useful thing instead of the true one.\n\n*achievement guard visible 50 Guard\n  Finish with Guard at 80 or above.\n  Carried what could not be shared, and did not put it down.\n\n*achievement crewfirst visible 50 Crew\n  Finish with Crew at 80 or above.\n  Brought them home. That was the whole job, in the end.\n\n*achievement missionfirst visible 50 Mission\n  Finish with Mission at 80 or above.\n  Finished the work. Someone always has to.\n\n*achievement ruler visible 50 Rule\n  Finish with Rule at 80 or above.\n  Decided. Alone, and on time, and in the dark.\n\n*achievement counsel visible 50 Counsel\n  Finish with Counsel at 80 or above.\n  Listened to the youngest person in the room, and was right to.\n\n*achievement halloran visible 100 Ivo Halloran\n  Reach the end knowing everything about Ceyla.\n  Learned all of it, including the part he does not say out loud.\n\n*achievement noone_lost hidden 100 Not One\n  ---\n  Some commanders come back with everybody.\n\n*goto_scene orders\n", "orders": "*comment ==================== CHAPTER ONE — ORDERS ====================\n*comment Establishing only. Nothing here is tested; everything here is set.\n*comment Ledger: Sarn Basin, third watch, four degrees. Halloran's name in\n*comment pencil on the particulars board. The ship is 26 years old, 112 berths.\n\nThe graving dock at Sarn Basin is kept at four degrees to save power, and your breath is going out in front of you in the gallery lights.\n\nThrough the glass she is eighty metres of scuffed grey and one long welded seam where somebody, years ago, put a hole in her and somebody else closed it. Two of her hull letters have been repainted and do not match. There is a scaffold up against her dorsal sensor block with nobody on it, because it is the third watch and the yard is asleep.\n\nCS *Perpetua*. Meridian class. Twenty-six years old. A hundred and twelve berths. Yours in nine hours.\n\nA dock hand goes past behind you pushing a cart with one bad wheel and does not look up. On the gallery wall there is a board with the ship's particulars stencilled on it, and a line at the bottom that reads MASTER: VACANT, and somebody has written a name over the blank in pencil and then rubbed most of it out again.\n\nYou can still read it. It says Halloran.\n\nFourteen months ago Ivo Halloran took this ship into the Ceyla system, disobeyed an order to hold and observe, and came out with nine hundred and six colonists in his cargo bays. The Survey held an inquiry. The inquiry did not publish a finding. Halloran retired at his own request, and the *Perpetua* has been in dock ever since, and now she is being given to you.\n\nYou have nine hours. You could spend them asleep in the transit hostel, like a sensible officer.\n\n*page_break\n\n*choice\n  #I want to walk her before there is anybody aboard to watch me do it.\n    *set rule %+12\n    *set candor %-8\n    You take the yard's freight lift down and go aboard through the cargo hatch, which is open because nothing on this ship is worth stealing.\n\n    She is dark and she smells of cold metal and old coffee. You go the length of her twice, forward and back, with a hand light. In the aft corridor the deck plating rings differently underfoot than everywhere else — a dead note, like knocking on a full box — and you stop and do it again, and then a third time, and you decide you will find out why later and you never quite do.\n\n    By the time the yard wakes up you know where every hatch is and which ones stick. Nobody knows you were aboard. You prefer it that way and you notice that you prefer it.\n    *goto named\n  #I want to read the last two years of her log tonight. All of it.\n    *set nerve %-12\n    *set crew %-8\n    The yard office gives you a reader and a chair in a room with a broken heater. Two years is four thousand pages and you do not finish, but you get far enough.\n\n    What you find is a ship that was run well. Halloran wrote short entries in a plain hand. Fuel, weather, repairs, a birthday. Twice a year he recorded that he had heard a grievance and settled it, and did not say what it was. The entries stop being short exactly once, in the Ceyla system, and then there are eleven pages, and then a gap of six days where nothing is written at all, and then the handwriting starts again and it is the same handwriting and it is not the same man.\n\n    At 0500 you put the reader down and rub your eyes and think: whatever else is true, he was not careless.\n    *goto named\n  #I want to find whoever is still awake in this yard and ask them what they make of her.\n    *set rule %-12\n    *set crew %+10\n    You find three of them in a heated shed at the foot of the dock, eating out of tins.\n\n    They are wary for about ninety seconds and then they are not, because you sit down on a crate and let them talk. What they tell you is this: the coolant loops are original and the number two loop whistles, and every yard in the Concord has tried to stop it whistling, and the correct thing to do is nothing. Her hull is thicker than the newer ships because they built her in a bad decade. And she has been sitting here fourteen months with her power off, which is worse for a ship than a war.\n\n    One of them, an old woman with burn scars up one forearm, says: \"You her new master?\" You say yes. She looks at you for a while and says, \"Well,\" and goes back to her tin, and you cannot tell whether that was a blessing.\n    *goto named\n\n*label named\n*page_break\n\nAt 0800 a Concord courier finds you and asks for your name to check against the commissioning order.\n\n*input_text name\n\nCommander ${name}. Thirty-four days ago you were a lieutenant commander with a competent record and no ship. There are two hundred and fourteen ships in the Survey and eleven worlds who argue about them, and one of the two hundred and fourteen is now yours.\n\n*choice\n  #She. That is how the record reads and how the crew will say it.\n    *set pcthey \"she\"\n    *set pcthem \"her\"\n    *set pctheir \"her\"\n    *set pcThey \"She\"\n    *goto adjo\n  #He. That is how the record reads and how the crew will say it.\n    *set pcthey \"he\"\n    *set pcthem \"him\"\n    *set pctheir \"his\"\n    *set pcThey \"He\"\n    *goto adjo\n  #They. The Survey has carried the form on its rolls for sixty years.\n    *set pcthey \"they\"\n    *set pcthem \"them\"\n    *set pctheir \"their\"\n    *set pcThey \"They\"\n    *goto adjo\n\n*label adjo\n*page_break\n\nCeron Adjo is the Concord's Delegate for the Cold Reach and he has come up from the surface in person, which is either an honour or a warning.\n\nHe is sixty, tired, beautifully dressed, and he does not sit down. He gives you a folder with a real paper cover because the Concord still does that for a first command, and inside it is one page.\n\n**CS PERPETUA. STANDING ORDERS.**\n**Patrol the Cold Reach. Three member colonies, eleven independent settlements, forty light years, no other Survey vessel within nine days of any of them. Chart what is uncharted. Answer what asks. Observe Standing Order Four.**\n**You are relieved of the requirement to seek confirmation before acting. There is nobody out there to confirm you.**\n\n\"That last line,\" Adjo says, \"is not a compliment. It is a description of the budget.\"\n\nHe looks through the gallery glass at your ship the way a man looks at a bill.\n\n*page_break\n\nThere is a thing you want to ask him and about nine hours until you stop being able to.\n\n*choice\n  #\"What actually happened at Ceyla?\"\n    *set candor %+15\n    *set standing %-4\n    Adjo does not blink. \"Nine hundred and six people are alive on Tessine Station who would otherwise be dead. Eleven weeks later the Vaunt annexed the Ceyla system, including forty-one thousand people on the second world, because Captain Halloran's ship was seen where it was not supposed to be and the Vaunt learned that the Concord had nothing out there.\"\n\n    \"And the inquiry?\"\n\n    \"The inquiry established the facts and published none of them.\" He straightens his cuff. \"Commander, I have been asked that question by better-connected people than you and I have given them a worse answer. Take the compliment.\"\n    *set ceyla_known 1\n    *goto why\n  #\"Why is the Reach unguarded? Really.\"\n    *set candor %+8\n    *set rule %-6\n    \"Because eleven worlds vote on where the ships go,\" Adjo says, \"and the Reach has one delegate, and that is me, and I am not very good at it.\"\n\n    He says it without self-pity, which is worse.\n\n    \"Ilium wants ships at Ilium. Sarn wants ships at Sarn. Every world in the Concord will tell you with total sincerity that it is defending the whole, and every one of them is defending itself, and the arithmetic of that is the Cold Reach. You are the arithmetic, Commander. Try not to take it personally.\"\n    *set standing %+3\n    *goto why\n  #\"What am I not being told?\"\n    *set candor %-6\n    *set rule %+8\n    Adjo turns and looks at you properly for the first time.\n\n    \"That is a better question than the one I expected.\" He thinks about it. \"You are not being told why you were chosen. You are not being told what the inquiry found. And you are not being told that the Vaunt have moved a cruiser into the Reach in the last five weeks, because that is in your folder on page two, which you have not read yet, because there is no page two.\" He almost smiles. \"There will be by the time you sail. Read it.\"\n    *set standing %+2\n    *goto why\n  #Nothing. I will find out in my own time.\n    *set candor %-14\n    *set nerve %-6\n    You say nothing, and Adjo waits three seconds longer than is comfortable, and then nods as though you have told him something.\n\n    \"Good,\" he says. \"The ones who ask everything at the dock stop asking in the field.\"\n\n    You cannot tell whether he means it or whether it is a thing he says.\n    *goto why\n\n*label why\n*page_break\n\nBefore he goes he says: \"You will be asked, at some point, why you were given this ship. It is worth deciding what you believe about that before somebody else decides for you.\"\n\n*choice\n  #Because I earned it.\n    *set why \"earned\"\n    *set standing %+6\n    *set nerve %+6\n    You have a good record. You have never lost anyone. You sat the board twice and the second time you were better than the man who passed. That is not arrogance; it is the file.\n    *goto background\n  #Because somebody owed somebody a favour.\n    *set why \"favour\"\n    *set standing %+3\n    *set candor %-8\n    You are not naive about how the Survey works. Eleven worlds, two hundred and fourteen ships, and every posting in the service is a sentence in a conversation between people who have known each other for forty years. You are somewhere in that sentence. You would like to know where.\n    *goto background\n  #Because nobody else wanted the Cold Reach.\n    *set why \"nobody\"\n    *set standing %-6\n    *set crew %+8\n    Nine days from help. A twenty-six-year-old hull. A crew that has been sitting in dock for over a year watching their careers go cold. If this posting were desirable it would not be yours, and you find that you do not much mind, and you file that away as something to watch in yourself.\n    *goto background\n  #Because they needed somebody who would not do what Halloran did.\n    *set why \"halloran\"\n    *set rule %+8\n    *set crew %-8\n    Somebody in the Survey looked at your file and saw an officer who follows orders. That is why the ship is yours. It is not flattering and it is probably true, and the crew of the *Perpetua* will work it out in about a week.\n    *goto background\n\n*label background\n*page_break\n\nAdjo goes. The dock begins to wake. At 1100 you will read yourself in on the quarterdeck in front of a hundred and twelve people, most of whom served under another master for nine years.\n\nBefore that, there is the small matter of who you are.\n\n*choice\n  #I came up through the science branch. I have never commanded in a fight.\n    *set background \"science\"\n    *set nerve %-14\n    *set rule %-10\n    *set candor %+6\n    Eleven years of survey work: spectrography, xenobiology, two seasons on an ice moon so cold the sampling rig had to be thawed with your hands. You have written forty-one papers and been shot at twice, both times by accident.\n\n    What you have is patience and a habit of not concluding early. What you do not have is the thing that happens to a person the first time they give an order that kills somebody.\n    *goto motive\n  #I was a line officer in the Border Patrol. I have.\n    *set background \"line\"\n    *set nerve %+16\n    *set rule %+10\n    *set crew %+4\n    Six years on the Sarn frontier in ships smaller than this one. You have boarded, been boarded, and buried four people, and you know exactly what your voice sounds like when you are frightened, because you have heard the recordings.\n\n    What you have is the ability to decide in the four seconds available. What you do not have is much practice at the other thing, the long thing, where nobody is shooting and you have to be right anyway.\n    *goto motive\n  #I was seconded to the Concord's diplomatic service for six years.\n    *set background \"diplomatic\"\n    *set candor %-16\n    *set rule %-6\n    *set standing %+5\n    Six years in rooms where nothing was said and everything was decided. You have sat at four treaty tables and drafted the language for two of them, and you know that a sentence can be a weapon and that the most dangerous person present is usually the one being pleasant.\n\n    What you have is the ear for it. What you do not have is any illusion left about how the Concord actually holds together, which is: barely, and by people agreeing to pretend.\n    *goto motive\n\n*label motive\n*page_break\n\n*comment ---------------- Halloran's cabin ----------------\n\nThe master's cabin is three metres by four with a bunk, a desk bolted to the deck, and a viewport. Halloran left it clean. He also left it not quite empty.\n\nOn the shelf above the desk there is a row of paper books, worn, none of them regulations. In the desk drawer there is a folded chart of the Ceyla system with pencil on it. And screwed to the bulkhead over the bunk, where you cannot miss it lying down, there is a small brass plate that says: *THE LEAST THAT ANSWERS.*\n\nSomebody was supposed to clear this out fourteen months ago and did not.\n\n*choice\n  #Box it all up and send it on to him. It is his.\n    *set crew %+10\n    *set candor %+6\n    You find a crate. It takes eleven minutes. You write the shipping label yourself — *I. Halloran, Tessine Station* — and when you carry it down to the cargo hatch three separate people see you doing it and nobody says a word, and by 1030 the whole ship knows.\n\n    You have no idea yet whether that was good or bad. You will find out.\n    *set rel_xo %+6\n    *goto crewpick\n  #Leave the books. Take down the brass plate.\n    *set rule %+12\n    *set nerve %+6\n    The books can stay; a ship should have books. The plate comes off with a coin.\n\n    You hold it a moment. *The least that answers.* It is the second sentence of Standing Order Four and it is the sentence that ended his career, and he screwed it to the wall where he would read it every night of nine years.\n\n    You put it in the drawer, face down, and you shut the drawer, and you do not throw it away.\n    *goto crewpick\n  #Leave everything exactly where it is.\n    *set nerve %-10\n    *set candor %-8\n    You leave the books. You leave the chart. You leave the plate on the bulkhead.\n\n    That night, and for a long time afterwards, the last thing you see before the lights go down is four words in brass, twenty centimetres from your face.\n    *set plaque true\n    *goto crewpick\n\n*label crewpick\n*page_break\n\n*comment ---------------- The senior staff ----------------\n\nAt 0900 the ship's yeoman brings you the personnel slate on a reader and then stands there, because nobody has told her whether she is supposed to leave.\n\nA Meridian carries five senior posts. All five are vacant: when a master goes, the Survey scatters the wardroom, partly for good reasons and partly because it is easier than deciding which of them agreed with him. What you have instead is a candidate list — officers available in this yard, this week, who can be aboard by 1400.\n\nYou get to choose them. Almost nobody in the Survey gets to choose them.\n\n\"Yeoman,\" you say. \"Sit down. You are going to be here a while.\"\n\n*page_break\n\n**FIRST OFFICER.** Three names.\n\n*choice\n  #Lieutenant Commander Elu Marand. Fifty-one. Passed over three times.\n    *set xo \"marand\"\n    *set xoname \"Marand\"\n    *set xothey \"she\"\n    *set xothem \"her\"\n    *set xotheir \"her\"\n    *set xoThey \"She\"\n    *set rel_xo 42\n    *set rule %-6\n    Her record is faultless and she has never been given a ship, and one of the three boards that turned her down was chaired by a man she had reported for falsifying a fuel return. She wanted the *Perpetua*. She was not offered it. She has accepted the first officer's berth within forty minutes of being asked.\n\n    When she comes aboard at 1350 she is carrying a paper notebook, and for the next year every order you give her will go into it in her own handwriting, with the time.\n    *goto engpick\n  #Lieutenant Ilya Ferreo. Thirty-four. The Survey's favourite.\n    *set xo \"ferreo\"\n    *set xoname \"Ferreo\"\n    *set xothey \"he\"\n    *set xothem \"him\"\n    *set xotheir \"his\"\n    *set xoThey \"He\"\n    *set rel_xo 62\n    *set standing %+8\n    *set candor %-6\n    Son of a Concord delegate, top of his year, and genuinely charming in the way that is not a trick — he likes people and they can tell. Every commodore in the Survey knows his first name. He has turned down two better postings to come out to the Reach, which either means he is serious or means somebody told him it would look good.\n\n    Within a day of coming aboard he knows the name of every rating on the ship, and their mothers' names, and he is not pretending.\n    *goto engpick\n  #Lieutenant Commander Bel Tanaka-Osei. Forty-three. Twelve years hauling cargo before the Survey took her.\n    *set xo \"tanaka\"\n    *set xoname \"Tanaka-Osei\"\n    *set xothey \"she\"\n    *set xothem \"her\"\n    *set xotheir \"her\"\n    *set xoThey \"She\"\n    *set rel_xo 55\n    *set crew %+8\n    *set standing %-4\n    She came into the Survey at thirty-one from the independent trade, which the Survey does not often do and does not often admit works. Her efficiency reports are a war between two kinds of officer: the ones who write *outstanding* and the ones who write *does not appear to have read the regulation.*\n\n    She eats standing up, always, at any hour, and she will offer you half of whatever it is, and it is rude to refuse.\n    *goto engpick\n\n*label engpick\n*page_break\n\n**CHIEF ENGINEER.** The number two coolant loop whistles. Somebody is going to have to live with that.\n\n*choice\n  #Warrant Officer Wen Osimo. Sixty-three. Nineteen years aboard this ship.\n    *set eng \"osimo\"\n    *set engname \"Osimo\"\n    *set engthey \"he\"\n    *set engthem \"him\"\n    *set engtheir \"his\"\n    *set engThey \"He\"\n    *set rel_eng 58\n    *set crew %+6\n    He has been aboard the *Perpetua* longer than anyone alive, through three masters, and he spent the fourteen months of the layup coming up to the dock on his own time to run her generators for an hour a week so her lines would not seize. Nobody asked him to. Nobody paid him.\n\n    He calls the ship *she* and the crew *the passengers*. He is not joking and it is not entirely a joke.\n    *goto medpick\n  #Lieutenant Priya Kallas. Twenty-nine. Brilliant, and knows the number.\n    *set eng \"kallas\"\n    *set engname \"Kallas\"\n    *set engthey \"she\"\n    *set engthem \"her\"\n    *set engtheir \"her\"\n    *set engThey \"She\"\n    *set rel_eng 50\n    *set nerve %+8\n    Two commendations and one formal reprimand, all three for the same incident. She will get you a miracle at 0300 and then explain to you, at length, in front of witnesses, the seven decisions that made the miracle necessary.\n\n    She talks faster when she is frightened. By the end of the year you will be able to tell how bad it is by her syllables per second and nothing else.\n    *goto medpick\n  #Lieutenant Anselm Dorr. Forty-four. Eight years in the Concord. Born in the Vaunt.\n    *set eng \"dorr\"\n    *set engname \"Dorr\"\n    *set engthey \"he\"\n    *set engthem \"him\"\n    *set engtheir \"his\"\n    *set engThey \"He\"\n    *set rel_eng 48\n    *set oleyo %-8\n    He is the best engineer on the list and it is not close. He is also a Vaunt defector with a Concord passport, and the Vaunt do not recognise the concept, and every conversation you ever have with a Vaunt officer will be conducted across the fact of him.\n\n    He apologises before he disagrees with you. *I am sorry — no.* You will come to hate the apology and rely absolutely on the *no*.\n    *goto medpick\n\n*label medpick\n*page_break\n\n**SHIP'S SURGEON.** Nine beds and no hospital inside nine days.\n\n*choice\n  #Surgeon Commander Hadiya Nour. Fifty-eight. Ilium famine relief.\n    *set med \"nour\"\n    *set medname \"Nour\"\n    *set medthey \"she\"\n    *set medthem \"her\"\n    *set medtheir \"her\"\n    *set medThey \"She\"\n    *set rel_med 52\n    *set crew %-4\n    *set standing %+4\n    Four years of field surgery in the Ilium camps, where at the worst of it she was signing off on who got treated by walking down a line of people and pointing. She does not talk about it and she does not pretend it did not happen.\n\n    She asks a patient's name twice — once at the start and once at the end. Ask her why and she will tell you it is a check on the anaesthetic. It is not.\n    *goto secpick\n  #Lieutenant Kip Sorrel. Thirty-one. Everybody's confessor.\n    *set med \"sorrel\"\n    *set medname \"Sorrel\"\n    *set medthey \"he\"\n    *set medthem \"him\"\n    *set medtheir \"his\"\n    *set medThey \"He\"\n    *set rel_med 66\n    *set crew %+8\n    Competent, not exceptional, and the best-liked officer you will ever have. People tell him things. Within a month he will know more about the state of your ship than you do, and he will not tell you any of it, and he will be right not to.\n\n    He remembers birthdays. The whole ship knows he remembers birthdays, which ruins the surprise and does not reduce the effect at all.\n    *goto secpick\n  #Surgeon Lieutenant Commander Teodor Vasi. Forty-nine. A researcher.\n    *set med \"vasi\"\n    *set medname \"Vasi\"\n    *set medthey \"he\"\n    *set medthem \"him\"\n    *set medtheir \"his\"\n    *set medThey \"He\"\n    *set rel_med 44\n    *set standing %+6\n    *set crew %-8\n    He took the berth for the samples. He says so in the interview, unprompted, as though it would be strange to pretend otherwise. Fifty-one published papers, two of which changed how the Concord treats burns.\n\n    He narrates his own work aloud while he does it, for the record, in a level voice. In an emergency this is the calmest sound on the ship, and afterwards, when you play the recording back, it is the worst.\n    *goto secpick\n\n*label secpick\n*page_break\n\n**SECURITY AND TACTICAL.** A survey ship is not a warship. It has four guns.\n\n*choice\n  #Lieutenant Rennick Oyelaran. Forty. Concord Marines, eleven years.\n    *set sec \"oyelaran\"\n    *set secname \"Oyelaran\"\n    *set secthey \"he\"\n    *set secthem \"him\"\n    *set sectheir \"his\"\n    *set secThey \"He\"\n    *set rel_sec 50\n    *set nerve %+6\n    He left the Marines for the Survey and he has an argument about it that he will make to anyone: that the Survey is a navy which lies to itself about what it is, and that the lie gets people killed at a rate the Concord does not publish. He is not bitter. He thinks he is being useful.\n\n    He stands when you enter a compartment. Every time. You will ask him to stop and he will say *ma'am* or *sir* or *Captain* and go on doing it.\n    *goto chappick\n  #Lieutenant Sena Whitlow. Thirty-seven. A civil investigator, not a soldier.\n    *set sec \"whitlow\"\n    *set secname \"Whitlow\"\n    *set secthey \"she\"\n    *set secthem \"her\"\n    *set sectheir \"her\"\n    *set secThey \"She\"\n    *set rel_sec 50\n    *set nerve %-8\n    *set rule %-6\n    Nine years in the Sarn magistracy investigating fraud and two homicides, then the Survey, because the Survey needed somebody who could tell whether a settlement's books were honest. She can shoot. She would rather establish what happened.\n\n    She writes nothing down while you are talking. She waits until you have completely finished, including the part you add after you think you have finished, and then she writes.\n    *goto chappick\n  #Master-at-Arms Mott. A Karsk. She will not end a life.\n    *set sec \"mott\"\n    *set secname \"Mott\"\n    *set secthey \"she\"\n    *set secthem \"her\"\n    *set sectheir \"her\"\n    *set secThey \"She\"\n    *set rel_sec 54\n    *set crew %+6\n    *set nerve %-4\n    Two and a half metres, grey, and slow to speak in any of the four languages she has. The Karsk have been in the Concord for sixty years and there are fewer than nine hundred of them in the Survey, and every one of them is under a vow that they do not explain and do not break: they will not end a life.\n\n    She names things. The corridors have names on her deck plan. The shuttles have names she gave them that are not the names painted on them. You will find out what she calls you and it will take you a week to decide how you feel about it.\n    *goto chappick\n\n*label chappick\n*page_break\n\n**CHAPLAIN.** A Meridian carries the berth. It does not require you to fill it.\n\nThe compartment is on the second deck, aft of the laboratory, and it was a scanner bay until somebody cut a door in the other side of it. There are eighteen seats. Halloran filled the berth for nine years. Roughly a third of the Survey's masters do not fill it at all, and the Concord does not ask why, because on four of the eleven worlds the question would start an argument that took a generation to finish.\n\n*choice\n  #Father Tobias Wren. Forty-seven. Mass at 0600 in the old scanner bay.\n    *set chap \"wren\"\n    *set chapname \"Wren\"\n    *set chapthey \"he\"\n    *set chapthem \"him\"\n    *set chaptheir \"his\"\n    *set chapThey \"He\"\n    *set rel_chap 50\n    A parish on Sarn for eleven years and then the Survey, which he asked for twice. He is not what you expected. He is quiet, badly shaved, and interested in the ship's water reclamation to a degree that seems excessive until you understand that he is going to be aboard for a year and intends to be useful.\n\n    He will not tell you what to do. You will discover this the hard way, at about the worst possible moment, when you ask him what to do and he says nothing for eleven seconds and then asks you a question instead.\n    *goto readin\n  #Sister Adaeze Onu. Fifty-five. A nursing order. Not a priest.\n    *set chap \"onu\"\n    *set chapname \"Onu\"\n    *set chapthey \"she\"\n    *set chapthem \"her\"\n    *set chaptheir \"her\"\n    *set chapThey \"She\"\n    *set rel_chap 50\n    *set crew %+6\n    Thirty years in her order's hospitals, the last nine of them on ships. She holds a Concord medical qualification and will stand a watch in sickbay, which makes her the only officer on the list who is two people for the price of one.\n\n    She works while she talks, always — folding, sorting, checking a line, moving. She will never sit down before you do, and she will never fail to notice that you have not eaten.\n    *goto readin\n  #Counsellor Loman Serat. Thirty-eight. Survey psychological corps.\n    *set chap \"serat\"\n    *set chapname \"Serat\"\n    *set chapthey \"he\"\n    *set chapthem \"him\"\n    *set chaptheir \"his\"\n    *set chapThey \"He\"\n    *set rel_chap 50\n    *set standing %+4\n    The modern answer, and a good one: fourteen years of shipboard practice, a specialism in isolated postings, and hard numbers behind him — crews with a counsellor aboard lose fewer people to the long dark than crews without.\n\n    He has a habit of saying back to you what you just said, slightly improved. It is disarming for a month. After that you will start listening for the improvement.\n    *goto readin\n  #Nobody. The berth stays empty and the compartment stays a scanner bay.\n    *set chap \"none\"\n    *set chapname \"—\"\n    *set rule %+8\n    *set standing %-3\n    You have a hundred and twelve berths and forty light years and a ship that has been cold for fourteen months, and you would rather have another sensor technician.\n\n    The yeoman does not react. She enters it, and then she says, without looking up: \"Captain Halloran kept it filled,\" and then she keeps typing, and you understand that this is the first thing anyone aboard has said to you about Halloran and it will not be the last.\n    *goto readin\n\n*label readin\n*page_break\n\n*comment ---------------- Reading in ----------------\n\nAt 1100 you stand on the quarterdeck of your own ship and read the commissioning order aloud to a hundred and twelve people who are standing very straight and have been at sea longer than you have.\n\nIt takes ninety seconds. The words are two hundred years old and most of them are about the Concord and none of them are about you. At the end you say *I relieve you* to a duty officer you have never met, and she says *I stand relieved*, and that is all there is to it. There is no music. Nobody claps. Somebody at the back coughs.\n\nThen a hundred and twelve people look at you, and it is 1101, and the rest is yours.\n\n*page_break\n\nBehind you, on the bulkhead in the corridor outside the bridge, there is a brass plaque the size of a book. Every Survey ship has one. It carries the name and one line about the person the name belongs to.\n\n**PERPETUA** — *She would not be moved, and she was not consoled, and she did not stop.*\n\n*choice\n  #Ask, right now, in front of everyone, who she was.\n    *set candor %+10\n    *set rule %-6\n    You turn around and ask.\n\n    A hundred and twelve people look at each other. Nobody knows. The ship has been in commission for twenty-six years and it turns out that this is not the kind of thing anybody asks, and now that you have asked it, everyone would like to know, and it is going to be a while before anybody finds out.\n    *if (chap != \"none\")\n      In the second rank, ${chapname} opens ${chaptheir} mouth and then closes it again. Not here. Not in front of the ship.\n      *set rel_chap %+6\n    *goto firstorder\n  #Read it, and say nothing, and find out later.\n    *set candor %-8\n    *set rule %+4\n    You read it twice and go on to the bridge.\n\n    It stays with you the way a line of verse stays with you, coming back at bad hours in the wrong order. *She did not stop.* You do not know who she was. There is no reason a ship's name should mean anything at all, and yet.\n    *goto firstorder\n  #It is a plaque. There is a ship to take out.\n    *set nerve %+8\n    *set candor %-6\n    Two hundred and fourteen ships, two hundred and fourteen plaques, most of them commemorating somebody who died in the Fracture for a reason that made sense at the time. You have a coolant loop that whistles and a Vaunt cruiser somewhere in your patrol area.\n\n    You go to the bridge.\n    *goto firstorder\n\n*label firstorder\n*page_break\n\n*comment ---------------- The first order ----------------\n\nThe bridge of a Meridian is nine metres across and everyone in it can hear everything anybody says, which is the single most important fact about commanding one.\n\nYour helmsman is a Sub-Lieutenant named Toma Beye, twenty-four, four years aboard, and he is the only officer on the bridge who served with Halloran. He has the departure plot up and he is waiting.\n\n${xoname} is at your left shoulder with the readiness board. Eleven items green. One amber: the number two coolant loop, which whistles, and which every yard in the Concord has failed to fix, and which the correct procedure is to ignore.\n\n\"Yard control has us in the window for another twenty-two minutes,\" ${xoname} says. \"After that we wait six hours for the next one.\"\n\n*choice\n  #Take her out now. The loop whistles. Let it whistle.\n    *set nerve %+12\n    *set rule %+6\n    \"Now, Mister Beye.\"\n\n    Beye takes her out of the graving dock at Sarn Basin at eleven minutes past noon, and he does it beautifully, and the number two coolant loop whistles all the way, a thin clean note somewhere under the deck, exactly the pitch of a kettle. Half the bridge hears it. Nobody says anything.\n    *if (eng = \"osimo\")\n      Two decks down, Osimo puts his hand flat on the housing the way you would put your hand on a horse.\n      *set rel_eng %+5\n    *goto address\n  #Hold the window. I want the loop looked at before we are nine days from a yard.\n    *set nerve %-12\n    *set rule %-4\n    *set strain -4\n    \"We will take the six hours.\"\n\n    You watch ${xoname} decide what to write. Beye's shoulders come down half a centimetre. In the six hours ${engname} pulls the housing, finds nothing, replaces two seals that did not need replacing, and reports that the loop is in better condition than it has any right to be and will go on whistling until the ship is broken up.\n\n    You take her out at 1815 and it whistles.\n    *set rel_eng %+8\n    *goto address\n  #Ask ${xoname} what ${xothey} would do.\n    *set rule %-14\n    *set crew %+6\n    You ask. On your first day, on your own bridge, in front of the helmsman.\n\n    ${xoname} does not hesitate. \"Take the window, Captain. The loop has whistled for twenty-six years, and a ship that misses her first departure window gets a name for it inside a week.\"\n\n    \"Then take the window, Mister Beye.\"\n    *set rel_xo %+10\n    *if (xo = \"marand\")\n      Marand writes it down. The time, the question, and the answer. You will see the page a year from now and it will not say what you expect.\n    *goto address\n\n*label address\n*page_break\n\n*comment ---------------- The address ----------------\n\nThree hours out from Sarn Basin, with the world gone to a blue thumbprint astern and forty light years of thin badly charted nothing ahead, you take the intercom.\n\nA hundred and twelve people stop what they are doing. This is the one they will remember. Halloran's, nine years ago, is still quoted on the mess deck; you have heard it twice already today, and it was four sentences long and one of them was a joke.\n\n*choice\n  #Tell them the truth about where they are going and how little help there is.\n    *set candor %+15\n    *set crew %+6\n    \"This is the Captain. We are going to the Cold Reach. There are three member colonies and eleven independent settlements out there and no other Survey ship within nine days of any of them, which means that when somebody out there is in trouble, the answer is this ship or there is no answer.\n\n    \"I am not going to tell you that is an honour. It is arithmetic. Eleven worlds voted and this is what was left over.\n\n    \"But it does mean that everything we do for the next year, we do because we did it, and not because somebody signed it. I have never had that before. Neither have most of you. Carry on.\"\n    *set told_crew \"truth\"\n    *goto endch1\n  #Tell them about Halloran.\n    *set candor %+10\n    *set crew %+10\n    *set standing %-5\n    \"This is the Captain. There is a name on this ship that nobody has said out loud since I came aboard, so I am going to say it. Ivo Halloran had this bridge for nine years. Some of you would follow him through a wall. Some of you would not. Both of those are allowed on my ship.\n\n    \"What is not allowed is pretending he never existed. Fourteen months of that is enough. Say his name in the mess if you want to. I have nothing to prove against a man who is not here.\n\n    \"Carry on.\"\n\n    Later, ${xoname} tells you that the mess deck was completely silent for four seconds and then somebody laughed, once, with relief, and that you will never know who or why, and that it was the best thing that could have happened.\n    *set told_crew \"halloran\"\n    *set rel_xo %+8\n    *goto endch1\n  #Keep it short, correct, and about the work.\n    *set candor %-12\n    *set rule %+6\n    \"This is the Captain. We are bound for the Cold Reach on a twelve-month patrol. Watch bill is posted. Departmental readiness reports to the first officer by 2000 daily. I will walk the ship at irregular hours and I would rather find things wrong than be told they are right.\n\n    \"Carry on.\"\n\n    Forty seconds. On the mess deck somebody says, *Well, that's that,* and gets back to work, which is exactly the effect you wanted and slightly less than you hoped.\n    *set told_crew \"short\"\n    *goto endch1\n  #Say nothing yet. Let them wonder for a week.\n    *set candor %-18\n    *set nerve %-6\n    *set rule %+10\n    You put the handset back in its clip.\n\n    ${xoname} looks at you. You look at the plot. Forty light years of thin badly charted nothing.\n\n    On the mess deck, at 1900, a hundred and twelve people work out that there is not going to be an address, and begin — without malice, and with enormous energy — to make one up.\n    *set told_crew \"silence\"\n    *set standing %-4\n    *goto endch1\n\n*label endch1\n*page_break\n\n*set commissioned true\n\nAt 2200 you are in the master's cabin, three metres by four, with a viewport and a desk bolted to the deck.\n\n*if (plaque)\n  Above the bunk there is a small brass plate that says *THE LEAST THAT ANSWERS*, twenty centimetres from your face.\n*if (chap != \"none\")\n  Somewhere aft, on the second deck, in a compartment that used to be a scanner bay, ${chapname} is finding out where the light switches are.\n*if (chap = \"none\")\n  Somewhere aft, on the second deck, there is a compartment with eighteen seats in it and nobody's name on the door.\n\nUnder the deck, faintly, the number two coolant loop is whistling.\n\nYou have a ship.\n\n*finish\n", "coldreach": "*comment ==================== CHAPTER TWO — THE COLD REACH ====================\n*comment First tests. Every officer speaks. Halloran is raised out loud for the\n*comment first time by somebody who is not aboard. Budget: 8 tests.\n*comment Ledger: Halbard's Rest, independent, pop. 340, ice mine, nine days from Sarn.\n*comment Administrator Wesse Ambrit, 19 years in post. The child is Ondra Vek, nine.\n\nNine days out, and the ship has stopped being a place you are visiting.\n\nYou know now that the number two coolant loop whistles at exactly the pitch of a kettle, and that after four days you stop hearing it and after seven you start hearing it again, worse. You know that the aft corridor rings dead underfoot and that nobody can tell you why. You know that the third watch smells of burnt coffee because somebody on the third watch cannot make coffee, and that finding out who would be a misuse of your authority.\n\nYou have walked the ship at 0300 twice. Both times somebody was already awake and doing something reasonable, which is either an excellent sign or evidence that word travels.\n\nAhead, at the end of the leg, is Halbard: a grey moon around a gas giant nobody has bothered to name properly, with three hundred and forty people living in an ice mine on the terminator, and a mail bag for them in your hold.\n\n*page_break\n\n*comment ---------------- The wardroom ----------------\n\nOn the eighth night you eat with your officers.\n\nThe *Perpetua*'s wardroom seats ten and there are six of you, and the table is bolted down and slightly too small, so everybody's elbows are in the conversation whether they want to be or not.\n\n*if (eng = \"osimo\")\n  Osimo has come up from the engine spaces in a clean shirt and looks wrong in it. He eats fast and says nothing for twenty minutes.\n*if (eng = \"kallas\")\n  Kallas is nineteen minutes late and arrives mid-sentence, already explaining something about a valve to nobody in particular.\n*if (eng = \"dorr\")\n  Dorr sits down last, which you will learn is deliberate: he wants to know where everybody else is before he chooses.\n\n*if (med = \"nour\")\n  Nour eats like a soldier, quickly and completely, and then sits back and watches the table.\n*if (med = \"sorrel\")\n  Sorrel has brought something. It turns out to be a cake, badly made, for the yeoman, whose birthday it is, and which nobody else knew.\n*if (med = \"vasi\")\n  Vasi has brought a sample jar to the table and set it down beside the salt without appearing to notice that he has done it.\n\n*if (sec = \"oyelaran\")\n  Oyelaran stands when you come in. Everyone else is already halfway up and now has to commit.\n*if (sec = \"whitlow\")\n  Whitlow is already there, at the far end, back to the bulkhead, and has been for a while.\n*if (sec = \"mott\")\n  Mott has taken the deck at the end of the table instead of a chair, because the chairs were not built for a Karsk, and she does this without a word and with enormous dignity.\n\n*if (chap = \"none\")\n  There is an empty chair. Nobody has moved it. On a Meridian the chaplain sits at the foot of the table opposite the master, and the chair is at the foot of the table, and it is empty, and everybody has noticed, and nobody is going to mention it on the first night.\n*if (chap != \"none\")\n  ${chapname} sits at the foot of the table, opposite you, which is where the chaplain sits on a Meridian and has since before either of you was born.\n\n*page_break\n\nThe talk is about nothing: the food, the whistle, a rating who has taught a hull-inspection drone to follow him down corridors. ${xoname} keeps it moving.\n\nThen, over the second course, somebody says the name.\n\n*if (xo = \"ferreo\")\n  It is Ferreo, of course, because Ferreo has decided that the sooner it is said the sooner it stops being a thing, and he says it lightly and on purpose. \"Halbard's Rest. Captain Halloran had a standing arrangement there, apparently. They send him ice wine. There are four bottles in the number three locker addressed to him.\"\n*if (xo = \"marand\")\n  It is Marand, flatly, off a list. \"Halbard's Rest. Note that Captain Halloran had a standing arrangement there. There are four bottles of ice wine in the number three locker addressed to him, and I require a decision on them.\"\n*if (xo = \"tanaka\")\n  It is Tanaka-Osei, with her fork in the air. \"So nobody's going to say it. There's four bottles of ice wine in the number three locker with Halloran's name on them and we make orbit in twenty hours.\"\n\nThe table goes quiet in the particular way a table goes quiet when everyone has been thinking about the same thing for eight days.\n\n*choice\n  #\"Then we deliver them to him. Log them, hold them. They are not ours.\"\n    *set candor %+8\n    *set crew %+6\n    *set rel_xo %+5\n    \"They were sent to a man, not to a berth. Log them, hold them, and they go to Tessine Station on the next mail leg.\"\n\n    *if (xo = \"marand\")\n      Marand writes it down: time, order, and a small mark in the margin that you do not understand and are not shown.\n    *if (xo = \"ferreo\")\n      \"That,\" says Ferreo, \"will be repeated in the mess by 2300, and it will do you a great deal of good, and I want it on the record that I am saying so out loud instead of letting you think it was an accident.\"\n    *if (xo = \"tanaka\")\n      Tanaka-Osei nods once and goes back to her plate. \"Right answer. Cheap, too.\" She says the second part with her mouth full and it is not a criticism.\n    *goto halbard_approach\n  #\"We drink them. He is not coming back for them.\"\n    *set nerve %+10\n    *set candor %+6\n    *set crew %+8\n    *set rel_xo %-4\n    \"Open one tonight and put the other three in the mess for the ratings. He is not coming back for them, and a ship that keeps a dead man's wine in a locker is a ship that is waiting for something.\"\n\n    Somebody exhales. Somebody else looks at the table. But the bottle is opened, and it is genuinely very good, and by 2300 there are three bottles on the mess deck and a hundred and twelve people arguing about whether you did that because you are clever or because you meant it.\n\n    Both, probably. You are not certain yourself.\n    *goto halbard_approach\n  #\"They stay in the locker. Next item.\"\n    *set candor %-12\n    *set rule %+8\n    *set rel_xo %-3\n    \"They stay in the locker. Next item.\"\n\n    ${xoname} moves on smoothly. The conversation restarts. It is a perfectly correct decision and it costs you nothing at all, except that for the rest of the year there will be four bottles of ice wine in the number three locker with another man's name on them, and every single person aboard will know exactly where they are.\n    *goto halbard_approach\n  #Put it to the table.\n    *set rule %-12\n    *set crew %+6\n    You put it to the table.\n\n    It takes eleven minutes and it is not tidy. ${engname} wants them delivered. ${medname} wants them opened. ${secname} points out, correctly, that four bottles of ice wine from an independent settlement to a serving officer were probably not strictly legal in the first place.\n    *if (chap != \"none\")\n      ${chapname} says nothing at all until asked directly, and then says: \"Whatever you do with them, do it where the ship can see.\"\n      *set rel_chap %+8\n    In the end you hold them for delivery, which is where you would have arrived alone in one minute, and the eleven minutes were the point.\n    *set rel_xo %+4\n    *goto halbard_approach\n\n*label halbard_approach\n*page_break\n\n*comment ---------------- Halbard's Rest ----------------\n\nHalbard from orbit is a dirty white marble with one lit scratch along the terminator, and the scratch is three hundred and forty people.\n\nThe Rest is an ice mine. They cut water out of the moon, crack it, sell the oxygen to passing traders and the hydrogen to anybody at all, and they have done it for sixty years without asking the Concord for a thing. They are not members. They have an arrangement, four pages long, which is why you are here: mail, the annual register, and any emergency medical case they care to declare.\n\nYou take the *Tern* down with ${medname} and two ratings.\n*if (sec = \"mott\")\n  Mott has written *KITTIWAKE* on the *Tern*'s inspection log and *TERN* on the *Kittiwake*'s, six weeks ago, for reasons she has not explained and will not.\n\nThe landing field is swept ice with a mast on it. Waiting at the mast in a coat that has been repaired more often than it has been washed is the settlement's administrator, **Wesse Ambrit**, sixty-something, nineteen years in post, who looks at your ship the way you looked at it in the dock.\n\nShe shakes your hand. Then she says: \"Where's Ivo?\"\n\n*page_break\n\n*choice\n  #Tell her the truth, as far as you know it.\n    *set candor %+14\n    *set standing %-4\n    \"Captain Halloran was relieved of this command fourteen months ago, after the Ceyla evacuation. There was an inquiry. It published nothing. He retired at his own request and he is on Tessine Station.\"\n\n    Ambrit stands very still in the cold.\n\n    \"Nine hundred people,\" she says at last. \"He took nine hundred people off a rock in front of the Vaunt, and your lot put him on a station.\" She turns and starts walking towards the settlement, so that you have to follow, and over her shoulder she says: \"Well. That tells me what sort of year I'm going to have.\"\n    *if (ceyla_known >= 1)\n      You do not correct her, though you could. Adjo told you the rest of it — the eleven weeks, the forty-one thousand — and you look at her back in the cold and decide it is not yours to hand her.\n      *set candor %-5\n      *set rule %+4\n    *goto register\n  #\"He is on Tessine Station and he is well. That is all I am able to say.\"\n    *set candor %-10\n    *set rule %+6\n    Ambrit takes it the way she would take a delivery three crates short.\n\n    \"That is all you are *able* to say,\" she repeats, and starts walking. \"Nineteen years I have had a Survey ship on this field twice a year, Commander, and every one of them was able to say a good deal more than that.\"\n\n    It is not a good beginning. It is also not a disaster: by the end of the day she will have decided that you are careful rather than cold, which from a distance is nearly the same thing.\n    *goto register\n  #\"I do not know. I have been aboard nine days and nobody will tell me either.\"\n    *set candor %+10\n    *set rule %-8\n    *set crew %+4\n    *set standing %-3\n    You say it in the cold, on the ice, to a woman you have known for forty seconds.\n\n    Ambrit looks at you properly for the first time.\n\n    \"Huh,\" she says. And then: \"All right.\" And then she picks up one end of the mail crate, which is not her job, and carries it with you as far as the shed, and does not mention it again for two days.\n    *goto register\n\n*label register\n*page_break\n\n*comment ---------------- The register, and the child ----------------\n\nThe annual register is a book. An actual book, cloth spine, because sixty years ago somebody decided that this settlement's population would be recorded in a form that could not be edited from orbit, and nobody has since seen a reason to change it.\n\nThree hundred and forty-one names. Ambrit reads them and you make the marks. Births since the last visit: four. Deaths: six. Under *departures* there is a line in nineteen-year-old handwriting that says *Halloran, I. — hon.*, because the Rest makes visiting masters honorary residents and then never takes them off the roll.\n\n\"You'll be in there by tonight,\" Ambrit says. \"It isn't an honour. It means if you die here we're obliged to bury you.\"\n\n*page_break\n\nThe medical case is a girl of nine named Ondra Vek, who broke her arm eleven weeks ago, whose bone is now infected, and who is sitting on a table in the settlement's two-bed clinic being extremely brave.\n\n*if (med = \"nour\")\n  Nour asks her name. Ondra tells her. Nour repeats it back, and then works for six minutes without speaking.\n*if (med = \"sorrel\")\n  Sorrel gets down on his heels so that his eyes are lower than hers and asks what the arm's name is. She says it does not have one. He says that is the problem, then.\n*if (med = \"vasi\")\n  Vasi looks at the arm for four seconds. \"Osteomyelitis, eleven weeks, poor culture medium, and I want the sample.\" He says this to you, not to her; and then to her, in precisely the same voice: \"This will take three days and it will not hurt.\"\n\nIt is nothing. Three days of a Concord antibiotic and the arm is saved, and the Rest's arrangement covers it in the second paragraph.\n\nYou give the order. It takes four seconds and it is the easiest thing you will do all year.\n\n*page_break\n\nThen Ambrit says: \"While you're at it.\"\n\nShe has three more. Grey lung, from sixty years of ice dust, in three miners aged forty-one, fifty, and fifty-eight. It is not an emergency. It will kill all three of them somewhere between four and eleven years from now. It is treatable — not cured, pushed back a decade — with a course of a Concord immunomodulator that your ship carries eleven doses of and cannot replace for nine days.\n\nThree courses is six doses. More than half.\n\n*if (med = \"nour\")\n  Nour says it quietly, so Ambrit will not hear. \"Captain. We are nine days from a hospital and I have eleven. If this ship burns and I have five, some of us walk. If I have five and a burn ward, some of us do not.\"\n*if (med = \"sorrel\")\n  Sorrel says nothing at all, which from Sorrel is a speech.\n*if (med = \"vasi\")\n  Vasi says, at conversational volume, in front of Ambrit: \"Six of eleven, chronic, non-member population, outside the arrangement. The answer is no, and I would like it recorded that I gave it.\"\n\nThe Rest did not ask for this. They asked for the child. Ambrit is asking now, in the doorway of a two-bed clinic, in a coat that has been repaired more often than it has been washed.\n\n*page_break\n\n*choice\n  #Give them the six doses.\n    *set crew %-10\n    *set nerve %+8\n    *set halbard \"generous\"\n    \"Six doses. ${medname}, start them today.\"\n\n    *if (med = \"vasi\")\n      Vasi records his objection in the log, in one sentence, and then treats all three of them with complete competence and no further comment of any kind.\n      *set rel_med %-8\n    *if (med = \"nour\")\n      Nour says \"Yes, Captain,\" and goes for her kit, and says nothing more about it until the ship is nine days away and something has gone wrong, and then she says it once.\n      *set rel_med %-4\n    *if (med = \"sorrel\")\n      Sorrel is halfway to the kit before you have finished the sentence.\n      *set rel_med %+10\n\n    Ambrit does not thank you. She writes the three names in the book under *treated*, in the same hand as everything else, and closes it.\n    *goto accident\n  #Two courses. Four doses. Seven stay aboard.\n    *set rule %+8\n    *set standing %+3\n    *set halbard \"split\"\n    \"Two courses. Four doses. Administrator, you choose which two.\"\n\n    It is the worst four seconds of the visit. Ambrit looks at you, then at the wall for a long moment, and then says a name, and another name, and does not say the third; and the third man is standing in the corridor and hears her not say it.\n\n    His name is Fen Doury. He is fifty-eight. He says, \"That's fair,\" which is unbearable.\n    *set rel_med %+4\n    *goto accident\n  #No. The arrangement covers emergencies. This is not one.\n    *set crew %+10\n    *set candor %+6\n    *set standing %+5\n    *set halbard \"refused\"\n    \"The arrangement covers emergencies. This is not one, and I am nine days from resupply with a hundred and twelve people aboard. The answer is no.\"\n\n    Ambrit nods. She expected it, and that is the part that stays with you — that she had already worked out the answer would be no and asked anyway, because asking cost her nothing and not asking would have cost her three men.\n\n    \"Right,\" she says. \"Register's done. You'll want to be off before the storm.\"\n    *set rel_med %+5\n    *goto accident\n  #Give it to ${medname}. ${medThey} runs the dispensary.\n    *set rule %-14\n    *set halbard \"delegated\"\n    \"Doctor. Your dispensary, your call.\"\n\n    ${medname} looks at you for slightly too long.\n    *if (med = \"nour\")\n      Then Nour says: \"Four doses. Two men. And Captain — I will do it, and I will be right, and you will still be the one who said it out loud when somebody asks you in eleven months. It does not transfer.\"\n      *set rel_med %+6\n    *if (med = \"sorrel\")\n      Then Sorrel says \"Six,\" immediately; and then, much more quietly, \"I am not sure I should be allowed to answer that as fast as I just did.\"\n      *set rel_med %+8\n    *if (med = \"vasi\")\n      Then Vasi says: \"None. And you have just made me the reason, which is efficient, and which I will not forget.\"\n      *set rel_med %-10\n    *goto accident\n\n*label accident\n*page_break\n\n*comment ---------------- The Rest's hospitality ----------------\n\nBefore the storm they feed you.\n\nThis is not optional. It is in the arrangement — paragraph eleven, *reciprocal hospitality* — and sixty years ago somebody in a Concord office signed it without asking what would be served, and what is served is a dish called simply *the block*: sixty-year-old sourdough starter, mine protein, and the salt they cannot sell, pressed into a brick and cut with a wire.\n\nIt is grey. It is warm. It has the texture of a decision you have already made.\n\nAmbrit watches you take the first mouthful with the flat attention of a woman who has watched nineteen years of Survey officers take the first mouthful.\n\n*choice\n  #Eat all of it and ask for more.\n    *set nerve %+8\n    *set crew %+6\n    *set standing %+3\n    You eat all of it. You ask for more. There is a silence in the refectory that you could hang a coat on, and then a man at the back laughs so hard he has to put his head on the table, and somebody thumps you between the shoulders hard enough to move you forward on the bench.\n\n    Ambrit says: \"Nobody's asked for more since 'ninety-one.\" She cuts you another slice. It is worse than the first one, because it is from the end.\n    *set rel_sec %+5\n    *goto icefall\n  #Eat it, say nothing, and never speak of it again.\n    *set candor %-8\n    *set rule %+4\n    You eat it. You do not react. Three hundred and forty people fail to get the entertainment they came for, and you can feel the disappointment arriving like weather.\n\n    Ambrit's mouth moves about a millimetre. \"Huh,\" she says.\n    *goto icefall\n  #\"What is in this?\"\n    *set candor %+10\n    *set rel_med %+6\n    You ask, out loud, in the refectory, with your mouth still full.\n\n    Ambrit tells you. All of it, ingredient by ingredient, including the year the starter was begun and the name of the woman who began it, and the fact that it has been fed every single day since by somebody whose job that is, and that when the Rest was nearly abandoned in 'seventy-four the starter was the second thing on the evacuation list.\n\n    You put the rest of the slice down, and then, after a moment, you pick it up again and finish it, and that is the part Ambrit will tell people about.\n    *set standing %+4\n    *goto icefall\n\n*label icefall\n*page_break\n\n*comment ---------------- The ice fall ----------------\n*comment Multi-level test on nerve; secondary on crew and rule. This is the\n*comment chapter's teeth.\n\nThe storm arrives four hours early and the number four gallery comes down.\n\nYou hear it before anybody tells you: a sound like a door closing somewhere enormous, and then the floor moves, once, and the lights swing. Somebody's cup goes off the table and does not break, because everything in the Rest is made not to break.\n\nThen the shouting starts, and it is coming from below.\n\nTwo miners in number four. Roof fall, eighty metres in, gallery blocked at forty. They are alive: there is a hardline through the ice and a woman on the other end of it saying her own name over and over, which is what you do when you cannot think of anything else to say.\n\nThe Rest has fourteen people who can dig and no cutting gear that will work in a live fall. Your ship has both, and your ship is in orbit, and the storm is on the field.\n\n*if (sec = \"oyelaran\")\n  Oyelaran is at your elbow before you have turned around. \"Four hands, two cutters, and the *Tern* can fly in that if Beye is any good. Say the word, Captain.\"\n*if (sec = \"whitlow\")\n  Whitlow is already crouched at the gallery mouth with her hand flat on the ice, reading the fall the way she reads a set of books. \"It came down in two stages,\" she says. \"There'll be a third.\"\n*if (sec = \"mott\")\n  Mott has gone to the gallery mouth and put one grey hand against the fall and stopped, absolutely still, listening to it through her palm. \"It is not finished,\" she says.\n\n*page_break\n\n*choice\n  #Get the cutters down here now. Beye can fly it.\n    *set nerve %+12\n    *set crew %-6\n    *goto ice_go\n  #Get the structural read first. Nobody goes in until we know where the third fall is.\n    *set nerve %-12\n    *set rule %+6\n    *goto ice_wait\n  #Ask ${secname} and do what ${secthey} says.\n    *set rule %-14\n    *set crew %+8\n    *set rel_sec %+10\n    *goto ice_ask\n\n*label ice_ask\n*if (sec = \"oyelaran\")\n  \"Then we go now,\" says Oyelaran, \"and I will take responsibility for the third fall.\"\n\n  You tell him the responsibility is not available to him and to go anyway.\n  *goto ice_go\n*if (sec = \"whitlow\")\n  \"Eleven minutes,\" says Whitlow. \"Give me eleven minutes and a probe and I will tell you exactly where not to stand, and then we go, and nobody has to be brave.\"\n  *goto ice_wait\n*if (sec = \"mott\")\n  Mott takes her hand off the ice. \"The fall will come again,\" she says, \"in under an hour. So we go now, and we go fast, and I will hold the roof.\"\n\n  You are about to ask what she means by that and then you understand that she means it literally.\n  *goto ice_go\n\n*label ice_go\n*page_break\n\nBeye brings the *Tern* down through a storm that is well outside her operating envelope, on instruments, with two cutters and six people in the back, and he does not say anything on the approach except the numbers.\n\n*set strain +6\n\nYou go into number four at eighty metres of bad ice with the sound of the roof working overhead.\n\n*if (nerve > 65)\n  You go in first. Nobody discusses it. You are the third person through the gap when it opens and you are the one who gets a hand round the wrist of a woman named Ilse Novy and pulls, and you find out that day exactly what your own voice sounds like under a roof that is talking.\n  *set standing %+8\n  *set rel_sec %+8\n*if (nerve <= 65) and (nerve > 38)\n  You go in with the second party, which is correct, and you spend nineteen minutes at the forty-metre line passing cut blocks back down a line of people and hearing the roof work, and it is the longest nineteen minutes of the year so far.\n  *set standing %+4\n*if (nerve <= 38)\n  You run the recovery from the gallery mouth, which is where a commanding officer belongs, and you are right, and you know you are right, and you stand at the mouth for forty-one minutes listening to other people's breathing on the hardline.\n  *set standing %+2\n\nThey get both of them out. Ilse Novy has a broken pelvis and the other one, a boy of nineteen, walks out on his own feet and then sits down suddenly on the ice and cannot get up again for some time.\n\nThe third fall comes fifty minutes later and takes the whole of number four gallery, and there is nobody in it.\n\n*goto ice_after\n\n*label ice_wait\n*page_break\n\n*if (sec = \"whitlow\")\n  Whitlow gets her eleven minutes.\n*if (sec != \"whitlow\")\n  You get a probe down the hardline and a structural read in fourteen minutes, which is fourteen minutes of a woman saying her own name into the ice.\n\nThe read says the fall came down in two stages and the second stage is holding on a single wedge of blue ice about the size of a door, and that when the wedge goes the whole roof between forty and eighty metres goes with it.\n\nSo you know where not to stand. You cut in from the side, through eleven metres of solid face instead of four metres of rubble, which takes ninety minutes instead of thirty and does not put one single person under the wedge.\n\n*set strain +3\n\n*if (crew > 60)\n  You will not order anybody under that roof. You say so out loud at the gallery mouth, in front of the Rest's own people, and one of the Rest's own people says *they're ours, not yours* and you say *the ones with the cutters are mine* and that is the end of the argument.\n  *set standing %+3\n  *set rel_sec %+6\n*if (crew <= 60)\n  You put four of your own under the safe line and keep them there, and you do the arithmetic every eleven minutes, and you keep doing it because that is the job.\n  *set standing %+5\n\nThey get both of them out at the ninety-fourt
