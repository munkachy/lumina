t one of them has an answer attached.\n    *set rel_sec %+4\n    *goto beye\n  #Read the first one and the last one. That is enough to charge him.\n    *set rule %+10\n    *set candor %-6\n    The first is dated eleven days after you took command. *CS Perpetua, Sarn Basin departed, master Cdr ${name}, ship well.*\n\n    The last one is from Tuesday. *Ship well.*\n\n    That is all you need and you know it is all you need, and you close the file, and you are aware that you have just chosen not to know something.\n    *goto beye\n  #Read none of them. What he sent is not the offence; that he sent it is.\n    *set rule %+14\n    *set crew %+8\n    *set candor %-4\n    *set kept_secret true\n    You do not open a single one.\n\n    Under Article Nine the offence is disclosure, not content. You do not need to read a man's four months to know he transmitted them, and you decide, in a cabin three metres by four, that you are not going to.\n\n    ${secname} raises an eyebrow at the order and enters it exactly as given.\n    *set rel_sec %+8\n    *goto beye\n\n*label beye\n*page_break\n\n*comment ---------------- Beye ----------------\n\nHe comes in and stands and does not sit down when told to.\n\nToma Beye is twenty-four and he flew a shuttle through a lane nine metres from a wall at four thousand degrees and talked the whole way, and he is now standing in the master's cabin of the *Perpetua* going grey around the mouth.\n\nHe does not deny it. He does not ask what you know. He says: \"One hundred and nineteen, Captain,\" which means he has been counting, which means he has known this morning was coming since the first one.\n\n*choice\n  #\"Why?\"\n    *set candor %+10\n    *set crew %+6\n    \"Because somebody should be able to see her,\" Beye says.\n\n    You wait.\n\n    \"He had her nine years. They took her off him in an afternoon and nobody told him anything, and there's no rule that says a man can't know his old ship is still afloat.\" He swallows. \"I know what it is, Captain. I looked it up the first week. I've looked it up every week since.\"\n    *goto beye_two\n  #\"Has he ever answered?\"\n    *set candor %+8\n    *set rule %-4\n    Beye's face does something complicated.\n\n    \"No, Captain.\"\n\n    \"Not once in four months.\"\n\n    \"No, Captain.\" And then, because you have not said anything: \"I didn't send them to get answered.\"\n    *set rel_sec %+6\n    *goto beye_two\n  #\"Do you know what an open band is?\"\n    *set rule %+12\n    *set nerve %+6\n    You put it to him the way it will be put to him by a Board: that a maintenance channel with no traffic on it is the easiest thing in the sky to read; that a daily position report from a Survey vessel is worth money to four governments; and that on the day the *Ashaya* was sitting nine astronomical units off Sedge watching you, she was also, at 0410, being handed your position by a Concord sub-lieutenant.\n\n    Beye does not argue. He goes the colour of the deck plating and sits down without being told, which is the first order he has broken in front of you.\n\n    \"I didn't—\" he says. And then: \"No. I did. I just hadn't done that part of the thinking.\"\n    *set rel_sec %-4\n    *goto beye_two\n\n*label beye_two\n*page_break\n\n*choice\n  #\"You have put me in an impossible position. I want you to understand that.\"\n    *set candor %+12\n    *set rule %+4\n    He does understand it. That is what makes the next thirty seconds so bad: he works it through out loud, in front of you, and arrives at the correct answer, which is that anything short of a formal charge makes you complicit from this morning onward.\n\n    \"I'm sorry, Captain,\" he says. \"That's — I hadn't done that part either.\"\n    *goto ninecouncil\n  #\"Do you want to say anything about Ceyla?\"\n    *set candor %+14\n    *set crew %+8\n    The question knocks him sideways. He was braced for Article Nine.\n\n    \"He came down to the bay,\" Beye says. \"After. When we had nine hundred people in the holds and no water for them. He came down and he stood there and he said, *Mister Beye, I have done a thing that is going to be argued about for a hundred years, and I would like you to remember that when I did it I was not confused.*\" He looks up. \"I was twenty-two, Captain. I didn't know what he meant. I do now.\"\n    *set ceyla_known 3\n    *set rel_sec %+8\n    *goto ninecouncil\n  #Say nothing. Let him stand there.\n    *set candor %-14\n    *set rule %+10\n    You let him stand in the middle of your cabin for a full minute, which is a very long time, and you watch a young man's face go through four separate things and arrive somewhere quieter than any of them.\n\n    Then you say, \"Wait outside,\" and he says \"Aye, Captain,\" and goes, and you find that you have learned something and you do not entirely like how.\n    *goto ninecouncil\n\n*label ninecouncil\n*page_break\n\n*comment ---------------- Article Nine ----------------\n\nArticle Nine of the Survey's disciplinary code covers unauthorised disclosure. It is one paragraph long and it gives a ship's master exactly three roads, and it does not say which.\n\n**Charge.** Log it, hold him, hand him to a Board at the next member colony. Dismissal is usual. It is out of your hands the moment you sign it, and it is on the record for a hundred years.\n\n**Summary.** Deal with it aboard under a master's authority. Disrate him, stop his pay, put him in the bilges for a month — anything short of dismissal. It stays on the ship. It also means that if it ever comes out, you concealed a hundred and nineteen counts of Article Nine.\n\n**Dismiss the matter.** Find that no offence occurred. This is available to you and it is a lie, and it is a lie you would have to sign.\n\n*if (xo = \"marand\")\n  \"Charge,\" Marand says, before you ask. \"And Captain — I know what he is worth in a shuttle. That is precisely why. If we only charge the ones who are no good at their jobs, the code is not a code, it is a way of getting rid of people.\"\n*if (xo = \"ferreo\")\n  \"Summary,\" Ferreo says, \"and I will help you write it so that it is airtight, and I want you to know that I am advising you badly on purpose. A charge ends him. A summary ends *you*, in about eleven months, if it ever surfaces. I am telling you to take the risk onto yourself and I am not sure that is my job.\"\n*if (xo = \"tanaka\")\n  \"Depends what you want the ship to learn,\" Tanaka-Osei says. \"Charge him and they learn the rules are real. Summary and they learn you are. You don't get both and anybody who tells you different has never run a crew.\"\n\n*if (sec = \"oyelaran\")\n  \"Charge,\" Oyelaran says flatly. \"He handed our position to a hostile power for four months. That he did it out of love makes it worse, Captain, not better, because love is not a thing you can put a procedure round.\"\n*if (sec = \"whitlow\")\n  \"I would like to note,\" Whitlow says, \"that I have checked, and the Vaunt did not need his transmissions to find us at Sedge, because we filed that transit with Marl in clear eleven days before. He is guilty of everything except the consequence.\"\n*if (sec = \"mott\")\n  \"He is loyal to a man,\" Mott says. \"You wish him to be loyal to a rule. On my world we would say you are asking a dog to be a door.\" A pause. \"This is not an argument. I have no argument. I only did not want the word *loyal* to go unsaid in this room.\"\n\n*if (chap = \"wren\")\n  Wren says: \"Captain, may I ask you something that is not about Mister Beye? What do you think he was doing at 0410 every morning for four months, alone, at a board, with nobody answering?\" He waits. \"I am not going to tell you the answer. I am telling you it is a real question.\"\n*if (chap = \"onu\")\n  \"He was keeping a vigil,\" Onu says, folding. \"Badly, and against the regulations, and at the wrong hour, and for a living man. But that is what it was, and you should know that before you decide what to do to him.\"\n*if (chap = \"serat\")\n  \"Four months of unreciprocated contact at a fixed hour is a ritual, not a communication,\" Serat says. \"Which does not make it legal. It does mean that whatever you take off him, you should be prepared for what happens at 0410 the next morning.\"\n*if (chap = \"none\")\n  There is nobody at the foot of the table. The word *loyalty* is used eleven times in the discussion and never once examined, and afterwards you cannot remember who used it most.\n  *achieve empty_berth\n\n*page_break\n\n*choice\n  #Charge him. It goes to a Board.\n    *set article_nine \"charged\"\n    *set rule %+14\n    *set crew %-12\n    *set standing %+10\n    *set candor %+8\n    You sign it. It takes eleven seconds and the pen is Concord issue and it does not run out.\n\n    Beye is confined to quarters, off the watch bill, and handed to a Board at Marl Colony nineteen days later. He does not appeal. He does not ask you to speak for him and you do not offer, because offering would be worse.\n\n    The Board dismisses him from the Survey in forty minutes.\n\n    *if (crew > 55)\n      What it costs you is not what you expected. Nobody is insubordinate. Nobody says a word. It is simply that for about three weeks the ship becomes extremely, immaculately correct, and you can hear it in the corridors, and there is nothing whatsoever you can do about it, and then it passes and something has been set that does not un-set.\n      *set rel_xo %-4\n      *set rel_med %-6\n    *if (crew <= 55)\n      What it buys you is real and you should not pretend otherwise. Every rating on the ship now knows exactly where the line is and that it is where the book says it is, and for the rest of the year not one person aboard tests it, and eleven months from now that will keep somebody alive.\n    *goto nineafter\n  #Summary punishment. It stays on this ship.\n    *set article_nine \"summary\"\n    *set rule %+8\n    *set crew %+12\n    *set candor %-14\n    *set standing %-6\n    *set kept_secret true\n    *achieve guard\n    You disrate him to Sub-Lieutenant Acting, stop three months' pay, put him off the flight roster for sixty days, and enter it in the ship's punishment book as *unauthorised use of a maintenance channel* — which is true, and which is a hundred and nineteen counts of Article Nine wearing a smaller coat.\n\n    Then you carry it. That is the part nobody explains: not the decision, the carrying. Every stores audit, every Board, every polite question from a delegate for the rest of your service, there is a book on this ship with a sentence in it that is true and not honest, and you wrote it.\n\n    *if (xo = \"marand\")\n      Marand countersigns because she must, and writes in her own notebook, in her own hand: *I advised otherwise.* She shows it to you. She is not threatening you. She is telling you that if it comes out, she will not lie either, and that you should plan accordingly.\n      *set rel_xo %-8\n    *if (xo = \"ferreo\")\n      Ferreo helps you write it and it is airtight, and afterwards he says, \"Captain, I would like to be somewhere else the day this comes up,\" and then, immediately, \"and I will not be. Forget I said it.\"\n      *set rel_xo %+6\n    *if (xo = \"tanaka\")\n      Tanaka-Osei reads the entry, hands it back, and says: \"That's a good sentence. It'll hold for about three years.\" She eats the rest of whatever she is holding. \"Three years is a long time, mind.\"\n      *set rel_xo %+4\n    *goto nineafter\n  #Find that no offence occurred.\n    *set article_nine \"buried\"\n    *set rule %+6\n    *set crew %+14\n    *set candor %-18\n    *set standing %-12\n    *set kept_secret true\n    You sign a finding that a maintenance channel was used for authorised ship's business, which is a lie, in your own hand, in a ship's book, over your own name.\n\n    It takes eleven seconds and the pen is Concord issue.\n\n    ${secname} enters it as directed. ${secThey} does not say anything at all, then or ever, and that silence becomes a small permanent object between you that neither of you refers to for the rest of the year.\n    *set rel_sec %-12\n    *goto nineafter\n  #Put it to a ship's inquiry. Three officers. I will abide by it.\n    *set article_nine \"inquiry\"\n    *set rule %-20\n    *set candor %+10\n    *set crew %+6\n    You convene a ship's inquiry under the same article, three officers, evidence heard, and you tell them in advance and in writing that you will abide by their finding — which the article permits and which almost no master does, because it hands away the one thing a master is for.\n\n    It sits for six hours.\n\n    *if (rule <= 40)\n      The finding is summary punishment: disrated sixty days, pay stopped, kept aboard. It is precisely the middle, and it is arrived at by three people who argued properly, and when it is read out in the wardroom it has a weight that nothing you could have said alone would have carried.\n      *set rel_xo %+10\n      *set rel_sec %+8\n      *set rel_med %+8\n    *if (rule > 40)\n      The finding is a formal charge. Two to one. You abide by it because you said you would, and Beye is handed to a Board at Marl and dismissed in forty minutes, and you sit through the whole of it having produced the outcome you were trying not to produce single-handed.\n      *set rel_xo %+6\n      *set crew %-8\n    *goto nineafter\n\n*label nineafter\n*page_break\n\n*comment ---------------- What arrives afterwards ----------------\n\nThe signal from Tessine Station comes in at 1140 the following day, which is nineteen hours after you signed, and it is addressed to you.\n\n*if (halloran_regard > 55)\n  *set met_halloran false\n  **FROM: I. HALLORAN, HARBOUR PILOT, TESSINE STATION**\n  **TO: MASTER, CS PERPETUA**\n\n  *Commander — I have your signal of the eleventh. Thank you for it. You did not have to send it and I have read it several times.*\n\n  *There is a sub-lieutenant on that ship who transmits to me at 0410. I have never answered him. Answering him would have made him mine, and he is yours.*\n\n  *If you have found it, be careful what you take off him. He is the best hand I ever had, and the reason he does it is the reason he is.*\n\n  *I do not ask you for anything. I am aware I have no standing to.*\n\n  *I. Halloran.*\n\n  The signal is timestamped four days ago. It has been in the queue behind a stores manifest and a weather bulletin for four days.\n  *set halloran_regard %+10\n*if (halloran_regard <= 55)\n  It is not from Halloran.\n\n  It is from the Tessine Station harbourmaster's office, an automatic acknowledgement of receipt for one hundred and nineteen transmissions, machine-generated, addressed to nobody, which has been sitting in a queue for four months because nothing on this ship was configured to receive it.\n\n  That is the whole correspondence. One hundred and nineteen messages out and one form letter back, and the form letter is not even from a person.\n\n*page_break\n\n*choice\n  #Show it to Beye.\n    *set candor %+14\n    *set crew %+10\n    You put it in his hand and stand there while he reads it, which is either the kindest or the cruellest thing you have done since you came aboard, and you are not sure which even afterwards.\n\n    *if (halloran_regard > 55)\n      He reads it four times. At the fourth he says, \"*He is yours,*\" and then does not say anything else for a while, and then: \"That's — thank you, Captain,\" which is not for the letter, and you both know it.\n      *set rel_sec %+8\n    *if (halloran_regard <= 55)\n      He reads it once and hands it back and says, \"Right,\" and that is all. Then, at the door: \"I knew, Captain. I've known since about the eleventh one.\" And he goes.\n    *goto nine_0410\n  #Keep it. He does not need this today.\n    *set candor %-12\n    *set rule %+10\n    *set kept_secret true\n    You put it in the drawer with the brass plate, face down, and you shut the drawer.\n\n    It is a defensible decision. It is also the second thing in nineteen hours that you have decided a twenty-four-year-old does not get to know about his own life, and the two of them sit together in the drawer.\n    *goto nine_0410\n  #Read it out in the wardroom.\n    *set candor %+12\n    *set rule %-8\n    *set crew %+6\n    You read it to your officers, all of it, standing, and the wardroom of a Meridian seats ten and there are six of you and the table is too small.\n\n    *if (article_nine = \"charged\")\n      Nobody says anything. ${xoname} looks at the table. Whatever any of them thought about your decision yesterday, all of them are now thinking it slightly harder, and so are you.\n      *set rel_xo %-4\n    *if (article_nine != \"charged\")\n      Nobody says anything for a while. Then ${medname} says, \"Well,\" in the tone of a person setting something down, and the meeting moves on, and nothing about the atmosphere aboard this ship is quite the same afterwards, in a good way that you could not have engineered and did not.\n      *set rel_med %+8\n    *goto nine_0410\n\n*label nine_0410\n*page_break\n\n*comment ---------------- 0410 ----------------\n\nThe next morning at 0410 you are awake, because of course you are, and you go up to the comms board to see what happens at 0410.\n\nNothing happens at 0410.\n\nThe board is manned by Tey Abara, twenty-two, who talked a sixteen-year-old about Sarn for two hours at the *Corvine*, and she looks up and says, \"Captain?\" and you say \"Carry on\" and stand there for a while like an idiot, and the maintenance channel stays empty.\n\n*if (article_nine = \"charged\")\n  Beye is in his quarters under confinement, nineteen days from a Board, and he is also awake. Everybody knows he is awake. Nobody says so.\n*if (article_nine != \"charged\")\n  Beye is in the number two bay with his hands inside the *Kittiwake*'s port cluster at four in the morning because he has been taken off the flight roster and there is nowhere else on this ship for him to be at 0410.\n\n*page_break\n\n*choice\n  #Take the watch beside Abara until 0500.\n    *set crew %+10\n    *set rule %-6\n    You sit down at the empty board next to the comms rating and stay there for fifty minutes, and you do not explain, and she does not ask.\n\n    At 0500 she says, \"Same time tomorrow, Captain?\" absolutely deadpan, and you say \"Probably,\" and that is how the *Perpetua* acquires a tradition that nobody ever writes down.\n    *set rel_sec %+6\n    *set rel_med %+6\n    *goto nine_ship\n  #Go and find Beye in the bay.\n    *set crew %+12\n    *set nerve %+8\n    *set candor %+8\n    You find him with his hands inside a shuttle at four in the morning and you do not say anything about the transmissions, and neither does he, and for about forty minutes the two of you replace a bad seal in the *Kittiwake*'s port cluster.\n\n    At the end he says, \"Captain, can I ask — do you think he's all right?\"\n\n    You do not know. You tell him you do not know. It is the first completely honest thing either of you has said since Tuesday.\n    *set rel_sec %+10\n    *goto nine_ship\n  #Go back to bed. It is 0410 and I am the master of this ship.\n    *set rule %+12\n    *set crew %-8\n    *set candor %-6\n    You go back down. You do not sleep, but you go back down, because a commanding officer standing at an empty board at 0410 is a story that will be around the ship by lunchtime and will mean whatever the mess deck decides it means.\n\n    *if (nerve > 60)\n      You are right, and it costs nothing, and you are still awake at 0600.\n    *if (nerve <= 60)\n      You are right. You lie in a bunk three metres by four and you are entirely right and it does not help at all.\n    *goto nine_ship\n\n*label nine_ship\n*page_break\n\n*comment ---------------- What the ship makes of it ----------------\n*comment Reaction block: reads rule, candor, crew, standing, rel_xo.\n\nA hundred and twelve people know that something happened on Tuesday. What they know depends almost entirely on what you have let them know.\n\n*if (article_nine = \"charged\")\n  They know all of it, because a charge is a public act. Nineteen days from now they will watch a Board take him.\n*if (article_nine = \"summary\")\n  They know that Beye is off the roster for sixty days for *unauthorised use of a maintenance channel.* About a third of them work out the rest inside a week. Nobody says it out loud, and the not-saying-it becomes a thing the ship does together, which is not the same as loyalty and is close enough to be dangerous.\n*if (article_nine = \"buried\")\n  They know nothing, officially. Unofficially they know that ${secname} carried a folder to your cabin and that Beye came out of it grey, and the gap between those two things is the most interesting thing that has happened aboard in four months and it will be filled.\n*if (article_nine = \"inquiry\")\n  They know all of it, because an inquiry is heard, and three of your officers sat in judgement and were seen to, and that is the part the mess deck cannot leave alone: not what was decided, but that it was decided in the open by people they could name.\n\n*if (rule > 65)\n  What the ship has learned about you this week is that you decide. Alone, on time, and without being talked round. That is a real asset and it has a shelf life, and the shelf life is exactly as long as your decisions keep being right.\n*if (rule <= 35)\n  What the ship has learned about you this week is that you will put a thing to other people even when you do not have to. There are officers in the Survey who would call that weakness and they are not on this ship and their opinion is not available.\n*if (rule > 35) and (rule <= 65)\n  What the ship has learned about you this week is that they cannot yet predict you, which at four months is neither good nor bad and will not stay that way.\n\n*if (candor > 65)\n  Whatever else, they have not had to guess. You have said what you did and why, every time, and there is a currency in that which does not show up on any report.\n*if (candor <= 35)\n  They have had to guess, all week, about everything, and a hundred and twelve people nine days from help are extremely good at guessing and extremely bad at guessing right.\n\n*page_break\n\n*if (chap != \"none\")\n  ${chapname} finds you on Friday.\n  *if (chap = \"wren\")\n    Wren does not ask about Beye. He asks whether you have eaten, and then whether you slept on Tuesday night, and when you say no he says \"Right,\" and sits down, and says nothing for a very long time, and the silence is not a technique; he is genuinely just sitting there.\n  *if (chap = \"onu\")\n    Onu arrives with a folded stack of something and says, without preamble, \"You have not eaten since Tuesday and you are about to tell me you have.\" She is right on both counts.\n  *if (chap = \"serat\")\n    \"You have made a decision that you will revisit,\" Serat says, \"which is normal and which I would like you to do here rather than at 0300 for the next six weeks.\"\n\n  *choice\n    #Tell ${chapthem} the whole thing, including the part I did not put in the book.\n      *set candor %+12\n      *set rel_chap %+14\n      You tell ${chapthem} all of it: what you did, what you nearly did, and the eleven seconds before you signed, in which you thought about your own record and not about Beye at all.\n\n      *if (chap = \"wren\")\n        Wren says, \"Thank you for telling me that,\" and then, after a while: \"You know you are allowed to be a person who thought about their record. It happened. You are not required to be surprised by yourself.\"\n      *if (chap = \"onu\")\n        Onu keeps folding. \"Everybody thinks about themselves for eleven seconds,\" she says. \"The ones who worry me are the ones who take eleven minutes and call it discernment.\"\n      *if (chap = \"serat\")\n        \"That is the useful part,\" Serat says. \"Not the decision. The eleven seconds. Most captains cannot find them.\"\n      *goto nine_end\n    #\"I am not going to discuss it.\"\n      *set candor %-12\n      *set rule %+8\n      *set rel_chap %-6\n      You say it politely and completely and ${chapthey} accepts it immediately, and the conversation is over in nine seconds, and ${chapthey} does not raise it again.\n\n      That last part is the problem. ${chapThey} does not raise it again.\n      *goto nine_end\n    #Ask ${chapthem} the question instead.\n      *set rule %-10\n      *set candor %+8\n      *set rel_chap %+10\n      \"What was he doing,\" you say, \"at 0410, for four months, with nobody answering?\"\n\n      *if (chap = \"wren\")\n        \"You already know,\" Wren says. \"You went up there yourself yesterday morning and stood at an empty board.\" He lets that sit. \"The word you are avoiding is not a Survey word and I am not going to make you say it.\"\n      *if (chap = \"onu\")\n        \"Keeping faith,\" says Onu. \"Which is not the same as being right, and which does not excuse him, and which is nevertheless the rarest thing on this ship and you have just spent a week punishing it. I do not say that as a criticism. I say it so that you know what it cost.\"\n      *if (chap = \"serat\")\n        \"Managing an unbearable ending by refusing to have one,\" Serat says. \"It is extremely common and it is not pathological. He will stop now, and the stopping is the part he has not done yet, and that is what I would watch.\"\n      *goto nine_end\n*if (chap = \"none\")\n  Nobody finds you on Friday.\n\n  You eat in the wardroom with the officers and it is fine, and you walk the ship at 2200 and it is fine, and at 0300 you are awake in a cabin three metres by four with a viewport, going through eleven seconds on a Tuesday for the fourth time, and there is nobody aboard this ship whose job it is to be told about them.\n  *achieve empty_berth\n  *set rule %+6\n  *goto nine_end\n\n*label nine_end\n*page_break\n\n*if (article_nine = \"charged\")\n  Nineteen days later, at Marl Colony, a Board of three takes forty minutes to dismiss Sub-Lieutenant Toma Beye from the Survey. He is twenty-four. He goes down the ramp with one bag.\n\n  ${xoname} logs the ship's complement as one hundred and eleven.\n\n  *if (sec = \"mott\")\n    Mott is at the top of the ramp when he goes. She says his name — his actual name, the one she gave him, which nobody else has ever heard her use — and he stops, and she says something in Karsk that she does not translate, and he goes.\n*if (article_nine != \"charged\")\n  Sixty days later Sub-Lieutenant Toma Beye goes back on the flight roster, and the first thing he does is bring the *Kittiwake* through a gate with eleven centimetres of clearance for no reason at all except that he can.\n\n  ${xoname} logs the ship's complement as one hundred and twelve.\n\nAt 0410 the maintenance channel is empty, and it stays empty, and four hundred light years away a man who was master of this ship for nine years is piloting freighters into a station and has stopped receiving the only news he had.\n\n*finish\n", "quietworld": "*comment ==================== CHAPTER SIX — THE QUIET WORLD ====================\n*comment Wonder, warmth, and Counsel's moment of glory: the youngest person\n*comment aboard is right and the player lets her be. Budget: 12 tests, 13 choices.\n*comment Ledger: Ossa, catalogued 41 years ago as sterile. Rings once every\n*comment eleven days for sixty hours. Tey Abara, comms rating, 22, hears it first\n*comment at 0410. The probe would damp the resonance permanently.\n\nOssa is a rock.\n\nThat is the entire catalogue entry, forty-one years old, written by a Survey lieutenant who spent nine hours in orbit and had somewhere else to be: *OSSA. Terrestrial, 0.81 standard. Atmosphere thin, inert. Surface ice and basalt. No biology. No resources of interest. Recommend no further visit.*\n\nYou are here because the Survey updates its catalogue every forty years whether anybody wants it or not, and because after Sedge and the *Corvine* and Article Nine, a fortnight in orbit around a rock is the best thing that could possibly happen to this ship.\n\nFor nine days nothing happens. It is wonderful. ${engname} strips the number two coolant loop for the fourth time and fails to stop it whistling. ${medname} runs the annual physicals and finds that eleven people have gained weight and nobody has lost any, which ${medthey} reports to you as *the single most encouraging medical finding of my career.*\n\nOn the tenth day, at 0410, Tey Abara calls the bridge.\n\n*page_break\n\n*comment ---------------- The note ----------------\n\nAbara is twenty-two. She talked a sixteen-year-old about Sarn for two hours at the *Corvine* and did not hand over. She has been on the graveyard comms watch for five months and she is, by an enormous margin, the most bored person on this ship.\n\n\"Captain,\" she says, \"there's something on the hull.\"\n\nIt is not on the hull. It is coming *through* it: a sound at the very bottom of hearing, so low that half the bridge cannot hear it at all and the other half can feel it in the teeth. It is not machinery. ${engname} shuts down every rotating component on the ship in eleven minutes to prove it, and the sound goes on.\n\nIt is the planet.\n\n*page_break\n\nOssa rings.\n\nEvery eleven days, when the gas giant it orbits pulls it into its longest stretch, the whole crust flexes; and forty kilometres down, in a network of ice caverns that runs the entire circumference of the world, the flex drives a column of air, and the world sounds a single note and holds it for sixty hours.\n\nIt is B flat, three octaves below the bottom of a piano. It has been going for somewhere between two hundred and four hundred million years. Nobody has ever heard it, because the Survey lieutenant who catalogued Ossa was here on day four of an eleven-day cycle and had somewhere else to be.\n\n*choice\n  #Put it on the ship's address system. All decks. Now.\n    *set candor %+10\n    *set crew %+12\n    *set nerve %+6\n    You pipe a rock's heartbeat through a hundred and twelve people's compartments at four in the morning.\n\n    Nobody complains. That is what you remember: not one complaint, from a crew you woke at 0410 on a Tuesday, and by 0500 there are eleven people in the observation blister who are supposed to be asleep, and by 0600 there are thirty.\n    *set rel_med %+6\n    *set rel_sec %+6\n    *goto ossa_science\n  #Record it. Wake nobody. It will still be here at 0800.\n    *set rule %+8\n    *set nerve %-6\n    You have it recorded at full spectrum and you go back to bed, and at 0800 you play it in the wardroom to five officers with cups of coffee, which is the correct way to introduce a scientific finding and is, you will realise later, the single largest failure of imagination of your entire command.\n    *set rel_eng %+4\n    *goto ossa_science\n  #Send for Abara. She found it; she gets to say what happens next.\n    *set rule %-14\n    *set crew %+10\n    *set rel_sec %+8\n    A rating on the graveyard watch is sent for by the master of the ship at 0420 and arrives convinced she is in trouble.\n\n    \"Miss Abara,\" you say. \"You found it. What do we do?\"\n\n    She stares at you for four seconds. Then: \"Put it on the address system, Captain. All decks. Everybody should get to hear a thing like that once.\"\n\n    You do. By 0600 there are thirty people in the observation blister who are supposed to be asleep, and Abara is off watch and asleep at the back of them with her boots on.\n    *goto ossa_science\n\n*label ossa_science\n*page_break\n\n*comment ---------------- The probe ----------------\n\nWithin three days the *Perpetua* has become a research vessel, which she was designed to be and has not been for fourteen months, and it is the happiest the ship has been.\n\nThe science party wants to put a probe down.\n\nIt is a good proposal. Forty kilometres of ice, a bore of eleven centimetres, an instrument package into the cavern network itself: pressure, temperature, gas composition, the geometry of a resonant chamber the size of a continent. Nobody has ever measured anything like it. It would be the most significant thing the *Perpetua* has done in twenty-six years and it would carry your name on it.\n\n*if (eng = \"osimo\")\n  Osimo, who has not volunteered an opinion on a scientific matter in nineteen years aboard, says: \"It'd be a shame to put a hole in it.\" Then he goes back below and will not be drawn.\n*if (eng = \"kallas\")\n  Kallas has the bore package half-built by the second afternoon and is talking at nine syllables a second about differential melt rates, and it is not until you ask her a direct question that you realise she has not slept.\n*if (eng = \"dorr\")\n  \"I am sorry,\" says Dorr. \"I can build the bore. I would like it noted that in the Vaunt this would be authorised in one hour by a clerk, and that this is one of the four or five things I actually left over.\"\n\n*if (med = \"vasi\")\n  Vasi wants it. He does not pretend otherwise and he is not embarrassed. \"Captain, there are eleven resonant bodies known and none of them are reachable. This is a career. Somebody's career. I would prefer it to be mine but I will take yours.\"\n*if (med = \"nour\")\n  \"It is a rock that makes a noise,\" says Nour, \"and I have three people with vitamin deficiencies and a ship that has been cheerful for a week. I have no view on your hole. I have a view on the week.\"\n*if (med = \"sorrel\")\n  Sorrel asks, apparently seriously, whether the planet would mind, and then apologises for asking, and then, after a moment, says he is not actually sure he was joking.\n\n*page_break\n\nAnd then, on the fifth day, the science party finds the problem and reports it honestly, which is to their enormous credit.\n\nAn eleven-centimetre bore into a resonant chamber vents. Not much: a fraction of a per cent of the column, forever, because ice at that depth does not re-seal. The note would not stop. It would go flat — by something on the order of one part in nine thousand, permanently, for the remaining life of the planet.\n\nNobody would ever hear the difference. No instrument in the Concord could hear the difference without the *before* recording, which only this ship has, which you made at 0410 on a Tuesday.\n\n*choice\n  #\"One part in nine thousand. Build the probe.\"\n    *set rule %+10\n    *set nerve %+8\n    *set standing %+8\n    *set quiet_named false\n    You say it out loud in the wardroom, because it is the right answer and you are not going to whisper it: that Ossa is a rock, that it is not owed anything, that the Concord has eleven worlds and forty light years of ignorance, and that a fraction of a per cent of a column of air is not a moral object.\n\n    ${xoname} logs it. Kallas — or whoever is building it — has the bore ready in six days.\n    *goto ossa_abara\n  #\"No. Not for one part in nine thousand.\"\n    *set rule %+8\n    *set nerve %-6\n    *set standing %-6\n    *set quiet_named true\n    You say no, on the fifth day, before anybody has argued, and you say it in one sentence and do not explain, and the science party takes it the way a science party takes a no from somebody who has not shown their working.\n\n    It is the right answer and you have delivered it in the worst available way, and it will cost you eleven weeks of goodwill from four people who deserved better.\n    *set rel_med %-8\n    *goto ossa_after\n  #Put it to the ship. Anybody who wants to argue, argue.\n    *set rule %-16\n    *set candor %+10\n    *set crew %+8\n    You post the proposal, the bore specification, and the damping figure on the mess board, unedited, and you announce that anybody aboard who has a view may put it in writing to the first officer by Friday.\n\n    ${xoname} receives forty-one written submissions from a crew of a hundred and twelve, which is a number you will quote for the rest of your career, usually to people who do not believe you.\n    *set rel_xo %+10\n    *goto ossa_abara\n\n*label ossa_abara\n*page_break\n\n*comment ---------------- Counsel's moment of glory ----------------\n\nThe forty-first submission — or, if there were no submissions, a request to see the master, made properly through the first officer, and waited out for two days — is from Tey Abara, comms rating, twenty-two, who has no scientific qualification whatsoever.\n\nIt is one page. It is not sentimental. It does not use the word *beautiful* and it does not ask you to spare anything.\n\nWhat it says is this. The Survey has forty-one years of archived gravitational data on Ossa, taken from four passing ships, and Ossa's flex cycle is recorded in all four. The note's frequency is a function of the cavern geometry. The cavern geometry is a function of the flex. Therefore the drift in the note across forty-one years is already in the archive, and from the drift you can solve the geometry, and you can have almost everything the probe would give you for the price of a fortnight's arithmetic and no hole at all.\n\nShe has done nine pages of the arithmetic in the back. Three of the nine pages are wrong.\n\nSix of them are not.\n\n*page_break\n\n*if (sec = \"whitlow\")\n  Whitlow read it before you did, because everything on this ship goes past her, and her note in the margin says: *This is either the best piece of work done aboard this year or a coincidence. I have checked it twice and it is not a coincidence.*\n*if (sec = \"oyelaran\")\n  Oyelaran hands it to you with the observation that a rating has gone round her own department, her own division officer, and two lieutenants to put a paper on the master's desk, and that he would like that noted before anybody starts calling her brilliant.\n*if (sec = \"mott\")\n  Mott says: \"The small one at the board has done a thing.\" She holds up the page in one grey hand, which makes it look like a receipt. \"I do not understand it. I understand that she did it at night.\"\n\n*choice\n  #Send for her. In the wardroom, in front of the officers, and let her present it.\n    *set rule %-18\n    *set candor %+12\n    *set crew %+10\n    *set standing %+6\n    *set quiet_named true\n    *achieve counsel\n    A comms rating stands at the foot of the wardroom table of a Concord Survey vessel with nine pages of her own arithmetic and presents to five commissioned officers, three of whom outrank her by more than she can count.\n\n    She is terrified for ninety seconds. Then she stops being terrified, because the third page has a question in it that ${engname} asks and that she has already answered on the seventh, and after that it is not a rating presenting to officers, it is six people at a table doing a piece of work.\n\n    Two hours later ${engname} says, \"The three bad pages are bad. The other six are right.\" And that is that.\n    *set rel_eng %+10\n    *set rel_sec %+10\n    *goto ossa_decide\n  #Have ${engname} check it and tell me if it holds.\n    *set rule %+8\n    *set standing %+4\n    ${engname} takes it away for two days and comes back and says that three pages are wrong and six are right, and that the six are enough.\n\n    You thank ${engthem}. It does not occur to you until much later that you thanked the wrong person, and that a comms rating heard the outcome of her own paper from her division officer, secondhand, in a corridor.\n    *set rel_sec %-6\n    *set quiet_named true\n    *goto ossa_decide\n  #She is a comms rating. Put it in the file with the others.\n    *set rule %+14\n    *set crew %-10\n    *set candor %-6\n    You file it. There are forty-one submissions and yours is a research vessel with a science party of nine qualified people, and a master who reorganises a scientific programme around a twenty-two-year-old's homework is a master who will be reorganising it around everybody's homework by Friday.\n\n    That reasoning is sound. It is also, as it happens, wrong, and you will find out how wrong in eleven days when the science party independently derives four of her six pages and presents it to you as a novel result.\n\n    *if (rel_sec > 60)\n      ${secname} does not say *I gave you that in writing on the fifth day.* You can see ${secthem} not saying it from across the wardroom.\n      *set rel_sec %-8\n    *goto ossa_decide\n\n*label ossa_decide\n*page_break\n\n*comment ---------------- The hole ----------------\n\nIt comes down to you, in a cabin three metres by four, as everything does.\n\n*if (quiet_named)\n  You have on the desk: nine pages of arithmetic by a twenty-two-year-old, six of which are right; a bore package that is built and ready; and a recording, made at 0410 on a Tuesday, of a sound that has been going for three hundred million years and has never been heard.\n*if (quiet_named = false)\n  You have on the desk: a bore package that is built and ready, and a recording made at 0410 on a Tuesday.\n\n*if (plaque)\n  Twenty centimetres from your face, in brass: *THE LEAST THAT ANSWERS.*\n\n*choice\n  #No bore. Take the forty-one years of archive and do the arithmetic.\n    *set rule %+4\n    *set nerve %-8\n    *set crew %+8\n    *set quiet_named true\n    You cancel the bore.\n\n    It takes the science party a fortnight and they get eleven of the fourteen things they wanted, and the three they do not get are the three that mattered least, and one of them writes in the report — over your name, because that is how reports work — that the result was obtained *without instrumentation of the resonant body.*\n\n    Forty years from now some other ship will come here and hear exactly what you heard, at exactly the pitch you heard it, and will not know why that is true.\n    *set standing %-4\n    *goto ossa_end\n  #Bore it. This is what a survey ship is for.\n    *set rule %+10\n    *set nerve %+10\n    *set standing %+10\n    You authorise the bore and it goes down on the ninth day, and it is a superb piece of engineering, and the data is extraordinary and will be cited for eighty years.\n\n    On the twenty-second day the cycle comes round again and the ship listens, and the note is one part in nine thousand flat, and there is not a person aboard who can hear it.\n\n    ${engname} can measure it. ${engThey} measures it once, and enters the figure, and does not mention it again.\n    *set quiet_named false\n    *set rel_eng %-6\n    *goto ossa_end\n  #Bore it — and log the damping figure, in full, in the catalogue entry.\n    *set rule %+8\n    *set candor %+14\n    *set standing %+6\n    You authorise the bore, and then you do the thing that nobody in the Survey does: you write the cost into the catalogue.\n\n    *OSSA. Resonant body. Fundamental 28.7 millihertz, sixty-hour sustain, eleven-day cycle. Instrumented by CS Perpetua, master Cdr ${name}. Note: instrumentation permanently damped the fundamental by 1.1 x 10^-4. This entry records that the damping was known, was authorised by me, and was judged worth it.*\n\n    Forty years from now somebody will read that and know exactly what was traded and by whom, which is the entire difference between a decision and an accident.\n    *set quiet_named false\n    *goto ossa_end\n  #No bore. And write down why, where the Survey will see it.\n    *set rule %+6\n    *set candor %+14\n    *set crew %+8\n    *set standing %-8\n    *set quiet_named true\n    You cancel the bore, and you write the reason into the catalogue entry, which is worse than cancelling it, because it puts a sentence with no instrument reading behind it into a document that is nothing but instrument readings:\n\n    *Instrumentation declined. The body has sounded for approximately 3 x 10^8 years and would have been permanently altered. The scientific yield was obtainable, at 79 per cent, from archive. The remaining 21 per cent was not judged worth the alteration. This judgement was mine and is not a precedent.*\n\n    ${xoname} reads it twice before countersigning.\n    *if (xo = \"marand\")\n      \"*Is not a precedent*,\" Marand says. \"Captain, everything is a precedent. That is what a record is.\" She signs it anyway.\n    *if (xo = \"ferreo\")\n      \"Somebody at Central is going to read this out loud,\" Ferreo says, \"and about a third of them are going to think you have lost your mind, and the other two thirds are going to remember your name, and I genuinely cannot tell you which is better.\"\n    *if (xo = \"tanaka\")\n      \"Twenty-one per cent,\" Tanaka-Osei says. \"That's the honest bit. Most people would've written it up as though there was nothing lost.\" She hands it back. \"Sign it.\"\n    *goto ossa_end\n\n*label ossa_end\n*page_break\n\n*comment ---------------- What the ship keeps ----------------\n\nThe *Perpetua* leaves Ossa on the twenty-ninth day.\n\n*if (quiet_named)\n  Somewhere in the fortnight, the ship names the note.\n\n  It is not official and it never becomes official. It happens on the mess deck, the way these things do, and by the time it reaches you it is settled and unarguable and nobody can tell you who started it. They call it **the Long Note**, and the recording lives on the ship's general library where anyone can get at it, and by the end of the year eleven people are using it to sleep to.\n\n  *if (sec = \"mott\")\n    Mott names it something else, in Karsk, and will not translate it, and says only that it is what her people call a sound that was there before anyone was listening. Two of the ratings learn to say it. They say it wrong. She lets them.\n*if (quiet_named = false)\n  The recording goes into the ship's library and the data goes into the Survey's archive, and eleven months from now a paper is published with your name third on it, and it is genuinely excellent work.\n\n  Nobody on the mess deck ever gives the note a name.\n\n*if (chap = \"wren\")\n  On the last night Wren asks you to come aft to the old scanner bay and play the recording in it, because, he says, the compartment has eighteen seats and hard walls and he would like to know what it does in there. It does something. The two of you sit in it for the whole sixty seconds you have of it and neither of you says a word, and afterwards he says, \"Thank you, Captain,\" and nothing else at all.\n  *set rel_chap %+12\n*if (chap = \"onu\")\n  Onu listens to it once, all the way through, with her hands still for the only time you have ever seen. Then she says, \"Well,\" and picks up the folding again. \"That is an argument, that is,\" and does not say what for.\n  *set rel_chap %+10\n*if (chap = \"serat\")\n  Serat has the recording playing quietly in his compartment for the rest of the year, and eleven people find excuses to come and sit in there, and he never once mentions this to you, and you find out from the yeoman.\n  *set rel_chap %+8\n*if (chap = \"none\")\n  On the last night somebody moves eighteen chairs into the old scanner bay, aft of the laboratory, and plays the recording in it, because the compartment has hard walls and somebody worked out that it would sound good in there.\n\n  Thirty-one people go. Nobody organises it. Nobody says anything. It lasts four minutes and then everybody goes back to work, and it is the closest thing to a service that this ship has had in fourteen months, and it happened without you and without anybody's permission.\n  *achieve empty_berth\n  *set crew %+6\n\n*page_break\n\n*if (rel_sec > 65)\n  At 0410 on the last night you go up to the comms board, because that is a thing you do now, and Abara is there, and she says: \"Captain — do you think anybody will ever come back and listen to it?\"\n*if (rel_sec <= 65)\n  At 0410 on the last night the comms board is manned by Tey Abara, twenty-two, who found it, and who says nothing at all when you come up, because she has learned in six months that you do not particularly want to be spoken to at 0410.\n\n*if (quiet_named)\n  Ossa rings behind you for another forty-eight hours and then stops, and starts again eleven days later, at exactly the pitch it has held for three hundred million years, with nobody in the system at all.\n*if (quiet_named = false)\n  Ossa rings behind you for another forty-eight hours and then stops, and starts again eleven days later, one part in nine thousand flat, with nobody in the system at all.\n\nAhead, four days out, there is a distress call on the automatic band, and this one is not a rock.\n\n*finish\n", "salvage": "*comment ==================== CHAPTER SEVEN — SALVAGE ====================\n*comment Action. Nerve's moment of glory. Strain cashes in. Budget: 15 choices,\n*comment 13 tests, and the first tests of every relationship stat.\n*comment Ledger: Kem Station, Concord member colony refinery, 411 aboard, in\n*comment orbit over the gas giant Kem. Station chief Ovan Rask, 44. Primary\n*comment hydrogen separator failure. Perpetua holds 200 in an emergency.\n\n**KEM STATION. SEPARATOR FAILURE. FOUR HUNDRED AND ELEVEN ABOARD. SIX HOURS.**\n\nYou are four days out of Ossa and the message is nineteen minutes old.\n\nKem Station is a refinery: eleven thousand tonnes of pipework in orbit over a gas giant, cracking hydrogen for a Concord member colony of ninety thousand people on the moon below, who cannot heat their houses without it. It has three habitat rings and four hundred and eleven people and it has just lost its primary separator.\n\n${xoname} has the arithmetic before you ask, because ${xothey} always does now.\n\n\"Two hours at flank. The *Perpetua* holds two hundred in an emergency lift — two hundred and forty if we vent the laboratory decks and put people in the corridors. There is no other ship inside eleven days.\"\n\nFour hundred and eleven. Two hundred and forty.\n\n*page_break\n\n*choice\n  #Flank speed. Whatever it costs her.\n    *set nerve %+12\n    *set strain +12\n    *set rel_eng %-6\n    \"Flank, Mister Beye.\"\n    *if (article_nine = \"charged\")\n      Except that it is not Mister Beye any more; it is a lieutenant from the second watch who is competent and careful and eleven per cent slower than the young man you handed to a Board at Marl, and you notice, and you make yourself stop noticing.\n      *set crew %-4\n    The *Perpetua* is twenty-six years old and she goes, and the number two coolant loop stops whistling at the fifty-first minute, which is the sound of a ship telling you what she thinks.\n    *goto kem_arrive\n  #Flank — and start venting the laboratory decks now.\n    *set nerve %+10\n    *set rule %+8\n    *set strain +9\n    Flank speed and a working party stripping the laboratory decks in transit, so that when you arrive you are already a lifeboat and not a survey ship.\n\n    It costs you the entire scientific fit of the *Perpetua*, which goes into the number three hold in ninety minutes by people who are being careful and then, at the eleventh minute, stop being careful.\n    *set rel_eng %-4\n    *set crew %+8\n    *goto kem_arrive\n  #What is the fastest speed ${engname} will stand behind?\n    *set rule %-10\n    *set strain +6\n    *set rel_eng %+10\n    You ask for the number ${engthey} will sign, and get it, and it is two hours and eleven minutes.\n    *if (strain > 34)\n      ${engThey} adds: \"And Captain — she has taken a great deal this year. That number is smaller than it was in the spring and I would like you to know that I know why.\"\n    *goto kem_arrive\n\n*label kem_arrive\n*page_break\n\n*comment ---------------- Ovan Rask ----------------\n\nKem Station is lit up like a city and leaking from four points along its spine, and the whole of it is turning very slowly, and there is a plume off the number one separator hall that goes out sixty kilometres before it thins.\n\n**Ovan Rask** is the station chief. He is forty-four, he has been here eleven years, and he is on your screen inside two minutes with soot on his face.\n\n\"Commander. Thank you for coming. We are not evacuating.\"\n\n*page_break\n\nHe has a case and he makes it fast, because he has six hours.\n\nIf the station is abandoned, the separator hall goes, and if the separator hall goes the whole refinery is scrap; and ninety thousand people on the moon below burn hydrogen to stay alive through a winter that is four months long and starts in nine weeks. Rebuilding takes three years. The colony does not have three years of anything.\n\nHe wants to fight the fire. He wants to put every person he has into the separator hall and hold it, and he wants your fire suppression and your people, and he is asking, formally, on the record, as the senior Concord official present.\n\n*if (sec = \"oyelaran\")\n  Oyelaran, quietly: \"Captain, he is not wrong about the winter and he is a station chief, not a fire officer. Somebody in that hall is going to have to tell him when to stop, and it will not be him.\"\n*if (sec = \"whitlow\")\n  Whitlow, quietly: \"He has been awake for thirty hours and he has just done a very large sum in his head. I would like somebody to check it who is not him.\"\n*if (sec = \"mott\")\n  Mott, quietly: \"He is afraid of the wrong thing. That is not a criticism. It is a fact about him that you will need in an hour.\"\n\n*choice\n  #\"Chief, I am evacuating your non-essential personnel. Now. Argue while they board.\"\n    *set nerve %+12\n    *set rule %+12\n    *set crew %+8\n    You do not wait for him to finish. You start the lift while he is still making his case, and you tell him he may go on making it, and he does, all the way through, while three hundred and eleven people who are not firefighters go into your holds.\n\n    It is rude, it is correct, and it saves you ninety minutes that turn out later to be the whole margin.\n    *set standing %+6\n    *goto kem_plan\n  #\"Show me the hall. Then I will decide.\"\n    *set rule %+6\n    *set nerve %-4\n    *set candor %+6\n    You go across with ${secname} and you look at it yourself: eleven metres of separator gallery with the deck plating already blue, and forty people in bad suits doing something brave and disorganised, and Rask's own fire chief standing at the door doing arithmetic with his hands.\n\n    It takes fourteen minutes. You come back knowing exactly what you are dealing with, and fourteen minutes poorer.\n    *set strain +2\n    *goto kem_plan\n  #\"Chief — how many of the four hundred and eleven do you actually need?\"\n    *set rule %-8\n    *set candor %+10\n    *set crew %+10\n    Rask stops. Nobody has asked him that. He has been holding the whole station in his head as one object for thirty hours.\n\n    He works it out on the screen with a soot-black finger: forty-one to fight the fire, nineteen to run the station, eleven for the reactor. Seventy-one.\n\n    \"Then three hundred and forty of your people are coming aboard my ship,\" you say, \"and seventy-one are staying, and now we are having the same argument instead of two different ones.\"\n    *set rel_xo %+8\n    *set standing %+8\n    *goto kem_plan\n\n*label kem_plan\n*page_break\n\n*comment ---------------- The hall ----------------\n\nThe number one separator hall is on fire in a way that is not really fire: a hydrogen flame at that pressure is nearly invisible and it cuts.\n\nThe problem is a valve. There is a manual isolator eleven metres inside the hall, behind the gallery, which was designed to be reachable and is now on the wrong side of a plume, and if somebody gets to it the hall stops burning in ninety seconds and the refinery is saved. If nobody gets to it, the hall burns for another four hours and takes the spine with it.\n\nRask's fire chief will not send anyone. He is right not to.\n\n*if (eng = \"osimo\")\n  Osimo has the station schematic up and one thick finger on it. \"There's a service crawl under the gallery deck. It's for a man with a lamp, not a man in a hard suit.\" He looks up. \"I've been a man with a lamp.\"\n*if (eng = \"kallas\")\n  Kallas is talking at nine syllables a second. \"There's a crawlway, it's under the gallery, it's rated for maintenance access which means it's rated for someone smaller than me, and before anybody says anything, yes, I have measured, and no, I have not measured myself, I have measured the crawlway.\"\n*if (eng = \"dorr\")\n  \"I am sorry,\" says Dorr. \"There is a way in. There is a service crawl under the gallery deck. I would rather not have found it and I have found it, and now you know, and I apologise for that as well.\"\n\n*page_break\n\n*comment ---------------- Nerve's moment of glory ----------------\n\nSomebody is going to go into a service crawl under a burning separator gallery to reach a manual isolator eleven metres in.\n\n*choice\n  #I go.\n    *set nerve %+16\n    *set crew %+6\n    *set standing %-6\n    *set kem_pc true\n    You are the master of a Concord Survey vessel and there are eleven other qualified bodies within nine metres of you, and you go anyway, and every single argument against it is correct.\n\n    ${xoname} says one sentence for the record. You do not hear the end of it.\n    *set rel_xo %-8\n    *goto kem_crawl\n  #${engname} goes. It is ${engtheir} trade.\n    *set rule %+10\n    *set nerve %+6\n    *set kem_eng true\n    ${engname} goes, because ${engthey} found it and knows it and is the only person aboard who will recognise the isolator by feel in no light at all.\n\n    You watch a hundred and eleven seconds of nothing on a hardline and find out what that is like.\n    *set rel_eng %+12\n    *goto kem_crawl\n  #Ask for a volunteer. Whoever it is, they hear the odds first.\n    *set rule %-8\n    *set candor %+12\n    *set crew %+10\n    You put the actual numbers on the open channel — the plume, the crawl, the ninety seconds, the fact that the gallery deck above is at a temperature that the suits are rated for and not qualified for — and then you ask.\n\n    You get nine volunteers in eleven seconds, three of them from Kem Station's own people, and you have to choose, which is worse than being asked.\n    *set kem_vol true\n    *set rel_sec %+10\n    *goto kem_crawl\n  #Nobody goes. Pull everyone off and let the hall burn.\n    *set nerve %-18\n    *set crew %+16\n    *set rule %+10\n    *set kem_burn true\n    \"Chief Rask, I am ordering your people out of the hall. All of them. Now.\"\n\n    He argues. He argues for four minutes on an open channel in front of both crews and he is not wrong about a single fact, and at the end of it you say, \"Chief. Ninety thousand people will be cold. Forty-one people are eleven metres from a hydrogen flame. I am not trading the second for the first and you may say whatever you like about it afterwards.\"\n\n    He gets his people out. It takes eleven minutes and one of them has to be carried.\n    *goto kem_burn_out\n\n*label kem_crawl\n*page_break\n\nOne hundred and eleven seconds in the crawl.\n\n*if (kem_pc)\n  It is eleven metres and it takes a very long time. The hard suit is rated to nine hundred degrees for four minutes and the number on your wrist is nine hundred and forty and you have been in for two.\n\n  At the eighth metre the deck above you makes a noise like a ship's plate settling, and you find out — for the second time this year, and this time with nobody listening — exactly what your own voice sounds like.\n\n  The isolator is a wheel. It is where the schematic said it would be. It takes eleven full turns and the last four are with both hands and your shoulder against the bulkhead, and then the noise overhead changes pitch and goes away.\n\n  Ninety seconds later the hall is out.\n\n  *if (nerve > 70)\n    You come back out of the crawl on your own feet, and there are about thirty people at the gallery door, and not one of them cheers, because they have all just watched their commanding officer do something that no regulation in the Survey permits, and the silence is the loudest thing you will ever hear.\n    *set standing %+14\n    *set rel_sec %+10\n    *set rel_med %+8\n  *if (nerve <= 70)\n    You come out of the crawl and your legs do not work and two ratings take you under the arms without being told, and you are extremely angry about that for about six seconds and then you are not.\n    *set standing %+8\n  *achieve nerve\n\n*if (kem_eng)\n  ${engname} goes in with a lamp and a wrench and no commentary at all, and the hardline carries breathing and nothing else for ninety-one seconds, and then a grunt, and then eleven turns of a wheel counted out loud in a voice that is being kept level on purpose.\n\n  Ninety seconds later the hall is out.\n\n  ${engThey} comes out with a suit that will never be used again and a burn across the back of one hand that ${medname} will be unhappy about for six weeks.\n  *if (eng = \"osimo\")\n    Osimo says, \"Told you. A man with a lamp.\" Then he sits down on a crate and does not get up for eleven minutes, and nobody comments.\n  *if (eng = \"kallas\")\n    Kallas talks for four solid minutes at nine syllables a second about the isolator's thread pitch and does not once mention being in a crawlway under a fire, and then stops mid-sentence and says, \"I would like to sit down,\" and does.\n  *if (eng = \"dorr\")\n    Dorr says, \"I am sorry, that took eleven seconds longer than it should have,\" and everybody in the gallery looks at him, and he understands, visibly, in real time, that this was the wrong thing to say and that nobody minds.\n  *set rel_eng %+14\n  *set standing %+10\n\n*if (kem_vol)\n  The volunteer is a Kem Station pipe fitter named Ines Halloway, thirty-six, who has been through that crawl eleven times in eleven years with a lamp, and who says, when you ask why she is volunteering, \"Because I know where the wheel is and you don't.\"\n\n  She is in for a hundred and four seconds. The hall goes out ninety seconds after she reaches it.\n\n  She comes out with a cracked faceplate and second-degree burns to one forearm and she is fine, and the thing you remember is that she is furious — not at you, at the valve, which she has told the station council about twice.\n  *set standing %+8\n  *set rel_sec %+8\n\n*set strain +5\n*goto kem_after\n\n*label kem_burn_out\n*page_break\n\nThe number one separator hall burns for four hours and eleven minutes and then takes the spine.\n\nKem Station does not explode; refineries do not explode, they come apart in a slow and undramatic way over a day and a half, venting, while everybody watches from a Survey ship's holds. By the third day it is eleven thousand tonnes of scrap in a decaying orbit and the Concord will spend four years arguing about who pays to clear it.\n\nFour hundred and eleven people are alive. Every single one.\n\nNinety thousand people on the moon below will burn stored hydrogen through a four-month winter, and then rationed hydrogen through the next one, and the Concord will get a temporary plant up in the second year. The excess mortality figure, when it is published eleven months later, is two hundred and forty.\n\nOvan Rask does not speak to you again.\n\n*set kem_dead 240\n*set standing %-10\n*set crew %+8\n*goto kem_after\n\n*label kem_after\n*page_break\n\n*comment ---------------- The ship ----------------\n*comment Strain cashes in here. This is the price of every fast decision made\n*comment since Sarn Basin.\n\nThe *Perpetua* has three hundred and forty people in her corridors and she has been at flank twice this year and she has a shuttle bay with a written-off *Tern* in it, and on the second day out from Kem she tells you what she thinks.\n\n*if (strain >= 45)\n  The number two coolant loop lets go at 0340 in the aft corridor, where the deck plating rings dead underfoot, which is where it has been going to let go since before you came aboard and which is why the deck plating rings dead underfoot.\n\n  It takes out the loop, eleven metres of run, and the aft laboratory bulkhead. Nobody is killed. Two ratings are burned. The ship loses forty per cent of her heat rejection and has to run at a third of cruise for eleven days, and ${engname} sleeps in the engine spaces for six of them.\n\n  You are nine days from a yard at full speed. You are twenty-seven at a third.\n  *set strain +10\n  *set rel_eng %-4\n*if (strain >= 28) and (strain < 45)\n  The number two coolant loop cracks — does not fail, cracks — at 0340, and ${engname} gets a clamp on it in nine minutes and then stands looking at it for a long time.\n\n  \"She will hold to Marl,\" ${engthey} says. \"She will not hold to Marl and then anywhere else. I want that in writing from me to you, Captain, not the other way round.\"\n  *set strain +4\n*if (strain < 28)\n  The number two coolant loop whistles.\n\n  That is all it does. ${engname} has been up to it four times in a fortnight and the seals are original and it is twenty-six years old and it whistles, and on the second day out from Kem, with three hundred and forty people asleep in the corridors, that thin clean kettle-note under the deck is the most reassuring sound on the ship.\n  *set rel_eng %+6\n\n*page_break\n\n*choice\n  #Signal Central. Full damage report, and I am requesting relief.\n    *set candor %+14\n    *set rule %+6\n    *set standing %-8\n    You transmit the actual condition of your ship to Concord Central and ask, in writing, for a relief vessel in the Cold Reach.\n\n    There is no relief vessel in the Cold Reach. There will not be one. You know that, and Adjo knows it, and you send it anyway, because the only thing worse than an unanswered request is an unmade one, and because in eleven months somebody is going to read the file.\n    *set rel_xo %+8\n    *goto kem_crewbeat\n  #Signal Central. She is fit for patrol.\n    *set candor %-12\n    *set nerve %+8\n    *set standing %+6\n    You report the ship fit for patrol, which is true in the sense that she is moving and false in every sense that matters, and you continue the circuit.\n\n    ${xoname} countersigns.\n    *if (xo = \"marand\")\n      Marand countersigns and writes in her own notebook, in her own hand, *fit for patrol*, with the date, and shows you nothing.\n      *set rel_xo %-6\n    *if (xo = \"ferreo\")\n      \"I would sign that too,\" Ferreo says, \"and I want you to know that is not reassurance.\"\n    *if (xo = \"tanaka\")\n      \"Fit for patrol,\" Tanaka-Osei repeats. \"Twelve years in freight, I signed that about nine hundred times. Twice it was true.\" She signs it.\n    *goto kem_crewbeat\n  #Ask ${xoname} what ${xothey} would put in it, and send that.\n    *set rule %-14\n    *set candor %+8\n    *set rel_xo %+14\n    You hand your first officer a blank damage report and tell ${xothem} to write what ${xothey} actually thinks and that you will send it unaltered over your own name.\n\n    ${xoname} takes four hours.\n    *if (xo = \"marand\")\n      What comes back is eleven hundred words, exact, unsparing about the ship and entirely silent about the master, and at the bottom: *The above is the condition of the vessel. The decisions that produced it were sound and I concurred in all but one, which is not material.* You never find out which one.\n    *if (xo = \"ferreo\")\n      What comes back is nine hundred words that manage to be completely truthful and to make four separate people at Central feel personally responsible for the state of your coolant loops, and you cannot find the seam anywhere.\n    *if (xo = \"tanaka\")\n      What comes back is four hundred words with no adjectives in it at all, and a last line that says: *This ship has done more this year than she was built to do and there is no line on the form for that, so I am putting it here.*\n    *goto kem_crewbeat\n\n*label kem_crewbeat\n*page_break\n\n*comment ---------------- Three hundred and forty guests ----------------\n*comment Relationship reaction block. Every rel_ stat gets read at least once.\n\nThree hundred and forty refugees on a ship built for a hundred and twelve is not a crisis. It is eleven days of queueing.\n\n*if (rel_med > 62)\n  ${medname} runs the corridors like a ward and does not lose anybody, including two births and one seventy-one-year-old with a heart that ${medthey} should not have been able to keep going for eleven days, and does.\n*if (rel_med <= 62)\n  ${medname} runs the corridors correctly and reports twice daily and does not lose anybody, and at no point in eleven days do the two of you have a conversation that is not a report.\n\n*if (rel_sec > 62)\n  ${secname} works out on the second day that the fights will start at the water points and not at the food, and moves the water points, and there are no fights.\n*if (rel_sec <= 62)\n  There are four fights, all of them at the water points, all of them on the fourth day, and ${secname} stops all four and files all four correctly.\n\n*if (rel_eng > 62)\n  ${engname} finds eleven hundred litres of hot water a day that the ship's specification says does not exist, and will not tell anybody where it comes from, and the whole of the number two hold is grateful and slightly frightened.\n*if (rel_eng <= 62)\n  There is not enough hot water. There is never going to be enough hot water. ${engname} says so on the first day and is right for eleven days.\n\n*if (chap != \"none\")\n  *if (rel_chap > 62)\n    ${chapname} is in the corridors for eleven days and does not appear to sleep, and by the fourth day three hundred and forty people from Kem Station know ${chaptheir} name, and by the eighth day they are bringing ${chapthem} their arguments instead of bringing them to ${secname}, which halves ${secname}'s workload and is never once discussed.\n    *set crew %+6\n  *if (rel_chap <= 62)\n    ${chapname} does the work, competently, in the corridors, for eleven days. Three hundred and forty people from Kem Station do not learn ${chaptheir} name.\n*if (chap = \"none\")\n  There is nobody whose job it is to be in the corridors, so ${medname} does it, and ${secname} does it, and on the sixth day you find your first officer sitting on the deck in the number two hold at 0200 explaining the Concord's compensation schedule to a woman who has lost a house, and ${xoname} looks up at you with an expression that says *this is not my trade* and goes on doing it.\n  *set rel_xo %+6\n  *achieve empty_berth\n\n*page_break\n\n*choice\n  #Walk the corridors every night. All eleven of them.\n    *set crew %+12\n    *set nerve %+4\n    You walk it at 0200 every night for eleven nights, all three holds, and you talk to whoever is awake, and by the fourth night people are waiting up for you, which is the point at which ${xoname} tells you to stop doing it at the same time every night.\n\n    You go on doing it at the same time every night.\n    *set rel_xo %-4\n    *set standing %+6\n    *goto kem_end\n  #Stay off the decks. Let ${xoname} run it. That is what ${xothey} is for.\n    *set rule %+10\n    *set crew %-8\n    *set rel_xo %+10\n    You delegate it completely and do not interfere once, and ${xoname} runs eleven days of refugee traffic on a survey ship without a single incident that reaches you.\n\n    It is excellent command practice and it is the correct use of a first officer, and three hundred and forty people leave your ship at Marl Colony without having any idea what the master of it looked like.\n    *goto kem_end\n  #Put Rask to work.\n    *set rule %-8\n    *set candor %+10\n    *set crew %+8\n    *if (kem_burn)\n      Ovan Rask has lost his station and has not spoken to you in six days, and you send for him and give him three hundred and forty of his own people to run in your corridors, and he takes it, and he does it well, and he still does not speak to you.\n\n      On the ninth day he says, \"You were right about the forty-one.\" That is the whole conversation. It is more than you expected and less than you wanted.\n      *set standing %+6\n    *if (kem_burn = false)\n      Ovan Rask has a station to go back to and three hundred and forty people in your corridors who used to be his, and you put him in charge of them, which is not in any regulation, and which means that for eleven days a Concord station chief runs a Concord Survey vessel's lower decks.\n\n      It works perfectly. ${xoname} finds it deeply irregular and says so twice and then stops saying it.\n      *set standing %+4\n    *goto kem_end\n\n*label kem_end\n*page_break\n\nThe orders are waiting at Marl Colony.\n\nThey are four lines long and they are signed by Ceron Adjo, Delegate for the Cold Reach, who came up from the surface in person to hand you a folder in a graving dock at Sarn Basin eight months ago.\n\n**CS PERPETUA. PROCEED MARL COLONY. MASTER TO ATTEND SURVEY BOARD OF INQUIRY, 4 CONCORD, IN PERSON.**\n**ASSESSOR: R. IVANESCU.**\n**MATTERS: SEDGE; KEM; AND SUCH OTHER MATTERS AS THE BOARD SHALL DETERMINE.**\n\n*if (article_nine != \"charged\") and (kept_secret)\n  *comment The player is carrying something.\n  *And such other matters as the Board shall determine.*\n\n  You read that line four times.\n*if (article_nine = \"charged\")\n  You have already sent this Board one of your own people. Nineteen days ago they took forty minutes over him.\n\n*finish\n", "theboard": "*comment ==================== CHAPTER EIGHT — THE BOARD ====================\n*comment Candour's moment of glory. Chapters three, five and seven come due.\n*comment The chapter answers promise #3: why this commander got this ship.\n*comment Budget: 14 choices, 13 tests. Assessor Ruth Ivanescu, 60s, fair, good.\n\nMarl Colony has a Survey office with a real door and a corridor with real carpet, and after eight months you find that you dislike both.\n\nThe Board sits in a room with eleven chairs in it and three people in the chairs. The Assessor is **Ruth Ivanescu**, sixty-something, who has been doing this for twenty-two years and who has, according to ${xoname}, never once been reversed on appeal.\n\nShe is not hostile. That is the first thing you have to adjust to. She is not hostile in a way that removes every defence you had prepared.\n\n\"Commander. Sit down. This is not a trial, it is an inquiry, and the difference is that at a trial somebody has already decided what the question is.\" She squares a folder. \"Sedge, first.\"\n\n*page_break\n\n*comment ---------------- Sedge ----------------\n\n*if (sedge = \"held\")\n  \"You declined assistance to six thousand two hundred people on the ground that the recognised government of Sedge had not asked. Three hundred and eighty-one of them are dead.\" She looks up. \"Was that the correct decision?\"\n*if (sedge = \"water\")\n  \"You landed a water plant at the Fold and withheld seed stock, and you wrote in the log that this was *the least that answers.*\" She looks up. \"What did you mean by that phrase?\"\n*if (sedge = \"gave\")\n  \"You landed Concord stores with a faction on an independent world in defiance of the recognised government, and you wrote the words *in contravention of Standing Order Four* into your own log in your own hand.\" She looks up. \"Why did you write that sentence?\"\n*if (sedge = \"council\")\n  \"You made the assistance conditional on Survey witness of the distribution, and Speaker Vane accepted, and every sack was counted in front of the Fold.\" She looks up. \"Whose plan was that, in the end — yours or his?\"\n\n*choice\n  #Answer it straight. All of it, including what I got wrong.\n    *set candor %+14\n    *set standing %-4\n    You answer for eleven minutes and you do not leave out the part where you were not certain, or the part where you thought about the Board, or the two hours you spent alone in a cabin three metres by four talking yourself into something.\n\n    Ivanescu writes almost nothing down. At the end she says: \"Thank you. That is the first useful account of a Standing Order Four decision I have had in four years, and I have had nine.\"\n    *set board_candid true\n    *goto board_fold\n  #Answer it correctly. Facts, order, and no interior.\n    *set candor %-10\n    *set rule %+8\n    *set standing %+6\n    You give her the sequence: signal received, meeting held, order given, stores disposed, outcome recorded. It is complete, accurate, and airless, and it takes four minutes and it is unimpeachable.\n\n    \"Yes,\" Ivanescu says. \"I have your log. I was asking you something else.\" She does not press it. She writes one word.\n    *goto board_fold\n  #\"Assessor, before I answer — what is the Board's finding going to turn on?\"\n    *set rule %+10\n    *set candor %+6\n    \"That is a very good question and I am going to answer it, because I am not trying to catch you.\" Ivanescu folds her hands. \"It turns on whether you can say what you did and why, in a way that another master could use. The Survey does not need you to have been right, Commander. It needs the next one to be able to learn something.\"\n    *set standing %+4\n    *goto board_fold\n\n*label board_fold\n*page_break\n\n\"Second question. The Fold. Six thousand two hundred people, a settlement of eleven years' standing, with a speaker who walked two days to stand at your fence.\"\n\nShe turns a page.\n\n\"Standing Order Four says *a world that has not asked.* Commander — in your judgement, is the Fold part of Sedge, or is the Fold a world?\"\n\n*choice\n  #\"The Fold is part of Sedge. That is the whole point of the rule.\"\n    *set rule %+12\n    *set standing %+8\n    \"If the Survey gets to decide which part of a world is really the world,\" you say, \"then every faction on forty settlements learns in one year that the way to win an argument is to ask a Concord ship. The rule is not there to protect governments. It is there so that six thousand people cannot be turned into a reason.\"\n\n    Ivanescu writes for some time. \"That is the orthodox answer,\" she says, \"and it is orthodox because it is good.\"\n    *goto board_kem\n  #\"Six thousand two hundred people asked. I do not know what else a world is.\"\n    *set candor %+12\n    *set crew %+10\n    *set standing %-6\n    \"Assessor, a world is not a chair in a hall. Cassa Doon walked two days. Nobody in the Landing walked anywhere. If the rule cannot tell the difference between a government that has considered a question and a government that has simply not been asked it, then the rule is not doing the work we think it is.\"\n\n    Ivanescu looks at you over the folder for a long moment.\n\n    \"You are aware,\" she says, \"that that is very nearly word for word what Ivo Halloran said to me fourteen months ago.\"\n    *set ceyla_known 3\n    *goto board_kem\n  #\"I do not know. I decided anyway, because I had to, and that is the report.\"\n    *set candor %+16\n    *set rule %-8\n    \"I do not know, Assessor. I did not know at 0300 on the fifth day and I do not know now. I made a decision because a decision was going to be made by somebody and the somebody was me, and I would rather stand behind a decision I cannot fully justify than pretend I found an answer in the text.\"\n\n    The junior member of the Board looks up sharply. Ivanescu does not.\n\n    \"Write that down,\" she says to him, without turning her head.\n    *set standing %+6\n    *goto board_kem\n\n*label board_kem\n*page_break\n\n*comment ---------------- Kem ----------------\n\n\"Kem Station.\"\n\n*if (kem_burn)\n  \"You ordered a Concord member colony's refinery abandoned against the express objection of the senior official present. Four hundred and eleven people are alive. Two hundred and forty people on the moon below are dead of a cold winter and a hydrogen shortage.\" She turns a page. \"Chief Rask has submitted a statement. It runs to nine pages and it is not intemperate, which is worse for you.\"\n*if (kem_pc)\n  \"The master of a Concord Survey vessel entered a burning separator gallery through a maintenance crawlway to reach a manual isolator.\" She looks up. \"There is no provision in the Survey's regulations for that, Commander, because it did not occur to anyone that it would be necessary to forbid it.\"\n*if (kem_eng)\n  \"Your chief engineer went into a maintenance crawlway under a burning gallery on your authority and came out with a hand that will not close
